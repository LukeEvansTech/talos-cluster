---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app scrutiny
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      scrutiny:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/starosdev/scrutiny
              tag: 1.76.4-omnibus@sha256:0ca3553d2ec494d5ece1852a6905cc91aabc454c1f3e8362db4c1f5b2447ed6e
            env:
              TZ: ${TIMEZONE:=UTC}
              # Collection runs via the scrutiny-collector DaemonSet, so this stays unprivileged.
              COLLECTOR_RUN_STARTUP: "false"
              COLLECTOR_CRON_SCHEDULE: "0 0 30 2 *" # 30 February never occurs, so this never fires.
              # Acknowledges the InfluxDB 2.2->2.9.1 migration gate (Starosdev/scrutiny#662).
              SCRUTINY_INFLUXDB_29_BACKUP_CONFIRMED: "true"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        # Omnibus uses s6-overlay + an embedded InfluxDB and must run as root.
        runAsNonRoot: false
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames:
          - scrutiny.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/scrutiny/config
            subPath: config
          - path: /opt/scrutiny/influxdb
            subPath: influxdb
