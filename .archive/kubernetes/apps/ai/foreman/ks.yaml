---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foreman
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: foreman
  dependsOn:
    - name: llmkube
      namespace: ai
    - name: litellm
      namespace: ai
    - name: onepassword-connect
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/ai/foreman/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foreman-agents
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: foreman-agents
  dependsOn:
    - name: foreman
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/foreman/agents
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
