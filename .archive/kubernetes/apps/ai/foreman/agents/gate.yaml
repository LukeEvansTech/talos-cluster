---
# No published JSON schema for foreman.llmkube.dev. The chart is a defilantech
# CRD, not one k8s-schemas.home-operations.com catalogs.
apiVersion: foreman.llmkube.dev/v1alpha1
kind: Agent
metadata:
  name: gate
  namespace: ai
spec:
  role: verifier
  # Deterministic Agent: inferenceServiceRef omitted (no LLM). The executor's
  # executeDeterministic() branch runs run_gate_job directly.
  tools:
    - run_gate_job
  requiredCapability:
    roles:
      - verifier
    accelerator: any
  maxRetries: 3
  requestTimeoutSeconds: 3900
