---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: seerr
  namespace: ai
spec:
  # Seerr request/discovery tools (overseerr-mcp). Native streamable-http
  # container (no proxy hop), so the Service is mcp-seerr:8085 directly.
  proxyRef: litellm
  url: http://mcp-seerr.ai.svc.cluster.local:8085/mcp
