---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pgadmin-secret
    template:
      engineVersion: v2
      data:
        PGADMIN_DEFAULT_EMAIL: "{{ .DEFAULT_EMAIL }}"
        PGADMIN_DEFAULT_PASSWORD: "{{ .DEFAULT_PASSWORD }}"
        # Also feeds servers.json (configmap.yaml) and the .pgpass line below.
        POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        .pgpass: "postgres18-rw.database.svc.cluster.local:5432:*:{{ .POSTGRES_SUPER_USER }}:{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: pgadmin
    - extract:
        key: cloudnative-pg
