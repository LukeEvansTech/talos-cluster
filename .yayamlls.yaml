---
# yayamlls workspace config, https://github.com/home-operations/yayamlls
# Kubernetes schema auto-detect and the schemastore catalog are on by default; only the Flux
# renderer needs setting. Keep `path` in sync with the flate root CI uses (kubernetes/flux/cluster,
# not onedr0p's kubernetes): our root Flux Kustomization + GitRepository live one level down.
renderers:
  flate:
    enabled: true
    path: kubernetes/flux/cluster
