---
# etcd has no multi-document form yet and stays in v1alpha1.
cluster:
  # KubeNodeConfig is the 1.14 home for this, but talhelper 3.1.17 doesn't know it yet, so this
  # stays v1alpha1 (deprecated, still supported).
  allowSchedulingOnControlPlanes: true
  # CoreDNS is Flux-managed. talhelper 3.1.17 (machinery 1.14.0-alpha.2) doesn't know
  # KubeCoreDNSConfig yet, so this stays v1alpha1 (no KubeCoreDNSConfig document to conflict with).
  coreDNS:
    disabled: true
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 10.32.8.0/24
---
# The generator ships a PodSecurity admission config; this cluster never ran it.
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
$$patch: delete
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
# talhelper 3.1.17 doesn't carry additionalApiServerCertSans into the 1.14 contract, so the extra
# SANs are restated here. Keep in sync with the &sans anchor in talconfig.yaml.
certExtraSANs:
  - "127.0.0.1"
  - "10.32.8.85"
  - "talos-cluster.codelooks.com"
  - "talos-cluster.core.codelooks.com"
extraArgs:
  # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
  enable-aggregator-routing: true
  # Required here AND under KubeControllerManagerConfig below for zeroscaler's minReplicas=0: the
  # apiserver validates the field, the controller-manager does the scaling. Control-plane change
  # (rolling apiserver restart). See KB-024.
  feature-gates: HPAScaleToZero=true
  # Public OIDC issuer so Entra can federate the cluster's service-account tokens, backing the
  # sentinel-syslog workload identity. Served as static OIDC discovery + JWKS by the
  # `network/oidc-talos` app; MUST match byte-for-byte with that app's `issuer` and
  # terraform-entra's var.sentinel_syslog_oidc_issuer. Control-plane change (rolling apiserver
  # restart); existing pods re-auth as their projected SA tokens rotate (self-healing, brief).
  service-account-issuer: https://oidc-talos.codelooks.com
resources:
  requests:
    memory: 2Gi
  limits:
    memory: 4Gi
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
  feature-gates: HPAScaleToZero=true
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
---
# kube-proxy is replaced by Cilium.
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
# talhelper 3.1.17 (machinery 1.14.0-alpha.2) renders this document with the secretbox key named
# "key1", but Talos has always rendered v1alpha1's secretboxEncryptionSecret as "key2", and etcd
# ciphertext carries the key name, so a "key1" config leaves every kube-apiserver unable to decrypt
# Secrets (2026-09-03 outage). Drop the generated document; the correct one is restated in
# etcd-encryption.yaml, listed after this file.
apiVersion: v1alpha1
kind: KubeEtcdEncryptionConfig
$$patch: delete
