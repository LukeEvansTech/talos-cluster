---
# talhelper 3.1.17 (machinery 1.14.0-alpha.2) does not know
# KubeTalosAPIAccessConfig yet, so this stays v1alpha1 (deprecated, still
# supported; no KubeTalosAPIAccessConfig document exists to conflict with).
machine:
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:admin
        - os:reader
      allowedKubernetesNamespaces:
        - actions-runner-system
        - system-upgrade
        - ai
