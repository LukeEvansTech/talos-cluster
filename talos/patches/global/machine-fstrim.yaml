---
# Periodic fstrim of Talos-managed volumes (STATE, EPHEMERAL, user volumes).
# Talos 1.14+ emits this document for new clusters; clusters upgraded from
# older versions have to add it explicitly or trimming stays off.
#
# This does NOT replace the kube-system/fstrim CronJob: Talos only trims
# volumes it mounts itself. The Ceph RBD PVC filesystems and the miroir loop
# devices are kubelet CSI mounts, which only the CronJob trims.
apiVersion: v1alpha1
kind: FilesystemTrimConfig
interval: 168h0m0s
