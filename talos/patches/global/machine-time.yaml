---
apiVersion: v1alpha1
kind: TimeSyncConfig
ntp:
  # UK pool, numbered names: each resolves to a disjoint server set, which is how the pool intends
  # multiple sources to be requested (a bare uk.pool.ntp.org repeated would just re-roll the same
  # rotation). Talos runs a single-server SNTP client, not chrony: it sticks to the last server that
  # synced and only walks the list on failure, with no averaging or outlier rejection, so these five
  # entries buy redundancy, not accuracy. The trailing literal is deliberate: every name above needs
  # DNS, and Talos gates boot on time sync, so a resolver outage at boot would otherwise leave a
  # node with no reachable source; Cloudflare by address needs no lookup and is the floor under it.
  servers:
    - 0.uk.pool.ntp.org
    - 1.uk.pool.ntp.org
    - 2.uk.pool.ntp.org
    - 3.uk.pool.ntp.org
    - 162.159.200.1
