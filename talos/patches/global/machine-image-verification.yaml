---
# Cosign keyless verification of Sidero-published images (issue #2340).
#
# As of 2026-07 Sidero signs all of ghcr.io/siderolabs/* and the Image Factory boot path with
# stable Google service accounts (image-factory#417, talos#13178), verified live with cosign v3.1.1
# against kubelet/flannel/extensions/installer and both factory installer paths. Mirrors
# hack/test/patches/image-verification.yaml upstream.
#
# Scope is deliberately Sidero-only: images matching no rule pull unverified as before (no deny
# rules), so this can't brick third-party pulls. quay.io/cilium etc. stay out of scope until
# Talos's handling of the newer OCI-referrers signature format stops being buggy (talos#13639).
#
# The ghcr.io subjectRegex keeps legacy personal-email identities as a fallback: images published
# before the releasemgr-svc cutover (some still pinned by v1.13.x) are signed by @siderolabs.com.
apiVersion: v1alpha1
kind: ImageVerificationConfig
rules:
  - image: "ghcr.io/siderolabs/*"
    keyless:
      issuer: "https://accounts.google.com"
      subjectRegex: '(@siderolabs\.com$|^releasemgr-svc@talos-production\.iam\.gserviceaccount\.com$)'
  - image: "factory.talos.dev/*"
    keyless:
      issuer: "https://accounts.google.com"
      subject: "image-factory-signing@talos-production.iam.gserviceaccount.com"
