---
machine:
  files:
    # Deprecated in 1.14 for CRICustomizationConfig, which talhelper 3.1.17 doesn't know yet;
    # still supported under the reserved customization name.
    - op: create
      path: /etc/cri/conf.d/20-customization.part
      permissions: 0o644
      content: |-
        [plugins."io.containerd.cri.v1.images"]
          discard_unpacked_layers = false
    # EtcFileConfig only manages files under /etc; this path is on the extra volume, so v1alpha1.
    - op: create
      path: /var/mnt/extra/miroir/.keep
      permissions: 0o644
      content: |-
        # Guarantees the miroir loopfile pool baseDir exists on first boot.
        # The miroir agent does not create it (crash-loops on a missing dir).
    # Raises NFS client parallelism for the NAS mounts. Inline `nfs:` pod volumes can't carry
    # mountOptions, so this file is the only place to set nconnect; without it every mount shares
    # the kernel default of one TCP connection per client/server pair. nconnect is per
    # (client, server), not per mount, so it multiplies across the fleet; 8 keeps total connections
    # well under the NAS's 48 nfsd threads, with room to go to the kernel ceiling of 16 later.
    #
    # Only the two options that actually change something are set: vers=4.2, hard and
    # rsize/wsize=1048576 are already what the kernel negotiates here (confirmed in /proc/mounts),
    # and pinning nfsvers=4.2 would force-break any NFSv3 mount, which the NAS still offers.
    # `op: overwrite` replaces the whole file, so Talos's shipped nolock=true is restated; it's
    # inert for the NFSv4.x mounts made here but matters on a v3 fallback.
    - op: overwrite
      path: /etc/nfsmount.conf
      permissions: 0o644
      content: |-
        [ NFSMount_Global_Options ]
        nolock=true
        nconnect=8
        noatime=True
