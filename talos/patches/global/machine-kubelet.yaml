---
# talhelper 3.1.17 (machinery 1.14.0-alpha.2) renders the kubelet image into
# v1alpha1 machine.kubelet and does not know KubeNodeConfig, so the kubelet
# overrides and the node IP selection stay v1alpha1 (deprecated, supported).
machine:
  kubelet:
    extraConfig:
      maxPods: 250
      serializeImagePulls: false
      maxParallelImagePulls: 3
      crashLoopBackOff:
        maxContainerRestartPeriod: 60s
      imageGCHighThresholdPercent: 55
      imageGCLowThresholdPercent: 50
      imageMaximumGCAge: 72h
    nodeIP:
      validSubnets:
        - 10.32.8.0/24
