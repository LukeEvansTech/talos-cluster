---
machine:
  kubelet:
    extraConfig:
      maxPods: 250
      serializeImagePulls: false
      maxParallelImagePulls: 3
      crashLoopBackOff:
        maxContainerRestartPeriod: 60s
      imageGCHighThresholdPercent: 55
      imageGCLowThresholdPercent: 50
      imageMaximumGCAge: 72h
    nodeIP:
      validSubnets:
        - 10.32.8.0/24
