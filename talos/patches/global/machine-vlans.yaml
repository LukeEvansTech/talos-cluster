---
# Host-side tagged VLAN subinterfaces on the node uplink (wan). Each is used as the macvlan
# `master` for a Multus NAD in kubernetes/apps/kube-system/multus/networks/. Interfaces carry no
# host IP; pods get addresses from the NAD's static IPAM. The switch side already trunks these
# VLANs to the uplink.
#
# To add a VLAN: append another VLANConfig block below (name: wan.<id>, vlanID: <id>) and add the
# matching NAD file under multus/networks/.
#
# VLAN 68, IoT-Trusted: Home Assistant, zigbee2mqtt, mosquitto
apiVersion: v1alpha1
kind: VLANConfig
name: wan.68
vlanID: 68
parent: wan
mtu: 1500
