# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
---
# renovate: datasource=custom.talos-factory depName=siderolabs/talos
talosVersion: v1.14.1
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.37.0

clusterName: kubernetes
endpoint: https://10.32.8.85:6443

clusterPodNets:
  - "10.42.0.0/16"
clusterSvcNets:
  - "10.43.0.0/16"

additionalApiServerCertSans: &sans
  - "127.0.0.1"
  - "10.32.8.85"
  - "talos-cluster.codelooks.com"
  - "talos-cluster.core.codelooks.com"
additionalMachineCertSans: *sans

# Disable built-in CNI to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: "cr-talos-01"
    ipAddress: "10.32.8.80"
    installDiskSelector:
      serial: "22443D5C45C9"
    machineSpec:
      secureboot: true
    talosImageURL: factory.talos.dev/installer-secureboot/44186a005dfca322f81df634a457384455475fbfa518777f3ee58d35f173d73b
    controlPlane: true
    patches:
      # TPM-sealed LUKS (slot 0) with a static-passphrase fallback (slot 1): a known-buggy BIOS
      # update line wipes Secure Boot keys, changing the PCR 7 value slot 0 is sealed to, and Talos
      # has no recovery path for that. Passphrase comes from 1Password at genconfig time; never
      # commit it. NEVER remove slot 1 without a replacement: talhelper's syncKeys() deletes any
      # slot missing from config. See kb/207 for the incident, why slot 0 still binds to PCR 7, and
      # the manual TPM-slot rotation procedure.
      - |-
        machine:
          systemDiskEncryption:
            state:
              provider: luks2
              keys:
                - slot: 0
                  tpm: {}
                - slot: 1
                  static:
                    passphrase: ${TALOS_LUKS_FALLBACK}
            ephemeral:
              provider: luks2
              keys:
                - slot: 0
                  tpm: {}
                - slot: 1
                  static:
                    passphrase: ${TALOS_LUKS_FALLBACK}
      - |-
        apiVersion: v1alpha1
        kind: WatchdogTimerConfig
        device: /dev/watchdog0
        timeout: 5m
      - |-
        apiVersion: v1alpha1
        kind: LinkAliasConfig
        name: wan
        selector:
          match: mac(link.permanent_addr) == "0c:c4:7a:ea:bf:0e"
      - |-
        apiVersion: v1alpha1
        kind: LinkConfig
        name: wan
        addresses:
          - address: 10.32.8.80/24
        routes:
          - gateway: 10.32.8.10
        mtu: 1500
  - hostname: "cr-talos-02"
    ipAddress: "10.32.8.81"
    installDiskSelector:
      serial: "22443D5C50A3"
    machineSpec:
      secureboot: true
    talosImageURL: factory.talos.dev/installer-secureboot/44186a005dfca322f81df634a457384455475fbfa518777f3ee58d35f173d73b
    controlPlane: true
    patches:
      # TPM-sealed LUKS (slot 0) with a static-passphrase fallback (slot 1): a known-buggy BIOS
      # update line wipes Secure Boot keys, changing the PCR 7 value slot 0 is sealed to, and Talos
      # has no recovery path for that. Passphrase comes from 1Password at genconfig time; never
      # commit it. NEVER remove slot 1 without a replacement: talhelper's syncKeys() deletes any
      # slot missing from config. See kb/207 for the incident, why slot 0 still binds to PCR 7, and
      # the manual TPM-slot rotation procedure.
      - |-
        machine:
          systemDiskEncryption:
            state:
              provider: luks2
              keys:
                - slot: 0
                  tpm: {}
                - slot: 1
                  static:
                    passphrase: ${TALOS_LUKS_FALLBACK}
            ephemeral:
              provider: luks2
              keys:
                - slot: 0
                  tpm: {}
                - slot: 1
                  static:
                    passphrase: ${TALOS_LUKS_FALLBACK}
      - |-
        apiVersion: v1alpha1
        kind: WatchdogTimerConfig
        device: /dev/watchdog0
        timeout: 5m
      - |-
        apiVersion: v1alpha1
        kind: LinkAliasConfig
        name: wan
        selector:
          match: mac(link.permanent_addr) == "0c:c4:7a:ea:be:7a"
      - |-
        apiVersion: v1alpha1
        kind: LinkConfig
        name: wan
        addresses:
          - address: 10.32.8.81/24
        routes:
          - gateway: 10.32.8.10
        mtu: 1500
  - hostname: "cr-talos-03"
    ipAddress: "10.32.8.82"
    installDiskSelector:
      serial: "22443D5C5114"
    machineSpec:
      secureboot: true
    talosImageURL: factory.talos.dev/installer-secureboot/44186a005dfca322f81df634a457384455475fbfa518777f3ee58d35f173d73b
    controlPlane: true
    patches:
      # TPM-sealed LUKS (slot 0) with a static-passphrase fallback (slot 1): a known-buggy BIOS
      # update line wipes Secure Boot keys, changing the PCR 7 value slot 0 is sealed to, and Talos
      # has no recovery path for that. Passphrase comes from 1Password at genconfig time; never
      # commit it. NEVER remove slot 1 without a replacement: talhelper's syncKeys() deletes any
      # slot missing from config. See kb/207 for the incident, why slot 0 still binds to PCR 7, and
      # the manual TPM-slot rotation procedure.
      - |-
        machine:
          systemDiskEncryption:
            state:
              provider: luks2
              keys:
                - slot: 0
                  tpm: {}
                - slot: 1
                  static:
                    passphrase: ${TALOS_LUKS_FALLBACK}
            ephemeral:
              provider: luks2
              keys:
                - slot: 0
                  tpm: {}
                - slot: 1
                  static:
                    passphrase: ${TALOS_LUKS_FALLBACK}
      - |-
        apiVersion: v1alpha1
