[settings]
# Pins exact tool versions, checksums and provenance in mise.lock for reproducible installs.
lockfile = true
# Required by [hooks] below (mise gates hooks behind experimental); scoped to this config only.
experimental = true
# Resolves aqua packages from the live aqua-registry instead of the binary's baked snapshot, which
# goes stale when upstream renames an asset or binary (editorconfig-checker 4.0.0 did both).
aqua.baked_registry = false

[env]
BOOTSTRAP_DIR = "{{config_root}}/bootstrap"
JUST_UNSTABLE = "1"
KUBECONFIG = "{{config_root}}/kubeconfig"
KUBERNETES_DIR = "{{config_root}}/kubernetes"
ROOT_DIR = "{{config_root}}"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
TALOS_DIR = "{{config_root}}/talos"
_.python.venv = {path = "{{config_root}}/.venv", create = true}

[hooks]
# `mise install` fetches the lefthook binary but doesn't materialise .git/hooks, which is how this
# repo ran for months with none of its pre-commit checks firing (#3804). Wiring the install here
# closes the fresh-clone gap; lefthook install is idempotent, so re-running costs nothing.
postinstall = "lefthook install"

[tasks.deps]
description = "Install the docs toolchain (zensical, CI-pinned) into the repo venv"
run = "uv pip install -r docs/requirements.txt"

[tools]
"aqua:budimanjojo/talhelper" = "3.1.17"
# ≥1.52 needed for default-list/default-script; recipe_name() needs 1.53. Pinned for Renovate.
"aqua:casey/just" = "1.59.0"
"aqua:charmbracelet/gum" = "latest"
"aqua:cli/cli" = "2.103.3"
"aqua:cloudflare/cloudflared" = "2026.10.6"
"aqua:cue-lang/cue" = "0.17.1"
# These four mirror the linters super-linter v8 bundles, so lefthook catches findings locally
# before CI. Local pins may run ahead of what super-linter@9e863354 (v8.6.0) bundles (e.g.
# editorconfig-checker 3.6.1); fine as long as newer is only stricter, a superset of CI.
"aqua:editorconfig-checker/editorconfig-checker" = "4.0.2"
# The hook runner; unpinned until now, which is why .git/hooks/ sat empty (see [hooks] above).
"aqua:evilmartians/lefthook" = "2.2.2"
"aqua:fluxcd/flux2" = "2.9.6"
"aqua:google/yamlfmt" = "0.21.0"
"aqua:helm/helm" = "4.3.1"
"aqua:helmfile/helmfile" = "1.8.2"
"aqua:helmfile/vals" = "0.50.0"
"aqua:jqlang/jq" = "1.7.1"
"aqua:koalaman/shellcheck" = "latest"
"aqua:kubernetes-sigs/kustomize" = "5.6.0"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.2"
"aqua:mitsuhiko/minijinja" = "3.0.4"
# promtool, for .github/scripts/check_prometheus_rules.py; keep in step with the workflow pin.
"aqua:prometheus/prometheus" = "3.15.1"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:rhysd/actionlint" = "latest"
"aqua:siderolabs/talos" = "1.14.4"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:zizmorcore/zizmor" = "1.31.1"
"github:home-operations/flate" = "latest"
"github:home-operations/yayamlls" = "latest"
python = "3.15.2"
uv = "0.13.6"
# Exact pins, not ranges: an in-range update is lockfile-only for Renovate, and that path fails on
# Mend hosted (the node/prettier "-lockfile" branches errored every tick; ordinary bump-toml+lock
# updates, e.g. just 1.57.0 in #3601, work fine). Every other tool here is already exact-pinned.
node = "24.22.2"
"npm:markdownlint-cli" = "0.50.0"
"npm:prettier" = "3.9.10"
"pipx:black" = "26.10.1"
"pipx:codespell" = "2.4.3"
"pipx:isort" = "9.0.2"
"pipx:pylint" = "4.1.3"
"pipx:yamllint" = "1.38.0"
