---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# CRDs install out-of-band, not via `helmfile apply`/`sync`, so apps skip a dependsOn edge.
# Renovate's helmfile manager keeps each version pin in step with the app's ocirepository.yaml.

helmDefaults:
  args:
    - --include-crds
    - --no-hooks

releases:
  - name: cloudflare-dns
    namespace: network
    chart: oci://ghcr.io/home-operations/charts-mirror/external-dns
    version: 1.23.0
    # Chart 1.22.0 requires `policy` with no default, or schema validation fails first.
    values:
      - policy: sync

  - name: envoy-gateway
    namespace: network
    chart: oci://mirror.gcr.io/envoyproxy/gateway-helm
    # Unprefixed like the Flux OCIRepository: Renovate proposes the unprefixed tag, so a v-prefixed
    # pin left its update branch erroring (v1.9.1 -> 1.9.2).
    version: 1.9.2

  - name: grafana-operator
    namespace: observability
    chart: oci://ghcr.io/grafana/helm-charts/grafana-operator
    version: 5.25.0

  - name: kopiur
    namespace: kopiur-system
    chart: oci://ghcr.io/home-operations/charts/kopiur
    version: 0.10.16

  - name: kube-prometheus-stack
    namespace: observability
    chart: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    version: 92.16.1

  - name: snapshot-controller
    namespace: kube-system
    chart: oci://ghcr.io/home-operations/charts/snapshot-controller
    version: 0.1.2

  - name: volsync
    namespace: volsync-system
    chart: oci://ghcr.io/home-operations/charts-mirror/volsync-perfectra1n
    version: 0.18.5
