# ---------------------------------------------------------------------------
# Commit message hygiene. AGENTS.md forbids LAN IPs and internal hostnames "in files", but prose
# was the one surface nobody linted; a squash merge copying a PR body verbatim into main's commit
# message is how a LAN IP and the internal zone name became permanent history in #3803. Reuses the
# same patterns and BENIGN list as the tracked-file scan in security-scans.yaml, so prose and files
# can't drift apart; pr-hygiene.yml runs the same check against PR title + body.
# Exception: git commit --no-verify
# ---------------------------------------------------------------------------
[commit-msg]

[commit-msg.commands.check-internal-identifiers]
# Via `mise x` so the gitignored .mise.local.toml [env] reaches the script; a git hook does not
# inherit an activated mise shell.
run = "mise x -- python3 .github/scripts/check_internal_identifiers.py --strip-git-comments --text-file {1}"

[pre-commit]
parallel = true

[pre-commit.commands.format-yaml]
run = "mise x -- yamlfmt {staged_files}"
glob = ["*.yaml", "*.yml"]
# .markdownlint.yml must byte-match the shared-workflows canonical (zensical drift check);
# yamlfmt would add a `---` document-start and break that match.
exclude = ["**/.markdownlint.yml", ".markdownlint.yml"]
stage_fixed = true

[pre-commit.commands.lint-shell]
run = "mise x -- shellcheck -x {staged_files}"
glob = ["*.sh"]

[pre-commit.commands.lint-actions]
run = "mise x -- actionlint -no-color"
glob = [".github/workflows/*.yml", ".github/workflows/*.yaml"]

# Complements actionlint: audits for template injection, dangerous triggers, credential leaks.
[pre-commit.commands.lint-zizmor]
run = "mise x -- zizmor --offline {staged_files}"
glob = [".github/workflows/*.yml", ".github/workflows/*.yaml", ".github/actions/**/action.yaml"]

# A docs page no nav entry names still builds under --strict; this makes it fail instead.
[pre-commit.commands.docs-linked]
run = "python3 .github/scripts/check_docs_linked.py"
glob = ["docs/docs/**/*.md", "docs/zensical.toml"]

[pre-commit.commands.format-json]
run = "mise x --quiet -- prettier -w --log-level warn {staged_files}"
glob = ["*.json", "*.json5"]
stage_fixed = true

# Matches super-linter's YAML_PRETTIER rule so brace-spacing/quote-style fixes land at commit time.
[pre-commit.commands.format-yaml-prettier]
run = "mise x --quiet -- prettier -w --log-level warn {staged_files}"
glob = ["*.yaml", "*.yml"]
stage_fixed = true

# Matches super-linter's MARKDOWN_PRETTIER rule: JSON and YAML were covered but Markdown was not,
# so its normalizations only surfaced in CI. docs/ is excluded because zensical owns that tree.
[pre-commit.commands.format-markdown-prettier]
run = "mise x --quiet -- prettier -w --log-level warn {staged_files}"
glob = ["*.md"]
exclude = ["docs/**"]
stage_fixed = true

# Matches super-linter's PYTHON_BLACK. The repo config sets line-length 120; plain `black` uses 88
# and CI then rejects the result.
[pre-commit.commands.format-python-black]
run = "mise x -- black --quiet --config .github/linters/.python-black {staged_files}"
glob = ["*.py"]
exclude = ["docs/**"]
stage_fixed = true

# ---------------------------------------------------------------------------
# super-linter parity (report-only: these block the commit, they don't fix). The commands below mirror
# the remaining non-Docker super-linter linters, pointing at the same config under .github/linters/
# and scoped to staged files like CI's changed-files-only PRs. docs/ is excluded everywhere: the
# zensical toolchain owns it. Tool versions in .mise.toml match the super-linter v8 pin.
# ---------------------------------------------------------------------------

# Non-strict to match CI: level:warning rules (line-length, braces, indentation, …) are reported,
# only error-level rules (key-duplicates, CRLF line endings) fail the commit.
[pre-commit.commands.lint-yamllint]
run = "mise x -- yamllint -c .github/linters/.yaml-lint.yml {staged_files}"
glob = ["*.yaml", "*.yml"]
exclude = ["docs/**"]

# No glob, so it scans every staged file; codespell auto-skips binaries.
[pre-commit.commands.lint-codespell]
run = "mise x -- codespell --config .github/linters/.codespellrc {staged_files}"
exclude = ["docs/**"]

# Uses the indent-4 .markdown-lint.yml; docs/ (indent-2) is excluded to avoid the MD007 conflict.
[pre-commit.commands.lint-markdownlint]
run = "mise x -- markdownlint --config .github/linters/.markdown-lint.yml {staged_files}"
glob = ["*.md"]
exclude = ["docs/**"]

# Binary renamed from `ec` to `editorconfig-checker` in v4.0.0. No glob needed: its own
# .editorconfig-checker.json already excludes Markdown, fixtures and smokeping Targets.
[pre-commit.commands.lint-editorconfig]
run = "mise x -- editorconfig-checker -config .github/linters/.editorconfig-checker.json {staged_files}"
exclude = ["docs/**"]

# Needs docker; a gate typo otherwise ships, since chaski drops a push whose whenExpr errors.
[pre-commit.commands.check-chaski-routes]
run = "mise x -- env -u VIRTUAL_ENV uv run -q --no-project --with pyyaml python3 .github/scripts/check_chaski_routes.py"
glob = ["kubernetes/apps/default/chaski/app/*.yaml", ".github/scripts/tests/chaski/**/*.json", ".github/scripts/check_chaski_routes.py"]

[pre-commit.commands.lint-pylint]
run = "mise x -- pylint --rcfile .github/linters/.python-lint {staged_files}"
glob = ["*.py"]
exclude = ["docs/**"]
