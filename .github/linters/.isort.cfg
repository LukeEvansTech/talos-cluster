# isort ships no shared config from the reusable workflow, so it runs with its
# defaults -- and its default wrap style (grid, hanging-aligned) is the one thing
# black always rewrites. Any import list long enough to wrap therefore fails
# PYTHON_BLACK and PYTHON_ISORT alternately, forever.
#
# profile=black is isort's own compatibility preset. Verified 2026-09-11 to
# change nothing about the repo's existing Python files: all four pass isort
# identically with and without it.
[settings]
profile = black
