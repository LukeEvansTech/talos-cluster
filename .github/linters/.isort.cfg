# isort has no shared config here, so it runs with its default wrap style, which black always
# rewrites; a long enough import list then fails PYTHON_BLACK and PYTHON_ISORT alternately, forever.
# profile=black is isort's own compatibility preset, verified 2026-09-11 to change nothing about
# this repository's existing Python files.
[settings]
profile = black
# Matches super-linter's bundled black line length, or isort wraps at 88 and black immediately
# unwraps it, the same alternating failure profile=black exists to prevent.
line_length = 120
