---
# The curatorfilm and curatortv engines are a fork whose fixes have drifted apart, and their fixture
# suites (with test_fork_parity) otherwise run only in a local pre-commit hook. Both are stdlib-only.
# The film engine's Python package keeps the name `curator`, so each entry names its app directory
# and its package separately.
name: Curator Tests

on:
  pull_request:
    paths:
      - "kubernetes/apps/*/curatorfilm/app/resources/**"
      - "kubernetes/apps/*/curatortv/app/resources/**"
      # The suites load each judge's read_verdicts.py.
      - "kubernetes/apps/*/curatorfilmjudge/app/resources/**"
      - "kubernetes/apps/*/curatortvjudge/app/resources/**"
      - ".github/workflows/curator-tests.yml"

permissions:
  contents: read

jobs:
  curator-tests:
    name: Curator engine tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: curatorfilm
            package: curator
          - app: curatortv
            package: curatortv
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the ${{ matrix.app }} fixture suite
        # Globbed, not a fixed namespace, so an engine can move without editing this.
        working-directory: kubernetes/apps
        env:
          APP: ${{ matrix.app }}
          PACKAGE: ${{ matrix.package }}
        run: cd ./*/"$APP"/app/resources && python3 -m unittest discover -s "$PACKAGE/tests" -t .
