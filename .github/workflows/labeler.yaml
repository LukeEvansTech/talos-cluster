---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Labeler"

on:
  workflow_dispatch:
  # zizmor: ignore[dangerous-triggers]
  # actions/labeler must write PR labels even for forks, where pull_request's token is read-only.
  # This workflow never checks out PR code or runs PR-supplied commands, so no injection risk.
  pull_request_target:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  labeler:
    name: Labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Labeler
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yaml
