---
# Canonical template shared across repos; build-only repos override `allow-no-pages: true`.
name: Docs Standard Check

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/**"
      - ".renovaterc.json5"
      - ".markdownlint.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  drift:
    uses: LukeEvansTech/shared-workflows/.github/workflows/zensical-drift-check.yml@e9b04d22ec529dd718aee0f38df44053149e13e8 # v1
