---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Thin caller of the shared-workflows renovate-review reusable, which owns the
# whole mechanism and the generic two-thirds of the review prompt. This repo's
# own context lives in .github/renovate-review-context.md.
#
# Fix reviewer behaviour in shared-workflows, never here.
name: "Renovate PR Review"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: renovate-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Top-level read-only (zizmor excessive-permissions / CKV2_GHA_1).
permissions:
  contents: read

jobs:
  review:
    # Per-job write scopes: post the review, set the gating commit status.
    # The reusable needs at least these or the run fails with startup_failure.
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      id-token: write
    uses: LukeEvansTech/shared-workflows/.github/workflows/renovate-review.yml@275af0a49a18fe926c1d7f0e65ee45babdb57a30 # v1
    with:
      # Derived at runtime from the "Protected infra" packageRules entry in
      # .renovaterc.json5, so the blast list can never drift from the Renovate
      # config the way a hardcoded regex would.
      blast-from-renovaterc: true
      forbidden-commands: "kubectl, flux, talosctl, or cluster commands"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
