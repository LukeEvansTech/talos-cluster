---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Thin caller of the shared-workflows renovate-review reusable, which owns the mechanism and the
# generic prompt; this repo's context lives in .github/renovate-review-context.md. Fix reviewer
# behaviour in shared-workflows, never here.
name: "Renovate PR Review"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: renovate-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Top-level read-only (zizmor excessive-permissions / CKV2_GHA_1).
permissions:
  contents: read

jobs:
  review:
    # Per-job write scopes the reusable needs (post the review, set the gating status), or the run
    # fails with startup_failure.
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      id-token: write
    uses: LukeEvansTech/shared-workflows/.github/workflows/renovate-review.yml@4f77b1856421438fefe16f69ed4dd682a445f7b1 # v1
    with:
      # Derived at runtime from the "Protected infra" packageRules entry in .renovaterc.json5, so
      # the blast list can never drift from the Renovate config the way a hardcoded regex would.
      blast-from-renovaterc: true
      forbidden-commands: "kubectl, flux, talosctl, or cluster commands"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
