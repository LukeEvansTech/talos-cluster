---
# The PR body is a leak surface, not just a description: GitHub's squash merge
# copies it verbatim into the commit message on main, where it is permanent and
# world-visible. This repository is PUBLIC (see AGENTS.md), so gate the title
# and body on the same rules the local commit-msg hook enforces.
#
# Deliberately a separate workflow from security-scans.yaml even though both
# call check_internal_identifiers.py: this one needs the `edited` trigger so a
# reworded body is re-checked, and firing Checkov/Trivy on every body edit
# would be wasteful.
name: PR Hygiene

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  scan-pr-text:
    name: Scan PR title and body
    runs-on: ubuntu-latest
    # Renovate bodies are machine-generated upstream release notes — they can
    # legitimately quote an example IP from a changelog and carry no narrative
    # about this network. Skip them rather than grow an allowlist forever.
    if: >-
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'renovate'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan title and body
        # PR text is untrusted input: bind it to env and reference it as a shell
        # variable, never interpolate ${{ }} into the run block
        # (zizmor template-injection).
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # The internal zone regex is NOT hardcoded in the script: that file is
          # public, so a literal there would re-disclose what the guard exists to
          # hide. Unset, the check skips and every other pattern still applies.
          # A dedicated GitHub Environment would gate this behind approval
          # rules, which is wrong for an always-on lint check that must run
          # unattended on every PR. The value is a low-sensitivity regex, not
          # a credential, and it is a secret only so it stays out of a public
          # file -- see the script docstring.
          INTERNAL_DOMAIN_RE: ${{ secrets.INTERNAL_DOMAIN_RE }} # zizmor: ignore[secrets-outside-env]
        run: |-
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" \
            | python3 .github/scripts/check_internal_identifiers.py --text-file -

  # Deliberately NOT gated on the Renovate skip above. The body check exempts
  # Renovate because its bodies are machine-generated upstream release notes,
  # but a human fix pushed onto a Renovate branch is authored normally -- and
  # that is a real path for an assistant-authored commit to reach main.
  scan-commit-authors:
    name: Scan commit authorship
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Reject assistant-authored commits
        # The body scan above is not sufficient. GitHub's squash merge derives
        # Co-authored-by trailers from COMMIT AUTHORSHIP and appends them after
        # this workflow has run, so a spotless body still lands a trailer on
        # main if any commit carries an assistant identity. AGENTS.md forbids
        # those trailers, so catch the authorship itself.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |-
          authors=$(gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate \
            --jq '.[] | "\(.commit.author.name) <\(.commit.author.email)>"' \
            | sort -u)
          printf 'commit authors in this PR:\n%s\n\n' "$authors"
          if printf '%s\n' "$authors" | grep -qiE 'anthropic\.com|@users\.noreply\.anthropic'; then
            echo "::error::A commit in this pull request carries an assistant author identity. GitHub's squash merge would append a co-author trailer to main, which AGENTS.md forbids. Re-author the commits (git rebase --exec 'git commit --amend --no-edit --reset-author') and force-push the branch."
            exit 1
          fi
          echo "No assistant-authored commits."
