---
# A PR body is a leak surface: squash merge copies it verbatim, permanently and world-visibly,
# into the commit message on main (this repository is PUBLIC), so it is gated like the commit-msg
# hook. Separate from security-scans.yaml, which shares the same script call, because this one
# needs the `edited` trigger to recheck a reworded body, without firing Checkov/Trivy on every edit.
name: PR Hygiene

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  scan-pr-text:
    name: Scan PR title and body
    runs-on: ubuntu-latest
    # Renovate bodies are machine-generated release notes that can legitimately quote an example
    # IP from a changelog with no narrative about this network; skipped rather than allowlisted.
    if: >-
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'renovate'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan title and body
        # PR text is untrusted: bind it to env and reference as a shell variable, never
        # interpolate ${{ }} into the run block (zizmor template-injection).
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # Not hardcoded in the script (that file is public); unset, the check just skips this
          # pattern. Not a GitHub Environment secret either: that gates behind approval, wrong for
          # an always-on unattended check. It's a secret only to keep it out of a public file.
          INTERNAL_DOMAIN_RE: ${{ secrets.INTERNAL_DOMAIN_RE }} # zizmor: ignore[secrets-outside-env]
          PRIVATE_NAMES_RE: ${{ secrets.PRIVATE_NAMES_RE }} # zizmor: ignore[secrets-outside-env]
        run: |-
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" \
            | python3 .github/scripts/check_internal_identifiers.py --text-file -

  # Not gated on the Renovate skip above: that exempts machine-generated release-note bodies, but
  # a human fix pushed onto a Renovate branch is authored normally, a real path to reaching main.
  scan-commit-authors:
    name: Scan commit authorship
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        # Needed by the commit-message scan step below, which shells out to the tracked script.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject assistant-authored commits
        # The body scan isn't enough: squash merge derives Co-authored-by trailers from commit
        # authorship after this workflow runs, so a spotless body can still land one on main.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |-
          authors=$(gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate \
            --jq '.[] | "\(.commit.author.name) <\(.commit.author.email)>"' \
            | sort -u)
          printf 'commit authors in this PR:\n%s\n\n' "$authors"
          if printf '%s\n' "$authors" | grep -qiE 'anthropic\.com|@users\.noreply\.anthropic'; then
            echo "::error::A commit in this pull request carries an assistant author identity. GitHub's squash merge would append a co-author trailer to main, which AGENTS.md forbids. Re-author the commits (git rebase --exec 'git commit --amend --no-edit --reset-author') and force-push the branch."
            exit 1
          fi
          echo "No assistant-authored commits."

      - name: Scan commit messages for internal identifiers / co-author trailers
        # The author-identity check only sees GitHub's derived metadata; a human-authored commit
        # can still carry a literal Co-authored-by trailer (or a LAN IP) in its message body, which
        # scan-pr-text never sees either. Squash merge aggregates commit messages into the default
        # body, so that text can reach main verbatim; reuses the same script as the other checks.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # See the matching comment in scan-pr-text above.
          INTERNAL_DOMAIN_RE: ${{ secrets.INTERNAL_DOMAIN_RE }} # zizmor: ignore[secrets-outside-env]
          PRIVATE_NAMES_RE: ${{ secrets.PRIVATE_NAMES_RE }} # zizmor: ignore[secrets-outside-env]
        run: |-
          set -o pipefail
          # The commits endpoint lists at most 250 commits however far you
          # paginate, so a longer PR would be scanned incompletely and pass.
          # The PR's own commit count is not capped; refuse rather than skim.
          total=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.commits')
          if [ "$total" -gt 250 ]; then
            echo "::error::This pull request has ${total} commits; the API lists at most 250, so the message scan would be incomplete. Squash or split it before merging."
            exit 1
          fi
          gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate \
            --jq '.[].commit.message' \
            | python3 .github/scripts/check_internal_identifiers.py --text-file -
