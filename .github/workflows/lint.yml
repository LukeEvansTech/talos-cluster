---
name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    uses: LukeEvansTech/shared-workflows/.github/workflows/super-linter.yml@239610499ad65c397d8d90b1a139d041bf28598a # v1
    with:
      # Raw YAML source is meaningless until kustomize substitutes vars and merges components, so
      # kubeconform false-positives on every CRD-shaped file; real validation lives in flate.
      validate-kubernetes-kubeconform: false
      # Blocking: with kubeconform off, the remaining checks (yamllint, prettier, …) run clean.
      soft-launch: false
      # docs/ is owned by .markdownlint.yml + docs-standard-check (MD007 indent 2); excluded here
      # so super-linter's indent-4 markdown config doesn't double-lint it with a conflicting rule.
      filter-regex-exclude: '(^|/)(node_modules|\.venv|site)/|(^|/)docs/'
