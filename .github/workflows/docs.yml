---
# Canonical template shared across repos; build-only repos override `publish: false`.
name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: LukeEvansTech/shared-workflows/.github/workflows/zensical.yml@73e389d042214f01e482a2bb64f3f71b00f63219 # v1
    with:
      publish: ${{ github.event_name != 'pull_request' }}
