---
name: security-scans

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *" # nightly at 3 AM UTC

# Top-level: read-only by default. The reusable workflow widens per job.
permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
    uses: LukeEvansTech/shared-workflows/.github/workflows/security-scans.yml@239610499ad65c397d8d90b1a139d041bf28598a # v1
    # Defaults match this repo's prior inline config: framework=kubernetes,helm;
    # severity=CRITICAL,HIGH,MEDIUM; scanners=vuln,secret,misconfig; trivyignore=.trivyignore.yaml.
    # Override here if drift becomes desirable.

  internal-identifiers:
    name: Internal Identifier Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR runs diff against the merge ref's first parent (main at merge time), so both
          # parents of the merge commit must be present.
          fetch-depth: 2
      # PR runs scan only the files the PR changes (--diff-base HEAD^1): the merge ref includes
      # all of main, and a full scan there once let a transient bad state on main fail every open
      # PR, whose stale FAILURE check-run then blocked Renovate self-merge forever. Push-to-main
      # and nightly runs still scan everything. See the script for the allowlist and rationale.
      - name: Scan tracked files for internal infrastructure identifiers
        env:
          DIFF_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
          # Internal zone regex supplied out-of-band (see the script docstring). Not a GitHub
          # Environment secret: that gates behind approval, wrong for an always-on unattended check.
          INTERNAL_DOMAIN_RE: ${{ secrets.INTERNAL_DOMAIN_RE }} # zizmor: ignore[secrets-outside-env]
        run: python3 .github/scripts/check_internal_identifiers.py ${DIFF_BASE:+--diff-base "$DIFF_BASE"}
      # Deleting a ${SECRET_INTERNAL_DOMAIN} route hostname is only safe when the same route also
      # publishes ${SECRET_DOMAIN}; catches an app going fully offline before it merges.
      - name: Route hostname pair check
        run: python3 .github/scripts/check_route_hostname_pairs.py
      # Every CronJob in git must set ttlSecondsAfterFinished, or one failed Job latches
      # KubeJobFailed until history rotation (11 days in Sep 2026).
      - name: CronJob TTL check
        run: python3 .github/scripts/check_cronjob_ttl.py
