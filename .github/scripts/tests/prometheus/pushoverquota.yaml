---
# promtool unit tests for PushoverQuotaPaceHigh. An exporter restart starts a new series with an
# hour of history; a burst in that hour must not be forecast over the month, but a real burn must fire.
rule_files:
  - kubernetes/apps/observability/pushoverquota/app/prometheusrule.yaml
evaluation_interval: 5m
tests:
  # Slow drain on pod a, a restart at 24h, then a 96-message burst in pod b's first hour.
  - interval: 5m
    input_series:
      - series: 'pushover_messages_remaining{job="pushoverquota",pod="a"}'
        values: "10000-0.2x287"
      - series: 'pushover_messages_remaining{job="pushoverquota",pod="b"}'
        values: "_x288 9942.4-8x12 9846.4x60"
      - series: 'pushover_message_limit{job="pushoverquota",pod="b"}'
        values: "10000x360"
      - series: 'pushover_limit_reset_timestamp_seconds{job="pushoverquota",pod="a"}'
        values: "2419200x287"
      - series: 'pushover_limit_reset_timestamp_seconds{job="pushoverquota",pod="b"}'
        values: "_x288 2419200x72"
    alert_rule_test:
      - eval_time: 1560m
        alertname: PushoverQuotaPaceHigh
        exp_alerts: []
      - eval_time: 1800m
        alertname: PushoverQuotaPaceHigh
        exp_alerts: []
  # A real burn: about 870 messages in two days, against a budget of about 260 a day.
  - interval: 5m
    input_series:
      - series: 'pushover_messages_remaining{job="pushoverquota",pod="a"}'
        values: "10000-3x600"
      - series: 'pushover_message_limit{job="pushoverquota",pod="a"}'
        values: "10000x600"
      - series: 'pushover_limit_reset_timestamp_seconds{job="pushoverquota",pod="a"}'
        values: "2419200x600"
    alert_rule_test:
      - eval_time: 2940m
        alertname: PushoverQuotaPaceHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: pushoverquota
            exp_annotations:
              description: >-
                Per-sender burn: sum by (target) (increase(chaski_target_sends_total[24h])). Alertmanager
                and other direct senders are not in that metric. The fix is in the PushoverQuota row of known-noise.md.
              summary: "At the last 24h rate Pushover runs out before its monthly reset (projected -14.19k messages left)."
