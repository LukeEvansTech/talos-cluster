---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: crowdsec
  # The chart schema rejects the kubernetes acquisition source.
  install:
    disableSchemaValidation: true
  upgrade:
    disableSchemaValidation: true
  # Alert-only: no bouncer is deployed, so decisions are recorded but never enforced.
  # See docs/docs/apps/crowdsec.md before adding one.
  values:
    # The default (docker) mounts /var/lib/docker/containers into the agent.
    container_runtime: containerd
    image:
      repository: mirror.gcr.io/crowdsecurity/crowdsec
    lapi:
      env:
        - name: USE_WAL
          value: "true"
      persistentVolume:
        data:
          storageClassName: ceph-block
        config:
          storageClassName: ceph-block
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: null
          memory: 512Mi
      metrics:
        serviceMonitor:
          enabled: true
    agent:
      isDeployment: true
      hostVarLog: false
      serviceAccountName: crowdsec-agent
      # Streams the gateway's JSON access log through the API; downstream_remote_address is
      # already the visitor's address because envoy trusts X-Forwarded-For from cloudflared.
      additionalAcquisition:
        - source: kubernetes
          namespace: network
          selector: gateway.envoyproxy.io/owning-gateway-name=envoy-external
          labels:
            type: envoy
      env:
        - name: COLLECTIONS
          value: yanis-kouidri/envoy
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: null
          memory: 256Mi
      metrics:
        serviceMonitor:
          enabled: true
