---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: opnsense-dns-rules
spec:
  groups:
    - name: opnsense-dns.rules
      rules:
        # A NotReady sidecar takes the whole pod out of the ServiceMonitor, so
        # every gauge rule also fires on absence; a value-only rule would go
        # quiet exactly when the firewall is unreachable. The counter rules are
        # the deliberate exception: the gauge rules already cover a missing
        # scrape, so they do not wrap absent(). Their series exist at zero from
        # sidecar start, but a fresh pod's first increment can land before
        # increase() has a window to read, so the second branch catches a
        # non-zero series that did not exist an hour ago.
        - alert: OPNsenseDNSStale
          expr: |
            (time() - external_dns_controller_last_sync_timestamp_seconds{job="opnsense-dns"} > 900)
              or absent(external_dns_controller_last_sync_timestamp_seconds{job="opnsense-dns"})
          for: 5m
          annotations:
            summary: >-
              opnsense-dns has not completed a sync for 15 minutes (or is not being scraped)
          labels:
            severity: critical
        - alert: OPNsensePendingReconfigure
          expr: |
            externaldns_webhook_opnsense_pending_reconfigure{provider="opnsense"} == 1
              or absent(externaldns_webhook_opnsense_pending_reconfigure{provider="opnsense"})
          for: 10m
          annotations:
            summary: >-
              opnsense-dns saved host overrides that Unbound is not serving yet (or the sidecar is not being scraped)
          labels:
            severity: warning
        - alert: OPNsenseDeleteBlocked
          expr: |
            increase(externaldns_webhook_opnsense_delete_blocked_total{provider="opnsense"}[1h]) > 0
              or (externaldns_webhook_opnsense_delete_blocked_total{provider="opnsense"} > 0
                unless externaldns_webhook_opnsense_delete_blocked_total{provider="opnsense"} offset 1h)
          for: 0m
          annotations:
            summary: >-
              opnsense-dns refused to delete a host override because a hand-made alias hangs off it
          labels:
            severity: warning
        - alert: OPNsenseLostWrite
          expr: |
            increase(externaldns_webhook_opnsense_lost_writes_total{provider="opnsense"}[1h]) > 0
              or (externaldns_webhook_opnsense_lost_writes_total{provider="opnsense"} > 0
                unless externaldns_webhook_opnsense_lost_writes_total{provider="opnsense"} offset 1h)
          for: 0m
          annotations:
            summary: >-
              OPNsense acknowledged a host-override write that was missing on re-read; the reconcile retries it, the sidecar log names the row
          labels:
            severity: warning
