---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opnsense-dns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: opnsense-dns
  values:
    fullnameOverride: opnsense-dns
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/lukeevanstech/external-dns-opnsense-webhook
          tag: 0.1.0@sha256:b9df1ac4db692cf4cbd31560e88a30d6ee979eceb57b830cbf73dbae190fa3cf
        env:
          - name: OPNSENSE_HOST
            valueFrom:
              secretKeyRef:
                name: opnsense-dns-secret
                key: host
          - name: OPNSENSE_API_KEY
            valueFrom:
              secretKeyRef:
                name: opnsense-dns-secret
                key: api-key
          - name: OPNSENSE_API_SECRET
            valueFrom:
              secretKeyRef:
                name: opnsense-dns-secret
                key: api-secret
          - name: OPNSENSE_DOMAINS
            value: ${SECRET_DOMAIN},${SECRET_INTERNAL_DOMAIN}
          # The firewall presents a self-signed certificate; the provider
          # defaults to verifying.
          - name: OPNSENSE_SKIP_TLS_VERIFY
            value: "true"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 256Mi
    # One apply can take OPNSENSE_APPLY_TIMEOUT + OPNSENSE_RECONFIGURE_TIMEOUT
    # (165s); the controller's write timeout and the pod's grace period sit
    # above that.
    deploymentStrategy:
      type: Recreate
    terminationGracePeriodSeconds: 180
    policy: sync
    registry: txt
    txtOwnerId: main
    txtPrefix: k8s.main.%{record_type}-
    # Pinned rather than left to the chart default: external-dns 1.22.0 flips
    # the default annotation prefix to the GA `external-dns.kubernetes.io/`,
    # and every annotation in this repository still uses the alpha prefix.
    # With `policy: sync` an unpinned bump would read zero annotations and
    # delete every record it owns. Drop the pin only as part of rewriting the
    # annotations to the GA prefix.
    annotationPrefix: external-dns.alpha.kubernetes.io/
    sources:
      - gateway-httproute
      - service
    extraArgs:
      - --events
      - --gateway-label-filter=type=internal
      - --webhook-provider-read-timeout=30s
      - --webhook-provider-write-timeout=180s
    domainFilters:
      - ${SECRET_DOMAIN}
      - ${SECRET_INTERNAL_DOMAIN}
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: opnsense-dns-secret
