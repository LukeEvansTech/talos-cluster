---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opnsense-dns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: opnsense-dns
  values:
    fullnameOverride: opnsense-dns
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/lukeevanstech/external-dns-opnsense-webhook
          tag: 0.1.1@sha256:03c74f5e9653f2d894ff14121555dbc9201d40ec02eb6c3d51671435bf257294
        env:
          - name: OPNSENSE_HOST
            valueFrom:
              secretKeyRef:
                name: opnsense-dns-secret
                key: host
          - name: OPNSENSE_API_KEY
            valueFrom:
              secretKeyRef:
                name: opnsense-dns-secret
                key: api-key
          - name: OPNSENSE_API_SECRET
            valueFrom:
              secretKeyRef:
                name: opnsense-dns-secret
                key: api-secret
          - name: OPNSENSE_DOMAINS
            value: ${SECRET_DOMAIN},${SECRET_INTERNAL_DOMAIN}
          # The firewall presents a self-signed certificate; the provider
          # defaults to verifying.
          - name: OPNSENSE_SKIP_TLS_VERIFY
            value: "true"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 256Mi
    # One apply can take OPNSENSE_APPLY_TIMEOUT + OPNSENSE_RECONFIGURE_TIMEOUT
    # (165s); the controller's write timeout and the pod's grace period sit
    # above that.
    deploymentStrategy:
      type: Recreate
    terminationGracePeriodSeconds: 180
    policy: upsert-only
    registry: noop
    # See the note in cloudflare-dns: external-dns 1.22.0 changes the default
    # annotation prefix to the GA `external-dns.kubernetes.io/`, which none of
    # this repository's annotations use yet. `upsert-only` means stale records
    # survive a bump, but new and changed hostnames would stop publishing.
    annotationPrefix: external-dns.alpha.kubernetes.io/
    sources:
      - gateway-httproute
      - service
    extraArgs:
      - --events
      - --gateway-label-filter=type=internal
      - --webhook-provider-read-timeout=30s
      - --webhook-provider-write-timeout=180s
    domainFilters:
      - ${SECRET_DOMAIN}
      - ${SECRET_INTERNAL_DOMAIN}
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: opnsense-dns-secret
