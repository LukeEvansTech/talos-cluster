---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: echo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: echo
  values:
    replicaCount: 2
    config:
      # Off, against upstream default: echo is public and this leaks pod/node/namespace to callers.
      kubernetes: false
      # Trust the in-cluster Envoy Gateway proxy so echo reports the real client IP
      trustedProxies:
        - ${CLUSTER_PODS_CIDR}
    # External-only: echo canaries the public chain (external-dns, DNS, envoy-external, cert, pod).
    httpRoute:
      enabled: true
      hostnames:
        - "{{ .Release.Name }}.${SECRET_DOMAIN}"
      parentRefs:
        - name: envoy-external
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 64Mi
