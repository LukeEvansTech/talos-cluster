---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scanopy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: scanopy-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # sslmode=require works because CNPG presents a valid cert-manager certificate.
        SCANOPY_DATABASE_URL: postgresql://scanopy:{{ .SCANOPY_POSTGRES_PASSWORD }}@postgres18-rw.database.svc.cluster.local:5432/scanopy?sslmode=require
        SCANOPY_DAEMON_API_KEY: "{{ .SCANOPY_DAEMON_API_KEY }}"
        SCANOPY_NETWORK_ID: "{{ .SCANOPY_NETWORK_ID }}"
  dataFrom:
    - extract:
        key: scanopy
