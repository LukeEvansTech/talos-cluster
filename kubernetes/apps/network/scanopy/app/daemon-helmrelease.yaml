---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app scanopy-daemon
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: scanopy
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      scanopy-daemon:
        # A per-node DaemonSet would triple-scan the shared LAN, so this is one
        # Deployment; Recreate stops two hostNetwork pods fighting over port 60073.
        type: deployment
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/scanopy/scanopy/daemon
              tag: v0.19.5@sha256:6b1acbde375dd2306aca6eba9388a94b7b28fb66eca46ffe484d4ce487b1d4c6
            env:
              TZ: ${TIMEZONE}
              SCANOPY_LOG_LEVEL: info
              SCANOPY_SERVER_URL: http://scanopy.network.svc.cluster.local:60072
              SCANOPY_ENABLE_LOCAL_DOCKER_SOCKET: "false"
              # Limits scanning to the LAN NIC; unscoped, it would also scan Cilium's
              # pod/service IPs and saturate node conntrack.
              SCANOPY_INTERFACES: enp1s0np0
              # This only limits L2 scanning; SNMP-discovered L3 subnets are still scanned.
              # TODO(vlan-buildout): re-check conntrack usage (docs/docs/apps/scanopy.md).
              # Caps concurrent scans; Scanopy's default auto-detects roughly 10-20.
              SCANOPY_CONCURRENT_SCANS: "5"
              # Fixed identity for the single scanner; previously came from the per-node nodeName.
              SCANOPY_NAME: scanopy-codelooks
            envFrom:
              - secretRef:
                  name: scanopy-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 60073
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
    persistence:
      # emptyDir, not hostPath: a per-node config held a different daemon id on each node. The API
      # key is bound to one daemon (api_keys.daemon_id), so a fresh config registers as that daemon.
      config:
        type: emptyDir
        globalMounts:
          - path: /root/.config/scanopy/daemon
      snmp-community:
        type: secret
        name: scanopy-snmp-secret
        globalMounts:
          - path: /run/secrets/snmp-community
            subPath: community
            readOnly: true
