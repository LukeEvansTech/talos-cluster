---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app scanopy
spec:
  interval: 1h
  # Room for the startupProbe below to cover a long schema migration.
  timeout: 35m
  chartRef:
    kind: OCIRepository
    name: scanopy
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    # Uninstall, not rollback: migrations are roll-forward only, so the previous binary cannot run
    # on a migrated schema. Retries come from the root patch; the PVC and database are not Helm's.
    remediation:
      strategy: uninstall
  values:
    controllers:
      scanopy:
        # Recreate: the RWO PVC would deadlock a rolling surge pod on another node
        # (docs/docs/apps/scanopy.md).
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/scanopy/scanopy/server
              tag: v0.18.0@sha256:ad1aafef0b8582330ab046094a1ccaacda92da391df91cee23a7a246bec7d924
            env:
              TZ: ${TIMEZONE}
              SCANOPY_LOG_LEVEL: info
              SCANOPY_PUBLIC_URL: https://scanopy.${SECRET_DOMAIN}
              SCANOPY_WEB_EXTERNAL_PATH: /app/static
              SCANOPY_USE_SECURE_SESSION_COOKIES: "true"
              # Implicit TLS on 465 to the smtp-tls sidecar; Scanopy has no plaintext mode.
              SCANOPY_SMTP_RELAY: 127.0.0.1
              SCANOPY_SMTP_PORT: "465"
              SCANOPY_SMTP_USERNAME: scanopy
              SCANOPY_SMTP_EMAIL: scanopy@${SECRET_DOMAIN}
              SCANOPY_TRUSTED_CA_BUNDLE: /tls/ca.crt
            envFrom:
              - secretRef:
                  name: scanopy-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 60072
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              # Migrations run before /api/health binds; liveness alone would kill it ~45s in.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 180
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
          smtp-tls:
            image:
              repository: docker.io/alpine/socat
              tag: 1.8.1.3@sha256:fb3862c949af7c79996d0e514ee96128644d840835ed5368eeecb14a869de361
            args:
              - OPENSSL-LISTEN:465,bind=127.0.0.1,reuseaddr,fork,cert=/tls/tls.crt,key=/tls/tls.key,verify=0
              - TCP:smtp2graph.infrastructure.svc.cluster.local:25
            resources:
              requests:
                cpu: 5m
                memory: 8Mi
              limits:
                memory: 32Mi
    defaultPodOptions:
      dnsConfig:
        options:
          - { name: ndots, value: "1" }
    service:
      app:
        controller: scanopy
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: scanopy
        advancedMounts:
          scanopy:
            app:
              - path: /data
      smtp-tls:
        type: secret
        name: scanopy-smtp-tls
        globalMounts:
          - path: /tls
            readOnly: true
