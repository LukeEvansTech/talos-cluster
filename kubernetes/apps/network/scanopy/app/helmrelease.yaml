---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app scanopy
spec:
  interval: 1h
  # Room for the startupProbe below to cover a long schema migration.
  timeout: 35m
  chartRef:
    kind: OCIRepository
    name: scanopy
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    # Uninstall, not rollback: migrations are roll-forward only, so the previous binary cannot run
    # on a migrated schema. Retries come from the root patch; the PVC and database are not Helm's.
    remediation:
      strategy: uninstall
  values:
    controllers:
      scanopy:
        # Recreate: the RWO PVC would deadlock a rolling surge pod on another node
        # (docs/docs/apps/scanopy.md).
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/scanopy/scanopy/server
              tag: v0.19.5@sha256:ec6a9b23af5094c009cb61d3078b4ba25c01471c9c3a126566b735b5df9cee3f
            env:
              TZ: ${TIMEZONE}
              SCANOPY_LOG_LEVEL: info
              SCANOPY_PUBLIC_URL: https://scanopy.${SECRET_DOMAIN}
              SCANOPY_WEB_EXTERNAL_PATH: /app/static
              SCANOPY_USE_SECURE_SESSION_COOKIES: "true"
              # The LAN name, not the Service name: smtp2graph's certificate is issued for it.
              # Port 25 makes Scanopy require STARTTLS, and it always logs in.
              SCANOPY_SMTP_RELAY: smtp.${SECRET_DOMAIN}
              SCANOPY_SMTP_PORT: "25"
              SCANOPY_SMTP_USERNAME: scanopy
              SCANOPY_SMTP_EMAIL: scanopy@${SECRET_DOMAIN}
            envFrom:
              - secretRef:
                  name: scanopy-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 60072
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              # Migrations run before /api/health binds; liveness alone would kill it ~45s in.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 180
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      dnsConfig:
        options:
          - { name: ndots, value: "1" }
    service:
      app:
        controller: scanopy
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: scanopy
        globalMounts:
          - path: /data
