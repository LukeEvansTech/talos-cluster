---
# Lets the oidc-talos ServiceAccount read the apiserver's discovery endpoints so init/refresh
# containers can fetch the live JWKS.
# Bound to this SA explicitly, not the cluster-wide system:serviceaccounts binding, so the app
# bootstraps clean on a fresh cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-talos-issuer-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - kind: ServiceAccount
    name: oidc-talos
    namespace: network
