---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app oidc-talos
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: oidc-talos
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    # Publishes OIDC discovery and JWKS so Entra can federate SA tokens without apiserver exposure.
    # The apiserver's `service-account-issuer` (talos/patches/controller/cluster.yaml) must equal
    # https://oidc-talos.${SECRET_DOMAIN}.
    # Only public keys are served; the private SA signing key never leaves the apiserver.
    # Fetched live at pod start and refreshed hourly, so no key material is committed (#3263).
    defaultPodOptions:
      # The init/refresh containers need this token; app-template disables automount by default.
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      oidc-talos:
        annotations:
          reloader.stakater.com/auto: "true"
        # Bound to system:service-account-issuer-discovery (rbac.yaml), not the cluster-wide
        # binding, so this bootstraps clean.
        serviceAccount:
          identifier: oidc-talos
        initContainers:
          # Authenticates with the pod's SA token, authorized by rbac.yaml's ClusterRoleBinding.
          # Uses kubernetes.default.svc, not ${KUBERNETES_SERVICE_*}, which Flux would blank.
          fetch-jwks:
            image: &curlImage
              repository: docker.io/curlimages/curl
              tag: 8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
            command:
              - /bin/sh
              - -c
              # $$ escapes Flux postBuild substitution so $(cat ...) reaches the shell intact.
              - |
                set -eu
                curl --fail --silent --show-error --max-time 10 --retry 5 --retry-delay 2 --retry-all-errors \
                  --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                  -H "Authorization: Bearer $$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
                  https://kubernetes.default.svc/openid/v1/jwks -o /jwks/jwks.new
                grep -q '"keys"' /jwks/jwks.new
                mv /jwks/jwks.new /jwks/jwks
                echo "fetched JWKS ($$(wc -c < /jwks/jwks) bytes)"
            securityContext: &hardened
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 32Mi
          # Refreshes hourly so a rotated SA key is picked up without a pod restart; a failed
          # refresh keeps serving the last good JWKS.
          refresh-jwks:
            restartPolicy: Always
            image: *curlImage
            command:
              - /bin/sh
              - -c
              # $$ escapes Flux postBuild substitution again (see fetch-jwks).
              - |
                while true; do
                  sleep 3600
                  if curl --fail --silent --show-error --max-time 10 --retry 3 --retry-delay 5 --retry-all-errors \
                    --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                    -H "Authorization: Bearer $$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
                    https://kubernetes.default.svc/openid/v1/jwks -o /jwks/jwks.new \
                    && grep -q '"keys"' /jwks/jwks.new; then
                    mv /jwks/jwks.new /jwks/jwks
                    echo "refreshed JWKS"
                  else
                    echo "refresh failed; keeping previous JWKS"
                  fi
                done
            securityContext: *hardened
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 32Mi
        containers:
          app:
            image:
              repository: docker.io/nginxinc/nginx-unprivileged
              tag: 1.31-alpine@sha256:26b0bf6fbf07297983cb341998d79c831508787de26627dd2a112321b9c3a4af
            env:
              TZ: ${TIMEZONE}
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    # The discovery ClusterRoleBinding (rbac.yaml) targets this SA (network/oidc-talos).
    serviceAccount:
      oidc-talos: {}
    service:
      app:
        controller: oidc-talos
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "oidc-talos.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
    configMaps:
      content:
        data:
          # `issuer` and `jwks_uri` must match the apiserver service-account-issuer and
          # terraform-entra var.sentinel_syslog_oidc_issuer.
          openid-configuration: |-
            {
              "issuer": "https://oidc-talos.${SECRET_DOMAIN}",
              "jwks_uri": "https://oidc-talos.${SECRET_DOMAIN}/openid/v1/jwks",
              "response_types_supported": ["id_token"],
              "subject_types_supported": ["public"],
              "id_token_signing_alg_values_supported": ["RS256"]
            }
      nginx:
        data:
          default.conf: |-
            server {
              listen 8080;
              server_name _;
              location = /.well-known/openid-configuration {
                default_type application/json;
                alias /config/openid-configuration;
              }
              location = /openid/v1/jwks {
                default_type application/json;
                # Served from the emptyDir the init/refresh containers populate from the live apiserver.
                alias /jwks/jwks;
              }
              location = /healthz {
                default_type text/plain;
                return 200 "ok";
              }
              location / { return 404; }
            }
    persistence:
      # Live JWKS: the init/refresh containers write it (rw), nginx serves it (ro).
      jwks:
        type: emptyDir
        globalMounts:
          - path: /jwks
      content:
        type: configMap
        identifier: content
        advancedMounts:
          oidc-talos:
            app:
              - path: /config
                readOnly: true
      nginx-conf:
        type: configMap
        identifier: nginx
        advancedMounts:
          oidc-talos:
            app:
              - path: /etc/nginx/conf.d/default.conf
                subPath: default.conf
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          oidc-talos:
            app:
              - path: /tmp
      cache:
        type: emptyDir
        advancedMounts:
          oidc-talos:
            app:
              - path: /var/cache/nginx
      run:
        type: emptyDir
        advancedMounts:
          oidc-talos:
            app:
              - path: /var/run
