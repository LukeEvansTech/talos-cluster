---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-dns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cloudflare-dns
  values:
    fullnameOverride: cloudflare-dns
    namespace: network
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    provider: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-dns-secret
            key: api-token
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
      - --cloudflare-proxied
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --events
      - --gateway-label-filter=type=external
    policy: sync
    # Pinned rather than left to the chart default: external-dns 1.22.0 flips
    # the default annotation prefix to the GA `external-dns.kubernetes.io/`,
    # and every annotation in this repository still uses the alpha prefix.
    # With `policy: sync` an unpinned bump would read zero annotations and
    # delete the records it owns. Drop the pin only as part of rewriting the
    # annotations to the GA prefix.
    annotationPrefix: external-dns.alpha.kubernetes.io/
    sources:
      - "crd"
      - "gateway-httproute"
    txtPrefix: k8s.%{record_type}-
    txtOwnerId: default
    domainFilters:
      - "${SECRET_DOMAIN}"
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: cloudflare-dns-secret
