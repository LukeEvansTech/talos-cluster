---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opnsensegh-config-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: opnsensegh-config-backup-secret
    template:
      data:
        OPNSENSE_HOST: "{{ .OPNSENSE_HOST }}"
        OPNSENSE_API_KEY: "{{ .OPNSENSE_API_KEY }}"
        OPNSENSE_API_SECRET: "{{ .OPNSENSE_API_SECRET }}"
        # Push credentials are shared with the main firewall's item: one deploy key, one repository.
        DEPLOY_KEY: "{{ .DEPLOY_KEY }}"
        KNOWN_HOSTS: "{{ .KNOWN_HOSTS }}"
  data:
    - secretKey: DEPLOY_KEY
      remoteRef:
        key: opnsense-config-backup
        property: DEPLOY_KEY
    - secretKey: KNOWN_HOSTS
      remoteRef:
        key: opnsense-config-backup
        property: KNOWN_HOSTS
  dataFrom:
    - extract:
        key: opnsensegh-config-backup
