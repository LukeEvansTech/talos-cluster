---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-same-namespace
spec:
  description: "Allow ingress from pods in the same namespace"
  endpointSelector:
    matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
          - cert-manager
          - external-secrets
          - rook-ceph
          - volsync-system
          - system-upgrade
      - key: app.kubernetes.io/name
        operator: NotIn
        values:
          # Holds a signed-in mail session behind no authentication of its own,
          # and is reached only by `kubectl port-forward`. allow-kube-apiserver
          # still grants it host ingress, which is that path.
          - thunderbird
  ingress:
    - fromEndpoints:
        - {}
