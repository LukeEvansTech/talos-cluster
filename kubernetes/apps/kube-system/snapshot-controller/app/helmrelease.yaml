---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: snapshot-controller
  # Helm never upgrades or deletes this chart's CRDs; apply them by hand after an appVersion
  # bump. See docs/docs/apps/snapshot-controller.md.
  values:
    replicaCount: 2
    monitoring:
      serviceMonitor:
        enabled: true
