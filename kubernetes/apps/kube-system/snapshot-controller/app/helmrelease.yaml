---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: snapshot-controller
  # This chart ships CRDs in crds/; the root Kustomization's CreateReplace patch keeps them
  # current on every install and upgrade. See docs/docs/apps/snapshot-controller.md.
  values:
    replicaCount: 2
    monitoring:
      serviceMonitor:
        enabled: true
