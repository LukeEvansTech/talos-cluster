---
# Home Assistant's IoT-VLAN leg. Same macvlan as `iot`, plus routes so the phone networks reach
# HA through it: the pod's default route is the cluster network, so without these a phone that
# connects to the IoT-VLAN address gets its replies via the node and the handshake never completes.
# HomeKit Bridge pairs by that address (it is what HA advertises over mDNS), which is why only
# HA carries the routes: mosquitto's LoadBalancer answers through the node, where the same
# routes would send its replies the wrong way.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iot-homeassistant
  namespace: kube-system
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "iot-homeassistant",
      "plugins": [
        {
          "type": "macvlan",
          "master": "wan.68",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "routes": [
              {"dst": "10.32.8.0/24", "gw": "10.32.68.1"},
              {"dst": "10.32.52.0/23", "gw": "10.32.68.1"}
            ]
          }
        }
      ]
    }
