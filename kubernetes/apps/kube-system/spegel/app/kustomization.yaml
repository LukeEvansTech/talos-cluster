---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./grafanadashboard.yaml
configMapGenerator:
  - name: spegel-values
    files:
      - values.yaml=./helm/values.yaml
  # The chart stopped shipping its dashboard in 0.8.0 (spegel-org/spegel#1512), so this is the
  # 0.7.4 copy, its advertised panels moved to the label-less spegel_advertised_keys (#1562).
  - name: spegel-grafana-dashboard
    files:
      - dashboards/spegel.json
    options:
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
configurations:
  - ./helm/kustomizeconfig.yaml
