---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/volsync.backube/kopiamaintenance_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: KopiaMaintenance
metadata:
  name: daily
  namespace: volsync-system
spec:
  enabled: true
  trigger:
    # Hourly, not every 4h: ~100 ReplicationSources share this repository, and each snapshots
    # every 4h, so uncompacted index blobs pile up faster than maintenance compacts them
    # (docs/docs/apps/kopia.md). Kept at :30 so it never starts alongside the hourly sources.
    schedule: 30 * * * *
  repository:
    repository: volsync-maintenance-secret
