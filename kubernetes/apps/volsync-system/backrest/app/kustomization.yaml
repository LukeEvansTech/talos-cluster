---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: backrest-seed
    files:
      - ./resources/seed-config.sh
      - ./resources/index-snapshots.sh
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # The script writes a literal ${RESTIC_REPOSITORY_BASE} for backrest to expand.
    kustomize.toolkit.fluxcd.io/substitute: disabled
