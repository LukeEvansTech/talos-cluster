---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backrest
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      backrest:
        annotations:
          reloader.stakater.com/auto: "true"
        # /config is an emptyDir, so the seed rebuilds it on every start: one repository per R2
        # prefix, with backrest's own auth off because sign-in is the pocket-id component at the
        # gateway. Why it reads guids itself and never locks: resources/seed-config.sh.
        initContainers:
          seed-config:
            image:
              repository: docker.io/garethgeorge/backrest
              tag: v1.14.1@sha256:b852979754281026230cc69fb11428e6d57c9a97784ab4a444ffc7934c53a215
            command:
              - "sh"
              - "/seed/seed-config.sh"
            env:
              RCLONE_CONFIG: /tmp/rclone.conf
              XDG_CACHE_HOME: /tmp
            envFrom:
              - secretRef:
                  name: backrest-secret
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image:
              repository: docker.io/garethgeorge/backrest
              tag: v1.14.1@sha256:b852979754281026230cc69fb11428e6d57c9a97784ab4a444ffc7934c53a215
            env:
              BACKREST_PORT: &port 9898
              BACKREST_DATA: /data
              BACKREST_CONFIG: /config/config.json
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: backrest-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
          indexer:
            image:
              repository: docker.io/garethgeorge/backrest
              tag: v1.14.1@sha256:b852979754281026230cc69fb11428e6d57c9a97784ab4a444ffc7934c53a215
            command:
              - "sh"
              - "/seed/index-snapshots.sh"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: backrest
        ports:
          http:
            port: *port
    route:
      app:
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - backrest.${SECRET_DOMAIN}
        rules:
          - backendRefs:
              - name: backrest
                port: *port
    persistence:
      seed:
        type: configMap
        name: backrest-seed
        advancedMounts:
          backrest:
            seed-config:
              - path: /seed
                readOnly: true
            indexer:
              - path: /seed
                readOnly: true
      config:
        type: emptyDir
        globalMounts:
          - path: /config
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      cache:
        type: emptyDir
        # The image entrypoint defaults XDG_CACHE_HOME to /cache, and the root filesystem is not
        # writable there as uid 1000, so every restic command failed to open its cache.
        globalMounts:
          - path: /cache
