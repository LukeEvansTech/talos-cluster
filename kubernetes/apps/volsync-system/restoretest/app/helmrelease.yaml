---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: restoretest
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: restoretest
  values:
    controllers:
      restoretest:
        type: cronjob
        cronjob:
          # Sunday 03:00 sits clear of the 00:30 R2 run and between the four-hourly NFS runs.
          schedule: "0 3 * * 0"
          timeZone: "${TIMEZONE}"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 2
          failedJobsHistory: 2
          backoffLimit: 0
          activeDeadlineSeconds: 21600
          # The repo-wide maximum; VolsyncRestoreTestStale keeps a failure visible after the Job goes.
          ttlSecondsAfterFinished: 86400
        pod:
          automountServiceAccountToken: true
        serviceAccount:
          identifier: restoretest
        containers:
          app:
            image:
              repository: docker.io/library/python
              tag: 3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
            command:
              - "python3"
              - "-I"
              - "/app/restoretest.py"
            env:
              TZ: "${TIMEZONE}"
              PYTHONDONTWRITEBYTECODE: "1"
              # A quarter of the apps each week, chosen by a hash of ns/app, so each app is
              # restored from both repositories about monthly.
              SHARDS: "4"
              REPOS: r2,nfs
              # The few volumes above this (plex, jellyfin and similar) need a manual run with ONLY.
              MAX_CAPACITY_GI: "50"
              CONCURRENCY: "3"
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    serviceAccount:
      restoretest: {}
    persistence:
      code:
        type: configMap
        name: restoretest-code
        globalMounts:
          - path: /app
            readOnly: true
