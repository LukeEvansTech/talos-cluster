---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: &app kopia
  labels:
    app.kubernetes.io/name: *app
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: *app
  endpoints:
    # This 5m scrape reads a cached static file, not NFS. The .txt extension is load-bearing
    # (docs/docs/apps/kopia.md).
    - port: metrics
      scheme: http
      path: /metrics.txt
      interval: 5m
      relabelings:
        - action: replace
          targetLabel: instance
          replacement: *app
