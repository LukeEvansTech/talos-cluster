---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres18
spec:
  instances: 3
  # Digest seeded by hand once (2026-07-19): the preset's CNPG imageName custom manager can
  # substitute an existing digest but can't append a first one, and a first-time pinDigest throws
  # update-failure and aborts Renovate's whole combined pin branch (renovate#24942, confirmed via
  # local dry-run). Renovate maintains the digest normally once it's present.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533

  primaryUpdateStrategy: unsupervised

  # 60s avoids spurious failovers during control-plane restarts (Talos node apply,
  # kube-controller-manager leader churn), which typically resolve in ~10-25s.
  failoverDelay: 60

  storage:
    size: 200Gi
    storageClass: miroir-local

  # Every app has its own role (#5879); admin work goes through kubectl exec and the local socket.
  enableSuperuserAccess: false

  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: 512MB
      effective_cache_size: 1536MB
      maintenance_work_mem: 128MB
      checkpoint_completion_target: "0.9"
      wal_buffers: 16MB
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: 2621kB
      huge_pages: "off"
      min_wal_size: 1GB
      max_wal_size: 4GB

  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 4Gi

  monitoring:
    enablePodMonitor: true

  certificates:
    serverTLSSecret: postgres18-tls
    serverCASecret: postgres18-tls

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres18-garage
        serverName: postgres18

  backup:
    retentionPolicy: 90d
    # barmanObjectStore config moved to the ObjectStore CR when the plugin replaced it.
