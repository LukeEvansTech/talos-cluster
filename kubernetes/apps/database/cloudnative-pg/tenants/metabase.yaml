---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
# On a password rotation force-sync this and database/metabase's ExternalSecret together: each
# refreshes hourly on its own, so the role and the app's MB_DB_PASS can disagree until both do.
metadata:
  name: metabase-pg
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: metabase-pg
    template:
      metadata:
        labels:
          # CNPG applies a changed role password at once only when its Secret carries this label.
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: metabase
        password: "{{ .MB_DBPASS }}"
  dataFrom:
    - extract:
        key: metabase
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: metabase
spec:
  cluster:
    name: postgres18
  name: metabase
  login: true
  passwordSecret:
    name: metabase-pg
  databaseRoleReclaimPolicy: retain
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: metabase
spec:
  cluster:
    name: postgres18
  name: metabase
  owner: metabase
  databaseReclaimPolicy: retain
