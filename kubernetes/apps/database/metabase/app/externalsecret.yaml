---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metabase
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: metabase-secret
    template:
      engineVersion: v2
      data:
        # sslmode=disable works around a CNPG cert the JVM rejects; see docs/docs/apps/metabase.md.
        MB_DB_CONNECTION_URI: jdbc:postgresql://postgres18-rw.database.svc.cluster.local:5432/metabase?sslmode=disable
        MB_DB_USER: "{{ .MB_DBUSER }}"
        MB_DB_PASS: "{{ .MB_DBPASS }}"
        # Rotating this needs Metabase's own command first; see docs/docs/apps/metabase.md.
        MB_ENCRYPTION_SECRET_KEY: "{{ .MB_ENCRYPTION_SECRET_KEY }}"
        INIT_POSTGRES_DBNAME: metabase
        INIT_POSTGRES_HOST: postgres18-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .MB_DBUSER }}"
        INIT_POSTGRES_PASS: "{{ .MB_DBPASS }}"
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: metabase
