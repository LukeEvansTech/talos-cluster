---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dcgm-exporter
spec:
  groups:
    - name: dcgm-exporter
      rules:
        - alert: GpuHighTemperature
          annotations:
            description: GPU {{ $labels.gpu }} on {{ $labels.hostname }} temperature is {{ $value }}C which is above 85C.
            summary: GPU temperature is critically high.
          expr: DCGM_FI_DEV_GPU_TEMP > 85
          for: 5m
          labels:
            severity: critical
        - alert: GpuHighMemoryUsage
          annotations:
            description: GPU {{ $labels.gpu }} on {{ $labels.hostname }} memory usage is above 90%.
            summary: GPU memory usage is critically high.
          # Excludes the node running an llmkube InferenceService, by node rather than
          # container label; see docs/docs/apps/gpu-operator.md for why.
          expr: |-
            (
              DCGM_FI_DEV_FB_USED
                / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) > 0.9
            )
            unless on (hostname)
            label_replace(
              max by (node) (
                max_over_time(kube_pod_info[1h])
                  and on (namespace, pod)
                max_over_time(
                  kube_pod_labels{
                    label_inference_llmkube_dev_runtime="llamacpp"
                  }[1h]
                )
              ),
              "hostname", "$1", "node", "(.+)"
            )
          for: 5m
          labels:
            severity: warning
        - alert: GpuHighPowerUsage
          annotations:
            description: GPU {{ $labels.gpu }} on {{ $labels.hostname }} power usage is {{ $value }}W which is above 90% of the power limit.
            summary: GPU power usage is critically high.
          expr: |-
            DCGM_FI_DEV_POWER_USAGE / DCGM_FI_DEV_POWER_MGMT_LIMIT > 0.9
          for: 5m
          labels:
            severity: warning
        - alert: GpuXidErrors
          annotations:
            description: GPU {{ $labels.gpu }} on {{ $labels.hostname }} has reported XID errors.
            summary: GPU hardware errors detected.
          expr: DCGM_FI_DEV_XID_ERRORS > 0
          for: 1m
          labels:
            severity: critical
