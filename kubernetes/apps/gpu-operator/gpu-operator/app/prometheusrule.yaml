---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dcgm-exporter
spec:
  groups:
    - name: dcgm-exporter
      rules:
        - alert: GpuHighTemperature
          annotations:
            description: GPU {{ $labels.gpu }} on {{ $labels.Hostname }} temperature is {{ $value }}C which is above 85C.
            summary: GPU temperature is critically high.
          expr: DCGM_FI_DEV_GPU_TEMP > 85
          for: 5m
          labels:
            severity: critical
        - alert: GpuHighMemoryUsage
          annotations:
            description: GPU {{ $labels.gpu }} on {{ $labels.Hostname }} memory usage is above 90%.
            summary: GPU memory usage is critically high.
          # Exclude the card running an llmkube InferenceService: llama.cpp holds
          # its weights + KV cache resident by design, idling at ~90% and peaking
          # higher during prompt processing, so this alert flapped on every
          # request (fire >90% for 5m, resolve when idle, repeat). DCGM
          # attributes the series to the GPU's occupant via exported_container
          # ("llama-server" for every llmkube runtime pod, whatever the model).
          # That card's real failure mode — CUDA OOM killing the server — is
          # covered by InferenceServiceDown and pod restart alerting instead.
          expr: |-
            DCGM_FI_DEV_FB_USED{exported_container!="llama-server"}
              / (DCGM_FI_DEV_FB_USED{exported_container!="llama-server"} + DCGM_FI_DEV_FB_FREE{exported_container!="llama-server"}) > 0.9
          for: 5m
          labels:
            severity: warning
        - alert: GpuHighPowerUsage
          annotations:
            description: GPU {{ $labels.gpu }} on {{ $labels.Hostname }} power usage is {{ $value }}W which is above 90% of the power limit.
            summary: GPU power usage is critically high.
          expr: |-
            DCGM_FI_DEV_POWER_USAGE / DCGM_FI_DEV_POWER_MGMT_LIMIT > 0.9
          for: 5m
          labels:
            severity: warning
        - alert: GpuXidErrors
          annotations:
            description: GPU {{ $labels.gpu }} on {{ $labels.Hostname }} has reported XID errors.
            summary: GPU hardware errors detected.
          expr: DCGM_FI_DEV_XID_ERRORS > 0
          for: 1m
          labels:
            severity: critical
