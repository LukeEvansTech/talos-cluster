---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gpu-operator
spec:
  # Community OCI mirror of the NGC chart (home-operations/charts-mirror); NVIDIA/gpu-operator#2520
  # tracks official OCI support, 6 months after which this mirror is deprecated.
  interval: 6h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://ghcr.io/home-operations/charts-mirror/nvidia-gpu-operator
  ref:
    # renovate: datasource=docker
    tag: 26.7.1
