---
# dcgm-exporter running with KUBERNETES_ENABLE_DRA resolves GPU to pod through
# resource.k8s.io objects instead of the device plugin's pod-resources view.
# The operator creates the ServiceAccount but grants it no DRA read access, so
# without this binding every metric loses its pod, namespace and container
# labels and the GPU dashboard panels go blank.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nvidia-dcgm-exporter-dra
rules:
  - apiGroups:
      - "resource.k8s.io"
    resources:
      - deviceclasses
      - resourceclaims
      - resourceclaimtemplates
      - resourceslices
    verbs:
      - "get"
      - "list"
      - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nvidia-dcgm-exporter-dra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nvidia-dcgm-exporter-dra
subjects:
  - kind: ServiceAccount
    name: nvidia-dcgm-exporter
    namespace: gpu-operator
