---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gpu-operator
  values:
    driver:
      enabled: false
    toolkit:
      enabled: false
    cdi:
      enabled: true
    # Exactly one whole-GPU advertiser per node. dra-driver-nvidia-gpu now
    # publishes the card, so the device plugin must stay off: the two keep
    # independent ledgers and would allocate the same GPU twice.
    devicePlugin:
      enabled: false
    dcgmExporter:
      enabled: true
      env:
        # Map metrics back to pods through DRA ResourceClaims rather than the
        # device plugin's pod-resources view, which no longer exists. Needs
        # resource.k8s.io read access the operator does not grant; see rbac.yaml.
        - name: KUBERNETES_ENABLE_DRA
          value: "true"
      serviceMonitor:
        enabled: true
    gfd:
      enabled: true
    mig:
      strategy: none
    nodeStatusExporter:
      enabled: false
    sandboxWorkloads:
      enabled: false
    gds:
      enabled: false
    kataManager:
      enabled: false
    vgpuManager:
      enabled: false
    vgpuDeviceManager:
      enabled: false
    runtimeClass:
      install: false
      name: nvidia
    operator:
      defaultRuntime: containerd
      runtimeClass: nvidia
    validator:
      driver:
        env:
          - name: DISABLE_DEV_CHAR_SYMLINK_CREATION
            value: "true"
