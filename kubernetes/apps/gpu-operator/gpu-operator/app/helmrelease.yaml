---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gpu-operator
  values:
    driver:
      enabled: false
    toolkit:
      enabled: false
    cdi:
      enabled: true
    # Exactly one GPU advertiser per node; see docs/docs/migrations/gpu-time-slicing-to-dra.md.
    devicePlugin:
      enabled: false
    dcgmExporter:
      enabled: true
      # KUBERNETES_ENABLE_DRA alone leaves automountServiceAccountToken=false; see
      # docs/docs/apps/gpu-operator.md.
      enablePodLabels: true
      # Without this, every pod label becomes a metric dimension, including the churning
      # pod-template-hash.
      podLabelAllowlistRegex:
        - app.kubernetes.io/name
      env:
        # Maps metrics to pods via DRA ResourceClaims, not the retired device-plugin view;
        # needs the read access rbac.yaml grants.
        - name: KUBERNETES_ENABLE_DRA
          value: "true"
      serviceMonitor:
        enabled: true
    gfd:
      enabled: true
    mig:
      strategy: none
    nodeStatusExporter:
      enabled: false
    sandboxWorkloads:
      enabled: false
    gds:
      enabled: false
    kataManager:
      enabled: false
    vgpuManager:
      enabled: false
    vgpuDeviceManager:
      enabled: false
    runtimeClass:
      install: false
      name: nvidia
    operator:
      defaultRuntime: containerd
      runtimeClass: nvidia
    validator:
      driver:
        env:
          - name: DISABLE_DEV_CHAR_SYMLINK_CREATION
            value: "true"
