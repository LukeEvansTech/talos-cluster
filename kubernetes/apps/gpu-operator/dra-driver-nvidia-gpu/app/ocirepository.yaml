---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: dra-driver-nvidia-gpu
spec:
  # Renamed from NVIDIA/k8s-dra-driver-gpu to kubernetes-sigs/dra-driver-nvidia-gpu; ghcr.io/nvidia
  # only carries stale pre-release tags. See docs/docs/migrations/gpu-time-slicing-to-dra.md for
  # why there's no verify block.
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://registry.k8s.io/dra-driver-nvidia/charts/dra-driver-nvidia-gpu
  ref:
    # renovate: datasource=docker
    tag: 0.5.0
