---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dra-driver-nvidia-gpu
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: dra-driver-nvidia-gpu
  values:
    # Talos ships the driver as a system extension rooted at /usr/local, not at
    # host root. This value is the whole reason for using the standalone chart
    # rather than gpu-operator's GPUCluster CR, whose validator hardcodes / for
    # a preinstalled driver and cannot be overridden.
    nvidiaDriverRoot: /usr/local
    # Acknowledges that the device plugin is off (gpu-operator
    # devicePlugin.enabled=false). The chart refuses to advertise GPUs without
    # it, as a guard against two allocators handing out the same card.
    gpuResourcesEnabledOverride: true
    resources:
      gpus:
        enabled: true
      # Multi-node NVLink; there is no NVSwitch fabric here. Leaving this off
      # is also what keeps the chart down to a DaemonSet with no controller or
      # webhook Deployment.
      computeDomains:
        enabled: false
    # Stands in for the device plugin's time-slicing replicas: 5. The GPU is
    # published with allowMultipleAllocations and five consumable shares, so
    # the per-node admission ceiling is unchanged by this migration and the
    # only variable that moves is the allocator itself.
    featureGates:
      ConsumableShares: true
    consumableShares: 5
