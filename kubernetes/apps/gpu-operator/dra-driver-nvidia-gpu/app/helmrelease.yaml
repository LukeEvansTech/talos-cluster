---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dra-driver-nvidia-gpu
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: dra-driver-nvidia-gpu
  values:
    # Why the standalone chart exists at all; see docs/docs/migrations/gpu-time-slicing-to-dra.md.
    nvidiaDriverRoot: /usr/local
    # Acknowledges devicePlugin.enabled=false on gpu-operator; see the migration doc above.
    gpuResourcesEnabledOverride: true
    resources:
      gpus:
        enabled: true
      # Multi-node NVLink; there is no NVSwitch fabric here. Leaving this off also keeps the
      # chart down to a DaemonSet with no controller or webhook Deployment.
      computeDomains:
        enabled: false
    # The literal equivalent of the device plugin's replicas: 5; see the migration doc above.
    featureGates:
      ConsumableShares: true
    consumableShares: 5
