---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name terraform-vsphere-runner
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set-terraform-vsphere
  interval: 1h
  values:
    fullnameOverride: *name
    githubConfigUrl: https://github.com/codelooks-com/terraform-vsphere
    githubConfigSecret: terraform-vsphere-runner-secret
    runnerGroup: default
    runnerScaleSetName: terraform-vsphere
    maxRunners: 2
    minRunners: 0
    containerMode:
      type: kubernetes
      kubernetesModeWorkVolumeClaim:
        accessModes:
          - "ReadWriteOnce"
        storageClassName: miroir-local
        resources:
          requests:
            # Remote state + small providers. Terraform needs little scratch.
            storage: 5Gi
    template:
      spec:
        # uid 1001 needs fsGroup to write miroir-local's root:root ext4 volume (#3739).
        securityContext:
          fsGroup: 1001
        serviceAccountName: terraform-vsphere-runner
        containers:
          - name: runner
            # Same digest as talos-cluster-runner; Renovate manages it.
            # The workflow installs tofu/terraform itself; it isn't baked into this image.
            image: ghcr.io/home-operations/actions-runner:2.338.0@sha256:c867ecdf82d4e8537ea8a41acc6addae09f069daec137e5614b87e4678a953e8
            command:
              - "/home/runner/run.sh"
            env:
              # kubernetes mode defaults this true, refusing plain `run:` jobs; ours needs false.
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
            envFrom:
              - secretRef:
                  name: terraform-vsphere-creds
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
