---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name packer-runner
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set-packer
  interval: 1h
  values:
    fullnameOverride: *name
    githubConfigUrl: https://github.com/codelooks-com/packer-vsphere
    githubConfigSecret: packer-runner-secret
    runnerGroup: default
    runnerScaleSetName: packer-vsphere
    maxRunners: 3
    minRunners: 0
    containerMode:
      type: kubernetes
      kubernetesModeWorkVolumeClaim:
        accessModes:
          - "ReadWriteOnce"
        storageClassName: miroir-local
        resources:
          requests:
            storage: 40Gi
    template:
      spec:
        # uid 1001 needs fsGroup to write miroir-local's root:root ext4 volume (#3739).
        securityContext:
          fsGroup: 1001
        serviceAccountName: packer-runner
        containers:
          - name: runner
            # Pinned to a digest; a stale :latest missed a pywinrm build and broke WinRM (#3034).
            image: ghcr.io/codelooks-com/packer-runner:latest@sha256:dc9d752704533636f69feacc8645433078023fbebbf26b3681bd68fa27ad11ba
            command:
              - "/home/runner/run.sh"
            env:
              # kubernetes mode defaults this true, refusing plain `run:` jobs; ours needs false.
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
            envFrom:
              - secretRef:
                  name: packer-vsphere-creds
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
