---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name subspy-runner
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set-subspy
  interval: 1h
  # ARC generates the Docker sidecar; patch its resources after chart rendering.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: actions.github.com
              version: v1alpha1
              kind: AutoscalingRunnerSet
              name: subspy
            patch: |-
              - op: test
                path: /spec/template/spec/initContainers/1/name
                value: dind
              - op: add
                path: /spec/template/spec/initContainers/1/resources
                value:
                  requests:
                    cpu: "1"
                    memory: 2Gi
                    ephemeral-storage: 8Gi
                  limits:
                    cpu: "4"
                    memory: 8Gi
                    ephemeral-storage: 20Gi
  values:
    fullnameOverride: *name
    githubConfigUrl: https://github.com/LukeEvansTech/subspy
    githubConfigSecret: subspy-runner-secret
    runnerScaleSetName: subspy
    # Three, as lurcher: lint, scans and image builds each take a runner, and one runner made
    # them queue behind each other. This repository's CI deploys nothing, so jobs cannot collide.
    maxRunners: 3
    minRunners: 0
    containerMode:
      # Docker actions used by lint and security workflows need a daemon.
      type: dind
    template:
      spec:
        nodeSelector:
          kubernetes.io/arch: amd64
        # uid 1001 needs fsGroup to write miroir-local's root:root ext4 volume (#3739).
        securityContext:
          fsGroup: 1001
        containers:
          - name: runner
            # Same digest as talos-cluster-runner; Renovate manages it.
            image: ghcr.io/home-operations/actions-runner:2.338.0@sha256:c867ecdf82d4e8537ea8a41acc6addae09f069daec137e5614b87e4678a953e8
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 4Gi
            command:
              - "/home/runner/run.sh"
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
        volumes:
          - name: work
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - "ReadWriteOnce"
                  storageClassName: miroir-local
                  resources:
                    requests:
                      # 40Gi vs talos-cluster's 25Gi: super-linter plus checkov/trivy need headroom.
                      # Not dind's image store (node ephemeral); Spegel doesn't mirror dind pulls.
                      storage: 40Gi
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
