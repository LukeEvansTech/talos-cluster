---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: codelooks-org-runner
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: codelooks-org-runner-secret
    template:
      engineVersion: v2
      data:
        github_app_id: "{{ .ACTIONS_RUNNER_APP_ID }}"
        github_app_installation_id: "{{ .ACTIONS_RUNNER_INSTALLATION_ID }}"
        github_app_private_key: "{{ .ACTIONS_RUNNER_PRIVATE_KEY }}"
  dataFrom:
    # Org-scoped scale sets need the app's ORGANISATION "Self-hosted runners: Read and write".
    # Repo-scoped ones only need the repository grant; a miss fails silently in the listener pod.
    - extract:
        key: github-codelooks
