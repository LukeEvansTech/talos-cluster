---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name talosci-runner
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set-talosci
  interval: 1h
  # ARC generates the Docker sidecar; patch its resources after chart rendering.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: actions.github.com
              version: v1alpha1
              kind: AutoscalingRunnerSet
              name: talosci
            patch: |-
              - op: test
                path: /spec/template/spec/initContainers/1/name
                value: dind
              - op: add
                path: /spec/template/spec/initContainers/1/resources
                value:
                  requests:
                    cpu: "1"
                    memory: 2Gi
                    ephemeral-storage: 8Gi
                  limits:
                    cpu: "4"
                    memory: 8Gi
                    ephemeral-storage: 20Gi
  values:
    fullnameOverride: *name
    # Repository-scoped CI pool without Talos administration credentials.
    githubConfigUrl: https://github.com/LukeEvansTech/talos-cluster
    githubConfigSecret: talosci-runner-secret
    runnerScaleSetName: talosci
    # Limit the pilot to one concurrent job.
    maxRunners: 1
    minRunners: 0
    containerMode:
      # Docker actions used by lint and security workflows need a daemon.
      type: dind
    template:
      spec:
        # miroir-local provisions a real ext4 block device whose root comes up
        # root:root 0755, and this image runs as uid/gid 1001. Without fsGroup
        # the runner cannot create _work/_tool and every job dies in ~2s with
        # UnauthorizedAccessException before a single step executes. miroir's
        # CSIDriver is fsGroupPolicy: ReadWriteOnceWithFSType and this claim is
        # RWO + ext4, so kubelet honours fsGroup and chowns the volume.
        securityContext:
          fsGroup: 1001
        containers:
          - name: runner
            # Same digest as talos-cluster-runner / terraform-vsphere-runner.
            # Renovate manages this.
            image: ghcr.io/home-operations/actions-runner:2.337.0@sha256:8b8e8326b5a08e658a0a41cfd2867afab69ca4194a152f986aa6fcd5430d09e7
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 4Gi
            command:
              - "/home/runner/run.sh"
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
        volumes:
          - name: work
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - "ReadWriteOnce"
                  storageClassName: miroir-local
                  resources:
                    requests:
                      # Roomier than talos-cluster-runner's 25Gi: the super-linter
                      # image alone is several GB and checkov/trivy add more. Note
                      # dind's own image store is the sidecar's writable layer
                      # (node ephemeral storage), not this claim — and Spegel does
                      # not mirror dind pulls, only containerd ones, so every run
                      # pulls super-linter from ghcr.io afresh.
                      storage: 40Gi
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
