# No Kubernetes RBAC: the only privileged job runs `talosctl image pull`, not kubectl.
# image-pull runs on push, not pull_request, so untrusted PR code never reaches this runner.
---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-cluster-runner
  namespace: actions-runner-system
spec:
  roles:
    - os:admin
