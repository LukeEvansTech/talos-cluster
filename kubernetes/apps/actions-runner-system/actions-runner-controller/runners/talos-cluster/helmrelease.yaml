---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name talos-cluster-runner
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  interval: 1h
  values:
    fullnameOverride: *name
    githubConfigUrl: https://github.com/LukeEvansTech/talos-cluster
    githubConfigSecret: talos-cluster-runner-secret
    maxRunners: 3
    minRunners: 0
    containerMode:
      type: dind
    template:
      spec:
        # uid 1001 needs fsGroup to write miroir-local's root:root ext4 volume (#3739).
        # This dind runner fails the same way but silently: image-pull is its only _work consumer.
        securityContext:
          fsGroup: 1001
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.337.0@sha256:8b8e8326b5a08e658a0a41cfd2867afab69ca4194a152f986aa6fcd5430d09e7
            command:
              - "/home/runner/run.sh"
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              - name: ACTIONS_RUNNER_POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: ACTIONS_RUNNER_CONTAINER_HOOKS
                value: /home/runner/k8s/index.js
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: talos-secrets
                mountPath: /home/runner/.talos/config
                # subPath must be `config`; `talosconfig` isn't a real key (empty dir, #4329).
                subPath: config
                readOnly: true
        volumes:
          - name: work
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - "ReadWriteOnce"
                  storageClassName: miroir-local
                  resources:
                    requests:
                      storage: 25Gi
          - name: talos-secrets
            secret:
              # This is the os:admin talosconfig from rbac.yaml, not the GitHub App secret (#4329).
              secretName: talos-cluster-runner
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
