---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name talos-cluster-runner
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  interval: 1h
  values:
    fullnameOverride: *name
    githubConfigUrl: https://github.com/LukeEvansTech/talos-cluster
    githubConfigSecret: talos-cluster-runner-secret
    maxRunners: 3
    minRunners: 0
    containerMode:
      type: dind
    template:
      spec:
        # miroir-local provisions a real ext4 block device, whose root directory
        # comes up root:root 0755. The openebs-hostpath directory it replaced
        # (#3583) was already writable, so nothing here needed fsGroup before.
        # This image runs as uid/gid 1001, so without the chown below the runner
        # cannot create _work/_tool and every job dies in ~2s with
        # UnauthorizedAccessException before a single step executes.
        # miroir's CSIDriver is fsGroupPolicy: ReadWriteOnceWithFSType and this
        # claim is RWO + ext4, so kubelet honours fsGroup and chowns the volume.
        # This dind runner is affected too — its live _work is root:root 0755 —
        # it just fails silently: the kubernetes-mode runners failed visibly
        # because jobs ran, while this one's only consumer (image-pull) has kept
        # skipping, so no job has exercised _work/_tool since the flip.
        securityContext:
          fsGroup: 1001
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.336.0@sha256:281a9a090522fafbf4967f158b8c97d03552b1978b688893c5f7cb1944bc5fe5
            command:
              - "/home/runner/run.sh"
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              - name: ACTIONS_RUNNER_POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: ACTIONS_RUNNER_CONTAINER_HOOKS
                value: /home/runner/k8s/index.js
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: talos-secrets
                mountPath: /home/runner/.talos/config
                # Minted talosconfig secrets carry the config under key `config`
                # (matches the talos MCP mount). The old `talosconfig` key never
                # existed, so this subPath came up as an empty *directory* and
                # `talosctl … --talosconfig ~/.talos/config` failed with
                # "is a directory" on every image-pull run.
                subPath: config
                readOnly: true
        volumes:
          - name: work
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - "ReadWriteOnce"
                  storageClassName: miroir-local
                  resources:
                    requests:
                      storage: 25Gi
          - name: talos-secrets
            secret:
              # The os:admin talosconfig minted by the talos.dev ServiceAccount
              # in rbac.yaml (Secret `talos-cluster-runner`) — NOT the GitHub App
              # creds (`talos-cluster-runner-secret`), which was wired here by
              # mistake and carries no talosconfig.
              secretName: talos-cluster-runner
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
