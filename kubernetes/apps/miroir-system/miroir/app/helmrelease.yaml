---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: miroir
  values:
    # Warm-standby controller; leader election auto-enables above 1 replica.
    replicaCount: 2
    agent:
      # Must list every loopfile.baseDir used by MiroirNode specs; the chart can't read the
      # topology CRs at render time.
      loopfileBaseDirs:
        - /var/mnt/extra/miroir
      # The busiest node bursts past the chart's 128Mi default during the initial reconcile sweep
      # (steady state ~27Mi), deep-merged over the chart's requests (cpu 10m / memory 32Mi).
      resources:
        limits:
          memory: 512Mi
    # Publishes CSIStorageCapacity so the scheduler avoids landing a volume on a full node; without
    # it, nearly every volsync cache piled onto one node until it hit the overcommit guard
    # (docs/docs/apps/miroir.md, #5110).
    storageCapacity:
      enabled: true
    groupSnapshots:
      enabled: true
    monitoring:
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
