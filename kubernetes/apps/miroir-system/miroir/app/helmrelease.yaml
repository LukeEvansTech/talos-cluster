---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: miroir
  values:
    # Warm-standby controller; leader election auto-enables above 1 replica.
    replicaCount: 2
    agent:
      # Must list every loopfile.baseDir used by MiroirNode specs. The chart
      # cannot read the topology CRs at render time.
      loopfileBaseDirs:
        - /var/mnt/extra/miroir
      # The busiest node (most loopfiles) bursts past the chart's 128Mi default
      # during the initial agent-volume reconcile sweep. Steady state is ~27Mi,
      # but the sweep OOMKills it into CrashLoopBackOff, so raise the ceiling
      # (deep-merged over the chart's requests: cpu 10m / memory 32Mi).
      resources:
        limits:
          memory: 512Mi
    # Publish CSIStorageCapacity so the scheduler steers a WaitForFirstConsumer
    # pod onto a node whose pool can actually hold the volume. Without it the
    # scheduler is blind to pool usage and simply lands somewhere, leaving
    # CreateVolume to refuse: nearly every volsync cache accreted onto one
    # node, so when #5098 raised them to 16Gi that node crossed the 2x
    # overcommit guard with ~3Gi to spare and started refusing new volumes and
    # pending resizes outright, while its two peers sat under 12% provisioned.
    storageCapacity:
      enabled: true
    groupSnapshots:
      enabled: true
    monitoring:
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
