---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: &app flux-operator
  labels:
    app.kubernetes.io/name: *app
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
      app.kubernetes.io/instance: *app
  endpoints:
    # Named port avoids the chart's `targetPort: 8080`: prometheus-operator resolves an integer
    # targetPort via the deprecated v1 Endpoints API, degraded on k8s 1.33+, so pod churn silently
    # drops the target and flux_instance_info disappears (FluxInstanceAbsent, #3266).
    - port: http
      interval: 60s
      path: /metrics
