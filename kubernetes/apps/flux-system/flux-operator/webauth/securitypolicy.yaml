---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# The web UI treats every request as group flux-admin (helm/values.yaml), so this sign-in is its
# only caller check. Written out here because components/pocket-id assumes an app-template route
# named after the app, and the chart names this one flux-operator on host flux.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: flux-pocket-id
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: flux-operator
  oidc:
    provider:
      issuer: https://id.${SECRET_DOMAIN}
    clientID: flux
    clientSecret:
      name: flux-pocket-id-secret
    redirectURL: https://flux.${SECRET_DOMAIN}/oauth2/callback
    logoutPath: /oauth2/logout
    # A pinned suffix keeps sessions alive when the policy is recreated.
    cookieNames:
      suffix: flux
