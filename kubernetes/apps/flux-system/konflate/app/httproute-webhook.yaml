---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# Path-scoped route for GitHub's HMAC-validated webhook deliveries, separate from the UI route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: konflate-webhook
  annotations:
    external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
    # POST-only (GET / -> 404) isn't health-checkable via gatus; the UI route already is monitored.
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - konflate-webhook.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hooks
      backendRefs:
        - name: konflate
          port: 8080
