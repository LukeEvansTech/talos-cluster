---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: konflate-secret
    template:
      engineVersion: v2
      data:
        # GitHub App identity (konflate-bot) lifts the rate limit and does the write-back.
        KONFLATE_APP_CLIENT_ID: "{{ .KONFLATE_APP_CLIENT_ID }}"
        KONFLATE_APP_PRIVATE_KEY: "{{ .KONFLATE_APP_PRIVATE_KEY }}"
        KONFLATE_PUSH_TOKEN: "{{ .KONFLATE_PUSH_TOKEN }}"
        # GitHub fine-grained PAT (read-only), a fallback beside the App identity above.
        KONFLATE_TOKEN: "{{ .KONFLATE_TOKEN }}"
        # Must match the secret configured on the GitHub webhook that POSTs to /hooks.
        KONFLATE_WEBHOOK_SECRET: "{{ .KONFLATE_WEBHOOK_SECRET }}"
  dataFrom:
    - extract:
        key: konflate
