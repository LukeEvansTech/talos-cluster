---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
  interval: 1h
  values:
    config:
      # Public repository: needs the GitHub App identity for the rate limit and write-back.
      repo: github://LukeEvansTech/talos-cluster
      # Backstop that re-renders open PRs when a webhook delivery is missed.
      refreshInterval: 15m
      logFormat: json
      # Posts the native Konflate commit status/PR comment; replaces workflows dropped in #3375.
      statusChecks: true
      prComments: true
      publicUrl: "https://konflate.${SECRET_DOMAIN}"
      # Capabilities come from this cluster; konflate renders offline (docs/docs/apps/konflate.md).
      kubeVersion: "{{ .Capabilities.KubeVersion.Version }}"
      helmApiVersions: '{{ join "," .Capabilities.APIVersions }}'
    secret:
      # KONFLATE_PUSH_TOKEN backs manual refreshes; the webhook is now the primary trigger.
      existingSecret: konflate-secret
    httpRoute:
      enabled: true
      parentRefs:
        - name: envoy-internal
          namespace: network
      hostnames:
        - "{{ .Release.Name }}.${SECRET_DOMAIN}"
    persistence:
      # emptyDir avoids inode fill (docs/docs/troubleshooting/kb/011-konflate-render-failures.md).
      enabled: false
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
      limits:
        # Cold restarts OOM-killed the pod at 1Gi re-rendering ~18 open PRs at once.
        # GOMEMLIMIT is derived from this limit (90%), so the GC tracks the container ceiling.
        memory: 2Gi
