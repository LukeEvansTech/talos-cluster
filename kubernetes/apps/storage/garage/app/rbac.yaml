---
# kubernetes_discovery only manages namespaced GarageNode CRs; the CRD is vendored
# with skip_crd=true, so no cluster-scoped grant is needed.
# The garage ServiceAccount comes from the HelmRelease, not a manifest here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage
  namespace: storage
rules:
  - apiGroups:
      - "deuxfleurs.fr"
    resources:
      - "garagenodes"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "create"
      - "update"
      - "patch"
      - "delete"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage
  namespace: storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage
subjects:
  - kind: ServiceAccount
    name: garage
    namespace: storage
