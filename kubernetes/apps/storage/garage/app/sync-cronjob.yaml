---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
# Backup path for cluster object data: Garage has no native cross-cluster replication.
# The NAS copy sits on a ZFS-snapshotted dataset, giving point-in-time recovery.
# The NAS veeam bucket stays out of this job on purpose; Veeam writes it directly.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: garage-cluster-to-nas-sync
  namespace: storage
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: garage-cluster-to-nas-sync
            app.kubernetes.io/component: backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rclone
              image: docker.io/rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  export RCLONE_CONFIG_SRC_ACCESS_KEY_ID=$(cat /secrets/CLUSTER_ACCESS_KEY_ID)
                  export RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY=$(cat /secrets/CLUSTER_SECRET_ACCESS_KEY)
                  export RCLONE_CONFIG_DST_ACCESS_KEY_ID=$(cat /secrets/NAS_ACCESS_KEY_ID)
                  export RCLONE_CONFIG_DST_SECRET_ACCESS_KEY=$(cat /secrets/NAS_SECRET_ACCESS_KEY)
                  rclone sync --verbose --stats-one-line --stats=5m --fast-list src:cnpg/ dst:cluster-mirror/cnpg/
                  exec rclone sync --verbose --stats-one-line --stats=5m --fast-list src:cnpg-tracearr/ dst:cluster-mirror/cnpg-tracearr/
              env:
                # No RCLONE_VERBOSE: paired with --verbose it logs the S3 secret keys in plaintext.
                - name: RCLONE_CONFIG_SRC_TYPE
                  value: s3
                - name: RCLONE_CONFIG_SRC_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_SRC_ENDPOINT
                  value: http://garage.storage.svc.cluster.local:3900
                - name: RCLONE_CONFIG_SRC_REGION
                  value: us-east-1
                - name: RCLONE_CONFIG_SRC_ACL
                  value: private
                - name: RCLONE_CONFIG_DST_TYPE
                  value: s3
                - name: RCLONE_CONFIG_DST_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_DST_ENDPOINT
                  # Deliberately SECRET_DOMAIN: the internal zone's wildcard cert can no longer
                  # renew via Cloudflare DNS-01, so it is being retired.
                  value: https://s3-nas.${SECRET_DOMAIN}
                - name: RCLONE_CONFIG_DST_REGION
                  value: us-east-1
                - name: RCLONE_CONFIG_DST_ACL
                  value: private
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: secrets
              secret:
                secretName: garage-sync-secret
                defaultMode: 0400
