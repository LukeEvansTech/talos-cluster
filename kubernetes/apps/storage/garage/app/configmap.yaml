---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/v1/configmap.json
# rpc_secret and admin_token arrive as env vars from garage-secret, not through this ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: storage
data:
  garage.toml: |-
    metadata_dir = "/mnt/meta"
    data_dir = "/mnt/data"
    db_engine = "lmdb"
    metadata_auto_snapshot_interval = "6h"
    replication_factor = 3
    consistency_mode = "consistent"

    rpc_bind_addr = "[::]:3901"

    [kubernetes_discovery]
    namespace = "storage"
    service_name = "garage"
    skip_crd = true

    [s3_api]
    s3_region = "us-east-1"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.${SECRET_DOMAIN}"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.${SECRET_DOMAIN}"
    index = "index.html"

    [admin]
    api_bind_addr = "[::]:3903"
