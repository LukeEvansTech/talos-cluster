---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: garage-sync
spec:
  groups:
    - name: garage-sync
      rules:
        # Age of the last success, same shape as GickupBackupStale: catches a suspended CronJob
        # and, through the creation-time fallback, one that has never succeeded.
        - alert: GarageNasSyncStale
          annotations:
            summary: >-
              The hourly garage-cluster-to-nas-sync CronJob has not succeeded in over 6h.
            description: >-
              Garage buckets are not being copied to the NAS. Read the latest Job log in the storage namespace.
          expr: |-
            time() - (
              kube_cronjob_status_last_successful_time{namespace="storage", cronjob="garage-cluster-to-nas-sync"}
              or
              kube_cronjob_created{namespace="storage", cronjob="garage-cluster-to-nas-sync"}
            ) > 21600
          for: 30m
          labels:
            severity: warning
