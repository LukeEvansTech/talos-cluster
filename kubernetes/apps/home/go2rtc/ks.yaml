---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app go2rtc
  namespace: &namespace home
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/homepage
  interval: 1h
  path: ./kubernetes/apps/home/go2rtc/app
  postBuild:
    substitute:
      APP: *app
      HOMEPAGE_NAME: Go2RTC
      HOMEPAGE_GROUP: Home
      HOMEPAGE_ICON: mdi-cctv
      HOMEPAGE_DESCRIPTION: Camera streaming
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
