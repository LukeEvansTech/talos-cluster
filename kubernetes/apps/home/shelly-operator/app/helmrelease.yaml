---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shelly-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: shelly-operator
  # helm-controller skips CRD upgrades by default; CreateReplace applies new CRD fields on a bump.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    image:
      repository: ghcr.io/lukeevanstech/shelly-operator
      tag: 0.7.1@sha256:678fc44ae2189bc44e18ad6b1c1682a7411bcbca526e663071212575f15b8828
    discovery:
      # Templated from cluster-secrets, so no literal LAN CIDR lands in this public repository.
      cidrs:
        - "${IOT_TRUSTED_NETWORK_CIDR}"
    deviceNamespace: home
    nameMap: shelly-names
    exporterConfigMap: shelly-prometheus-exporter-config
    # 60s matches the ServiceMonitor scrape interval; the chart's 30s default doubled device RPC
    # and tripped firmware rate-limiting (docs/docs/apps/shelly-operator.md). Raise both together.
    exporterDeviceUpdateInterval: 60s
    dashboard:
      enabled: true
    metrics:
      enabled: true
    serviceMonitor:
      enabled: true
    reloader: true
