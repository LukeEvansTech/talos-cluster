---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shelly-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: shelly-operator
  # The chart ships CRDs in crds/; helm-controller skips CRD upgrades by
  # default, so 0.2.0's new fields (firmware section, availableFirmware)
  # need an explicit CreateReplace policy.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    image:
      repository: ghcr.io/lukeevanstech/shelly-operator
      tag: 0.6.0@sha256:1299d458712cd8b110056deb2be64d3cec67929799a63f505601a8b622914300
    discovery:
      # Substituted from cluster-secrets (public repo: no literal LAN CIDRs).
      # IOT_TRUSTED_NETWORK_CIDR is the IoT VLAN the whole fleet lives on
      # (migration completed 2026-06-12; the old flat-LAN CIDR was dropped
      # from the sweep in Phase 5 cleanup).
      cidrs:
        - "${IOT_TRUSTED_NETWORK_CIDR}"
    deviceNamespace: home
    nameMap: shelly-names
    exporterConfigMap: shelly-prometheus-exporter-config
    # How often the exporter polls EACH device. This is ~98% of all RPC load on
    # the fleet: the exporter makes ~6 calls per device per cycle, against
    # ~1 per device per reconcileInterval from the operator itself.
    #
    # 60s deliberately MATCHES the exporter ServiceMonitor scrape interval. The
    # chart default is 30s, which is a 2x oversample: those extra samples are
    # overwritten before Prometheus ever reads them, so they buy no stored
    # resolution and cost double the device traffic. Device firmware 2.0.0
    # rate-limits and starts answering HTTP 429 under that load, leaving the
    # operator unable to read config and reporting InSync=Unknown -- which is
    # unverified, not the same as healthy.
    #
    # Raise the scrape interval and this together, never one alone.
    exporterDeviceUpdateInterval: 60s
    dashboard:
      enabled: true
    metrics:
      enabled: true
    serviceMonitor:
      enabled: true
    reloader: true
