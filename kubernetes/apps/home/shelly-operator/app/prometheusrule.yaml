---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
#
# Fleet-health alerts on the shelly-operator's per-device metrics
# (shelly_device_online / _in_sync / _update_available / _restart_required /
# _firmware_update_refused), scraped via the
# operator's already-enabled ServiceMonitor. These metrics ship in operator
# v0.3.x; before that they are absent and the rules simply never fire.
# Power/temperature alerts live in the shelly-prometheus-exporter PrometheusRule -- not
# duplicated here.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shelly-operator
spec:
  groups:
    - name: shelly-operator
      rules:
        - alert: ShellyDeviceOffline
          annotations:
            summary: Shelly device offline.
            description: >-
              {{ $labels.name }}{{ with $labels.room }} in {{ . }}{{ end }}
              ({{ $labels.mac }}) has been offline (undiscovered by the
              operator sweep) for over 15m.
          expr: shelly_device_online == 0
          for: 15m
          labels:
            severity: warning
        - alert: ShellyDeviceOutOfSync
          annotations:
            summary: Shelly device config drift not converging.
            description: >-
              {{ $labels.name }}{{ with $labels.room }} in {{ . }}{{ end }}
              ({{ $labels.mac }}) is online but its config has not matched its
              profile for over 1h (enforcement failing or damped).
          # Online only -- an offline device is covered by ShellyDeviceOffline.
          expr: (shelly_device_in_sync == 0) and on(mac, name) (shelly_device_online == 1)
          for: 1h
          labels:
            severity: warning
        - alert: ShellyDevicePendingFirmware
          annotations:
            summary: Shelly device has a pending firmware update.
            description: >-
              {{ $labels.name }}{{ with $labels.room }} in {{ . }}{{ end }}
              ({{ $labels.mac }}) has had a stable firmware update available for
              over 24h. Neither the device's own 00:00 job nor the operator's
              09:00-10:00 update window installed it; kubectl get shellydevice
              shows why in status.lastFirmwareUpdate.
          expr: shelly_device_update_available == 1
          for: 24h
          labels:
            severity: info
        - alert: ShellyDeviceFirmwareUpdateRefused
          annotations:
            summary: Shelly device refused the operator's firmware update.
            description: >-
              {{ $labels.name }}{{ with $labels.room }} in {{ . }}{{ end }}
              ({{ $labels.mac }}) refused the operator's Shelly.Update and the
              version is still pending. The device's answer is in
              status.lastFirmwareUpdate.error on its ShellyDevice.
            # The device's own 00:00 job fails without trace; this is the one
            # place a refusal becomes visible. 30m lets the rest of the
            # 09:00-10:00 window retry before it fires.
          expr: shelly_device_firmware_update_refused == 1
          for: 30m
          labels:
            severity: warning
        - alert: ShellyDeviceRestartRequired
          annotations:
            summary: Shelly device needs a restart for a setting to take effect.
            description: >-
              {{ $labels.name }}{{ with $labels.room }} in {{ . }}{{ end }}
              ({{ $labels.mac }}) has reported restart_required for over 6h. A
              setting has been written but is NOT live until the device is
              rebooted. Note this does not show up as drift: InSync compares the
              config the device REPORTS, and the value is already written, so
              such a device reads as fully in sync. Clear it by rebooting the
              device, or set rebootWhenRequired on its profile if that load
              tolerates an interruption.
            # 6h, not 24h: unlike a pending firmware update there is no daily
            # window that clears this on its own -- it waits for a human
            # indefinitely. Four devices sat pending before this alert existed,
            # the oldest for four and a half days.
          expr: shelly_device_restart_required == 1
          for: 6h
          labels:
            severity: info
