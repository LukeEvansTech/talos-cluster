---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeassistant-prometheus
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: homeassistant-prometheus-secret
    template:
      engineVersion: v2
      data:
        # Long-lived access token named "prometheus" in the HA user profile; HA tokens are
        # full-access, so this secret stays scoped to the scrape config below.
        token: "{{ .LONG_LIVED_ACCESS_TOKEN }}"
  dataFrom:
    - extract:
        key: homeassistant-prometheus
