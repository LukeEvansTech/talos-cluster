---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mosquitto-secret
    template:
      engineVersion: v2
      data:
        # mosquitto_passwd hashes, base64-encoded in 1Password so the multi-line file survives
        # as one field. Usernames live there too, so device names stay out of Git.
        passwd: "{{ .MOSQUITTO_PASSWD_B64 | b64dec }}"
  dataFrom:
    - extract:
        key: mosquitto
