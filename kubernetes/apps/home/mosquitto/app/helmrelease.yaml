---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: mosquitto
  values:
    controllers:
      mosquitto:
        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        containers:
          app:
            image:
              repository: public.ecr.aws/docker/library/eclipse-mosquitto
              tag: 2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
            env:
              TZ: ${TIMEZONE}
              # 2.1 refuses symlinked key files; the mounted TLS secret is symlinks.
              MOSQUITTO_UNSAFE_ALLOW_SYMLINKS: "1"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
        statefulset:
          volumeClaimTemplates:
            - name: data
              storageClass: miroir-local
              accessMode: ReadWriteOnce
              size: 1Gi
              globalMounts:
                - path: /mosquitto/data
    defaultPodOptions:
      annotations:
        # External IoT devices reach the broker on-link through this macvlan address.
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "iot",
            "namespace": "kube-system",
            "ips": ["${SVC_MOSQUITTO_ADDR}/23"],
            "mac": "02:00:00:00:00:03"
          }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: mosquitto
        # Keeps the name in-cluster clients already use; a second service would otherwise
        # suffix it to mosquitto-app.
        forceRename: mosquitto
        # In-cluster clients use this ClusterIP; external IoT devices use the macvlan address above.
        type: ClusterIP
        ports:
          mqtt:
            port: 1883
      lb:
        controller: mosquitto
        # For routed clients, which cannot use the on-link macvlan address: its replies leave
        # through the pod's default route. TLS only, so credentials never cross the network in
        # plaintext; opnsense-dns publishes the name internally.
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: mqtt.${SECRET_DOMAIN}
          io.cilium/lb-ipam-ips: ${SVC_MOSQUITTO_LB_ADDR}
        ports:
          mqtts:
            port: 8883
    configMaps:
      config:
        data:
          mosquitto.conf: |-
            acl_file /mosquitto/config/acl
            allow_anonymous false
            autosave_interval 60
            connection_messages false
            listener 1883
            password_file /mosquitto/secret/passwd
            per_listener_settings false
            # Every client now authenticates, so a device credential cannot take over another
            # client's ID and repeatedly disconnect it (zigbee2mqtt, Home Assistant).
            use_username_as_clientid true
            persistence true
            persistence_location /mosquitto/data

            # TLS for routed clients; the password file and ACL above apply here too.
            listener 8883
            certfile /mosquitto/tls/tls.crt
            keyfile /mosquitto/tls/tls.key
          acl: |-
            # zigbee2mqtt: its own tree plus Home Assistant discovery and birth topics.
            user zigbee2mqtt
            topic readwrite zigbee2mqtt/#
            topic readwrite homeassistant/#

            # Home Assistant drives every integration, so it gets the whole broker.
            user homeassistant
            topic readwrite #

            # Every other user is a Glasshouse TV: its username is its topic prefix and its
            # discovery device id, so a TV can only touch its own topics and entities.
            pattern readwrite %u/#
            pattern write homeassistant/+/%u/#
    persistence:
      config-file:
        type: configMap
        identifier: config
        # Not world-readable: Mosquitto warns on that today and future versions refuse the file.
        defaultMode: 0440
        globalMounts:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
          - path: /mosquitto/config/acl
            subPath: acl
      passwd:
        type: secret
        name: mosquitto-secret
        defaultMode: 0440
        globalMounts:
          - path: /mosquitto/secret/passwd
            subPath: passwd
      tls:
        type: secret
        name: mosquitto-tls
        defaultMode: 0440
        globalMounts:
          - path: /mosquitto/tls
            readOnly: true
