---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: mosquitto
  values:
    controllers:
      mosquitto:
        annotations:
          reloader.stakater.com/auto: "true"
        type: statefulset
        containers:
          app:
            image:
              repository: public.ecr.aws/docker/library/eclipse-mosquitto
              tag: 2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
            env:
              TZ: ${TIMEZONE}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
        statefulset:
          volumeClaimTemplates:
            - name: data
              storageClass: miroir-local
              accessMode: ReadWriteOnce
              size: 1Gi
              globalMounts:
                - path: /mosquitto/data
    defaultPodOptions:
      annotations:
        # External IoT devices reach the broker on-link through this macvlan address.
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "iot",
            "namespace": "kube-system",
            "ips": ["${SVC_MOSQUITTO_ADDR}/23"],
            "mac": "02:00:00:00:00:03"
          }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: mosquitto
        # Keeps the name in-cluster clients already use; a second service would otherwise
        # suffix it to mosquitto-app.
        forceRename: mosquitto
        # In-cluster clients use this ClusterIP; external IoT devices use the macvlan address above.
        type: ClusterIP
        ports:
          mqtt:
            port: 1883
      lb:
        controller: mosquitto
        # Routed clients on other VLANs (Glasshouse TVs), which cannot reach the on-link macvlan:
        # its replies leave through the pod's default route, not the IoT interface.
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: ${SVC_MOSQUITTO_LB_ADDR}
        ports:
          mqtt:
            port: 1883
    configMaps:
      config:
        data:
          mosquitto.conf: |-
            acl_file /mosquitto/config/acl
            allow_anonymous false
            autosave_interval 60
            connection_messages false
            listener 1883
            password_file /mosquitto/secret/passwd
            per_listener_settings false
            persistence true
            persistence_location /mosquitto/data
          acl: |-
            # zigbee2mqtt: its own tree plus Home Assistant discovery and birth topics.
            user zigbee2mqtt
            topic readwrite zigbee2mqtt/#
            topic readwrite homeassistant/#

            # Home Assistant drives every integration, so it gets the whole broker.
            user homeassistant
            topic readwrite #

            # Every other user is a Glasshouse TV: its username is its topic prefix and its
            # discovery device id, so a TV can only touch its own topics and entities.
            pattern readwrite %u/#
            pattern write homeassistant/+/%u/#
    persistence:
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /mosquitto/config/mosquitto.conf
            subPath: mosquitto.conf
          - path: /mosquitto/config/acl
            subPath: acl
      passwd:
        type: secret
        name: mosquitto-secret
        globalMounts:
          - path: /mosquitto/secret/passwd
            subPath: passwd
