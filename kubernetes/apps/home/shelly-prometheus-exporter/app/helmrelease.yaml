---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app shelly-prometheus-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: shelly-prometheus-exporter
  values:
    controllers:
      shelly-prometheus-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/lukeevanstech/shelly-prometheus-exporter
              tag: 0.4.1@sha256:a64977f1bbb38b71da946526953b57aa139973c8c274d4187065e2aca0ea08bc
            args:
              - --config
              - /config/config.yaml
            env:
              TZ: ${TIMEZONE:=UTC}
              # Digest auth engages only on a 401, so SHELLY_PASSWORD no-ops on devices with
              # auth off. auth-credentials comes from the private shelly-fleet sync, not here.
              SHELLY_USERNAME: admin
              SHELLY_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: auth-credentials
                    key: password
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
    service:
      app:
        controller: *app
        ports:
          metrics:
            port: 8080
            protocol: TCP
    persistence:
      config:
        # shelly-operator renders this ConfigMap; it is not generated by this Kustomization.
        type: configMap
        name: shelly-prometheus-exporter-config
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true
