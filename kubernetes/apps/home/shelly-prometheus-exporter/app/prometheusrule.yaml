---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shelly-prometheus-exporter
spec:
  groups:
    - name: shelly-prometheus-exporter
      rules:
        - alert: ShellyExporterAbsent
          annotations:
            description: Shelly Exporter has disappeared from Prometheus target discovery.
            summary: Shelly Exporter is down.
          expr: absent(up{job=~".*shelly-prometheus-exporter.*"} == 1)
          for: 5m
          labels:
            severity: critical
        # Alerts use each device's own firmware power_limit as a percentage: a fixed wattage
        # would either never fire (the plug self-limits first) or fire at a normal peak.
        # The join uses shelly_device_online (operator registry): the exporter's own
        # device_name is usually unset. Bare $1 survives Flux, which substitutes only ${VAR}.
        - alert: ShellyPowerNearLimit
          annotations:
            description: >-
              {{ $labels.name }}{{ with $labels.room }} in {{ . }}{{ end }}
              ({{ $labels.device_mac }}) is drawing {{ $value | printf "%.0f" }}%
              of the power limit its own firmware cuts out at.
            summary: Shelly plug approaching its power cut-off.
          expr: >-
            (100 * shelly_switch_power / on(device_mac, switch_id) shelly_switch_power_limit)
            * on(device_mac) group_left(name, room)
            label_replace(max by(mac, name, room) (shelly_device_online), "device_mac", "$1", "mac", "(.*)")
            > 90
          for: 5m
          labels:
            severity: warning
        - alert: ShellyPowerAtLimit
          annotations:
            description: >-
              {{ $labels.name }}{{ with $labels.room }} in {{ . }}{{ end }}
              ({{ $labels.device_mac }}) is drawing {{ $value | printf "%.0f" }}%
              of its firmware power limit and is about to cut its own output.
            summary: Shelly plug about to trip on overpower.
          expr: >-
            (100 * shelly_switch_power / on(device_mac, switch_id) shelly_switch_power_limit)
            * on(device_mac) group_left(name, room)
            label_replace(max by(mac, name, room) (shelly_device_online), "device_mac", "$1", "mac", "(.*)")
            > 98
          for: 1m
          labels:
            severity: critical
        # Temperature stays absolute, since it is a hardware limit rather than a configurable
        # one, and reuses the join above so the alert names the device, not just a MAC.
        - alert: ShellyHighTemperature
          annotations:
            description: >-
              {{ $labels.name }}{{ with $labels.room }} in {{ . }}{{ end }}
              ({{ $labels.device_mac }}) temperature is
              {{ $value | printf "%.1f" }}°C which exceeds 70°C.
            summary: Shelly plug temperature is high.
          expr: >-
            shelly_switch_temperature{temperature_unit="dC"}
            * on(device_mac) group_left(name, room)
            label_replace(max by(mac, name, room) (shelly_device_online), "device_mac", "$1", "mac", "(.*)")
            > 70
          for: 5m
          labels:
            severity: warning
        - alert: ShellyHighTemperatureCritical
          annotations:
            description: >-
              {{ $labels.name }}{{ with $labels.room }} in {{ . }}{{ end }}
              ({{ $labels.device_mac }}) temperature is
              {{ $value | printf "%.1f" }}°C which exceeds 85°C.
            summary: Shelly plug temperature is critical.
          expr: >-
            shelly_switch_temperature{temperature_unit="dC"}
            * on(device_mac) group_left(name, room)
            label_replace(max by(mac, name, room) (shelly_device_online), "device_mac", "$1", "mac", "(.*)")
            > 85
          for: 2m
          labels:
            severity: critical
