---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cross-namespace-ingress
spec:
  description: "Allow ingress from gateway and external clients (mosquitto)"
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
    - fromEntities:
        - world
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-hamcp-from-ai
spec:
  # hamcp (ai namespace) drives Home Assistant over its API; additive to the namespace-wide
  # policy above, scoped to just this endpoint and source pod.
  description: "Allow the hamcp MCP server (ai) to reach Home Assistant"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: homeassistant
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            toolhive-name: hamcp
