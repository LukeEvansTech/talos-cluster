---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scrypted
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: scrypted
  values:
    controllers:
      scrypted:
        annotations:
          reloader.stakater.com/auto: "true"
        # Recreate avoids two pods sharing one macvlan MAC/IP and deadlocking the PVC.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/koush/scrypted
              # `-noble-full` mirrors upstream's `:latest` tag; Renovate stays within this suffix.
              tag: v0.147.0-noble-full@sha256:e78b4fcecdd6c61acaaf22b50ccef303c738da58cc0be57afdb116521df52296
            env:
              TZ: ${TIMEZONE}
              # Routing the gateway at this plain-HTTP port avoids a BackendTLSPolicy for
              # the self-signed HTTPS port.
              SCRYPTED_INSECURE_PORT: &port 11080
              SCRYPTED_SECURE_PORT: 10443
              # Left unset: macvlan already reaches the HomeKit hubs directly, and
              # Homebridge's bundled Avahi crash-loops here.
            # A macvlan pod cannot reach its own node, so a kubelet httpGet probe blackholes;
            # exec checks localhost inside the pod instead.
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - curl
                      - --silent
                      - --fail
                      - --output
                      - /dev/null
                      - --max-time
                      - "5"
                      - http://127.0.0.1:11080/
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *probes
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              # False: Scrypted unpacks helper binaries onto the image filesystem at runtime.
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # Headroom for HKSV transcoding spikes when several cameras record at once.
                memory: 4Gi

    # Multus macvlan on the `iot-legacy` NAD: HomeKit needs L2 adjacency with its hubs.
    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "iot-legacy",
            "namespace": "kube-system",
            "ips": ["10.32.8.106/24"],
            "mac": "02:00:00:00:00:05"
          }]
      # Runs as root: the entrypoint manages the plugin runtime and npm-installs at
      # runtime, the same documented exception as homebridge.
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: scrypted
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    # HKSV clips live in iCloud, so no NVR volume is provisioned yet; add one alongside
    # `config` with SCRYPTED_NVR_VOLUME set when the Reolink plugin needs local storage.
    persistence:
      # Losing this PVC unpairs every HomeKit accessory, so it carries the standard volsync backup.
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /server/volume
