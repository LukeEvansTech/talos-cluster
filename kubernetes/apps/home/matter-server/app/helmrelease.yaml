---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matter-server
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: matter-server
  values:
    controllers:
      matter-server:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # The kernel needs accept_ra_rt_info_max_plen > 0 to accept OTBR's Thread routes.
          sysctl:
            image:
              repository: ghcr.io/matter-js/matterjs-server
              tag: 1.4.0@sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236
            command:
              - /bin/sh
              - -ec
              - |
                echo 2 > /proc/sys/net/ipv6/conf/net1/accept_ra
                echo 64 > /proc/sys/net/ipv6/conf/net1/accept_ra_rt_info_max_plen
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              # NET_ADMIN cannot write /proc/sys, so this container is fully privileged.
              # Only the sysctls above are net1-scoped; the privilege itself is not.
              privileged: true
        containers:
          app:
            image:
              # matter.js replaces the archived python-matter-server: same ws API and CLI flags.
              repository: ghcr.io/matter-js/matterjs-server
              tag: 1.4.0@sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236
            args:
              - --storage-path
              - /data
              - --primary-interface
              - net1
              - --log-level
              - info
            env:
              TZ: ${TIMEZONE}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      annotations:
        # iot-legacy is temporary, for L2 adjacency with the Thread router until it relocates.
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "iot-legacy",
            "namespace": "kube-system",
            "ips": ["10.32.8.103/24"],
            "mac": "02:00:00:00:00:04"
          }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: matter-server
        ports:
          ws:
            port: 5580
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
