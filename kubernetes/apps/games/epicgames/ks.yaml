---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app epicgames
  namespace: &namespace games
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/homepage
  dependsOn:
    - name: onepassword-connect
      namespace: external-secrets
    - name: envoy-gateway
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/games/epicgames/app
  postBuild:
    substitute:
      APP: *app
      HOMEPAGE_NAME: Epic Games
      HOMEPAGE_GROUP: Games
      HOMEPAGE_ICON: epic-games.svg
      HOMEPAGE_DESCRIPTION: Free games claimer
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: true
