---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app gameyfin
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gameyfin
  values:
    controllers:
      gameyfin:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/gameyfin/gameyfin
              tag: 2.5.0@sha256:aa8039d36734221e82016c1bb6714177eca8c440885d42a527a04d2abd194e0c
            env:
              TZ: ${TIMEZONE}
              PUID: 1000
              PGID: 1000
              APP_URL: https://gameyfin.${SECRET_DOMAIN}
            envFrom:
              - secretRef:
                  name: gameyfin-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 10m
                memory: 2Gi
              limits:
                memory: 2Gi

    defaultPodOptions:
      # Entrypoint runs groupmod and needs root; NFS all_squash→1000 makes the runtime UID moot.
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: gameyfin
        ports:
          http:
            port: 8080

    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          gameyfin:
            app:
              - path: /opt/gameyfin/data
                subPath: data
              - path: /opt/gameyfin/db
                subPath: db
              - path: /opt/gameyfin/plugindata
                subPath: plugin
      games:
        type: nfs
        server: ${SECRET_STORAGE_SERVER}
        path: ${SECRET_STORAGE_SERVER_GAMES_NFS}
        globalMounts:
          - path: /games
      tmp:
        type: emptyDir
        advancedMounts:
          gameyfin:
            app:
              - path: /opt/gameyfin/logs
                subPath: logs
              - path: /tmp
                subPath: tmp
