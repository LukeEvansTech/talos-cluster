---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app romm
  namespace: &namespace games
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/homepage
    - ../../../../components/volsync
  dependsOn:
    - name: cloudnative-pg-tenants
      namespace: database
    - name: envoy-gateway
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/games/romm/app
  postBuild:
    substitute:
      APP: *app
      # Scraped artwork and manuals reached 48Gi with 10 of 53 platforms scraped (2026-10-26).
      VOLSYNC_CAPACITY: 150Gi
      HOMEPAGE_NAME: ROMM
      HOMEPAGE_GROUP: Games
      HOMEPAGE_ICON: /icons/dracula/romm.svg
      HOMEPAGE_DESCRIPTION: ROM manager
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 35m
  wait: true
