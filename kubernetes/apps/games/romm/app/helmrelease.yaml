---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app romm
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: romm
  # Covers the startup probe's ~30m migration budget; the 5m default would roll back mid-migration.
  timeout: 35m
  values:
    controllers:
      romm:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/rommapp/romm
              tag: 5.4.0@sha256:03295f95a6290e752641f9553ac4198b0e5b71b879d57f7b2371b98f608feb54
            env:
              TZ: ${TIMEZONE}
              DISABLE_DOWNLOAD_ENDPOINT_AUTH: "true"
              ENABLE_SCHEDULED_RESCAN: "true"
              RESCAN_ON_FILESYSTEM_CHANGE: "false"
              SCHEDULED_RESCAN_CRON: "0 3 * * *"
              # Key-less metadata sources. Hasheous and PlayMatch match by file hash. LaunchBox's
              # store lives in the emptyDir cache: refill it from Administration > Tasks after a restart.
              HASHEOUS_API_ENABLED: "true"
              PLAYMATCH_API_ENABLED: "true"
              LAUNCHBOX_API_ENABLED: "true"
              HLTB_API_ENABLED: "true"
            envFrom:
              - secretRef:
                  name: romm-secret
            probes:
              # Alembic runs before anything listens on :8080, in one transaction, so a liveness
              # kill mid-migration rolls back all of it; 5.4.0 warns of 15-20 minutes. ~30m budget.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 180
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 3500Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: romm
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /romm/resources
            subPath: resources
          - path: /romm/assets
            subPath: assets
      library:
        type: nfs
        server: ${SECRET_STORAGE_SERVER}
        path: ${SECRET_STORAGE_SERVER_GAMES_NFS}
        globalMounts:
          - path: /romm/library
      redis-data:
        type: emptyDir
        globalMounts:
          - path: /redis-data
      tmp:
        type: emptyDir
