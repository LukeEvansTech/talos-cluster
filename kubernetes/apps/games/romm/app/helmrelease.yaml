---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app romm
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: romm
  # Covers the startup probe's ~30m migration budget; the 5m default would roll back mid-migration.
  timeout: 35m
  values:
    controllers:
      romm:
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image: &image
              repository: ghcr.io/rommapp/romm
              tag: 5.4.1@sha256:8677fb7b81b1d3db20b849e989a1dadc2a11159e51eb34a2acdcb01102274edf
            env:
              TZ: ${TIMEZONE}
              DISABLE_DOWNLOAD_ENDPOINT_AUTH: "true"
              ENABLE_SCHEDULED_RESCAN: "true"
              RESCAN_ON_FILESYSTEM_CHANGE: "false"
              SCHEDULED_RESCAN_CRON: "0 3 * * *"
              # Key-less metadata sources. Hasheous and PlayMatch match by file hash. LaunchBox's
              # store is filled from Administration > Tasks and persists in /redis-data.
              # HowLongToBeat stays off: it rate-limited (503) a 13k-game scan.
              HASHEOUS_API_ENABLED: "true"
              PLAYMATCH_API_ENABLED: "true"
              LAUNCHBOX_API_ENABLED: "true"
            envFrom:
              - secretRef:
                  name: romm-secret
            probes:
              # Alembic runs before anything listens on :8080, in one transaction, so a liveness
              # kill mid-migration rolls back all of it; 5.4.0 warns of 15-20 minutes. ~30m budget.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 180
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 3500Mi

        initContainers:
          # A kubelet-created (or restored) subPath directory is root-owned, and Valkey stops
          # accepting writes when it cannot save there.
          redis-dir:
            image: *image
            command:
              [
                "sh",
                "-c",
                "mkdir -p /cfg/redis && chown 1000:1000 /cfg/redis && chmod 2775 /cfg/redis",
              ]
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"], add: ["CHOWN", "FOWNER"] }
            resources:
              limits:
                memory: 32Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: romm
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          romm:
            app:
              - path: /romm/resources
                subPath: resources
              - path: /romm/assets
                subPath: assets
              # Valkey snapshots here hourly: sessions and the LaunchBox store survive a restart.
              - path: /redis-data
                subPath: redis
            redis-dir:
              - path: /cfg
      library:
        type: nfs
        server: ${SECRET_STORAGE_SERVER}
        path: ${SECRET_STORAGE_SERVER_GAMES_NFS}
        globalMounts:
          - path: /romm/library
      tmp:
        type: emptyDir
