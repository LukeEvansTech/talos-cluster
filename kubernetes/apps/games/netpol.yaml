---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cross-namespace-ingress
spec:
  description: "Allow ingress from gateway and external clients (game servers)"
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-world-ingress-mc-router
spec:
  description: "Allow world ingress only to the pods behind this namespace's LoadBalancer services"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mc-router
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "25565"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-world-ingress-satisfactory
spec:
  description: "Allow world ingress only to the pods behind this namespace's LoadBalancer services"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: satisfactory
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "7777"
              protocol: TCP
            - port: "7777"
              protocol: UDP
