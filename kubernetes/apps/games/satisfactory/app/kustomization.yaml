---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./pvc.yaml
patches:
  # Repoints sourcePVC to sf-gamedata; this may be backing up the wrong claim, see kb/145.
  - target:
      kind: ReplicationSource
    patch: |-
      - op: replace
        path: /spec/sourcePVC
        value: sf-gamedata
