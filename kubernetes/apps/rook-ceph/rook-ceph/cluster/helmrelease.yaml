---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  values:
    # No cephImage pin: the CHART governs the Ceph version, and it moves with the
    # chart (v1.20.4 shipped v20.2.2, v1.20.6 ships v20.2.4). The pin that held
    # v20.2.2 through the v1.20.6 chart move has done its job and is removed here,
    # which is what performs the v20.2.2 -> v20.2.4 data-plane upgrade.
    #
    # An explicit pin is deliberately NOT kept: no Renovate manager in this
    # repository tracks an inline cephImage tag, so it would be hand-maintained and
    # would silently go stale. Instead, rook-ceph sits in the "Protected infra"
    # packageRules entry, so every chart bump gets a human review -- and that
    # reviewer must check whether the chart's default Ceph version has moved,
    # because a chart bump alone will roll every mon, mgr, OSD and MDS.
    monitoring:
      enabled: true
      createPrometheusRules: true
    ingress:
      dashboard:
        ingressClassName: ""
    toolbox:
      enabled: true
    cephClusterSpec:
      resources:
        # NOTE: mgr resources must live here (spec.resources.mgr) — the CephCluster
        # CRD has no spec.mgr.resources field, so a block there is silently pruned
        # and the chart default (1Gi limit) applies instead.
        # 3Gi limit: with diskprediction_local/insights/pg_autoscaler modules
        # plus the prometheus + dashboard endpoints enabled, the active mgr working
        # set climbs past 2Gi and gets OOMKilled (~twice daily), failing over to the
        # standby each time. 3Gi holds it with headroom (mon is already 4Gi).
        mgr:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 3Gi
        mon:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 4Gi
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: local # requires mgr module
          mon_data_avail_warn: "15" # quote - mons live on OS disk, not OSD disk
        mon:
          mon_cluster_log_level: info # default debug floods the cluster log
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      # Ceph v20.2.4 asserts on cephx key ciphers (CVE-2025-30156). Rotating the DAEMON
      # keys is what clears both HEALTH_ERR items, AUTH_INSECURE_SERVICE_KEY_TYPE and
      # AUTH_INSECURE_SERVICE_TICKETS. keyGeneration: 2 per upstream's guide.
      #
      # keyGeneration is APPEND-ONLY — the CRD enforces "keyGeneration cannot be removed
      # once set", so deleting this field makes the API server reject every later
      # CephCluster update and the HelmRelease stops reconciling. Raise the number to
      # rotate again; never remove it.
      #
      # csi keys stay on the chart default (aes): AES256K needs a 7.0+ kernel, the fleet
      # is on 6.18 even after Talos v1.13.9, and both storage paths here are kernel
      # clients (krbd, and the built-in CephFS kernel client per KB-025).
      security:
        cephx:
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
      # These three cannot be cleared here, so they are muted rather than left to mask
      # later health changes: CLIENT_KEY_TYPE needs those CSI keys rotated, and
      # KEYS_ALLOWED/KEYS_CREATABLE need allowedCiphers restricted to aes256k, which
      # would lock the same clients out. AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE is
      # deliberately not muted — it clears itself once the daemons re-key.
      healthCheck:
        muteHealthWarning:
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
      mgr:
        modules:
          - name: diskprediction_local
            enabled: true
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          # Disabled: leaks mgr memory on Ceph v20.2.2 (rook#17786) and crash-loops
          # the mgr every ~15s on v20.2.3/v20.2.4 (rook#18124). Rook v1.20.6 force-
          # disables it, but only for Extra in [2,4] - leaving this true would
          # silently re-enable it on v20.2.5.
          - name: rook
            enabled: false
      network:
        provider: host
        connections:
          requireMsgr2: true
      storage:
        useAllNodes: true
        useAllDevices: true
        devicePathFilter: /dev/disk/by-id/nvme-INTEL_SSDPE21D015TA_.*
        config:
          osdsPerDevice: "1"
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - "discard"
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    # CephFS provides the cluster's RWX StorageClass (ceph-filesystem). The kernel
    # CephFS client is built into the Talos v1.13.5+ kernel (CONFIG_CEPH_FS=y);
    # the earlier "Talos ships no `ceph` kernel module" claim was a modprobe-vs-
    # builtin misdiagnosis — see KB-025
    # (docs/docs/troubleshooting/kb/025-cephfs-modprobe-builtin-misdiagnosis.md).
    # The cephfs CSI driver must also be enabled in the ceph-csi-drivers
    # HelmRelease (msgr2 kernel mount options live there).
    # To tear the filesystem back down:
    # ceph fs fail ceph-filesystem && ceph fs rm ceph-filesystem --yes-i-really-mean-it
    cephFileSystems:
      - name: &cephFilesystemName ceph-filesystem
        spec:
          # Distinct metadata + data0 pools, both replicated x3 across hosts.
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
          dataPools:
            - name: data0
              failureDomain: host
              replicated:
                size: 3
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            # Keep the active + standby MDS on separate nodes so a single node
            # loss can't take out both.
            placement:
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: *cephFilesystemName
        storageClass:
          enabled: true
          name: ceph-filesystem
          isDefault: false
          pool: data0
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete
    # Object storage (RGW) removed — migrated to Garage (storage/garage).
    cephObjectStores: []
