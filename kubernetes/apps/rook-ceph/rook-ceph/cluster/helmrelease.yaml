---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  values:
    # No cephImage pin: the chart governs the Ceph version, and a bump can move it silently
    # (v1.20.4 shipped v20.2.2, v1.20.6 ships v20.2.4). No Renovate manager tracks an inline
    # tag, so rook-ceph sits in "Protected infra": every chart bump's reviewer must also check
    # the Ceph version.
    monitoring:
      enabled: true
      createPrometheusRules: true
    ingress:
      dashboard:
        ingressClassName: ""
    toolbox:
      enabled: true
    cephClusterSpec:
      resources:
        # mgr resources must live here; the CephCluster CRD has no spec.mgr.resources field, so a
        # block there is silently pruned and the chart's 1Gi default applies instead.
        # 3Gi holds the mgr's working set with headroom; 2Gi OOMKilled it about twice a day
        # (docs/docs/apps/rook-ceph.md).
        mgr:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 3Gi
        mon:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 4Gi
      cephConfig:
        global:
          bdev_enable_discard: "true" # quote
          bdev_async_discard_threads: "1" # quote
          osd_class_update_on_start: "false" # quote
          device_failure_prediction_mode: local # requires mgr module
          mon_data_avail_warn: "15" # quote - mons live on OS disk, not OSD disk
        mon:
          mon_cluster_log_level: info # default debug floods the cluster log
          # 0.3s is 2.7x the observed peak clock offset and still catches a real time fault; the
          # default 0.05s false-paged on ordinary NTP wander (docs/docs/apps/rook-ceph.md).
          mon_clock_drift_allowed: "0.3" # quote
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      # keyGeneration: 2 rotates the DAEMON keys, clearing the CVE-2025-30156 HEALTH_ERR items
      # AUTH_INSECURE_SERVICE_KEY_TYPE and AUTH_INSECURE_SERVICE_TICKETS.
      # keyGeneration is append-only: the CRD rejects a CephCluster update that removes it, and
      # the HelmRelease then stops reconciling. Raise the number to rotate; never remove it.
      # aes256k for the kernel clients (KB-025) needs Talos v1.14+, whose 6.18 kernel backports the
      # 7.0 libceph support (docs/docs/apps/rook-ceph.md).
      security:
        cephx:
          csi:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
            keepPriorKeyCountMax: 0
            keyType: aes256k
          rbdMirrorPeer:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
            keyType: aes256k
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          allowedCiphers:
            - aes256k
      # Rook runs these imperatively, so unmute stays until it has applied, then the block goes.
      healthCheck:
        muteHealthWarning:
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: unmute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: unmute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: unmute
      mgr:
        modules:
          - name: diskprediction_local
            enabled: true
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          # Disabled: leaks mgr memory on v20.2.2 (rook#17786) and crash-loops the mgr every ~15s on
          # v20.2.3/v20.2.4 (rook#18124). Rook v1.20.6 only force-disables it for Extra in [2,4], so
          # leaving this true would silently re-enable it on v20.2.5.
          - name: rook
            enabled: false
      network:
        provider: host
        connections:
          requireMsgr2: true
      storage:
        useAllNodes: true
        useAllDevices: true
        devicePathFilter: /dev/disk/by-id/nvme-INTEL_SSDPE21D015TA_.*
        config:
          osdsPerDevice: "1"
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions:
            - "discard"
          parameters:
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    # CephFS backs the RWX StorageClass. Its kernel client is built into Talos v1.13.5+, not a
    # loadable module (docs/docs/troubleshooting/kb/025-cephfs-modprobe-builtin-misdiagnosis.md).
    # cephfs CSI must also be enabled in ceph-csi-drivers's HelmRelease, which sets msgr2 options.
    cephFileSystems:
      - name: &cephFilesystemName ceph-filesystem
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
          dataPools:
            - name: data0
              failureDomain: host
              replicated:
                size: 3
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            # Keeps active and standby MDS on separate nodes so one node loss can't take both down.
            placement:
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: *cephFilesystemName
        storageClass:
          enabled: true
          name: ceph-filesystem
          isDefault: false
          pool: data0
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete
    # Object storage (RGW) removed, migrated to Garage (storage/garage).
    cephObjectStores: []
