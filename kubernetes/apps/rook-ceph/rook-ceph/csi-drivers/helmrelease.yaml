---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: ceph-csi-drivers
  values:
    # Rook v1.20 split CSI driver deployment into this ceph-csi-operator-managed chart. RBD
    # (ceph-block) and CephFS (ceph-filesystem) are enabled; NFS/NVMeoF are not. The kernel CephFS
    # client is built into Talos, not missing
    # (docs/docs/troubleshooting/kb/025-cephfs-modprobe-builtin-misdiagnosis.md).
    drivers:
      rbd:
        enabled: true
        # MUST match the existing StorageClass provisioner and all in-use PVs. The chart defaults
        # to unprefixed "rbd.csi.ceph.com"; Rook's convention (and our ceph-block SC) prefixes it.
        name: rook-ceph.rbd.csi.ceph.com
        # The chart defaults this to "none", which stops VolumeSnapshotContents from ever
        # completing (stuck ReadyToUse=false); VolSync's copyMethod: Snapshot movers need this
        # sidecar for every *-nfs/-r2 ReplicationSource.
        snapshotPolicy: volumeSnapshot
      cephfs:
        enabled: true
        # Same prefix requirement as RBD above: the ceph-filesystem SC provisioner is
        # {operatorNamespace}.cephfs.csi.ceph.com, so PVCs only bind if this name matches.
        name: rook-ceph.cephfs.csi.ceph.com
        # Mirrors the RBD snapshotter so csi-ceph-filesystem's VolumeSnapshotClass and VolSync's
        # Snapshot movers have a working CreateSnapshot path.
        snapshotPolicy: volumeSnapshot
        # The cluster requires msgr2 (cephClusterSpec.network.connections.requireMsgr2), so the
        # kernel client must negotiate it or the mount hangs against the v1-refusing mons.
        # prefer-crc = msgr2 with CRC32c integrity, not full encryption.
        # kernelMountOptions is a map (csi.ceph.io/v1 Driver spec), not a "key=value" string.
        kernelMountOptions:
          ms_mode: prefer-crc
      nfs:
        enabled: false
      nvmeof:
        enabled: false
    operatorConfig:
      namespace: rook-ceph
