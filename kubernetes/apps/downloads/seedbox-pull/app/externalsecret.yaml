---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seedbox-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: seedbox-pull-secret
    template:
      data:
        # ssh needs the trailing newline the 1Password field drops.
        id_ed25519: |
          {{ .private_key }}
  dataFrom:
    - extract:
        key: seedbox-pull
