---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  values:
    controllers:
      qbittorrent:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            nameOverride: qbittorrent
            image: &image
              # libtorrent v1.2.x: better private-tracker compatibility, fewer libtorrent-v2
              # disk/memory quirks.
              repository: ghcr.io/home-operations/qbittorrent-libtorrentv1
              tag: 5.2.4@sha256:6c303adb93d995ba33dcdce45ee89181a370b6ad745b4148e7f73bde43e5d482
            # QBT_* vars are CLI options only; apply-settings below declares the rest of
            # qBittorrent.conf.
            env:
              QBT_WEBUI_PORT: &port 80
              # Must equal the VPN provider's forwarded port (FIREWALL_VPN_INPUT_PORTS below).
              QBT_TORRENTING_PORT: &BT-port 28812
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                # Disk cache pinned to 256 MiB (apply-settings.sh) keeps RSS ~330Mi; 2Gi is
                # generous headroom.
                memory: 2Gi
          metrics:
            dependsOn: app
            image:
              repository: ghcr.io/martabal/qbittorrent-exporter
              tag: v2.0.3@sha256:bc4fa09481634ee894ebfb4d47c8aa239a32a12567b043afa01fa42a3075d1a5
            env:
              # Real ExternalSecret credentials: the app container's localhost-auth bypass is off.
              QBITTORRENT_BASE_URL: "http://localhost:80"
              QBITTORRENT_USERNAME: admin
              QBITTORRENT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: qbittorrent-secret
                    key: QBT_WEBUI_PASSWORD
              # qBittorrent >= 5.2.0 names the session cookie QBT_SID_<port>; untracked, the
              # exporter loops re-auth with the bypass off.
              QBITTORRENT_COOKIE_NAME: QBT_SID_80
              EXPORTER_PORT: &metricsPort 9710
              # Per-torrent series (qbittorrent_torrent_info / qbittorrent_tracker_info)
              ENABLE_HIGH_CARDINALITY: "true"
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              seccompProfile: { type: RuntimeDefault }
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
          gluetun-webui:
            dependsOn: app
            image:
              repository: docker.io/scuzza/gluetun-webui
              tag: latest@sha256:a7c2b4c77f26bb690debe6879cd7149d69710578b13e0dcdc08f6b9b6c7a7a14
            env:
              GLUETUN_CONTROL_URL: http://localhost:8000
              PORT: &gluetun-webui-port 3000
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *gluetun-webui-port
                  periodSeconds: 60
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *gluetun-webui-port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *gluetun-webui-port
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 50Mi
              limits:
                memory: 128Mi
        initContainers:
          # Declares qBittorrent.conf in Git (disk-cache OOMKill fix, WebUI auth, queue and
          # share limits) so a PVC recreate can't drop it; see apply-settings.sh for the list.
          apply-settings:
            image: *image
            command:
              - "/scripts/apply-settings.sh"
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              limits:
                memory: 64Mi
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            env:
              DOT: "on"
              DOT_CACHING: "on"
              DOT_IPV6: off
              # Keeps CoreDNS as the resolver, so cluster services stay resolvable in-tunnel.
              DNS_KEEP_NAMESERVER: "on"
              FIREWALL: true
              FIREWALL_DEBUG: on
              FIREWALL_INPUT_PORTS: 80,3000,9710,9999
              # Opens the tunnel for inbound peers so qBittorrent can seed. The VPN provider's
              # forwarded ports are account-wide, so no port-forward sync sidecar is needed.
              FIREWALL_VPN_INPUT_PORTS: 28812
              FIREWALL_OUTBOUND_SUBNETS: '"${CLUSTER_PODS_CIDR},${CLUSTER_SVCS_CIDR},${CR_LAN_CIDR},${GH_LAN_CIDR}"'
              HEALTH_SERVER_ADDRESS: ":9999"
              HEALTH_SERVER_DISABLE_LOOP: on
              HEALTH_VPN_DURATION_INITIAL: 60s
              LOG_LEVEL: debug
              # Root (0) avoids EPERM chowning the public-IP file to PUID:PGID under drop-ALL.
              PGID: 0
              # ip2location avoids ipinfo's 429 on its free tier; the display is cosmetic.
              PUBLICIP_API: ip2location
              PUID: 0 # see PGID above
              TZ: ${TIMEZONE}
              UPDATER_PERIOD: 12h
              VERSION_INFORMATION: off
              VPN_INTERFACE: wg0
              VPN_IPV6_SERVER: off
              VPN_TYPE: wireguard
            envFrom:
              - secretRef:
                  name: qbittorrent-secret
            probes:
              liveness:
                enabled: false
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  timeoutSeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              # Holds the app container until the tunnel is up: gluetun's health server answers 500
              # until its first check passes. Without it the app can start before wg0 exists and
              # never listen on it (qBittorrent sat at 0 DHT nodes for 19h on 2026-09-28).
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 5
            restartPolicy: Always
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
              capabilities:
                add:
                  - NET_ADMIN
                drop:
                  - ALL
              allowPrivilegeEscalation: false
            resources:
              limits:
                kernel.org/tun: 1
        pod:
          labels:
            gluetun: "true"
    defaultPodOptions:
      terminationGracePeriodSeconds: 300
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: qbittorrent
        ports:
          http:
            port: *port
          metrics:
            port: *metricsPort
      gluetun:
        controller: qbittorrent
        ports:
          http:
            port: 8888
      gluetun-webui:
        controller: qbittorrent
        ports:
          http:
            port: *gluetun-webui-port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: qbittorrent-app
                port: 80
      gluetun-webui:
        hostnames:
          - "{{ .Release.Name }}-gluetun.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: qbittorrent-gluetun-webui
                port: 3000
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          qbittorrent:
            app:
              - path: /config
            apply-settings:
              - path: /config
      scripts:
        type: configMap
        name: qbittorrent-scripts
        defaultMode: 0755
        advancedMounts:
          qbittorrent:
            apply-settings:
              - path: /scripts
                readOnly: true
      media:
        type: nfs
        server: ${SECRET_STORAGE_SERVER:-localhost}
        path: /mnt/pool/media
        globalMounts:
          - path: /media
      # Pre-created (mode 1777): gluetun's own MkdirAll leaves no execute bit, which blocked the
      # public-IP write under this drop-ALL container. Paired with PUID/PGID 0 in the gluetun env.
      gluetun-tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Mi
        advancedMounts:
          qbittorrent:
            gluetun:
              - path: /tmp/gluetun
