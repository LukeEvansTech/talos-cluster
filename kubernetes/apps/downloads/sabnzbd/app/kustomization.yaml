---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./configmap.yaml
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./servicemonitor.yaml
  - ./cleanup-cronjob.yaml
  - ./complete-cleanup-cronjob.yaml
configMapGenerator:
  - name: sabnzbd-pp-watchdog
    namespace: downloads
    files:
      - pp-watchdog.sh=./resources/pp-watchdog.sh
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
