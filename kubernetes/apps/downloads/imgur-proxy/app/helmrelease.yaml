---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: imgur-proxy
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: imgur-proxy
  values:
    controllers:
      imgur-proxy:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            nameOverride: nginx
            image:
              repository: docker.io/library/nginx
              tag: 1.31-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
            command:
              - "nginx"
            args:
              - "-g"
              - "daemon off;"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8443
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              runAsUser: 101
              runAsGroup: 101
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                memory: 128Mi
        initContainers:
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            env:
              # Off here only: nginx's SNI map already limits lookups to .imgur.com.
              BLOCK_MALICIOUS: off
              DOT: "on"
              DOT_CACHING: "on"
              DOT_IPV6: off
              FIREWALL: true
              FIREWALL_DEBUG: on
              # nginx (8443) + gluetun health server (9999)
              FIREWALL_INPUT_PORTS: "8443,9999"
              FIREWALL_OUTBOUND_SUBNETS: '"${CLUSTER_PODS_CIDR},${CLUSTER_SVCS_CIDR},${CR_LAN_CIDR},${GH_LAN_CIDR}"'
              HEALTH_SERVER_ADDRESS: ":9999"
              # `off` keeps gluetun's tunnel-recovery loop enabled (double negative; don't flip it).
              # The kubelet probe below is off, so this loop is the only recovery path left (#4608).
              HEALTH_SERVER_DISABLE_LOOP: off
              HEALTH_VPN_DURATION_INITIAL: 60s
              LOG_LEVEL: info
              # Root (0) avoids EPERM chowning the public-IP file to PUID:PGID under drop-ALL.
              PGID: 0
              # ip2location avoids ipinfo's 429 on its free tier; the display is cosmetic.
              PUBLICIP_API: ip2location
              PUID: 0 # see PGID above
              TZ: ${TIMEZONE}
              UPDATER_PERIOD: 12h
              VERSION_INFORMATION: off
              VPN_INTERFACE: wg0
              VPN_IPV6_SERVER: off
              VPN_TYPE: wireguard
            # VPN creds come from the `gluetun-imgur-proxy` 1Password item via the ExternalSecret.
            envFrom:
              - secretRef:
                  name: imgur-proxy-secret
            # Probes off, matching the sibling gluetun sidecars, avoids a kubelet restart storm
            # from shared netns state (1352 restarts in 4+ days; docs/docs/apps/imgur-proxy.md).
            probes:
              liveness:
                enabled: false
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  timeoutSeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              # Gates the app container until the tunnel is up (gluetun answers 500 until its first
              # health check passes); 5m headroom bounds the KB-042 restart risk.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  failureThreshold: 30
            restartPolicy: Always
            # Clears stale v4/v6 wireguard ip rules left by an abrupt exit, so gluetun can
            # re-add them on (re)start instead of failing with "table 51820: file exists".
            lifecycle:
              postStart:
                exec:
                  command:
                    - "/bin/sh"
                    - "-c"
                    - "(ip rule del table 51820; ip -6 rule del table 51820) || true"
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
              capabilities:
                add:
                  - "NET_ADMIN"
                drop:
                  - "ALL"
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                # Insurance, not a measurement: this container OOMKilled 240+ times at 256Mi from a
                # startup spike too brief for cAdvisor to sample (docs/docs/apps/imgur-proxy.md).
                memory: 512Mi
                kernel.org/tun: 1
        pod:
          labels:
            gluetun: "true"
    defaultPodOptions:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
    service:
      app:
        controller: imgur-proxy
        type: LoadBalancer
        annotations:
          # Add SVC_IMGUR_PROXY_ADDR to cluster-secrets before applying; pins the Cilium pool IP.
          lbipam.cilium.io/ips: ${SVC_IMGUR_PROXY_ADDR}
        # Cluster (default): Local needs Cilium's L2 announcer on the pod's node, not guaranteed.
        # Source IP isn't useful here; the proxy is SNI-allowlisted, not per-client.
        externalTrafficPolicy: Cluster
        ports:
          https:
            port: 443
            targetPort: 8443
            protocol: TCP
    configMaps:
      nginx:
        data:
          nginx.conf: |
            pid /tmp/nginx.pid;
            worker_processes auto;
            error_log /dev/stderr warn;

            events {
              worker_connections 1024;
            }

            stream {
              # gluetun runs an in-pod DOT proxy on 127.0.0.1:53 (default
              # behaviour with DOT=on). It forwards encrypted DNS over the
              # WireGuard tunnel to gluetun's configured DOT upstreams, so
              # lookups are authenticated end-to-end (DOT cert verified)
              # and never traverse cluster DNS (which would loop back to
              # this proxy's own IP via the OPNsense local-zone redirect).
              resolver 127.0.0.1 valid=10s ipv6=off;
              resolver_timeout 5s;

              log_format basic '$$remote_addr [$$time_local] sni=$$ssl_preread_server_name upstream=$$upstream sent=$$bytes_sent recv=$$bytes_received session=$$session_time';
              access_log /dev/stdout basic;

              # SNI allowlist: leading-dot `.imgur.com` matches the apex
              # AND any subdomain in nginx's `hostnames;` map syntax.
              # Empty default drops other SNI (open-relay protection: only
              # Imgur-owned hosts are relayed).
              map $$ssl_preread_server_name $$upstream {
                hostnames;
                .imgur.com   $$ssl_preread_server_name;
                default      "";
              }

              server {
                listen 8443;
                ssl_preread on;

                proxy_connect_timeout 5s;
                proxy_timeout 60s;

                proxy_pass $$upstream:443;
              }
            }
    persistence:
      nginx-config:
        type: configMap
        identifier: nginx
        globalMounts:
          - path: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        globalMounts:
          - path: /tmp
      var-cache-nginx:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        advancedMounts:
          imgur-proxy:
            app:
              - path: /var/cache/nginx
      var-run:
        type: emptyDir
        medium: Memory
        sizeLimit: 4Mi
        advancedMounts:
          imgur-proxy:
            app:
              - path: /var/run
      gluetun-data:
        type: emptyDir
        sizeLimit: 16Mi
        advancedMounts:
          imgur-proxy:
            gluetun:
              - path: /gluetun
      # Pre-created (mode 1777): gluetun's own MkdirAll leaves no execute bit, which blocked the
      # public-IP write under this container's drop-ALL caps (docs/docs/apps/imgur-proxy.md).
      gluetun-tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Mi
        advancedMounts:
          imgur-proxy:
            gluetun:
              - path: /tmp/gluetun
