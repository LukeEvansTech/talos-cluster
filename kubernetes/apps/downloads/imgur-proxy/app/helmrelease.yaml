---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: imgur-proxy
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: imgur-proxy
  values:
    controllers:
      imgur-proxy:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            nameOverride: nginx
            image:
              repository: docker.io/library/nginx
              tag: 1.31-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
            command:
              - "nginx"
            args:
              - "-g"
              - "daemon off;"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8443
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              runAsUser: 101
              runAsGroup: 101
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - "ALL"
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                memory: 128Mi
        initContainers:
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            env:
              # gluetun blocks malicious domains at its DNS layer by default.
              # That is dead weight here and nowhere else: nginx below runs
              # `resolver 127.0.0.1` and its SNI map drops anything that is
              # not .imgur.com before a connection is opened, so the only
              # lookups this resolver ever sees are imgur hostnames. Turning
              # it off also removes the blocklist download, the likeliest
              # cause of the startup memory spike that OOMKilled this
              # container against its (previously 256Mi) limit.
              BLOCK_MALICIOUS: off
              DOT: "on"
              DOT_CACHING: "on"
              DOT_IPV6: off
              FIREWALL: true
              FIREWALL_DEBUG: on
              # nginx (8443) + gluetun health server (9999)
              FIREWALL_INPUT_PORTS: "8443,9999"
              FIREWALL_OUTBOUND_SUBNETS: '"${CLUSTER_PODS_CIDR},${CLUSTER_SVCS_CIDR},${CR_LAN_CIDR},${GH_LAN_CIDR}"'
              HEALTH_SERVER_ADDRESS: ":9999"
              HEALTH_SERVER_DISABLE_LOOP: on
              HEALTH_VPN_DURATION_INITIAL: 60s
              LOG_LEVEL: info
              # Run as root (0) rather than gluetun's default 1000. gluetun
              # chowns the public-IP status file to PUID:PGID after every
              # write (internal/publicip/fs.go), and this container drops ALL
              # capabilities, so a 0 -> 1000 chown fails EPERM without
              # CAP_CHOWN. Chowning to the existing owner is a permitted
              # no-op, which keeps the drop-ALL context intact. Only the
              # unused OpenVPN process user is otherwise derived from PUID
              # (this tunnel is WireGuard), so nothing else is affected.
              PGID: 0
              # Public IP check provider. gluetun only accepts "ipinfo" or
              # "ip2location"; ipinfo rate-limits (HTTP 429) on its free monthly
              # tier, so use ip2location for the (cosmetic) public-IP display.
              # https://github.com/qdm12/gluetun-wiki/blob/main/setup/options/others.md
              PUBLICIP_API: ip2location
              PUID: 0 # see PGID above
              TZ: ${TIMEZONE}
              UPDATER_PERIOD: 12h
              VERSION_INFORMATION: off
              VPN_INTERFACE: wg0
              VPN_IPV6_SERVER: off
              VPN_TYPE: wireguard
            # WireGuard creds + exit location come from the per-app
            # `gluetun-imgur-proxy` 1Password item (its own AirVPN device key /
            # internal IP, SERVER_COUNTRIES=Netherlands), merged into
            # imgur-proxy-secret by the ExternalSecret.
            envFrom:
              - secretRef:
                  name: imgur-proxy-secret
            # Both probes are disabled, matching the gluetun sidecars in
            # qbittorrent / sabnzbd / prowlarr. A kubelet probe on the health
            # server restarts the *container*, but gluetun keeps the pod's
            # network namespace across container restarts and re-appends its
            # firewall rules on every start. One transient tunnel failure
            # therefore becomes self-sustaining: probe 500 -> restart ->
            # more accumulated netns state -> slower/failed start -> probe
            # 500. This container sat in exactly that loop for 4+ days and
            # 1352 restarts, ending in OOMKills against the limit below, and
            # only a pod recreation could break it. gluetun's own internal
            # healthcheck loop already restarts the *tunnel* in-process on
            # failure, which recovers the same faults without touching the
            # netns, so the kubelet probe adds a failure mode without adding
            # a recovery path.
            probes:
              liveness:
                enabled: false
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  timeoutSeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              startup:
                enabled: false
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 30
            restartPolicy: Always
            # gluetun shares the pod netns across container restarts, so an
            # abrupt exit leaves an orphaned policy-routing rule for the
            # wireguard table. The next start then fails with
            # "adding ip rule 101 ... table 51820: file exists" and never
            # connects. Clear stale v4/v6 rules on (re)start so gluetun can
            # re-add them cleanly. See gluetun-wiki setup/advanced/kubernetes.
            lifecycle:
              postStart:
                exec:
                  command:
                    - "/bin/sh"
                    - "-c"
                    - "(ip rule del table 51820; ip -6 rule del table 51820) || true"
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
              capabilities:
                add:
                  - "NET_ADMIN"
                drop:
                  - "ALL"
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                # Steady state is ~26Mi and the highest figure cAdvisor ever
                # sampled in 7 days is ~86Mi, but this container still
                # OOMKilled 240+ times at 256Mi: the spike lands ~2s into
                # startup and dies inside one scrape interval, so it is
                # invisible to sampling and cannot be sized from metrics.
                # BLOCK_MALICIOUS: off above should remove it; this is the
                # belt to that pair of braces, since the 7MB servers.json
                # parse is an unmeasured second candidate. The other three
                # gluetun sidecars set no memory limit at all.
                memory: 512Mi
                kernel.org/tun: 1
        pod:
          labels:
            gluetun: "true"
    defaultPodOptions:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
    service:
      app:
        controller: imgur-proxy
        type: LoadBalancer
        annotations:
          # Pin the LB IP from the Cilium pool. Add SVC_IMGUR_PROXY_ADDR
          # to cluster-secrets in 1Password before applying.
          lbipam.cilium.io/ips: ${SVC_IMGUR_PROXY_ADDR}
        # externalTrafficPolicy: Cluster (default) — Cilium L2 picks any
        # node as announcer; with Local the announcer must coincide with
        # the pod's node, which Cilium L2 doesn't currently guarantee
        # (announcer is hash-selected from the policy's nodeSelector).
        # Source IP visibility isn't useful here — the proxy is
        # SNI-allowlisted and doesn't do per-client policy.
        externalTrafficPolicy: Cluster
        ports:
          https:
            port: 443
            targetPort: 8443
            protocol: TCP
    configMaps:
      nginx:
        data:
          nginx.conf: |
            pid /tmp/nginx.pid;
            worker_processes auto;
            error_log /dev/stderr warn;

            events {
              worker_connections 1024;
            }

            stream {
              # gluetun runs an in-pod DOT proxy on 127.0.0.1:53 (default
              # behaviour with DOT=on). It forwards encrypted DNS over the
              # WireGuard tunnel to gluetun's configured DOT upstreams, so
              # lookups are authenticated end-to-end (DOT cert verified)
              # and never traverse cluster DNS (which would loop back to
              # this proxy's own IP via the OPNsense local-zone redirect).
              resolver 127.0.0.1 valid=10s ipv6=off;
              resolver_timeout 5s;

              log_format basic '$$remote_addr [$$time_local] sni=$$ssl_preread_server_name upstream=$$upstream sent=$$bytes_sent recv=$$bytes_received session=$$session_time';
              access_log /dev/stdout basic;

              # SNI allowlist: leading-dot `.imgur.com` matches the apex
              # AND any subdomain in nginx's `hostnames;` map syntax.
              # Empty default drops other SNI (open-relay protection — only
              # Imgur-owned hosts are relayed).
              map $$ssl_preread_server_name $$upstream {
                hostnames;
                .imgur.com   $$ssl_preread_server_name;
                default      "";
              }

              server {
                listen 8443;
                ssl_preread on;

                proxy_connect_timeout 5s;
                proxy_timeout 60s;

                proxy_pass $$upstream:443;
              }
            }
    persistence:
      nginx-config:
        type: configMap
        identifier: nginx
        globalMounts:
          - path: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        globalMounts:
          - path: /tmp
      var-cache-nginx:
        type: emptyDir
        medium: Memory
        sizeLimit: 16Mi
        advancedMounts:
          imgur-proxy:
            app:
              - path: /var/cache/nginx
      var-run:
        type: emptyDir
        medium: Memory
        sizeLimit: 4Mi
        advancedMounts:
          imgur-proxy:
            app:
              - path: /var/run
      gluetun-data:
        type: emptyDir
        sizeLimit: 16Mi
        advancedMounts:
          imgur-proxy:
            gluetun:
              - path: /gluetun
      # gluetun creates its status directory with os.MkdirAll("/tmp/gluetun",
      # 0644), a directory with no execute bit, so nothing can traverse into
      # it without CAP_DAC_OVERRIDE (cmd/gluetun/main.go). The other gluetun
      # sidecars in this namespace only survive that because they keep root's
      # default capability set; this one drops ALL, so writing the public-IP
      # file failed with "clearing public IP data: open /tmp/gluetun/ip:
      # permission denied" on every tunnel teardown. Pre-creating the path as
      # an emptyDir (mode 1777) makes gluetun's MkdirAll a no-op and keeps the
      # mode sane, with no capability grant. Nested under the `tmp` mount
      # above; the kubelet orders nested mounts by path.
      gluetun-tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Mi
        advancedMounts:
          imgur-proxy:
            gluetun:
              - path: /tmp/gluetun
