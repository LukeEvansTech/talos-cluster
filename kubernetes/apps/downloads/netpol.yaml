---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cross-namespace-ingress
spec:
  description: "Allow ingress from gateway, media (arr apps)"
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
        - matchLabels:
            io.kubernetes.pod.namespace: media
    - fromEntities:
        - world
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-arr-mcp-from-ai
spec:
  # The `arr` ToolHive MCP server (ai namespace) queries Prowlarr over its API.
  # Additive to the namespace-wide policy above (Cilium unions allows), scoped to
  # the prowlarr endpoint and to the arr MCP pod as the source. Prowlarr runs
  # behind a gluetun sidecar whose firewall already admits cluster ingress on :80.
  description: "Allow the arr MCP server (ai) to reach prowlarr"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            toolhive-name: arr
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-arrmcp-from-ai
spec:
  # The `arrmcp` app (ai namespace) queries Prowlarr and SABnzbd over their
  # APIs. Both run behind a gluetun sidecar whose firewall already admits
  # cluster ingress on their API port. qBittorrent is not listed because
  # arr-mcp cannot authenticate to qBittorrent 5.2.x — see the note in the
  # arrmcp ExternalSecret; add it back alongside that config block.
  description: "Allow the arrmcp app (ai) to reach prowlarr/sabnzbd"
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - prowlarr
          - sabnzbd
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: arrmcp
