---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: smtp2graph
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: smtp2graph
  values:
    controllers:
      smtp2graph:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: smtp2graph/smtp2graph
              tag: v1.1.5@sha256:88ef2015f37ad460d7cc06fa80cf82a0318108ae696dac61a2896d5016d9545d
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
          # smtp2graph has no metrics of its own; this sidecar reads the queue
          # and canaries delivery end to end (Aug 2026 outage, docs/apps/smtp2graph.md).
          metrics:
            image:
              repository: python
              tag: 3.14-alpine@sha256:9e9fde4d32eedce0b661d9ab91e826b62dddf28e928c230ec55f1866cac66b01
            command:
              - "python"
              - "-u"
              - "/opt/exporter/exporter.py"
            # Container port, not a second Service: app-template renames the existing
            # one when there is more than one, breaking every in-cluster consumer.
            ports:
              - name: metrics
                containerPort: 9184
                protocol: TCP
            env:
              MAILROOT: /data/mailroot
              METRICS_PORT: "9184"
              SMTP_HOST: 127.0.0.1
              SMTP_PORT: "25"
              CANARY_ENABLED: "true"
              # Real mail to CANARY_TO, filtered by a mailbox rule. Shorter interval trades
              # more mail for faster detection.
              CANARY_INTERVAL_SECONDS: "21600"
              CANARY_TIMEOUT_SECONDS: "180"
              # Must be in allowedFrom (externalsecret.yaml), or the canary false-pages an outage.
              CANARY_FROM: noreply@${SECRET_DOMAIN}
              CANARY_TO: operations@${SECRET_DOMAIN}
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /metrics, port: 9184 }
                  initialDelaySeconds: 20
                  periodSeconds: 60
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /metrics, port: 9184 }
                  initialDelaySeconds: 10
                  periodSeconds: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: smtp.${SECRET_DOMAIN}
          io.cilium/lb-ipam-ips: ${SVC_SMTP_RELAY_ADDR}
        # No externalTrafficPolicy: Local (client IP is irrelevant here); one replica means
        # the Cilium L2 lease can land on a node without the pod, dropping every connection.
        ports:
          smtp:
            port: 25
    persistence:
      # WORKDIR /data: config.yml plus the disk queue (queue/ temp/ failed/), an emptyDir
      # like the maddy relay uses, which is durable enough at estate volume.
      # advancedMounts, not globalMounts: the metrics sidecar must not see client.key.
      data:
        type: emptyDir
        advancedMounts:
          smtp2graph:
            app:
              - path: /data
            metrics:
              - path: /data
                readOnly: true
      config:
        type: secret
        name: smtp2graph-secret
        advancedMounts:
          smtp2graph:
            app:
              - path: /data/config.yml
                subPath: config.yml
                readOnly: true
              - path: /secrets/client.key
                subPath: client.key
                readOnly: true
      exporter:
        type: configMap
        name: smtp2graph-exporter
        advancedMounts:
          smtp2graph:
            metrics:
              - path: /opt/exporter/exporter.py
                subPath: exporter.py
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
