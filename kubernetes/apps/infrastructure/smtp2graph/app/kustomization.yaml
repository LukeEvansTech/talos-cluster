---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./externalsecret.yaml
  - ./podmonitor.yaml
  - ./prometheusrule.yaml
  - ./grafanadashboard.yaml
configMapGenerator:
  # Real files, not inline YAML, so both lint and the exporter is unit-testable.
  - name: smtp2graph-exporter
    files:
      - exporter.py=./exporter/exporter.py
  - name: smtp2graph-dashboard
    files:
      - smtp2graph.json=./dashboards/smtp2graph.json
generatorOptions:
  # Stable names: reloader.stakater.com/auto restarts on content change, no new name needed.
  disableNameSuffixHash: true
  annotations:
    # Keeps Grafana's ${DS_PROMETHEUS} macro from being blanked by Flux postBuild substitution.
    kustomize.toolkit.fluxcd.io/substitute: disabled
