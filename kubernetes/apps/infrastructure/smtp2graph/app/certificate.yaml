---
# Publicly trusted, so clients verify it with stock roots. Clients must connect by this name
# (the Service's external-dns name), not the in-cluster Service name.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: smtp2graph-tls
spec:
  secretName: smtp2graph-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - smtp.${SECRET_DOMAIN}
