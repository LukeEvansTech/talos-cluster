---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
# PodMonitor, not ServiceMonitor: a second Service would make app-template rename
# smtp2graph's, breaking every in-cluster consumer and the LoadBalancer VIP.
#
# prometheus-operator matches podMetricsEndpoints[].port by name; helmrelease.yaml
# names the container port `metrics`, since a bare number resolves no target.
#
# No `release: kube-prometheus-stack` label; this cluster's Prometheus selects
# monitors without it.
kind: PodMonitor
metadata:
  name: &app smtp2graph
  labels:
    app.kubernetes.io/name: *app
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  namespaceSelector:
    matchNames:
      - infrastructure
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 10s
