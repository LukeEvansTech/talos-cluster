---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextdns-linkip
  namespace: infrastructure
spec:
  schedule: "0 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Reaping after 24h clears KubeJobFailed, which stays pinned until the Job object is gone.
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: nextdns-linkip
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          containers:
            - name: wget
              image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
              command:
                - "/bin/sh"
                - "-c"
                - "wget -q -O - $(cat /secrets/NEXTDNS_URL)"
              volumeMounts:
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: secrets
              secret:
                secretName: nextdns-linkip-secret
          securityContext:
            seccompProfile:
              type: RuntimeDefault
