---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextdns-linkip
  namespace: infrastructure
spec:
  # Run every hour at minute 0
  schedule: "0 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Reap finished jobs after 24h so a failed run cannot pin KubeJobFailed
      # (the alert clears only when the Job object is gone)
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: nextdns-linkip
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          containers:
            - name: wget
              image: docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
              command:
                - "/bin/sh"
                - "-c"
                - "wget -q -O - $(cat /secrets/NEXTDNS_URL)"
              volumeMounts:
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: secrets
              secret:
                secretName: nextdns-linkip-secret
          securityContext:
            seccompProfile:
              type: RuntimeDefault
