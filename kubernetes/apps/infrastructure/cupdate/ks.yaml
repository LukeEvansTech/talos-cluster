---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cupdate
  namespace: &namespace infrastructure
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/homepage
  interval: 1h
  path: ./kubernetes/apps/infrastructure/cupdate/app
  postBuild:
    substitute:
      APP: *app
      HOMEPAGE_NAME: Cupdate
      HOMEPAGE_GROUP: Infrastructure
      HOMEPAGE_ICON: mdi-update
      HOMEPAGE_DESCRIPTION: Container updates
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
