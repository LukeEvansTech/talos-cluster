---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: certwarden
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: certwarden
  values:
    controllers:
      certwarden:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          install-tools:
            image:
              repository: docker.io/library/alpine
              tag: 3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
            command:
              - sh
              - -c
              - |
                set -e

                # Install curl for kubectl download
                echo "Installing curl..."
                apk add --no-cache curl

                # Install kubectl
                echo "Installing kubectl..."
                curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
                chmod +x kubectl
                mv kubectl /shared-bin/

                echo "Installation complete!"
                ls -la /shared-bin/
        serviceAccount:
          identifier: certwarden
        containers:
          app:
            image:
              repository: ghcr.io/gregtwallace/certwarden
              tag: v0.31.0@sha256:0db81a87e9679430c2e7fe4600b205371f0c17c42c040cca4f293b492254ec36
            env:
              - name: PATH
                value: "/shared-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 2Gi
    defaultPodOptions:
      # kubectl needs its own RBAC: app-template disables automountServiceAccountToken by
      # default, which would strand kubectl on localhost:8080 for the post-process scripts.
      automountServiceAccountToken: true
    service:
      app:
        controller: certwarden
        ports:
          http:
            port: 4050
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    serviceAccount:
      certwarden: {}
    persistence:
      data:
        enabled: true
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      shared-bin:
        type: emptyDir
        globalMounts:
          - path: /shared-bin
      # Supermicro IPMI post-process scripts
      supermicro-scripts:
        type: configMap
        name: certwarden-supermicro-scripts
        defaultMode: 0755
        globalMounts:
          - path: /app/scripts/supermicro
      # APC post-process scripts
      apc-scripts:
        type: configMap
        name: certwarden-apc-scripts
        defaultMode: 0755
        globalMounts:
          - path: /app/scripts/apc
      # Brother printer post-process scripts
      brother-scripts:
        type: configMap
        name: certwarden-brother-scripts
        defaultMode: 0755
        globalMounts:
          - path: /app/scripts/brother
      # Core switch post-process scripts
      onyx-scripts:
        type: configMap
        name: certwarden-onyx-scripts
        defaultMode: 0755
        globalMounts:
          - path: /app/scripts/onyx
