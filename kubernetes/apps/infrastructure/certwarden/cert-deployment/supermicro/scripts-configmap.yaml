---
apiVersion: v1
data:
  certwarden-supermicro-deploy.sh: |
    #!/bin/bash
    #
    # Certwarden Post-Process Script for Supermicro IPMI Certificate Deployment (CONTAINERIZED)
    #
    # This script is called by Certwarden after certificate renewal.
    # It creates a Kubernetes Job to deploy the certificate to the Supermicro IPMI host.
    # Uses the pre-built ghcr.io/lukeevanstech/supermicro-ipmi-cert container.
    #
    # Environment variables from Certwarden:
    #   CERTIFICATE_NAME - Name of the certificate
    #   CERTIFICATE_PEM - Certificate data (PEM format)
    #   PRIVATE_KEY_PEM - Private key data (PEM format)
    #   SUPERMICRO_HOST - Custom env var: Supermicro IPMI host identifier (e.g., cr-storage-ipmi)
    #   NAMESPACE - Optional: Kubernetes namespace (default: infrastructure)
    #

    set -euo pipefail

    # Debug output to stderr (Certwarden captures this)
    echo "DEBUG: Containerized script started at $(date)" >&2
    echo "DEBUG: Environment variables:" >&2
    env | grep -E "(SUPERMICRO|CERTIFICATE|PRIVATE|NAMESPACE)" | sort >&2 || echo "DEBUG: No matching env vars" >&2
    echo "DEBUG: Working directory: $(pwd)" >&2
    echo "DEBUG: User: $(whoami)" >&2
    echo "DEBUG: Script path: $0" >&2

    # Validate required environment variables FIRST (before using them with set -u)
    if [[ -z "${SUPERMICRO_HOST:-}" ]]; then
        echo "ERROR: SUPERMICRO_HOST environment variable is required"
        exit 1
    fi

    if [[ -z "${CERTIFICATE_PEM:-}" ]]; then
        echo "ERROR: CERTIFICATE_PEM not provided by Certwarden"
        exit 1
    fi

    if [[ -z "${PRIVATE_KEY_PEM:-}" ]]; then
        echo "ERROR: PRIVATE_KEY_PEM not provided by Certwarden"
        exit 1
    fi

    # Now safe to use variables with set -u
    NAMESPACE="${NAMESPACE:-infrastructure}"
    SECRET_NAME="supermicro-${SUPERMICRO_HOST}"

    echo "=== Certwarden Supermicro Certificate Deployment (CONTAINERIZED) ==="
    echo "Certificate: ${CERTIFICATE_NAME:-unknown}"
    echo "Target Supermicro: ${SUPERMICRO_HOST}"
    echo "Namespace: ${NAMESPACE}"
    echo "Container: ghcr.io/lukeevanstech/supermicro-ipmi-cert:0.3.0@sha256:ef57ea05e2ff7f4136b4015327f18929d1e9c387fb53f24d9a41fec4a851aaa7"

    # Create a unique job name with timestamp
    JOB_NAME="supermicro-cert-deploy-${SUPERMICRO_HOST}-$(date +%s)"

    # Create a temporary secret for the certificate
    CERT_SECRET_NAME="${JOB_NAME}-cert"
    echo "Creating temporary secret: ${CERT_SECRET_NAME}"

    kubectl create secret generic "${CERT_SECRET_NAME}" \
        -n "${NAMESPACE}" \
        --from-literal=cert.pem="${CERTIFICATE_PEM}" \
        --from-literal=key.pem="${PRIVATE_KEY_PEM}"

    # The Secret is adopted by the Job further down, once the Job exists and has
    # a UID to point at. It cannot be created with an ownerReference here
    # because the owner does not exist yet, and a stale/incorrect ownerReference
    # would have the Secret garbage-collected immediately.

    # Create the deployment Job
    echo "Creating deployment Job: ${JOB_NAME}"
    cat <<EOF | kubectl apply -f -
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: ${JOB_NAME}
      namespace: ${NAMESPACE}
      labels:
        app.kubernetes.io/name: certwarden-supermicro-deploy
        app.kubernetes.io/instance: ${SUPERMICRO_HOST}
        deployment-method: container
    spec:
      ttlSecondsAfterFinished: 300
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: certwarden
          restartPolicy: Never
          containers:
            - name: supermicro-deploy
              image: ghcr.io/lukeevanstech/supermicro-ipmi-cert:0.3.0@sha256:cc0d59d258ebe21f7e0b656cdeec4cd387ef5fc2c16645db163b6fbb18aa9444
              command:
                - sh
                - -c
                - |
                  set -e

                  # Read IPMI configuration from secret
                  export IPMI_URL=\$(kubectl get secret ${SECRET_NAME} -n ${NAMESPACE} -o jsonpath='{.data.IPMI_URL}' | base64 -d)
                  export IPMI_MODEL=\$(kubectl get secret ${SECRET_NAME} -n ${NAMESPACE} -o jsonpath='{.data.IPMI_MODEL}' | base64 -d)
                  export IPMI_USERNAME=\$(kubectl get secret ${SECRET_NAME} -n ${NAMESPACE} -o jsonpath='{.data.IPMI_USERNAME}' | base64 -d)
                  export IPMI_PASSWORD=\$(kubectl get secret ${SECRET_NAME} -n ${NAMESPACE} -o jsonpath='{.data.IPMI_PASSWORD}' | base64 -d)

                  echo "=== IPMI Configuration ==="
                  echo "IPMI URL: \${IPMI_URL}"
                  echo "IPMI Model: \${IPMI_MODEL}"
                  echo "IPMI Username: \${IPMI_USERNAME}"

                  echo "=== Deploying certificate using containerized approach ==="
                  python3 /app/supermicro_ipmi_cert.py \\
                    --ipmi-url "\${IPMI_URL}" \\
                    --model "\${IPMI_MODEL}" \\
                    --username "\${IPMI_USERNAME}" \\
                    --password "\${IPMI_PASSWORD}" \\
                    --cert-file /certs/cert.pem \\
                    --key-file /certs/key.pem \\
                    --debug
              volumeMounts:
                - name: certs
                  mountPath: /certs
          volumes:
            - name: certs
              secret:
                secretName: ${CERT_SECRET_NAME}
    EOF

    # Make the Job the owner of the cert Secret so the two are deleted together.
    #
    # This is the step that was missing. The comment above the secret creation
    # used to claim ownerReferences handled cleanup, but nothing ever set one:
    # ttlSecondsAfterFinished removed the Job while the Secret — which holds the
    # certificate's PRIVATE KEY — stayed in the namespace forever. Every renewal
    # since the first deployment left one behind; 40 had accumulated by
    # 2026-07-31 and were cleared out alongside this fix.
    #
    # blockOwnerDeletion is false so the Secret can never hold up deletion of
    # the Job, and a failure here is not fatal: the deployment itself has
    # already been submitted, and a Secret that outlives its Job is the old
    # (bad) behaviour rather than a new one.
    echo "Binding Secret ${CERT_SECRET_NAME} to Job ${JOB_NAME} for cleanup"
    JOB_UID=$(kubectl get job "${JOB_NAME}" -n "${NAMESPACE}" -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
    if [[ -n "${JOB_UID}" ]]; then
        kubectl patch secret "${CERT_SECRET_NAME}" -n "${NAMESPACE}" --type merge -p \
            "{\"metadata\":{\"ownerReferences\":[{\"apiVersion\":\"batch/v1\",\"kind\":\"Job\",\"name\":\"${JOB_NAME}\",\"uid\":\"${JOB_UID}\",\"controller\":false,\"blockOwnerDeletion\":false}]}}" \
            || echo "WARNING: could not set ownerReference on ${CERT_SECRET_NAME}; it will need manual cleanup"
    else
        echo "WARNING: could not read Job UID; ${CERT_SECRET_NAME} will need manual cleanup"
    fi

    # Wait for the Job to reach a terminal condition (Complete or Failed).
    # kubectl wait --for=condition=complete ignores Failed, so on a fast pod
    # failure it would block the full --timeout instead of surfacing the real
    # error. Poll both conditions explicitly so failures are caught quickly.
    echo "Waiting for Job to complete..."
    JOB_TIMEOUT=300
    DEADLINE=$(( $(date +%s) + JOB_TIMEOUT ))
    JOB_RESULT=""
    while [[ $(date +%s) -lt ${DEADLINE} ]]; do
        COMPLETE=$(kubectl get job "${JOB_NAME}" -n "${NAMESPACE}" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
        FAILED=$(kubectl get job "${JOB_NAME}" -n "${NAMESPACE}" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
        if [[ "${COMPLETE}" == "True" ]]; then
            JOB_RESULT="complete"
            break
        fi
        if [[ "${FAILED}" == "True" ]]; then
            JOB_RESULT="failed"
            break
        fi
        sleep 5
    done

    # Always dump pod logs so Certwarden captures them on success and failure
    echo "=== Job Logs ==="
    kubectl logs "job/${JOB_NAME}" -n "${NAMESPACE}" --all-containers --tail=-1 || true

    case "${JOB_RESULT}" in
        complete)
            echo "✅ Certificate deployed successfully to ${SUPERMICRO_HOST} (containerized)"
            exit 0
            ;;
        failed)
            echo "❌ Failed to deploy certificate to ${SUPERMICRO_HOST} (containerized)"
            exit 1
            ;;
        *)
            echo "❌ Job did not reach a terminal state within ${JOB_TIMEOUT}s on ${SUPERMICRO_HOST}"
            exit 1
            ;;
    esac
kind: ConfigMap
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  creationTimestamp: null
  name: certwarden-supermicro-scripts
  namespace: infrastructure
