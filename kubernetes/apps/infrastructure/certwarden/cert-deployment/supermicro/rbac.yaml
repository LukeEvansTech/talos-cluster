---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: certwarden
  namespace: infrastructure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: certwarden-supermicro-deployer
  namespace: infrastructure
rules:
  - apiGroups:
      - "batch"
    resources:
      - "jobs"
    verbs:
      - "create"
      - "get"
      - "list"
      - "watch"
      - "delete"
  - apiGroups:
      - ""
    resources:
      - "pods"
      - "pods/log"
    verbs:
      - "get"
      - "list"
  # "patch" sets the ownerReference binding a temporary cert Secret to its Job,
  # so the two are garbage-collected together.
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "create"
      - "get"
      - "list"
      - "patch"
      - "delete"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: certwarden-supermicro-deployer
  namespace: infrastructure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: certwarden-supermicro-deployer
subjects:
  - kind: ServiceAccount
    name: certwarden
    namespace: infrastructure
