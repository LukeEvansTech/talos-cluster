---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# A bare dataFrom.extract left required keys empty ('APC_HOSTNAME is empty', #4052).
# APC_FINGERPRINT is the NMC's SSH host key; APC_INSECURE_CIPHER enables legacy ciphers.
# Fingerprint retrieval command: docs/docs/apps/certwarden.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apc-cr-ups-main
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: apc-cr-ups-main
    template:
      data:
        APC_HOSTNAME: "{{ .IP_Address }}"
        APC_USERNAME: "{{ .username }}"
        APC_PASSWORD: "{{ .password }}"
        APC_FINGERPRINT: "{{ .APC_FINGERPRINT }}"
        APC_INSECURE_CIPHER: "{{ .APC_INSECURE_CIPHER }}"
  dataFrom:
    - extract:
        key: cr-ups-main
