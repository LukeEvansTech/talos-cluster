---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cross-namespace-ingress
spec:
  description: "Allow ingress from gateway, cluster workloads (smtp2graph consumers) and external clients (vlmcsd, off-cluster smtp)"
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
    - fromEntities:
        - cluster
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-world-ingress-smtp2graph
spec:
  description: "Allow world ingress only to the pods behind this namespace's LoadBalancer services"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: smtp2graph
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-world-ingress-vlmcsd
spec:
  description: "Allow world ingress only to the pods behind this namespace's LoadBalancer services"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vlmcsd
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "1688"
              protocol: TCP
