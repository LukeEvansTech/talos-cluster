---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tuppr
  values:
    replicaCount: 2
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      # 768Mi (not 512Mi): steady state is ~320Mi, but on an apiserver
      # reconnect all informers re-LIST at once (Secrets/Pods/Nodes) and the
      # resync spike OOMKilled the follower at 512Mi. This headroom absorbs it.
      limits:
        memory: 768Mi
    # Hold Alertmanager silences while an upgrade run is in flight. This only
    # configures how the operator reaches Alertmanager; which alerts each run
    # silences is authored per-resource in upgrades/talosupgrade.yaml.
    #
    # The silence is a short lease re-extended on every reconcile, so it lapses
    # on its own if the controller stops driving the run — a crashed operator
    # un-silences rather than leaving the estate permanently muted.
    silences:
      enabled: true
      alertmanager:
        address: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
    monitoring:
      serviceMonitor:
        enabled: true
      # Keep our hand-tuned rules in upgrades/prometheusrule.yaml (thresholds
      # tuned to our tuppr powercycle/stuck-reboot history) instead of the chart's.
      prometheusRule:
        enabled: false
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
