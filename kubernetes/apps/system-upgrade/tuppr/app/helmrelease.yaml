---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tuppr
  values:
    replicaCount: 2
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      # 768Mi, not 512Mi: an apiserver-reconnect informer re-LIST spike OOMKilled the follower
      # at 512Mi. See docs/docs/operations/upgrade-playbooks.md (tuppr section).
      limits:
        memory: 768Mi
    # Only configures how the operator reaches Alertmanager; which alerts a run silences is
    # authored per-resource in upgrades/talosupgrade.yaml. The silence is a lease re-extended
    # each reconcile, so a crashed operator un-silences rather than muting the estate for good.
    silences:
      enabled: true
      alertmanager:
        address: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
    monitoring:
      serviceMonitor:
        enabled: true
      # upgrades/prometheusrule.yaml holds hand-tuned rules from this cluster's
      # powercycle/stuck-reboot history instead of the chart's defaults.
      prometheusRule:
        enabled: false
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
