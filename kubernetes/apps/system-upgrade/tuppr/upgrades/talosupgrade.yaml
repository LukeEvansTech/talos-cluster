---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=custom.talos-factory depName=siderolabs/talos
    version: v1.14.1
  policy:
    rebootMode: default
  # Drain-first, one-node-at-a-time mitigates the shutdown-time unmount stall that wedges a
  # node half-down and needs an IPMI reset (GH #2728); see docs/docs/apps/tuppr.md.
  drain:
    enabled: true
  # Silences alerts that are the expected consequence of a rolling reboot, never the ones
  # that say quorum is actually at risk; scope, exclusions and the maxDuration safety catch
  # are in docs/docs/apps/tuppr.md.
  silences:
    - maxDuration: 1h
      matchers:
        - name: alertname
          matchType: =~
          value: CephMonDown|CephOSDDown|CephOSDHostDown|CephHealthWarning|CephPGsUnclean|CephPGsInactive|CephFilesystemDegraded
    - maxDuration: 1h
      matchers:
        - name: alertname
          matchType: =~
          value: KubeNodeUnreachable|KubeNodeNotReady|KubeNodeReadinessFlapping|KubeletDown|TargetDown
  healthChecks:
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      expr: |-
        status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      expr: |-
        status.ceph.health in ['HEALTH_OK']
