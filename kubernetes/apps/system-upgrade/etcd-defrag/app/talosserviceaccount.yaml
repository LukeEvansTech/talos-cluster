---
# Mints a rotating talosconfig into Secret `etcd-defrag-talosconfig`. Talos allows this API only in
# the namespaces listed in machine.features.kubernetesTalosAPIAccess, which is why the app lives in
# system-upgrade; etcd defrag needs os:admin while os:operator is absent from allowedRoles.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-defrag-talosconfig
  namespace: system-upgrade
spec:
  roles:
    - os:admin
