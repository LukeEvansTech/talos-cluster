---
apiVersion: v1
kind: ConfigMap
metadata:
  name: etcd-defrag-script
  namespace: system-upgrade
data:
  defrag.sh: |-
    #!/bin/sh
    set -eu

    # Defragments every etcd member once any member's fragmentation passes the threshold.
    FRAG_THRESHOLD=35

    echo "etcd fragmentation check, threshold $${FRAG_THRESHOLD}%, started $(date -u)"

    # Members come from etcd itself, so no node address is kept in Git.
    if ! MEMBERS=$(talosctl -n "$HOST_IP" etcd members 2>&1); then
        echo "ERROR: etcd members failed: $MEMBERS" >&2
        exit 1
    fi
    NODES=$(echo "$MEMBERS" | grep -oE 'https://[0-9.]+:2379' | sed -E 's#https://([0-9.]+):2379#\1#' | sort -u)
    if [ -z "$NODES" ]; then
        echo "ERROR: no member client URL in the etcd members output" >&2
        exit 1
    fi

    get_fragmentation() {
        NODE="$1"
        # A failed query must fail the Job: reporting 0% hid an expired client
        # certificate for five days in November 2026.
        if ! STATUS=$(talosctl -n "$NODE" etcd status 2>&1); then
            echo "ERROR: etcd status failed on $NODE: $STATUS" >&2
            return 1
        fi
        # IN USE column looks like "164 MB (51.84%)"; fragmentation is the remainder.
        IN_USE_PCT=$(echo "$STATUS" | tail -1 | grep -oE '\([0-9.]+%\)' | tr -d '()%')
        if [ -z "$IN_USE_PCT" ]; then
            echo "ERROR: no in-use percentage in etcd status for $NODE" >&2
            return 1
        fi
        awk "BEGIN {printf \"%.0f\", 100 - $IN_USE_PCT}"
    }

    NEEDS_DEFRAG=false
    for NODE in $NODES; do
        FRAG=$(get_fragmentation "$NODE")
        echo "member $NODE: $${FRAG}% fragmentation"
        if [ "$FRAG" -gt "$FRAG_THRESHOLD" ]; then
            NEEDS_DEFRAG=true
        fi
    done

    if [ "$NEEDS_DEFRAG" != "true" ]; then
        echo "Fragmentation within limits, nothing to do"
        exit 0
    fi

    # One member at a time, so quorum never depends on a member that is mid-defrag.
    for NODE in $NODES; do
        echo "Defragmenting member $NODE"
        talosctl -n "$NODE" etcd defrag
        sleep 10
    done

    echo "Defragmentation complete, final status:"
    for NODE in $NODES; do
        talosctl -n "$NODE" etcd status
    done
