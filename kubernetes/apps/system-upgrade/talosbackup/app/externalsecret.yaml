---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talosbackup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: talosbackup-secret
    template:
      engineVersion: v2
      data:
        # Public key only: the private key is in the separate talosbackup-restore item, never read here.
        AGE_RECIPIENT_PUBLIC_KEY: "{{ .AGE_PUBLIC_KEY }}"
        RCLONE_S3_ACCESS_KEY_ID: "{{ .R2_ACCESS_KEY_ID }}"
        RCLONE_S3_SECRET_ACCESS_KEY: "{{ .R2_SECRET_ACCESS_KEY }}"
        RCLONE_S3_ENDPOINT: "{{ .R2_ENDPOINT }}"
        BUCKET: "{{ .R2_BUCKET }}"
  dataFrom:
    - extract:
        key: talosbackup
