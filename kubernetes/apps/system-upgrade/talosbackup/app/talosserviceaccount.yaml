---
# Mints a talosconfig limited to etcd snapshots into Secret `talosbackup-talosconfig`. The role must
# also be in machine.features.kubernetesTalosAPIAccess.allowedRoles on every control-plane node.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talosbackup-talosconfig
spec:
  roles:
    - os:etcd:backup
