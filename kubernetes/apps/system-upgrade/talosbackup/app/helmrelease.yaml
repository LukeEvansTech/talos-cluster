---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: talosbackup
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: talosbackup
  values:
    controllers:
      talosbackup:
        type: cronjob
        cronjob:
          schedule: "15 */6 * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        initContainers:
          # Sidero's talos-backup image is unsigned, so machine image verification rejects it; the
          # signed talosctl image takes the snapshot instead.
          snapshot:
            image:
              repository: ghcr.io/siderolabs/talosctl
              tag: v1.14.6@sha256:82c9a9985fc7292a222e680414c65955ac0566db588b84d88f620b05d16b1d5b
            env:
              HOST_IP:
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
            args:
              - --talosconfig=/var/run/secrets/talos.dev/config
              # The pod's own node: the nodeSelector below guarantees it runs etcd.
              - --nodes=$(HOST_IP)
              - etcd
              - snapshot
              - /backup/etcd.snapshot
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image:
              repository: docker.io/library/alpine
              tag: 3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
            command:
              - /bin/sh
              - -ec
              - |
                set -o pipefail
                apk add --no-cache --quiet age rclone
                obj="etcd/kubernetes-$(date -u +%Y%m%dT%H%M%SZ).snapshot.gz.age"
                gzip -c /backup/etcd.snapshot > /backup/etcd.snapshot.gz
                age -r "$AGE_RECIPIENT_PUBLIC_KEY" -o /backup/out.age /backup/etcd.snapshot.gz
                rclone copyto --s3-no-check-bucket /backup/out.age ":s3:$BUCKET/$obj"
                echo "uploaded $obj ($(wc -c < /backup/out.age) bytes)"
            env:
              RCLONE_S3_PROVIDER: Cloudflare
              RCLONE_S3_REGION: auto
            envFrom:
              - secretRef:
                  name: talosbackup-secret
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      securityContext:
        # apk needs root to install age and rclone at runtime, as in etcd-defrag.
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
    persistence:
      backup:
        type: emptyDir
        globalMounts:
          - path: /backup
      talosconfig:
        type: secret
        name: talosbackup-talosconfig
        globalMounts:
          - path: /var/run/secrets/talos.dev
            readOnly: true
