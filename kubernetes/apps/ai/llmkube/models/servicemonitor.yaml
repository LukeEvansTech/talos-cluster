---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llmkube-models
spec:
  selector:
    matchExpressions:
      - key: inference.llmkube.dev/service
        operator: Exists
  namespaceSelector:
    matchNames:
      - ai
  # Lets the llama-server dashboard filter by backend (app.kubernetes.io/instance).
  targetLabels:
    - app.kubernetes.io/instance
    - app.kubernetes.io/name
  endpoints:
    - port: http
      path: /metrics
  fallbackScrapeProtocol: PrometheusText0.0.4
