---
# Model: operator-managed HF repo source. The operator stages the GGUF and the
# mmproj projector into the shared llmkube-model-cache PVC (CephFS RWX) and
# passes the projector to the runtime itself — no staging Job, no hand-rolled
# --mmproj path.
#
# Qwen3.8-27B Heretic abliteration (0bserverx RVN refinement of the
# trohrbaugh heretic-ara pass): the "as close to vanilla as possible"
# uncensored build — KL divergence ~0.0085 vs the base model on harmless
# prompts, refusals 0–1/100, official Qwen3.8 chat template embedded. This is
# the cluster's ONLY GPU model: it serves both the `self-hosted` and
# `self-hosted-uncensored` LiteLLM aliases (see litellm/app/configmap.yaml).
#
# Base arch: dense 27B, hybrid Gated-DeltaNet linear attention (48/64 layers),
# native VLM, 262k native context, embedded MTP head (the -mtp file carries
# the nextn tensors, +0.42Gi). Only the 16 full-attention layers hold KV cache
# (~32KB/token at q8_0), which is what makes 128k affordable on a 24GB L4.
# Requires a llama.cpp build from release week (2026-08-14) or later — older
# builds don't register the qwen35 arch and refuse to load the GGUF.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3.8-27b-heretic
spec:
  source: hf://0bserverx/Qwen3.8-27B-Heretic-Abliterated-Uncensored-GGUF
  files:
    - RVN-Q4_K_S-multilingual-mtp.gguf
  mmproj: mmproj-Qwen3.8-27B-Q8_0.gguf
  format: gguf
  quantization: Q4_K_S
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
      layers: 99
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-nvidia
  labels:
    krr/ignore: "true"
spec:
  modelRef: qwen3.8-27b-heretic
  # Do NOT set skipModelInit here. It looks safe — the controller does stage the
  # GGUF (+ mmproj) into the shared cache PVC, so the model-downloader init
  # container only logs "already cached" — but on llmkube 0.9.x the flag ALSO
  # blanks the rendered `--model` arg, because the /models/<cacheKey>/ path is
  # derived from the init-container staging step. llama.cpp then starts in
  # router mode with zero models: the pod goes 1/1 Ready and every request fails
  # with "model not found". See #3792 (which set it) and the revert that
  # followed.
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:34fb4d3f822d3270fd780a9a28900ad5c0adfd86bbc5e9ec4eb84a53aeb743d3
  # Defer a pod-template rollout (e.g. a Renovate image bump) until llama.cpp's
  # own /slots endpoint reports both slots idle, instead of killing an
  # in-flight opencode/agent session mid-response. Falls back to proceeding
  # anyway after idleTimeoutSeconds so a genuinely stuck slot can't block
  # upgrades forever. Field verified present on this llmkube CRD version via
  # `kubectl explain inferenceservice.spec.rolloutPolicy` (crib:
  # joryirving/home-ops litellm/llama-strix.yaml).
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  runtimeClassName: nvidia
  priorityClassName: gpu-preemptible
  # VRAM budget on a 24GB L4 (~22.4Gi usable): 14.9Gi weights (Q4_K_S + MTP
  # head) + 0.6Gi mmproj projector (stays on the GPU — see the extraArgs
  # comment below for why --no-mmproj-offload is deliberately NOT used
  # here) + 3Gi KV (128k, K q8_0 + V q4_0; only 16/64 layers are full
  # attention) + compute buffers. With MTP on and q8/q8 KV the card sat at
  # 22.0/22.5Gi and the FIRST real prompt crashed llama-server with "CUDA
  # error: out of memory" in ggml_cuda_pool_vmm::alloc — the mul_mat compute
  # pool grows at decode time, so ~0.5Gi idle headroom is NOT enough; keep
  # ≥1.5Gi free. V-cache q4_0 buys 1Gi (K stays q8_0 — K quantization is the
  # recall-sensitive half) and uBatchSize 512 shrinks the CUDA compute
  # buffers for the rest, at a modest prompt-processing cost. Idle free
  # measured ~1.8Gi with the projector on the GPU and --kv-unified active
  # (2026-08-25) — still above the ≥1.5Gi floor.
  # 128k unified across the 2 parallelSlots (--kv-unified below) covers every
  # request — opencode's ~41k agent baseline included — the window the old
  # YaRN-extended uncensored model needed hacks for, with no YaRN and no
  # --override-kv. A single request may borrow the full 128k while the other
  # slot is idle, instead of a static 64k-per-slot split.
  contextSize: 131072
  parallelSlots: 2
  flashAttention: true
  jinja: true
  cacheTypeK: q8_0
  cacheTypeV: q4_0
  reasoningBudget: 16384
  reasoningBudgetMessage: "Stop reasoning and produce the final answer or tool call."
  batchSize: 4096
  uBatchSize: 512
  resources:
    gpu: 1
    # cpu bumped for --threads/--threads-batch below — still worth it for
    # prompt processing and tokenisation even with the mmproj projector back
    # on the GPU (see the extraArgs comment below).
    cpu: "6"
    memory: 20Gi
  nodeSelector:
    nvidia.com/gpu.present: "true"
  podLabels:
    llm-gpu-model: "true"
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              llm-gpu-model: "true"
  # No runAsNonRoot: the operator's model-cache-prep init container must run as
  # scoped root (drop ALL, add CHOWN+FOWNER only, no privesc, ro rootfs) to
  # chown the shared cache on fsGroupPolicy:None backends like CephFS — the
  # upstream-supported compatibility path (docs/MODEL-CACHE.md). Runtime
  # containers still run as 1000 via runAsUser below.
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  endpoint:
    port: 8080
    type: ClusterIP
  # NB: no manual --mmproj here — the operator injects the projector argument
  # from Model.spec.mmproj with the correct cache path.
  # Samplers are the vanilla Qwen3.8 thinking-mode recommendations
  # (temp 1.0 / top-p 0.95 / top-k 20 / min-p 0) — part of keeping the
  # abliterated build's behaviour as close to stock as possible.
  #
  # MTP self-speculative decoding: drafts with the nextn head embedded in
  # this GGUF and verifies with the main model — lossless (identical output
  # distribution), it only changes tokens/step. Baseline without it measured
  # 15.2 t/s decode on the L4; expect roughly +30–60% at typical ~0.75
  # acceptance. n-max 2 is the consumer-GPU sweet spot per the qwen38-mtp
  # recipe (tune 2–4); the gain shrinks as concurrent slots rise, which is
  # fine at 2 slots. Both flags verified against this image digest's --help.
  extraArgs:
    - --spec-type
    - draft-mtp
    - --spec-draft-n-max
    - "2"
    - --alias
    - self-hosted
    - --no-mmap
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0"
    - --cont-batching
    - --cache-prompt
    # Unified KV + threads tuning (crib: joryirving/home-ops
    # litellm/llama-nvidia.yaml) — but the mmproj projector stays on the GPU
    # here, deliberately NOT matching Jory's --no-mmproj-offload. That flag
    # was added in #4579 to move the projector to host RAM for ~0.6Gi more
    # VRAM headroom; post-merge measurement on 2026-08-25 showed the
    # tradeoff was wrong for this cluster — three vision requests against a
    # 64x64 image took 59.7s / 53.8s / 53.3s (correct answers, all CPU-bound
    # on the 1024-token image encode) versus low single-digit seconds with
    # the projector on the GPU. The `loupe` app depends on this vision path,
    # so latency wins over the 0.6Gi; see the VRAM-budget comment above for
    # the ~1.8Gi idle-free number measured with the projector back on the
    # GPU. --image-min-tokens 1024 (Jory's value) keeps vision quality
    # regardless of where the projector runs. --kv-unified lets one request
    # use the whole 128k context when the other slot is idle instead of a
    # hard 64k-per-slot ceiling; measured post-merge: /props reports
    # `default_generation_settings.n_ctx == 131072` (the full unified size,
    # not a per-slot share), and idle free VRAM is the ~1.8Gi above.
    # --threads/--threads-batch below (and the matching cpu: "6" request in
    # resources above) still help prompt processing and tokenisation even
    # with the projector back on the GPU, so they're kept. All flags
    # verified against this image digest's --help (llama.cpp server-cuda,
    # digest above; ran `llama-server --help` inside the live llama-nvidia
    # pod).
    - --image-min-tokens
    - "1024"
    - --kv-unified
    - --threads
    - "6"
    - --threads-batch
    - "12"
  probeOverrides:
    startup:
      httpGet: { path: /health, port: 8080 }
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet: { path: /health, port: 8080 }
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet: { path: /health, port: 8080 }
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
