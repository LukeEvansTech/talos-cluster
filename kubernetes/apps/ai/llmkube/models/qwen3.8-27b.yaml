---
# 0bserverx RVN Heretic-abliterated Qwen3.8-27B; the cluster's only GPU model, serving both
# self-hosted and self-hosted-uncensored (docs/docs/architecture/ai-llm-stack.md Model serving).
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3.8-27b-heretic
spec:
  source: hf://0bserverx/Qwen3.8-27B-Heretic-Abliterated-Uncensored-GGUF
  files:
    - RVN-Q4_K_S-multilingual-mtp.gguf
  mmproj: mmproj-Qwen3.8-27B-Q8_0.gguf
  format: gguf
  quantization: Q4_K_S
  hardware:
    accelerator: cuda
    gpu:
      enabled: true
      vendor: nvidia
      count: 1
      layers: 99
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-nvidia
  labels:
    krr/ignore: "true"
spec:
  modelRef: qwen3.8-27b-heretic
  # Never set skipModelInit: on llmkube 0.9.x it also blanks --model, serving zero models
  # (#3792; docs/docs/architecture/ai-llm-stack.md Rollout and staging safety).
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:883915ea20a4b350e98f7284098f4d400c21e9b366e248d397cd42d90602a84c
  # Waits for both /slots to go idle before rolling, instead of killing an in-flight session
  # (docs/docs/architecture/ai-llm-stack.md Rollout and staging safety).
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400
  replicas: 1
  runtimeClassName: nvidia
  priorityClassName: gpu-preemptible
  # VRAM budget: ≥1.5Gi must stay free after an OOM at 22.5Gi
  # (docs/docs/architecture/ai-llm-stack.md Resource budget on the L4).
  contextSize: 131072
  parallelSlots: 2
  flashAttention: true
  jinja: true
  cacheTypeK: q8_0
  cacheTypeV: q4_0
  reasoningBudget: 16384
  reasoningBudgetMessage: "Stop reasoning and produce the final answer or tool call."
  batchSize: 4096
  uBatchSize: 512
  resources:
    gpu: 1
    # Bumped for --threads/--threads-batch below; still help with the projector on the GPU.
    cpu: "6"
    memory: 20Gi
  nodeSelector:
    nvidia.com/gpu.present: "true"
  podLabels:
    llm-gpu-model: "true"
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              llm-gpu-model: "true"
        # Reciprocal of whisper's rule: its model can hold several GiB on its card, and this one
        # needs nearly all 24. Pod affinity is namespace-scoped, hence `namespaces`.
        - topologyKey: kubernetes.io/hostname
          namespaces:
            - "media"
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: whisper
      # Plex prefers to avoid this pod but nothing stopped a reschedule landing on Plex's card,
      # which would leave its transcodes about 1 GiB of VRAM.
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            namespaces:
              - "media"
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: plex
  # No runAsNonRoot: the cache-prep init container needs scoped root to chown CephFS
  # (docs/docs/architecture/ai-llm-stack.md Rollout and staging safety).
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  endpoint:
    port: 8080
    type: ClusterIP
  # No manual --mmproj: the operator injects it from Model.spec.mmproj with the correct cache path.
  # Samplers are the vanilla Qwen3.8 thinking-mode recommendations, to keep the abliterated build
  # close to stock. MTP decoding: docs/docs/architecture/ai-llm-stack.md Resource budget on the L4.
  extraArgs:
    - --spec-type
    - draft-mtp
    - --spec-draft-n-max
    - "2"
    - --alias
    - self-hosted
    # --load-mode replaces the removed --no-mmap/--mmap; "none" means not memory-mapped.
    - --load-mode
    - none
    - --temp
    - "1.0"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0"
    - --cont-batching
    - --cache-prompt
    # Projector stays on the GPU unlike Jory's --no-mmproj-offload; --kv-unified lets one request
    # use the full 128k window (docs/docs/architecture/ai-llm-stack.md Vision projector placement).
    - --image-min-tokens
    - "1024"
    - --kv-unified
    - --threads
    - "6"
    - --threads-batch
    - "12"
  probeOverrides:
    startup:
      httpGet: { path: /health, port: 8080 }
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet: { path: /health, port: 8080 }
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet: { path: /health, port: 8080 }
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
