---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: llmkube
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Shared cache so any node can serve any model without re-staging
    # (docs/docs/architecture/ai-llm-stack.md Model serving).
    modelCache:
      enabled: true
      mode: shared
      accessMode: ReadWriteMany
      storageClass: ceph-filesystem
      size: 100Gi
    prometheus:
      inferencePodMonitor:
        # Off: the llmkube-models ServiceMonitor already scrapes these pods.
        enabled: false
