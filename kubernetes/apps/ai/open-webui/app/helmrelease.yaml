---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: open-webui
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        # State is SQLite on a ReadWriteOnce ceph-block PVC, and upstream does
        # not support rolling updates across a schema migration. The chart
        # default (RollingUpdate) starts the new pod before the old one exits:
        # same node, both mount the RWO volume and two processes migrate one
        # webui.db; different node, the RBD attach is refused and the rollout
        # stalls. Recreate replaces the pod atomically instead.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
            env:
              # v0.11.0 starts the scheduler loop unconditionally and polls for
              # due timers before checking whether automations are enabled. The
              # query filters on three JSON_EXTRACT predicates over chat.meta
              # that no index can serve, so SQLite full-scans the chat table
              # every second even though timers are unused here. Cost grows
              # with chat history, not timer count. 30s is a straight trade of
              # timer latency for CPU; drop back to the default of 1 once the
              # upstream fix (open-webui#27663, unreleased) ships.
              - name: TIMER_POLL_INTERVAL
                value: "30"
              - name: ENABLE_OLLAMA_API
                value: "false"
              - name: OPENAI_API_BASE_URL
                value: http://litellm.ai.svc.cluster.local:4000/v1
              - name: OPENAI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: open-webui-secret
                    key: LITELLM_MASTER_KEY
              - name: ENABLE_RAG_WEB_SEARCH
                value: false
                # - name: RAG_WEB_SEARCH_ENGINE
                #   value: searxng
                # - name: SEARXNG_QUERY_URL
                #   value: http://searxng.default.svc.cluster.local:8080/search?q=<query>
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 2Gi
    service:
      app:
        controller: open-webui
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        enabled: true
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/backend/data
