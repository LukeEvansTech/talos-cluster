---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: open-webui
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        # SQLite on an RWO PVC can't take a rolling update across a schema migration:
        # RollingUpdate would either double-migrate one webui.db (same node) or stall
        # on a refused RBD attach (different node).
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
            env:
              # Works around a full-table scan in the always-on scheduler loop; revert to
              # the default of 1 once open-webui#27663 ships (docs/docs/apps/open-webui.md).
              - name: TIMER_POLL_INTERVAL
                value: "30"
              - name: ENABLE_OLLAMA_API
                value: "false"
              - name: OPENAI_API_BASE_URL
                value: http://litellm.ai.svc.cluster.local:4000/v1
              - name: OPENAI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-open-webui
                    key: api-key
              # Web search (RAG citations from live search results), backed by the in-cluster
              # SearXNG instance's JSON API. A PersistentConfig value already seeded false on
              # this PVC, so it needs enabling by hand too (docs/docs/apps/open-webui.md).
              - name: ENABLE_WEB_SEARCH
                value: "true"
              - name: WEB_SEARCH_ENGINE
                value: searxng
              - name: SEARXNG_QUERY_URL
                value: http://searxng.default.svc.cluster.local:8080/search?q=<query>
              - name: WEB_SEARCH_RESULT_COUNT
                value: "5"
              - name: WEB_SEARCH_CONCURRENT_REQUESTS
                value: "5"
              # RAG embeddings (web search + file upload) route through LiteLLM on the
              # all-minilm model (backend/open_webui/config.py:984,990,1080-1081).
              - name: RAG_EMBEDDING_ENGINE
                value: openai
              - name: RAG_EMBEDDING_MODEL
                value: all-minilm
              - name: RAG_OPENAI_API_BASE_URL
                value: http://litellm.ai.svc.cluster.local:4000/v1
              - name: RAG_OPENAI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-open-webui
                    key: api-key
              # Moves Socket.IO state onto Dragonfly, so websocket sessions survive the
              # Recreate rollout above instead of dropping on deploy (env.py:450,453,470).
              - name: ENABLE_WEBSOCKET_SUPPORT
                value: "true"
              - name: WEBSOCKET_MANAGER
                value: redis
              - name: WEBSOCKET_REDIS_URL
                valueFrom:
                  secretKeyRef:
                    name: open-webui-secret
                    key: WEBSOCKET_REDIS_URL
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 2Gi
    service:
      app:
        controller: open-webui
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        enabled: true
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/backend/data
