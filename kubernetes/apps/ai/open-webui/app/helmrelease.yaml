---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: open-webui
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        # State is SQLite on a ReadWriteOnce ceph-block PVC, and upstream does
        # not support rolling updates across a schema migration. The chart
        # default (RollingUpdate) starts the new pod before the old one exits:
        # same node, both mount the RWO volume and two processes migrate one
        # webui.db; different node, the RBD attach is refused and the rollout
        # stalls. Recreate replaces the pod atomically instead.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.1@sha256:6bb1fbe8ab0a3e0456067f493044ffb66a30a65a34be47f6a5862176a370dd16
            env:
              # v0.11.0 starts the scheduler loop unconditionally and polls for
              # due timers before checking whether automations are enabled. The
              # query filters on three JSON_EXTRACT predicates over chat.meta
              # that no index can serve, so SQLite full-scans the chat table
              # every second even though timers are unused here. Cost grows
              # with chat history, not timer count. 30s is a straight trade of
              # timer latency for CPU; drop back to the default of 1 once the
              # upstream fix (open-webui#27663, unreleased) ships.
              - name: TIMER_POLL_INTERVAL
                value: "30"
              - name: ENABLE_OLLAMA_API
                value: "false"
              - name: OPENAI_API_BASE_URL
                value: http://litellm.ai.svc.cluster.local:4000/v1
              - name: OPENAI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-open-webui
                    key: api-key
              # Web search (RAG citations from live search results), backed by the
              # in-cluster SearXNG instance's JSON API. v0.11.0 renamed these from
              # RAG_WEB_SEARCH_* / ENABLE_RAG_WEB_SEARCH to WEB_SEARCH_* / ENABLE_WEB_SEARCH
              # (backend/open_webui/config.py:1129,1138,1147,1164,1185) — the old names are
              # not read by this version.
              #
              # ENABLE_WEB_SEARCH is a PersistentConfig value: it only seeds the SQLite
              # `web.search.enable` row on that row's first-ever write, and is ignored once
              # the row exists (models/config.py's seed_defaults() docstring: "Existing DB
              # values take precedence over defaults"). This app previously ran with web
              # search off, so the row is already seeded false on the live PVC — flipping
              # this env var does not retroactively flip it. After deploying, enable web
              # search by hand in Admin Settings → Web Search.
              - name: ENABLE_WEB_SEARCH
                value: "true"
              - name: WEB_SEARCH_ENGINE
                value: searxng
              - name: SEARXNG_QUERY_URL
                value: http://searxng.default.svc.cluster.local:8080/search?q=<query>
              - name: WEB_SEARCH_RESULT_COUNT
                value: "5"
              - name: WEB_SEARCH_CONCURRENT_REQUESTS
                value: "5"
              # RAG embeddings (web search + file upload) route through LiteLLM's
              # OpenAI-compatible endpoint on the all-minilm model
              # (backend/open_webui/config.py:984,990,1080-1081).
              - name: RAG_EMBEDDING_ENGINE
                value: openai
              - name: RAG_EMBEDDING_MODEL
                value: all-minilm
              - name: RAG_OPENAI_API_BASE_URL
                value: http://litellm.ai.svc.cluster.local:4000/v1
              - name: RAG_OPENAI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-open-webui
                    key: api-key
              # Socket.IO state moves off the single pod's memory onto the shared
              # Dragonfly instance, so websocket sessions/events survive the
              # Recreate rollout described above instead of dropping on every deploy
              # (backend/open_webui/env.py:450,453,470).
              - name: ENABLE_WEBSOCKET_SUPPORT
                value: "true"
              - name: WEBSOCKET_MANAGER
                value: redis
              - name: WEBSOCKET_REDIS_URL
                valueFrom:
                  secretKeyRef:
                    name: open-webui-secret
                    key: WEBSOCKET_REDIS_URL
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 2Gi
    service:
      app:
        controller: open-webui
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        enabled: true
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/backend/data
