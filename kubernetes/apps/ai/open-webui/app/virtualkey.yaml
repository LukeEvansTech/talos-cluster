---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: open-webui
  namespace: ai
spec:
  proxyRef: litellm
  keyAlias: open-webui
  secretName: litellm-key-open-webui
  secretKey: api-key
  models:
    - self-hosted
    - self-hosted-uncensored
    - openrouter/auto
    # Embedding model used by RAG_OPENAI_API_KEY/RAG_EMBEDDING_MODEL in
    # helmrelease.yaml. Must be in scope or web-search/file-upload embedding fails.
    - all-minilm
