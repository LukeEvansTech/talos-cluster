---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/v1/configmap.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-configmap
  namespace: ai
data:
  config.yaml: |-
    model_list:
      # ------------------------------------------------------------------
      # Local — llama.cpp (llama-nvidia). Served by the llmkube llama-nvidia
      # StatefulSet in the ai namespace.
      # ------------------------------------------------------------------

      # Stable "self-hosted" group. One backend today (llama-nvidia, order 1):
      # Qwen3.8-27B Heretic-abliterated (0bserverx RVN Q4_K_S, KL ~0.0085 vs
      # base — near-vanilla behaviour, refusals 0–1/100), 128k context over
      # 2 parallel slots (64k per request), vision via mmproj. The single GPU
      # model in the cluster.
      - model_name: self-hosted
        model_info:
          mode: chat
          supports_function_calling: true
          supports_vision: true
          supports_reasoning: true
          max_input_tokens: 65536
          max_output_tokens: 16384
        litellm_params:
          model: openai/self-hosted
          api_base: http://llama-nvidia.ai.svc.cluster.local:8080/v1
          api_key: llama-nvidia
          max_parallel_requests: 2
          order: 1

      # Alias for the SAME llama-nvidia backend (the model is abliterated, so
      # the dedicated uncensored InferenceService is gone). Kept as its own
      # group so existing clients (opencode etc.) keep working and because its
      # fallback semantics differ: deliberately NOT in router_settings.fallbacks
      # — a cloud fallback would reintroduce refusals and defeat the point.
      - model_name: self-hosted-uncensored
        model_info:
          mode: chat
          supports_function_calling: true
          supports_vision: true
          supports_reasoning: true
          max_input_tokens: 65536
          max_output_tokens: 16384
        litellm_params:
          model: openai/self-hosted-uncensored
          api_base: http://llama-nvidia.ai.svc.cluster.local:8080/v1
          api_key: llama-nvidia
          max_parallel_requests: 2

      # ------------------------------------------------------------------
      # Cloud
      # ------------------------------------------------------------------
      - model_name: openrouter/auto
        litellm_params:
          model: openrouter/openrouter/auto
          api_key: os.environ/OPENROUTER_API_KEY

      # ------------------------------------------------------------------
      # Embedding — served by the CPU llama-embed pod (all-MiniLM-L6-v2, 384-dim,
      # OpenAI /v1). Powers the MCP semantic tool filter below.
      # ------------------------------------------------------------------
      - model_name: all-minilm
        model_info:
          mode: embedding
        litellm_params:
          model: openai/sentence-transformers/all-MiniLM-L6-v2
          api_base: http://llama-embed.ai.svc.cluster.local:8080/v1
          api_key: llama-embed

      # ------------------------------------------------------------------
      # Optional cloud providers (Jory's set). To enable one: add its key to the
      # `litellm` 1Password item, add the matching line to externalsecret.yaml's
      # template, then uncomment. Disabled by default so a missing key can't fail
      # the deploy.
      # ------------------------------------------------------------------
      # - model_name: kimi-k2                       # Moonshot
      #   model_info: {mode: chat, supports_function_calling: true}
      #   litellm_params:
      #     model: moonshot/kimi-k2
      #     api_base: https://api.moonshot.ai/v1
      #     api_key: os.environ/MOONSHOT_API_KEY
      # - model_name: MiniMax                       # MiniMax (Anthropic-format)
      #   model_info: {mode: messages, supports_function_calling: true, supports_vision: true}
      #   litellm_params:
      #     model: minimax/MiniMax-M2
      #     api_base: https://api.minimax.io/anthropic/v1/messages
      #     api_key: os.environ/MINIMAX_API_KEY
      #     cache_control_injection_points:
      #       - {location: message, role: system}
      #       - {location: message, index: -1}
      # - model_name: zen/glm                       # OpenCode "zen" (one key, many models)
      #   model_info: {mode: chat, supports_function_calling: true}
      #   litellm_params:
      #     model: openai/glm-4.6
      #     api_base: https://opencode.ai/zen/go/v1
      #     api_key: os.environ/OPENCODE_API_KEY

    router_settings:
      redis_host: os.environ/REDIS_HOST
      redis_port: os.environ/REDIS_PORT
      redis_password: os.environ/REDIS_PASSWORD
      cooldown_time: 30
      enable_pre_call_checks: true
      # If the local model is cooling-down / unhealthy, spill to cloud.
      fallbacks:
        - self-hosted: ["openrouter/auto"]
      # No context_window_fallbacks: both aliases resolve to the same backend
      # with the same 64k-per-request window, so there is no larger local model
      # to spill into.

    litellm_settings:
      success_callback: ["prometheus"]
      failure_callback: ["prometheus"]
      require_auth_for_metrics_endpoint: false
      cache: true
      cache_params:
        type: redis
        host: os.environ/REDIS_HOST
        port: os.environ/REDIS_PORT
        password: os.environ/REDIS_PASSWORD
        ttl: 300
      # drop_params is deliberately OFF: with it enabled LiteLLM silently strips
      # reasoning_effort before it reaches the llama.cpp backend (treated as
      # unsupported for the openai/ provider entry), which defeats disabling Qwen3.8's
      # thinking mode (verified 2026-08-25). If a real UnsupportedParamsError 400 ever
      # shows up, scope the drop with per-model additional_drop_params on that entry
      # instead of re-enabling this globally.
      num_retries: 2
      retry_after: 5
      request_timeout: 1200
      # Surfaces only the top-k relevant MCP tools per request (9 servers) using
      # the all-minilm embedding model above.
      mcp_semantic_tool_filter:
        enabled: true
        embedding_model: all-minilm
        top_k: 8
        similarity_threshold: 0.3

    # MCP tools proxied to any LiteLLM client (ToolHive-managed endpoints, ai ns).
    # 9 servers — the semantic filter above trims each request to the top-k
    # relevant tools.
    mcp_servers:
      kubectl:
        url: http://mcp-kubectl.ai.svc.cluster.local:8000/mcp
      flux:
        url: http://mcp-flux.ai.svc.cluster.local:8000/mcp
      talos:
        url: http://mcp-talos-mcp.ai.svc.cluster.local:8080/mcp
      searxng:
        url: http://mcp-searxng.ai.svc.cluster.local:3000/mcp
      github:
        url: http://mcp-github-proxy.ai.svc.cluster.local:8080/mcp
      grafana:
        url: http://mcp-grafana-proxy.ai.svc.cluster.local:8080/mcp
      # Sonarr/Radarr/Prowlarr tools (mcp-arr). stdio server behind ToolHive's
      # streamable-http proxy, same as github/grafana above.
      arr:
        url: http://mcp-arr-proxy.ai.svc.cluster.local:8080/mcp
      # Seerr request/discovery tools (overseerr-mcp). Native streamable-http
      # container (no proxy hop), so the Service is mcp-seerr:8085 directly.
      seerr:
        url: http://mcp-seerr.ai.svc.cluster.local:8085/mcp
      # Home Assistant tools (ha-mcp in ha-mcp-web mode). Native streamable-http
      # container like seerr, so the Service is mcp-hamcp:8080 directly.
      hamcp:
        url: http://mcp-hamcp.ai.svc.cluster.local:8080/mcp

    general_settings:
      health_check_endpoint: /v1/health
