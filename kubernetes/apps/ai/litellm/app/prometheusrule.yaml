---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: litellm
spec:
  groups:
    # Thresholds assume one replica, so increase() counts real events, not a cross-replica sum.
    # *_fallbacks_total appears only after the first fallback; absence is healthy, not stale
    # (docs/docs/apps/litellm.md Alerting).
    - name: litellm.rules
      rules:
        - alert: LiteLLMFallbackChainExhausted
          expr: |-
            sum by (requested_model, exception_status, exception_class) (
              increase(litellm_deployment_failed_fallbacks_total[15m])
            ) > 0
          annotations:
            summary: >-
              LiteLLM {{ $labels.requested_model }} fallback chain exhausted, no working deployment
              ({{ $labels.exception_status }} {{ $labels.exception_class }})
          labels:
            severity: critical
        - alert: LiteLLMModelFailover
          expr: |-
            sum by (requested_model, fallback_model, exception_status, exception_class) (
              increase(litellm_deployment_successful_fallbacks_total[10m])
            ) > 2
          for: 5m
          annotations:
            summary: >-
              LiteLLM {{ $labels.requested_model }} failing over to {{ $labels.fallback_model }}
              ({{ $labels.exception_status }} {{ $labels.exception_class }})
          labels:
            severity: warning
        - alert: LiteLLMDeploymentOutage
          # rate()'s 3m window stays under the 10m for:, so one failure can't
          # extrapolate positive for the whole period (docs/docs/apps/litellm.md Alerting).
          expr: |-
            max by (litellm_model_name) (litellm_deployment_state) >= 2
            and on (litellm_model_name)
            sum by (litellm_model_name) (rate(litellm_deployment_failure_responses_total[3m])) > 0
          for: 10m
          annotations:
            summary: >-
              LiteLLM {{ $labels.litellm_model_name }} out of rotation and still failing
              (deployment_state >= 2)
          labels:
            severity: warning
        - alert: LiteLLMAuthOrQuotaFailures
          expr: |-
            sum by (litellm_model_name, exception_status) (
              increase(litellm_deployment_failure_responses_total{exception_status=~"403|429"}[15m])
            ) > 3
          for: 5m
          annotations:
            summary: >-
              LiteLLM {{ $labels.litellm_model_name }} returning {{ $labels.exception_status }}
              (auth/quota, check the upstream key or plan cap)
          labels:
            severity: warning
        - alert: LiteLLMClaudeBudgetLow
          # Not an outage: once the budget is spent, claude callers fall back to self-hosted.
          expr: |-
            litellm_provider_remaining_budget_metric{api_provider="anthropic"} < 40
          annotations:
            summary: >-
              LiteLLM Anthropic budget down to {{ $value | printf "%.0f" }} USD; claude traffic
              moves to self-hosted when it runs out
          labels:
            severity: warning
        - alert: LiteLLMClaudeBudgetMetricAbsent
          # The budget filter sets the gauge on every claude call, so a call with no gauge means
          # provider_budget_config is unset. New series count, as increase() misses their first call.
          expr: |-
            (
              sum(increase(litellm_deployment_success_responses_total{litellm_model_name="claude-sonnet-5-5"}[1h])) > 0
              or
              sum(litellm_deployment_success_responses_total{litellm_model_name="claude-sonnet-5-5"} unless litellm_deployment_success_responses_total{litellm_model_name="claude-sonnet-5-5"} offset 1h)
            )
            unless on () litellm_provider_remaining_budget_metric{api_provider="anthropic"}
          for: 15m
          annotations:
            summary: >-
              LiteLLM reports no Anthropic budget; the claude spend cap may be unset
          labels:
            severity: warning
        - alert: LiteLLMClaudeRequestRejected
          # A 400 from Anthropic is a request param it does not accept, which fails over
          # silently; chat_template_kwargs did this until it was dropped.
          # The counter is created at its first event, which increase() never sees, so a
          # series that did not exist an hour ago counts too.
          expr: |-
            sum by (exception_class) (
              increase(litellm_deployment_successful_fallbacks_total{exception_status="400",exception_class=~"Anthropic[.].*"}[1h])
            ) > 0
            or
            sum by (exception_class) (
              litellm_deployment_successful_fallbacks_total{exception_status="400",exception_class=~"Anthropic[.].*"}
              unless
              litellm_deployment_successful_fallbacks_total{exception_status="400",exception_class=~"Anthropic[.].*"} offset 1h
            )
          annotations:
            summary: >-
              Anthropic rejected LiteLLM requests ({{ $labels.exception_class }}); check the
              LiteLLM logs for the param and add it to additional_drop_params
          labels:
            severity: warning
        - alert: LiteLLMClaudeSpendFast
          # $20/day empties the monthly budget in ten days.
          expr: |-
            sum(increase(litellm_spend_metric_total{model="claude-sonnet-5-5"}[24h])) > 20
          annotations:
            summary: >-
              LiteLLM claude spent {{ $value | printf "%.0f" }} USD in the last 24h
          labels:
            severity: warning
    # up comes from the llmkube-models ServiceMonitor; max by (service) fires only
    # when every endpoint of a backend is down. 15m absorbs restarts and cold GGUF
    # loads; a scaled-to-zero pod goes stale, not up==0 (docs/docs/apps/litellm.md Alerting).
    - name: llmkube.rules
      rules:
        - alert: InferenceServiceDown
          expr: |-
            max by (service) (up{service=~"llama-.+"}) == 0
          for: 15m
          annotations:
            summary: >-
              llmkube InferenceService {{ $labels.service }} is down, no llama.cpp scrape target
              reachable (self-hosted routing degrades to the cloud fallback)
          labels:
            severity: critical
