---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: arrmcp
  namespace: ai
spec:
  # bardesss/arr-mcp: the whole media stack (radarr/sonarr/bazarr/prowlarr/
  # seerr/sabnzbd/qbittorrent/plex) behind one native streamable-http endpoint,
  # so no ToolHive proxy hop. Unlike every sibling here it authenticates:
  # `/mcp` refuses anything without `Authorization: Bearer <token>`.
  proxyRef: litellm
  url: http://arrmcp.ai.svc.cluster.local:6060/mcp
  authType: bearer_token
  authTokenRef:
    name: arrmcp-secret
    key: ARR_MCP_BEARER_TOKEN
