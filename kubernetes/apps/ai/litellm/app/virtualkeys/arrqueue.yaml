---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: arrqueue
  namespace: ai
spec:
  # Cross-namespace key for the arrqueue tick's queue judge (media namespace): PushSecret mirrors it
  # to the litellm 1Password item (docs/docs/architecture/ai-llm-stack.md In-cluster consumers).
  proxyRef: litellm
  keyAlias: arrqueue
  secretName: litellm-key-arrqueue
  secretKey: api-key
  # The judge removes and imports on the answer, so only the group with no router fallback.
  maxBudget: "20"
  models:
    - claude-opus
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: arrqueue
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword-connect
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-arrqueue
  updatePolicy: Replace
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: litellm
          property: LITELLM_ARRQUEUE_API_KEY
