---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: sakuga
  namespace: ai
spec:
  # Cross-namespace key: PushSecret mirrors it to the litellm 1Password item
  # (docs/docs/architecture/ai-llm-stack.md In-cluster consumers).
  proxyRef: litellm
  keyAlias: sakuga
  secretName: litellm-key-sakuga
  secretKey: api-key
  # Reads each new cel listing's title and photo once (vision), and compares two photos when
  # their hashes are borderline; tens of calls a day after the first sweep.
  models:
    - claude
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: sakuga
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword-connect
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-sakuga
  updatePolicy: Replace
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: litellm
          property: LITELLM_SAKUGA_API_KEY
