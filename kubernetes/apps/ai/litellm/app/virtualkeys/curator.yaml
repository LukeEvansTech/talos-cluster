---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: curator
  namespace: ai
spec:
  # Cross-namespace key for the curatorjudge and curatortvjudge CronJobs: PushSecret mirrors it
  # to the litellm 1Password item (docs/docs/architecture/ai-llm-stack.md In-cluster consumers).
  proxyRef: litellm
  keyAlias: curator
  secretName: litellm-key-curator
  secretKey: api-key
  # Only the group with no router fallback: scope alone would not stop one.
  models:
    - claude-opus
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: curator
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword-connect
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-curator
  updatePolicy: Replace
  data:
    - match:
        secretKey: api-key
        remoteRef:
          remoteKey: litellm
          property: LITELLM_CURATOR_API_KEY
