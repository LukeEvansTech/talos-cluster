---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
  namespace: ai
spec:
  applyMode: file
  image: ghcr.io/berriai/litellm:main-stable@sha256:f63fb81b831b170ec16851e23c36ac5bf52ef106b271406429524a2ed730bbfd
  replicas: 1
  service:
    port: 4000
    type: ClusterIP
  route:
    hostnames:
      - "litellm.${SECRET_DOMAIN}"
    parentRefs:
      - name: envoy-internal
        namespace: network
  env:
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: REDIS_HOST
      value: dragonfly.database.svc.cluster.local
    - name: REDIS_PORT
      value: "6379"
  envFrom:
    - secretRef:
        name: litellm-secret
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    # 180s covers a cold mcp_semantic_tool_filter embed, measured at 104s
    # (docs/docs/apps/litellm.md).
    initialDelaySeconds: 180
    periodSeconds: 10
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 6
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  routerSettings:
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    redis_password: os.environ/REDIS_PASSWORD
    routing_strategy: simple-shuffle
    cooldown_time: 30
    enable_pre_call_checks: true
    # Timeout gets one attempt, not num_retries' 2: a retry just re-queues onto the same GPU.
    retry_policy:
      TimeoutErrorRetries: 0
    # If the local model is cooling down or unhealthy, spill to cloud.
    fallbacks:
      - self-hosted:
          - "openrouter/auto"
          # No context_window_fallbacks: both aliases share one backend and window.
  litellmSettings:
    success_callback:
      - "prometheus"
    failure_callback:
      - "prometheus"
    require_auth_for_metrics_endpoint: false
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      password: os.environ/REDIS_PASSWORD
      ttl: 300
      # Cache embeddings only. LiteLLM's default supported_call_types includes
      # completion/acompletion, which replayed chat replies inside the TTL, keyed
      # on the request body rather than the caller.
      supported_call_types:
        - embedding
        - aembedding
    # drop_params stays off, or LiteLLM strips reasoning_effort before llama.cpp sees it
    # (verified 2026-08-25; docs/docs/architecture/ai-llm-stack.md Gotchas).
    num_retries: 2
    retry_after: 5
    # 1500s must stay under repowiki's 1800s LLM_TIMEOUT (docs/docs/apps/litellm.md Timeouts).
    request_timeout: 1500
    set_verbose: false
    # Embeds via qwen3-embedding, not all-minilm, whose 512-token cap broke this at
    # startup (docs/docs/architecture/ai-llm-stack.md MCP tools).
    mcp_semantic_tool_filter:
      enabled: true
      embedding_model: qwen3-embedding
      top_k: 8
      similarity_threshold: 0.3
  generalSettings:
    health_check_endpoint: /v1/health
    # CRs are the model source of truth, not the DB (docs/docs/apps/litellm.md Design decisions).
    store_model_in_db: false
  extraConfig:
    environment:
      - REDIS_HOST
      - REDIS_PORT
      - REDIS_PASSWORD
      - OPENROUTER_API_KEY
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY
