---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: self-hosted-uncensored
  namespace: ai
spec:
  # Same backend as self-hosted; kept separate since it has no cloud fallback by design
  # (docs/architecture/ai-llm-stack.md Model groups).
  modelName: self-hosted-uncensored
  proxyRef: litellm
  params:
    model: openai/self-hosted-uncensored
    apiBase: http://llama-nvidia.ai.svc.cluster.local:8080/v1
    apiKey: llama-nvidia
    additional:
      max_parallel_requests: 2
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: chat
    maxInputTokens: 65536
    maxOutputTokens: 16384
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      supports_reasoning: true
      input_cost_per_token: 1.0e-08
      output_cost_per_token: 3.0e-08
