---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: claude
  namespace: ai
spec:
  # Paid from a monthly provider credit and capped by provider_budget_config
  # (litellmproxy.yaml). Default model for most callers; falls back to self-hosted.
  modelName: claude
  proxyRef: litellm
  params:
    model: anthropic/claude-sonnet-5-5
    apiKey: os.environ/ANTHROPIC_API_KEY
    additional:
      # Sonnet 5.5 rejects non-default sampling params and budget_tokens with a 400,
      # and this LiteLLM build has no capability entry for it to drop them itself.
      additional_drop_params:
        - temperature
        - top_p
        - top_k
        - reasoning_effort
        # llama.cpp-only switch (todoist-sort); Anthropic 400s on unknown body keys.
        - chat_template_kwargs
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 128000
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      # Not in this LiteLLM build's price map; without these spend reads $0 and the
      # budget never trips.
      input_cost_per_token: 2.0e-06
      output_cost_per_token: 1.0e-05
      cache_creation_input_token_cost: 2.5e-06
      cache_read_input_token_cost: 1.0e-07
