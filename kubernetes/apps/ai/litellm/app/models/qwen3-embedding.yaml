---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: qwen3-embedding
  namespace: ai
spec:
  # Long-context embedder for the VMCP tool optimizer and the semantic filter; all-minilm's
  # 512-token cap broke both (docs/architecture/ai-llm-stack.md MCP tools).
  modelName: qwen3-embedding
  proxyRef: litellm
  params:
    model: openai/Qwen3-Embedding-0.6B
    apiBase: http://toolhiveembed.ai.svc.cluster.local:8080/v1
    apiKey: toolhive-embed
  info:
    mode: embedding
