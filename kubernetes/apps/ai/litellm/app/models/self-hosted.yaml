---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: self-hosted
  namespace: ai
spec:
  # llama-nvidia backend, order 1 (docs/architecture/ai-llm-stack.md Model groups).
  modelName: self-hosted
  proxyRef: litellm
  params:
    model: openai/self-hosted
    apiBase: http://llama-nvidia.ai.svc.cluster.local:8080/v1
    apiKey: llama-nvidia
    additional:
      order: 1
      max_parallel_requests: 2
      # Forwards reasoning_effort despite drop_params off; the openai/ provider's default
      # allowlist would otherwise strip it (docs/architecture/ai-llm-stack.md Gotchas).
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: chat
    maxInputTokens: 65536
    maxOutputTokens: 16384
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      supports_reasoning: true
      input_cost_per_token: 1.0e-08
      output_cost_per_token: 3.0e-08
