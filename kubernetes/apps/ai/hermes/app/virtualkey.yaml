---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: hermes
  namespace: ai
spec:
  # The operator mints this key on the litellm proxy and writes it to the
  # named Secret; scope is limited to the models hermes actually routes to
  # (including litellm's own self-hosted fallback target) so a leak can't
  # reach the master key's full account access.
  proxyRef: litellm
  keyAlias: hermes
  secretName: litellm-key-hermes
  secretKey: api-key
  models:
    - self-hosted
    - self-hosted-uncensored
    - openrouter/auto
