---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes
    template:
      engineVersion: v2
      data:
        MEMINI_API_KEY: "{{ .MEMINI_API_KEY }}"
        # Shared with hermeswebui's HERMES_WEBUI_GATEWAY_API_KEY, same 1Password field.
        API_SERVER_KEY: "{{ .api_server_key }}"
        # Dashboard binds 0.0.0.0, so basic auth is load-bearing; the session secret
        # must persist or rollouts log everyone out.
        HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "{{ .username }}"
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "{{ .password }}"
        HERMES_DASHBOARD_BASIC_AUTH_SECRET: "{{ .session_secret }}"
  dataFrom:
    - extract:
        key: memini
    - extract:
        key: hermes-agent
