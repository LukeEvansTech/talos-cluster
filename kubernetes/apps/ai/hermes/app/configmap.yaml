---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/v1/configmap.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: ai
data:
  # NOTE: `$${VAR}` is intentional. Flux postBuild collapses it to a literal
  # `${VAR}`, which Hermes' own config loader (_expand_env_vars) then resolves
  # against the pod environment (populated by envFrom the `hermes` Secret) at
  # startup. A single `${VAR}` would be consumed — and blanked — by Flux first.
  config.yaml: |-
    model:
      default: self-hosted
      provider: litellm
    providers:
      # LiteLLM's OpenAI-compatible surface. `self-hosted` is the local
      # llama.cpp model group; LiteLLM handles its own cloud fallback. The key
      # is an operator-minted LiteLLMVirtualKey (see virtualkey.yaml), not the
      # master key.
      litellm:
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: $${HERMES_LITELLM_API_KEY}
    terminal:
      backend: local
      cwd: /opt/data/workspace
      timeout: 180
      persistent_shell: true
    memory:
      provider: memini
    # Auto-shrinks long conversations before they blow the model's context
    # window: once prompt_tokens crosses `threshold` of the model's context
    # limit, middle turns are summarized down to `target_ratio` of that
    # threshold, always preserving the most recent `protect_last_n` messages
    # verbatim. See upstream cli-config.yaml.example for the full mechanism.
    compression:
      enabled: true
      # Trigger compression at 50% of the model's context limit.
      threshold: 0.50
      # Keep 20% of the threshold as the post-compaction recent-tail budget.
      target_ratio: 0.20
      # Always preserve the most recent 20 messages (~10 full turns).
      protect_last_n: 20
    agent:
      # Ceiling on tool-calling iterations per conversation before a turn
      # gives up.
      max_turns: 90
      # Inactivity timeout (seconds) for gateway agent runs — only fires once
      # the agent goes idle this long; active tool calls / API responses
      # don't count against it.
      gateway_timeout: 1800
      # Grace window (seconds) for an in-flight turn on gateway stop/restart
      # before it's interrupted.
      restart_drain_timeout: 60
      # App-level retry attempts for API errors (connection drops, provider
      # timeouts, 5xx) before the turn surfaces the failure.
      api_max_retries: 2
      # "Thinking" depth passed to the model (OpenRouter / Nous Portal).
      reasoning_effort: medium
    approvals:
      # manual: every flagged terminal command is queued for approval. Hermes
      # has a terminal + cluster-adjacent MCP tools, so the Pod is the only
      # trust boundary — no unattended actions.
      mode: manual
    security:
      redact_secrets: true
    privacy:
      redact_pii: true
    mcp_servers:
      # Aggregate of the mcp-tools ToolHive VirtualMCPServer group (9
      # backends behind one endpoint), not per-proxy entries or the LiteLLM
      # /mcp aggregate. Tool names are namespaced `{workload}_<tool>`; the
      # built-in semantic optimizer (find_tool/call_tool) trims the list
      # before it reaches the agent. flux's tools include write verbs since
      # #4578 — approvals.mode: manual above still queues those for approval.
      toolhive:
        url: http://vmcp-mcp-gateway.ai.svc.cluster.local:4483/mcp
