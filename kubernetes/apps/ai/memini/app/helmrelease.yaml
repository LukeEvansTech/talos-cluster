---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app memini
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  # Startup probe budgets ~30m for a synchronous re-embed (probes.startup); the
  # default 5m Helm timeout would roll back mid-re-embed before it could pass.
  timeout: 35m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: memini
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            env:
              MEMINI_BACKEND: sqlite
              MEMINI_DEFAULT_NAMESPACE: default
              # Embeddings + rerank served by the CPU llama.cpp pods in this ns.
              MEMINI_EMBED_BASE_URL: http://llama-embed.ai.svc.cluster.local:8080/v1
              MEMINI_EMBED_MODEL: sentence-transformers/all-MiniLM-L6-v2
              MEMINI_EMBED_DIMS: "384"
              # Caps in-flight calls to the single-replica CPU embed backend, and
              # bounds the recall-path call so a stuck backend degrades to
              # keyword-only search instead of hanging recall.
              MEMINI_EMBED_MAX_CONCURRENCY: 2
              MEMINI_RECALL_EMBED_TIMEOUT: 5s
              # Re-embeds automatically on a model swap, instead of refusing to start.
              MEMINI_REEMBED_ON_MODEL_CHANGE: true
              MEMINI_RERANK: http://llama-rerank.ai.svc.cluster.local:8080/v1
              MEMINI_RERANK_MODEL: qwen3-reranker
              MEMINI_RERANK_MAX_CONCURRENCY: 2
              MEMINI_RERANK_TIMEOUT: 12s
              # Wider than the recall limit, so the cross-encoder can promote a
              # result the fused score buried below it.
              MEMINI_RERANK_POOL: "8"
              # Consolidation LLM via LiteLLM's self-hosted group; scoped key from
              # virtualkey.yaml, not the master key.
              MEMINI_LLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000
              MEMINI_LLM_MODEL: self-hosted
              MEMINI_LLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-memini
                    key: api-key
              # Coalesces a near-duplicate write into its nearest same-tier memory
              # instead of hinting; keep the dedup pass and short-term cap tuned to match.
              MEMINI_WRITE_DEDUP_SCORE: "0.80"
              MEMINI_WRITE_DEDUP_ACTION: coalesce
              MEMINI_DEDUP_TIERS: episodic
              MEMINI_DEDUP_SIMILARITY: "0.80"
              MEMINI_SHORT_TERM_CAP: "300"
              MEMINI_ASSESS_BATCH: "5"
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini
                    key: api-key
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  # ~30m (180 * 10s): a synchronous re-embed of the whole store, one call
                  # per memory, on a model swap.
                  failureThreshold: 180
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      fsck:
        enabled: true
        cronjob:
          schedule: "0 5 * * *"
        pod:
          # RWO ceph-block PVC shared with the main pod: pin fsck to main's node, or
          # it Multi-Attach-stalls in ContainerCreating until it lands there by chance.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: memini
                      app.kubernetes.io/controller: main
                  topologyKey: kubernetes.io/hostname
        # The chart's fsck curl uses --variable %MEMINI_API_KEY, needing the same
        # bearer token as the main container.
        containers:
          fsck:
            env:
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini
                    key: api-key
    persistence:
      data:
        existingClaim: memini
    route:
      internal:
        enabled: true
        hostnames:
          - "memini.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        # Chart v0.7.5 split the UI onto its own `ui` port (8081); `http` (8080) is
        # now API-only and 404s on `/`. This custom route key inherits neither chart
        # default, so it would fall back to `http` without this.
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: main
                port: ui
    serviceMonitor:
      main:
        enabled: true
    grafanaDashboards:
      enabled: true
      folder: ai
