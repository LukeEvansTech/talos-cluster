---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermeswebui
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermeswebui
    template:
      engineVersion: v2
      data:
        # Same 1Password field the hermes gateway maps to API_SERVER_KEY, so the
        # UI authenticates to hermes-app's API server (upstream requires the two
        # to match). It stays on the gateway's item: it is the gateway's key.
        HERMES_WEBUI_GATEWAY_API_KEY: "{{ .gateway_api_key }}"
        # Web login password. Upstream auth is off by default; setting this
        # turns it on, which is required once the UI is bound beyond loopback
        # (we route it on envoy-internal). Held on the UI's own `hermeswebui`
        # LOGIN item so 1Password can autofill the sign-in page: a LOGIN
        # carries one password, and the gateway item's is the dashboard's.
        HERMES_WEBUI_PASSWORD: "{{ .webui_password }}"
  # Two explicit field refs rather than `dataFrom: extract` of both items: the
  # items share the label `password` (dashboard vs web UI), and a merged extract
  # would resolve it by list order.
  data:
    - secretKey: gateway_api_key
      remoteRef:
        key: hermes-agent
        property: api_server_key
    - secretKey: webui_password
      remoteRef:
        key: hermeswebui
        property: password
