---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermeswebui
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermeswebui
    template:
      engineVersion: v2
      data:
        # Same field as hermes' API_SERVER_KEY (upstream requires them to match); stays
        # on the gateway's item, since it is the gateway's key.
        HERMES_WEBUI_GATEWAY_API_KEY: "{{ .gateway_api_key }}"
        # Off by default upstream, needed once routed beyond loopback. On its own LOGIN
        # item, not the gateway's: that item's one password is already the dashboard's.
        HERMES_WEBUI_PASSWORD: "{{ .webui_password }}"
  # Explicit field refs, not `dataFrom: extract`: both items use the label `password`,
  # and extract order isn't guaranteed to pick the right one.
  data:
    - secretKey: gateway_api_key
      remoteRef:
        key: hermes-agent
        property: api_server_key
    - secretKey: webui_password
      remoteRef:
        key: hermeswebui
        property: password
