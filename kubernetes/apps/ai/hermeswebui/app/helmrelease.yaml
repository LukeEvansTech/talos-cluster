---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermeswebui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: hermeswebui
  values:
    controllers:
      hermeswebui:
        annotations:
          reloader.stakater.com/auto: "true"
        # RWO state PVC: avoid a multi-attach deadlock on rollout.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/nesquena/hermes-webui
              tag: 0.52.445@sha256:edba65868e24f073ec426a5816cb52db76633b02183bd23a307af3c36b605fe9
            env:
              TZ: ${TIMEZONE}
              # Image already bakes 0.0.0.0:8787; kept explicit for clarity.
              HERMES_WEBUI_HOST: 0.0.0.0
              HERMES_WEBUI_PORT: &port 8787
              # Sessions, settings, the signing key, and attachments: the only stateful
              # path, persisted on the volsync PVC. Losing it logs everyone out.
              HERMES_WEBUI_STATE_DIR: /data
              # gateway: hermes-app's OpenAI-compatible API, not the WebUI's own legacy backend.
              HERMES_WEBUI_CHAT_BACKEND: gateway
              # Base URL only: the WebUI appends /v1/* and /api/* itself (matches
              # upstream's 127.0.0.1:8642 default).
              HERMES_WEBUI_GATEWAY_BASE_URL: http://hermes-app.ai.svc.cluster.local:8642
              # Required: the gateway's approvals.mode: manual needs the runs API, or
              # approval cards never surface and tool calls hang invisibly.
              HERMES_WEBUI_GATEWAY_USE_RUNS_API: "true"
            envFrom:
              - secretRef:
                  name: hermeswebui
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              # Every start builds a venv via `uv pip install` before /health answers
              # (the venv lives on the image layer, not the PVC); the startup probe
              # covers that instead of a long initialDelaySeconds.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              # Entrypoint writes the venv to the image layer, so root FS can't be read-only.
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            ports:
              - containerPort: *port
                name: http
                protocol: TCP
    defaultPodOptions:
      securityContext:
        # Starting directly as UID 1024 skips the entrypoint's root/self-chown branch
        # (docs/docs/apps/hermeswebui.md). fsGroup 1024 covers the /data PVC instead.
        runAsNonRoot: true
        runAsUser: 1024
        runAsGroup: 1024
        fsGroup: 1024
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: hermeswebui
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          # Probes /health, not /: once HERMES_WEBUI_PASSWORD is set, / redirects to
          # login, which a bare uptime check would read as down.
          gatus.home-operations.com/endpoint: |-
            url: https://{{ .Release.Name }}.${SECRET_DOMAIN}/health
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
