---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Renders arr-mcp's entire config.yaml from 1Password, so the deployment is
# declarative and no credential is ever written to the PVC.
#
# The API keys are the SAME 1Password items the media/downloads apps already
# read; only the `arrmcp` item is new, and it holds just the two values that
# have no other home: the MCP bearer token and the scrypt hash of the config
# UI password.
#
# arr-mcp only writes config.yaml when the file is absent or `bearer_token` is
# missing (src/config/load.ts), so seeding a complete file means startup
# performs no writes at all and this can be mounted read-only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name arrmcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 15m
  target:
    name: arrmcp-secret
    template:
      engineVersion: v2
      data:
        # The same token as `auth.bearer_token` below, exposed as its own key so
        # the LiteLLMMCPServer's authTokenRef can send `Authorization: Bearer
        # <token>`. arr-mcp requires that exact scheme — `presentedToken` splits
        # on the space and matches "bearer", so a bare token is refused.
        ARR_MCP_BEARER_TOKEN: "{{ .ARR_MCP_BEARER_TOKEN }}"
        # The same value again, pre-prefixed. ToolHive's MCPServerEntry injects
        # a forwarded header verbatim, so the scheme has to be part of the
        # secret rather than something the CR can add.
        ARR_MCP_AUTHORIZATION: "Bearer {{ .ARR_MCP_BEARER_TOKEN }}"
        # Keys are validated by a zod *strict* object per service, so an unknown
        # or misspelled key at service level fails at startup. Note
        # `destructive`, not `unsafe_write` — the README says the latter and the
        # code says the former (src/config/schema.ts PermissionsSchema), and
        # because that inner object is non-strict the README's key would have
        # been silently dropped rather than rejected.
        config.yaml: |
          auth:
            bearer_token: "{{ .ARR_MCP_BEARER_TOKEN }}"
            username: "{{ .ARR_MCP_USERNAME }}"
            password_hash: "{{ .ARR_MCP_PASSWORD_HASH }}"
            allow_token_in_url: false
            allowed_hosts: []
          services:
            radarr:
              url: http://radarr.media.svc.cluster.local
              api_key: "{{ .RADARR_API_KEY }}"
              permissions:
                safe_write: true
                # Enabled 2026-09-06 so queue hygiene (remove_queue_item,
                # clean_queue) can run from the MCP. Both are two-step
                # confirm-token writes and every call is recorded in
                # audit.db. This also grants delete_media/delete_episode_files
                # on this service, which is the real cost of the flag.
                destructive: true
            sonarr:
              url: http://sonarr.media.svc.cluster.local
              api_key: "{{ .SONARR_API_KEY }}"
              permissions:
                safe_write: true
                # Enabled 2026-09-06 so queue hygiene (remove_queue_item,
                # clean_queue) can run from the MCP. Both are two-step
                # confirm-token writes and every call is recorded in
                # audit.db. This also grants delete_media/delete_episode_files
                # on this service, which is the real cost of the flag.
                destructive: true
            bazarr:
              url: http://bazarr.media.svc.cluster.local:6767
              api_key: "{{ .BAZARR_API_KEY }}"
              permissions:
                safe_write: true
                destructive: false
            prowlarr:
              url: http://prowlarr-app.downloads.svc.cluster.local
              api_key: "{{ .PROWLARR_API_KEY }}"
              permissions:
                safe_write: true
                destructive: false
            seerr:
              url: http://seerr.media.svc.cluster.local
              api_key: "{{ .SEERR_API_KEY }}"
              permissions:
                safe_write: true
                destructive: false
            sabnzbd:
              url: http://sabnzbd-app.downloads.svc.cluster.local
              api_key: "{{ .SABNZBD_API_KEY }}"
              permissions:
                safe_write: true
                destructive: false
            # Needs arr-mcp >= 1.21.2: 1.21.1 required the login body to be
            # exactly "Ok." and so rejected qBittorrent 5.2.x, which answers a
            # successful login with 204 and an empty body (upstream #195).
            qbittorrent:
              url: http://qbittorrent-app.downloads.svc.cluster.local
              username: "{{ .QBT_USERNAME }}"
              password: "{{ .QBT_PASSWORD }}"
              permissions:
                safe_write: true
                destructive: false
            # Plex is the media server here. Jellyfin is deliberately absent:
            # the schema refuses both at once, because `get_library`'s presence
            # check has no single answer with two media servers.
            plex:
              url: http://plex.media.svc.cluster.local:32400
              api_key: "{{ .PLEX_TOKEN }}"
              permissions:
                safe_write: true
                destructive: false
          metadata:
            imdb:
              enabled: false
          ui:
            theme: system
  data:
    # qBittorrent's WebUI credentials are generically labelled (`username` /
    # `password`), so they are pulled by explicit property rather than through
    # an extract that could collide with another item's identically named field.
    - secretKey: QBT_USERNAME
      remoteRef:
        key: qbittorrent
        property: username
    - secretKey: QBT_PASSWORD
      remoteRef:
        key: qbittorrent
        property: password
  dataFrom:
    - extract:
        key: *name
    - extract:
        key: radarr
    - extract:
        key: sonarr
    - extract:
        key: bazarr
    - extract:
        key: prowlarr
    - extract:
        key: seerr
    - extract:
        key: sabnzbd
    - extract:
        key: plex
