---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Renders arr-mcp's whole config.yaml from 1Password; no credential is ever written to the PVC.
# Reuses the media/downloads apps' own 1Password items for their API keys; `arrmcp` itself only
# holds the bearer token and the UI password hash, the two values with no other home.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name arrmcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 15m
  target:
    name: arrmcp-secret
    template:
      engineVersion: v2
      data:
        # Standalone copy of auth.bearer_token below, for LiteLLMMCPServer's authTokenRef
        # (Authorization: Bearer <token>). arr-mcp's presentedToken parsing requires that
        # exact scheme; a bare token is refused.
        ARR_MCP_BEARER_TOKEN: "{{ .ARR_MCP_BEARER_TOKEN }}"
        # Pre-prefixed duplicate: ToolHive's MCPServerEntry forwards this header verbatim,
        # so the Bearer scheme has to live in the secret, not the CR.
        ARR_MCP_AUTHORIZATION: "Bearer {{ .ARR_MCP_BEARER_TOKEN }}"
        # Use `destructive`, not the README's `unsafe_write` (docs/docs/apps/arrmcp.md).
        config.yaml: |
          auth:
            bearer_token: "{{ .ARR_MCP_BEARER_TOKEN }}"
            username: "{{ .ARR_MCP_USERNAME }}"
            password_hash: "{{ .ARR_MCP_PASSWORD_HASH }}"
            allow_token_in_url: false
            allowed_hosts: []
          services:
            radarr:
              url: http://radarr.media.svc.cluster.local
              api_key: "{{ .RADARR_API_KEY }}"
              permissions:
                safe_write: true
                # Enabled 2026-09-06 so queue hygiene (remove_queue_item,
                # clean_queue) can run from the MCP. Both are two-step
                # confirm-token writes and every call is recorded in
                # audit.db. This also grants delete_media/delete_episode_files
                # on this service, which is the real cost of the flag.
                destructive: true
            sonarr:
              url: http://sonarr.media.svc.cluster.local
              api_key: "{{ .SONARR_API_KEY }}"
              permissions:
                safe_write: true
                # Enabled 2026-09-06 so queue hygiene (remove_queue_item,
                # clean_queue) can run from the MCP. Both are two-step
                # confirm-token writes and every call is recorded in
                # audit.db. This also grants delete_media/delete_episode_files
                # on this service, which is the real cost of the flag.
                destructive: true
            bazarr:
              url: http://bazarr.media.svc.cluster.local:6767
              api_key: "{{ .BAZARR_API_KEY }}"
              permissions:
                safe_write: true
                destructive: false
            prowlarr:
              url: http://prowlarr-app.downloads.svc.cluster.local
              api_key: "{{ .PROWLARR_API_KEY }}"
              permissions:
                safe_write: true
                destructive: false
            seerr:
              url: http://seerr.media.svc.cluster.local
              api_key: "{{ .SEERR_API_KEY }}"
              permissions:
                safe_write: true
                destructive: false
            sabnzbd:
              url: http://sabnzbd-app.downloads.svc.cluster.local
              api_key: "{{ .SABNZBD_API_KEY }}"
              permissions:
                safe_write: true
                destructive: false
            # Needs arr-mcp >= 1.21.2: 1.21.1 required the login body to be
            # exactly "Ok." and so rejected qBittorrent 5.2.x, which answers a
            # successful login with 204 and an empty body (upstream #195).
            qbittorrent:
              url: http://qbittorrent-app.downloads.svc.cluster.local
              username: "{{ .QBT_USERNAME }}"
              password: "{{ .QBT_PASSWORD }}"
              permissions:
                safe_write: true
                destructive: false
            # Plex is the media server here. Jellyfin is deliberately absent:
            # the schema refuses both at once, because `get_library`'s presence
            # check has no single answer with two media servers.
            plex:
              url: http://plex.media.svc.cluster.local:32400
              api_key: "{{ .PLEX_TOKEN }}"
              permissions:
                safe_write: true
                destructive: false
          metadata:
            imdb:
              enabled: false
          ui:
            theme: system
  data:
    # Explicit property, not `dataFrom: extract`: qBittorrent's generic username/password
    # labels could collide with another item's identically named field.
    - secretKey: QBT_USERNAME
      remoteRef:
        key: qbittorrent
        property: username
    - secretKey: QBT_PASSWORD
      remoteRef:
        key: qbittorrent
        property: password
  dataFrom:
    - extract:
        key: *name
    - extract:
        key: radarr
    - extract:
        key: sonarr
    - extract:
        key: bazarr
    - extract:
        key: prowlarr
    - extract:
        key: seerr
    - extract:
        key: sabnzbd
    - extract:
        key: plex
