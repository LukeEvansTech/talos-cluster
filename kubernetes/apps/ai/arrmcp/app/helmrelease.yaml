---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arrmcp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: arrmcp
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      arrmcp:
        annotations:
          # config.yaml is a subPath secret mount, which doesn't update in place;
          # only a pod restart picks up a 1Password rotation, which this provides.
          reloader.stakater.com/auto: "true"
        # One RWO volume: a rolling update would start the replacement before
        # the old pod releases the RBD attach and stall.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/bardesss/arr-mcp
              tag: 1.42.0@sha256:d56b4a29dab308eca7c6b1cb9fa4c6f7e81767ae17b710fb76ec00d63d2ef885
            env:
              ARR_MCP_PORT: &port 6060
              TZ: ${TIMEZONE}
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    persistence:
      # Writable for LogStore/WriteAudit's SQLite databases; not VolSync-backed on
      # purpose (docs/docs/apps/arrmcp.md).
      config:
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /config
      # Read-only: the ExternalSecret renders the token as a hash, so arr-mcp has
      # nothing to rewrite at startup.
      config-file:
        type: secret
        name: arrmcp-secret
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        controller: arrmcp
        ports:
          http:
            port: *port
