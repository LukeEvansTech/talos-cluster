---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: foreman
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: foreman
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    foreman:
      # This cluster's kube-state-metrics has no customResourceState config
      # (see docs/docs/architecture/ai-llm-stack.md), so the CRS ConfigMap +
      # Grafana dashboard + PrometheusRule this would render have nothing to
      # consume them. Leave disabled (the chart default) until that changes.
      crs:
        enabled: false
    operator:
      # Audit-record ConfigMaps (foreman.llmkube.dev/audit) accumulate one per
      # task and are only GC'd by the operator's reaper. Trim the chart's 168h
      # default the same way this cluster trims other audit trails — a bare
      # trial does not need a week of history.
      audit:
        retention: 48h
    # Defaults every entry in `agents` merges over.
    agent:
      mode: native
      taskNamespace: ai
      image:
        # Upstream's coder-capable image, confirmed present at this tag via
        # `docker manifest inspect` (multi-arch amd64/arm64). NOT
        # `llmkube-coder` (that repository does not exist) — the real
        # repository name is `llmkube-foreman-agent-coder`. Jory's fleet
        # builds its own fork (ghcr.io/misospace/llmkube-coder) because it
        # predates this upstream image; this cluster uses upstream instead.
        repository: ghcr.io/defilantech/llmkube-foreman-agent-coder
        tag: 0.9.20@sha256:248060f5cb8ef8ad42d87c4decc0a5adf6628230a7d8f7f91f75f9e4d4b05419
      gateCache:
        storageClass: ceph-filesystem
        accessModes:
          - "ReadWriteMany"
    agents:
      default:
        enabled: true
        # One task per FleetNode, and Job-mode coders hold theirs for the
        # whole Job — 2 replicas is enough to try a coder + gate run
        # concurrently without reserving capacity this cluster doesn't have
        # spare. No second (fork) agent pool: this is a bare trial with no
        # dispatch bridge, see docs/docs/operations/jory-homeops-adoption.md.
        replicaCount: 2
        roles:
          - worker
          - coder
          - verifier
        githubToken:
          secretName: foreman-agent
          secretKey: GITHUB_TOKEN
        commitAuthorName: foreman
        commitAuthorEmail: foreman@${SECRET_DOMAIN}
        gateCache:
          name: foreman-gate-cache
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "4"
            memory: 8Gi
    coder:
      gitCredentialsSecret: foreman-agent
      gitCredentialsSecretKey: GITHUB_TOKEN
