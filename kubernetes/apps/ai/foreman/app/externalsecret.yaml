---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The foreman GitHub App's private key (1Password item `foreman-github`,
# field PRIVATE_KEY). Only the GithubAccessToken generator below reads it —
# no foreman pod ever sees the PEM.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: foreman-github-app
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: foreman-github-app
    template:
      engineVersion: v2
      data:
        private-key: "{{ .PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: foreman-github
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# GITHUB_TOKEN for the foreman agents + coder Jobs is a GitHub App
# *installation token* minted by the GithubAccessToken generator
# (githubaccesstoken.yaml): scoped to the repositories listed there, and
# rotated here every 30 minutes because GitHub expires them after 60. Nothing
# long-lived is stored anywhere. A coder Job reads the token at start, so a
# single run longer than ~60 minutes can fail its final push — acceptable for
# the trial; revisit if it bites.
#
# No LITELLM_API_KEY here: the Agent CRs point their apiKeySecretRef straight
# at the LiteLLMVirtualKey-managed litellm-key-foreman Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: foreman-agent
  namespace: ai
spec:
  refreshInterval: 30m
  target:
    name: foreman-agent
    template:
      engineVersion: v2
      data:
        GITHUB_TOKEN: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: foreman-github
