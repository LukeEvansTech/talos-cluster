---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: foreman-agent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: foreman-agent
    template:
      engineVersion: v2
      data:
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
  # PREREQUISITE (owner action, not automated by this PR): the `foreman-github`
  # item does not exist yet. Create it in the Talos 1Password vault with a
  # single field GITHUB_TOKEN holding a fine-grained PAT scoped to
  # contents:write + pull_requests:write + issues:read on the trial repo(s).
  #
  # No LITELLM_API_KEY field here, unlike Jory's foreman-agent ExternalSecret.
  # The Agent CRD's spec.providerConfig.apiKeySecretRef is a plain K8s
  # SecretKeySelector — it can point at ANY Secret/key, so coder.yaml and
  # reviewer.yaml reference the LiteLLMVirtualKey operator's own
  # litellm-key-foreman/api-key Secret directly. Duplicating that key into
  # this 1Password-sourced Secret would need a second 1Password item (this
  # ClusterSecretStore only reads 1Password) or a cross-store copy neither
  # ExternalSecret nor SecretStore support — and would go stale the moment
  # the LiteLLMVirtualKey rotates the key. Pointing the Agent CRs straight at
  # the operator-managed Secret avoids both problems.
  dataFrom:
    - extract:
        key: foreman-github
