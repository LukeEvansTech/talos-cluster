---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: litellm-operator
  values:
    controller:
      logLevel: info
      leaderElection:
        enabled: true
    llmkube:
      # Off: explicit LiteLLMModel CRs mirror the existing cloud + Ollama list instead
      # of auto-registering from llmkube InferenceServices; revisit once llmkube is the norm.
      autoRegister: false
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
