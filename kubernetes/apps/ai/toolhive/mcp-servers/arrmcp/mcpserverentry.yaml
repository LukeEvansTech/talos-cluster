---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserverentry_v1alpha1.json
# Puts the already-deployed arrmcp app behind vmcp-mcp-gateway; LiteLLM still talks to it directly.
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServerEntry
metadata:
  name: arrmcp
spec:
  # Short svc.ns form, not cluster.local
  # (docs/docs/architecture/ai-llm-stack.md Adding an MCP server).
  remoteUrl: http://arrmcp.ai:6060/mcp
  transport: streamable-http
  headerForward:
    # Injected verbatim; the secret holds the "Bearer " prefix.
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          name: arrmcp-secret
          key: ARR_MCP_AUTHORIZATION
  groupRef:
    name: mcp-tools
