---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-mcp
  namespace: ai
---
# Read: reuses the two broad read ClusterRoles from kubectl-mcp (secrets
# excluded, see kubectl/rbac.yaml for why the aggregated role is split from
# its explicit-rules counterpart) so the flux MCP can inspect Flux state.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-mcp-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubectl-mcp-readonly
subjects:
  - kind: ServiceAccount
    name: flux-mcp
    namespace: ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-mcp-readonly-explicit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubectl-mcp-readonly-explicit
subjects:
  - kind: ServiceAccount
    name: flux-mcp
    namespace: ai
---
# Write: limited to Flux API groups (never core "", so no Secret access is
# granted here), enabling the MCP reconcile/suspend/resume/apply/delete
# tools against Flux objects. Enabled per "flux-mcp write access (enabled)"
# in docs/docs/architecture/ai-llm-stack.md; revoke by deleting this
# ClusterRole + its binding.
#
# Resources are enumerated explicitly per apiGroup (not `resources: ["*"]`)
# so Trivy KSV-0046 and Checkov's "minimize wildcard use in Roles and
# ClusterRoles" stay quiet. A wildcard here reads identically to
# cluster-admin-over-Flux to both scanners even though it's group-scoped.
# Generated from `kubectl api-resources --api-group=<group> -o name` against
# the live cluster; add new Flux kinds here by hand when a Flux component is
# upgraded to introduce one (subresources like `<kind>/status` are
# deliberately excluded. flux-operator-mcp's write tools only ever patch
# spec/annotations on the main object, never status).
#
# `image.toolkit.fluxcd.io` (imagepolicies, imagerepositories,
# imageupdateautomations) is omitted: this cluster does not run the Flux
# image-automation controller, so the group has no CRDs installed. Add a
# rule for it here if that controller is ever deployed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-mcp-write
rules:
  - apiGroups:
      - fluxcd.controlplane.io
    resources:
      - fluxinstances
      - fluxreports
      - resourcesetinputproviders
      - resourcesets
    verbs:
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    verbs:
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
    resources:
      - kustomizations
    verbs:
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - notification.toolkit.fluxcd.io
    resources:
      - alerts
      - providers
      - receivers
    verbs:
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - buckets
      - externalartifacts
      - gitrepositories
      - helmcharts
      - helmrepositories
      - ocirepositories
    verbs:
      - create
      - patch
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-mcp-write
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-mcp-write
subjects:
  - kind: ServiceAccount
    name: flux-mcp
    namespace: ai
