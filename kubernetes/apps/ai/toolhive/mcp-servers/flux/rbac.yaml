---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-mcp
  namespace: ai
---
# Read-only: reuses the two broad read ClusterRoles from kubectl-mcp (secrets
# excluded — see kubectl/rbac.yaml for why the aggregated role is split from
# its explicit-rules counterpart) so the flux MCP can inspect Flux state but
# not mutate it. To grant write access (reconcile/suspend/resume/apply/delete
# on Flux CRDs), see "Enabling flux-mcp write access" in
# docs/docs/architecture/ai-llm-stack.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-mcp-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubectl-mcp-readonly
subjects:
  - kind: ServiceAccount
    name: flux-mcp
    namespace: ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-mcp-readonly-explicit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubectl-mcp-readonly-explicit
subjects:
  - kind: ServiceAccount
    name: flux-mcp
    namespace: ai
