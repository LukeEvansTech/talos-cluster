---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-mcp
  namespace: ai
---
# Reuses the kubectl-mcp read ClusterRoles (secrets excluded); see kubectl/rbac.yaml for the split.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-mcp-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubectl-mcp-readonly
subjects:
  - kind: ServiceAccount
    name: flux-mcp
    namespace: ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-mcp-readonly-explicit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubectl-mcp-readonly-explicit
subjects:
  - kind: ServiceAccount
    name: flux-mcp
    namespace: ai
---
# Write access to Flux API groups only, never core "" (docs/docs/architecture/ai-llm-stack.md
# flux-mcp write access); revoke by deleting this ClusterRole and its binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flux-mcp-write
rules:
  - apiGroups:
      - fluxcd.controlplane.io
    resources:
      - fluxinstances
      - fluxreports
      - resourcesetinputproviders
      - resourcesets
    verbs:
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    verbs:
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
    resources:
      - kustomizations
    verbs:
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - notification.toolkit.fluxcd.io
    resources:
      - alerts
      - providers
      - receivers
    verbs:
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - buckets
      - externalartifacts
      - gitrepositories
      - helmcharts
      - helmrepositories
      - ocirepositories
    verbs:
      - create
      - patch
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-mcp-write
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-mcp-write
subjects:
  - kind: ServiceAccount
    name: flux-mcp
    namespace: ai
