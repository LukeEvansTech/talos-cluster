---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: flux
spec:
  image: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp:v0.58.1@sha256:7bbcff1fb43ff9452eca38b48c925e12c08cddf7d603c25e59be6e0758ba0ccc
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  serviceAccount: flux-mcp
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          # flux-operator-mcp defaults --read-only to false (confirmed via
          # `flux-operator-mcp --help` and upstream docs/mcp/mcp-config.md);
          # this deployment has never passed the flag, so the
          # reconcile/suspend/resume/apply/delete tools have always been
          # registered here. RBAC in rbac.yaml is the actual — and only —
          # enforcement layer, both before and after enabling flux-mcp-write.
          args:
            - serve
            - --transport=http
            - --port=8000
          env:
            # In-cluster mode: no KUBECONFIG; uses the pod service account.
            - name: RUNTIME_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
  telemetryConfigRef:
    name: prometheus
  groupRef:
    name: mcp-tools
