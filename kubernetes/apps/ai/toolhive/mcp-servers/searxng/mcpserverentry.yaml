---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserverentry_v1alpha1.json
# For a future VirtualMCPServer aggregate; LiteLLM already reaches mcp-searxng directly.
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServerEntry
metadata:
  name: searxng
spec:
  # Short svc.ns form, not cluster.local
  # (docs/docs/architecture/ai-llm-stack.md Adding an MCP server).
  remoteUrl: http://mcp-searxng.ai:3000/mcp
  transport: streamable-http
  groupRef:
    name: mcp-tools
