---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: kubectl
spec:
  image: docker.io/rohitghumare64/kubectl-mcp-server:2.0.0@sha256:f1f57aa5d4952f3c49e4d9bb8071a143d0812bdc8253922d51eeca8a2615ea29
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  serviceAccount: kubectl-mcp-readonly
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          # 2.0.0 runs as 10001 with a 0700 home; without this the operator injects uid 1000,
          # which cannot read the workdir and the server exits at import (upstream issue 93).
          # Container level, because the operator fills a nil container securityContext whole.
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
          args:
            - --transport
            - streamable-http
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --read-only
            # 2.0.0 refuses a non-loopback bind without OAuth. The ToolHive proxy reaches this pod
            # over the pod network, and 1.24.0 had no auth either, so this keeps the same exposure.
            - --allow-unauthenticated
            # 2.0.0 loads only core and helm by default; keep the read-side sets that 1.24.0
            # registered and that match what runs here (Flux, cert-manager, Cilium).
            - --toolsets
            - core,helm,diagnostics,security,cost,crds,gitops,certs,cilium
          env:
            - name: MCP_K8S_PROVIDER
              value: in-cluster
            - name: PYTHONUNBUFFERED
              value: "1"
  telemetryConfigRef:
    name: prometheus
  groupRef:
    name: mcp-tools
