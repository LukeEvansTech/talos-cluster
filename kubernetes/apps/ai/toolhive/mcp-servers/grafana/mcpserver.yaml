---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: grafana
spec:
  image: docker.io/grafana/mcp-grafana:2.2.0@sha256:697336440e34878f8e0b26a69675db8d7e97b4d0daec25ec5441c85ac6c60e81
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  # The image defaults to streamable-http; force stdio so ToolHive proxies it.
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          args:
            - -t
            - stdio
  env:
    - name: GRAFANA_URL
      value: http://grafana-service.observability.svc.cluster.local:3000
    # 2.x reports anonymous usage statistics by default.
    - name: GRAFANA_USAGE_STATS
      value: disabled
  secrets:
    - name: toolhive-grafana
      key: token
      targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  telemetryConfigRef:
    name: prometheus
  groupRef:
    name: mcp-tools
