---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mcp-gateway
spec:
  # Scrapes the VirtualMCPServer's vmcp Deployment pod. Labels verified against
  # the ToolHive operator source (labelsForVirtualMCPServer in
  # cmd/thv-operator/controllers/virtualmcpserver_controller.go): every vmcp pod
  # gets app.kubernetes.io/name=virtualmcpserver + app.kubernetes.io/instance=<CR
  # name>. No `release: kube-prometheus-stack` label. This cluster's Prometheus
  # selects monitors without it (see the sibling ../app/podmonitor.yaml).
  selector:
    matchLabels:
      app.kubernetes.io/instance: mcp-gateway
      app.kubernetes.io/name: virtualmcpserver
  namespaceSelector:
    matchNames:
      - ai
  podMetricsEndpoints:
    # vmcp exposes one container port named `http` (buildContainerPortsForVmcp in
    # virtualmcpserver_deployment.go), unlike the "8080" numeric port some
    # upstream examples use, prometheus-operator matches podMetricsEndpoints[].
    # port by NAME, so a numeric value here would resolve no target. /metrics is
    # served on that same port once telemetryConfigRef is set (../gateway/virtualmcpserver.yaml).
    - port: http
      path: /metrics
      interval: 15s
