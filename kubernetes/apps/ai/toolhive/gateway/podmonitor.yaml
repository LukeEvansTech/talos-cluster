---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mcp-gateway
spec:
  # Labels verified against the operator source, not assumed (docs/docs/architecture/ai-llm-stack.md
  # Metrics scraping).
  selector:
    matchLabels:
      app.kubernetes.io/instance: mcp-gateway
      app.kubernetes.io/name: virtualmcpserver
  namespaceSelector:
    matchNames:
      - ai
  podMetricsEndpoints:
    # Port matched by name, not number: a numeric value resolves no target
    # (docs/docs/architecture/ai-llm-stack.md Metrics scraping).
    - port: http
      path: /metrics
      interval: 15s
