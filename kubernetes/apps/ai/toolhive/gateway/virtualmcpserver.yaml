---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-gateway
spec:
  # Aggregates every backend in the mcp-tools MCPGroup; tool name collisions are resolved by
  # prefixing with the backend workload name (docs/docs/architecture/ai-llm-stack.md MCP gateway).
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
    # find_tool/call_tool only, resolved semantically via qwen3-embedding, not all-minilm
    # (512-token cap): docs/docs/architecture/ai-llm-stack.md MCP gateway.
    optimizer:
      embeddingModel: qwen3-embedding
      embeddingProvider: openai
      embeddingService: http://litellm.ai.svc.cluster.local:4000/v1
      # 600s: a fresh session's full-set embed measured ~2 min
      # (docs/docs/architecture/ai-llm-stack.md MCP gateway).
      embeddingServiceTimeout: 600s
  groupRef:
    name: mcp-tools
  # Anonymous here does not mean unauthenticated: the Envoy Gateway SecurityPolicy enforces
  # x-api-key in front of this HTTPRoute (docs/docs/architecture/ai-llm-stack.md MCP gateway).
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          env:
            # Scoped LiteLLM key for the optimizer's embedding client (virtualkey.yaml).
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-key-toolhive
                  key: api-key
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
  # Lets the vmcp Deployment scale beyond one replica without pinning clients to a pod.
  sessionStorage:
    provider: redis
    address: dragonfly.database.svc.cluster.local:6379
    db: 0
    keyPrefix: "toolhive:vmcp:"
    passwordRef:
      name: toolhive-gateway-redis
      key: password
  # /metrics on the same port as MCP traffic; scraped by podmonitor.yaml.
  telemetryConfigRef:
    name: prometheus
