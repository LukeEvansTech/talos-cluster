---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-gateway
  annotations:
    # vmcp's own /health is unauthenticated (pkg/vmcp/server/server.go), but the
    # SecurityPolicy below (../gateway/securitypolicy.yaml) requires x-api-key on
    # every path matched by this route, including /health — an unauthenticated
    # Gatus probe would get 401, not 200. Disable auto-monitoring rather than
    # carve out an unauthenticated path just for the health check.
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - mcp.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        # The ToolHive operator names the VirtualMCPServer's Service "vmcp-<name>"
        # (vmcpServiceName in cmd/thv-operator/controllers/virtualmcpserver_controller.go),
        # distinct from MCPServer's "mcp-<name>-proxy" pattern.
        - name: vmcp-mcp-gateway
          port: 4483
