---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-gateway
  annotations:
    # A Gatus probe would get 401 on /health under the SecurityPolicy below
    # (docs/docs/architecture/ai-llm-stack.md MCP gateway).
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - mcp.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        # vmcp-<name>, distinct from MCPServer's mcp-<name>-proxy
        # (docs/docs/architecture/ai-llm-stack.md Adding an MCP server).
        - name: vmcp-mcp-gateway
          port: 4483
