---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: toolhiveembed
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: 5Gi
  storageClassName: ceph-block
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: toolhiveembed
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: toolhiveembed
  values:
    controllers:
      toolhiveembed:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Public GGUF, no HF token needed; downloaded once into the RWO PVC and reused on
          # restart (docs/docs/architecture/ai-llm-stack.md MCP gateway).
          model-download:
            image:
              repository: python
              tag: 3.14-slim@sha256:c3e521df8b2b498a7a682e7e18676771cb80c6b75b8699af886b2d554ce40151
            command:
              - /bin/sh
              - -ec
              - |
                set -euo pipefail
                if [ ! -s /models/Qwen3-Embedding-0.6B/Qwen3-Embedding-0.6B-Q8_0.gguf ]; then
                  pip install --no-cache-dir "huggingface_hub[hf_transfer]"
                  mkdir -p /models/Qwen3-Embedding-0.6B
                  hf download \
                    Qwen/Qwen3-Embedding-0.6B-GGUF \
                    Qwen3-Embedding-0.6B-Q8_0.gguf \
                    --local-dir /models/Qwen3-Embedding-0.6B
                  echo "Qwen3-Embedding-0.6B download complete"
                else
                  echo "Qwen3-Embedding-0.6B already present, skipping"
                fi
            env:
              HF_HUB_ENABLE_HF_TRANSFER: "1"
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 2Gi
        containers:
          app:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              tag: server@sha256:2f8ebc2dde83c4bd7e5c6d61efa57965e0d5a79d29802c246c4593740d9c04c1
            args:
              - --host
              - 0.0.0.0
              - --port
              - "8080"
              - --alias
              - Qwen3-Embedding-0.6B
              - --model
              - /models/Qwen3-Embedding-0.6B/Qwen3-Embedding-0.6B-Q8_0.gguf
              - --embeddings
              - --pooling
              - last
              # 2 slots gives 4096 tokens/input; 4 slots 400'd on the longest tool description
              # (docs/docs/architecture/ai-llm-stack.md Embedding server tuning).
              - --ctx-size
              - "8192"
              - --parallel
              - "2"
              - --cont-batching
              # --ubatch-size must cover the longest input; 8192 OOM-killed this pod at 2Gi
              # (docs/docs/architecture/ai-llm-stack.md Embedding server tuning).
              - --batch-size
              - "4096"
              - --ubatch-size
              - "2048"
              # 4 threads timed out the optimizer's full-batch embed on session start
              # (docs/docs/architecture/ai-llm-stack.md Embedding server tuning).
              - --threads
              - "12"
              # Embeddings never share a prefix, so the RAM prompt cache only grows; disabled
              # after an OOM (docs/docs/architecture/ai-llm-stack.md Embedding server tuning).
              - --cache-ram
              - "0"
              - --no-cache-prompt
              - --metrics
              # --load-mode replaces the removed --mmap and works on both old and new builds.
              - --load-mode
              - mmap
            resources:
              requests:
                cpu: "4"
                memory: 2Gi
              limits:
                # RSS grows ~2Gi transiently during the optimizer's full batch; 3Gi OOM-killed it
                # mid-batch (docs/docs/architecture/ai-llm-stack.md Embedding server tuning).
                memory: 6Gi
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 6
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  failureThreshold: 60
                  periodSeconds: 10
    persistence:
      models:
        existingClaim: toolhiveembed
        globalMounts:
          - path: /models
    service:
      app:
        ports:
          http:
            port: 8080
