---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: toolhive-embed
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: toolhive-embed
  # Deliberately depends on nothing: both consumers order themselves after it.
  # litellm's mcp_semantic_tool_filter resolves its embedding model ONCE at
  # startup and stays silently inactive if the backend is missing, so this must
  # reconcile before litellm, which rules out living in toolhive-gateway,
  # since that depends on litellm for its LiteLLMVirtualKey.
  interval: 1h
  path: ./kubernetes/apps/ai/toolhive/embed
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 15m
  # wait: true, unlike its siblings. A dependsOn is only satisfied when this
  # goes Ready, and "applied" is not good enough here: the pod pulls a 610MB
  # GGUF on first start, so litellm must wait for it to actually serve.
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: toolhive-crds
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: toolhive-crds
  interval: 1h
  path: ./kubernetes/apps/ai/toolhive/crds
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: toolhive
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: toolhive
  dependsOn:
    - name: toolhive-crds
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/ai/toolhive/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: toolhive-mcp-servers
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: toolhive-mcp-servers
  dependsOn:
    - name: toolhive
      namespace: *namespace
    - name: onepassword-connect
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/ai/toolhive/mcp-servers
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: toolhive-gateway
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: toolhive-gateway
  dependsOn:
    - name: litellm
      namespace: *namespace
    - name: toolhive-embed
      namespace: *namespace
    - name: onepassword-connect
      namespace: external-secrets
    - name: toolhive-mcp-servers
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/ai/toolhive/gateway
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
