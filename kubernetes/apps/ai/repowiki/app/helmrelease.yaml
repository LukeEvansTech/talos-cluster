---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: repowiki
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: repowiki
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      # Serves the rendered wiki (mkdocs-material, live-reload) off the RWO PVC
      # repowiki-gen writes into.
      mkdocs:
        annotations:
          reloader.stakater.com/auto: "true"
        # Single RWO ceph-block volume: a rolling update could land the new pod on a
        # different node before the old one releases the RBD attach, and stall.
        strategy: Recreate
        initContainers:
          # First-boot race: mkdocs won't start until repowiki-gen creates
          # /app-data/repository, so this seeds a placeholder index.md instead
          # (docs/docs/apps/repowiki.md).
          seed-placeholder:
            image: &mkdocsImage
              repository: squidfunk/mkdocs-material
              tag: 9.7.7@sha256:51b87149d227691486b5f08993d28c65ca7e4990010664b697265b8e6fcd5287
            command:
              - "sh"
              - "-c"
              - |
                mkdir -p /app-data/repository
                f=/app-data/repository/index.md
                [ -f "$f" ] && exit 0
                printf '# repowiki\n\nNo pages yet. Runs every 12h.\n' > "$f"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 32Mi
        containers:
          app:
            image: *mkdocsImage
            args:
              - "serve"
              - "--dirty"
              - "-f"
              - "/config/mkdocs.yml"
              - "-a"
              - "0.0.0.0:8000"
            command:
              - "mkdocs"
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 512Mi
      repowiki-gen:
        type: cronjob
        cronjob:
          ttlSecondsAfterFinished: 86400
          schedule: "0 */12 * * *"
          timeZone: "${TIMEZONE}"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        pod:
          # RWO PVC: pin the generator to the mkdocs pod's node so both can mount it.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - "repowiki"
                  topologyKey: kubernetes.io/hostname
        containers:
          app:
            image:
              repository: python
              tag: "3.14@sha256:1eb6b7d4b76454b1de8317863ac3213b678c337b27e604a4e3fb70bddbb2bad7"
            command:
              - "python3"
              - "/config/generate.py"
            env:
              - name: OPENAI_BASE_URL
                value: http://litellm.ai.svc.cluster.local:4000/v1
              - name: WIKI_MODEL
                value: self-hosted
              - name: MAX_REPOS_PER_RUN
                value: "2"
              - name: MAX_PAGES_PER_REPO
                value: "20"
              - name: LLM_TIMEOUT
                value: "1800"
              - name: WIKI_REPO
                value: /app-data/repository
              - name: OPENAI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-repowiki
                    key: api-key
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: repowiki-secret
                    key: GITHUB_TOKEN
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          mkdocs:
            app:
              - path: /app-data
            seed-placeholder:
              - path: /app-data
          repowiki-gen:
            app:
              - path: /app-data
      config:
        type: configMap
        name: repowiki
        globalMounts:
          - path: /config
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        controller: mkdocs
        ports:
          http:
            port: 8000
