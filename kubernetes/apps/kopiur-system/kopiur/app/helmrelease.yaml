---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kopiur
  values:
    installScope: cluster
    # 0.6.0 nested metrics/dashboards under monitoring:, the only breaking
    # values change between 0.4.8 and the current chart line.
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
    # credentialProjection stays at its chart default (disabled); movers read
    # KOPIA_PASSWORD from a per-namespace ExternalSecret instead, though the
    # chart's own secrets RBAC is unchanged either way (docs/docs/apps/kopiur.md).
    # No controller repo mount: maintenance and verification run in mover pods,
    # so controller liveness never depends on NFS.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
