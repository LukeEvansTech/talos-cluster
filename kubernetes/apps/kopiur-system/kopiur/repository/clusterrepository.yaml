---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  backend:
    filesystem:
      # `path` is only the in-pod mountpoint; isolation from the volsync kopia
      # repo happens at the NFS layer, via a separate subdirectory of the export.
      path: /repo
      volume:
        nfs:
          server: ${SECRET_STORAGE_SERVER}
          path: ${SECRET_STORAGE_SERVER_VOLSYNC_NFS}/kopiur
  encryption:
    passwordSecretRef:
      name: kopiur-nas-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  create:
    enabled: true
  # credentialProjection stays unset; movers read KOPIA_PASSWORD from a
  # per-namespace ExternalSecret instead (components/kopiur/secret).
  allowedNamespaces:
    # Trial scope: default (apprise, atuin) plus kopiur-system, since the
    # webhook gates the operator's own Maintenance CR on this same list.
    list:
      - default
      - kopiur-system
  identityDefaults:
    # Unchanged since the 0.4.x trial, so existing snapshots stay addressable
    # under the same kopia identity.
    hostnameExpr: namespace
    usernameExpr: namespace + '-' + policyName
  scheduleDefaults:
    # Timezone lives here (DRY) instead of per SnapshotSchedule.
    timezone: Europe/London
  moverDefaults:
    # cache/scratch stay unset on purpose and fall back to an emptyDir, which
    # fits these tiny trial apps; a token value like 1Mi would ENOSPC a real one.
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    ttlSecondsAfterFinished: 86400
  maintenance:
    enabled: true
    schedule:
      # Hourly quick maintenance bounds index blob growth as the trial widens
      # (default: 6-hourly, 30m jitter). `full` restates the operator default
      # since the CRD requires both once `schedule` is set.
      # No `timezone` here: maintenance crons fall back to the controller's UTC
      # default; `scheduleDefaults.timezone` above covers SnapshotSchedules only.
      quick:
        cron: "0 * * * *"
        jitter: 10m
      full:
        cron: "0 3 * * *"
        jitter: 1h
  parameters:
    epoch:
      # 1h floor (kopia's default is 24h) pairs with the hourly quick
      # maintenance above so epochs close and compact the same day.
      minDuration: 1h
