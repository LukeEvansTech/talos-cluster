---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app plex-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      plex-exporter:
        # A high restart count on this pod is expected, not a fault to chase.
        # The exporter treats a Plex websocket read failure as fatal and exits
        # ("cannot listen to plex server events") rather than reconnecting, so
        # the Kubernetes restart IS its reconnect. It has no backoff for "Plex
        # is not there yet", so while Plex is down — a Plex image update, say —
        # it hot-loops and the count jumps in bursts of 5-12 an hour, then sits
        # still for days. Measured impact is small: 99.75% scrape availability
        # over 7 days. Deliberately no extra alert: those bursts are fast enough
        # to trip CrashLoopBackOff, so KubePodCrashLooping already covers a
        # recurrence, and PlexServerUnreachable covers the up-but-blind case.
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/timothystewart6/prometheus-plex-exporter
              tag: 3e7a4da@sha256:90dc0799601c334f2945a3d5b4b552a06352b208a8ce88a428cf90d6c9aa51cd
            env:
              # In-cluster Plex service (media namespace). If Plex "Secure
              # connections" is set to Required, switch to the LB IP
              # http://${SVC_PLEX_ADDR}:32400 or relax the Plex setting.
              PLEX_SERVER: http://plex.media.svc.cluster.local:32400
              LOG_LEVEL: info
            envFrom:
              - secretRef:
                  name: plex-exporter-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        controller: *app
        ports:
          metrics:
            port: 9000
            protocol: TCP
