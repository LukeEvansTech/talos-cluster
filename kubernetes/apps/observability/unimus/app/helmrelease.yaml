---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unimus
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: unimus
  values:
    controllers:
      unimus:
        annotations:
          reloader.stakater.com/auto: "true"
        # One RWO volume: a rolling update would start the replacement before
        # the old pod releases the RBD attach and stall.
        strategy: Recreate
        containers:
          app:
            # No vendor-published image exists: Unimus ships .deb/.rpm/tarballs
            # and its own wiki points at this community build, which is the
            # actively maintained one. The abandoned netcore-jsa/unimus-docker
            # calls itself official but has not been touched since 2019.
            # The jar is baked in at build time rather than fetched at start,
            # and files/start.sh jarsigner-verifies it before exec'ing java, so
            # the digest pin covers the application and not just a wrapper.
            image:
              repository: docker.io/croc/unimus
              tag: 2.9.1@sha256:cef185bd9bff1d54a9e7e43ffc435d447222b61aaac146b98a5b318fd1860166
            env:
              TZ: ${TIMEZONE}
              # start.sh maps XMS/XMX straight onto the JVM flags. Capped below
              # the container limit so the heap cannot be what pushes the pod
              # into an OOM kill.
              XMS: 256M
              XMX: 1024M
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8085
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 15
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  # First boot creates the embedded HSQLDB before the web
                  # listener comes up, on top of ordinary JVM start, so this
                  # budgets ~5 minutes rather than the chart's default.
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              # The image is plain debian with no USER, and start.sh writes
              # /etc/localtime and /etc/timezone before handing off to the JVM.
              # So it needs to run as root with a writable root filesystem, the
              # same concession tdarr and gameyfin make. Set explicitly, because
              # a fresh app-template render otherwise inherits runAsNonRoot and
              # the container fails to start rather than falling back.
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              readOnlyRootFilesystem: false
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1536Mi
      # Daily reconcile of credentials and devices into Unimus from 1Password
      # (ExternalSecret unimus-seed): credentials and enable passwords through
      # API v3, devices through API v2 (this Unimus build serves no v3 device
      # endpoints). Additive and idempotent; see the seed.py docstring in
      # configmap.yaml.
      seed:
        type: cronjob
        cronjob:
          schedule: "0 4 * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 2
        # Set here rather than in defaultPodOptions: the controller above runs
        # as root by necessity, and a shared default would have to be widened
        # to accommodate it. The job has no such constraint.
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            # Stock upstream python and no build step: seed.py is standard
            # library only and is mounted from the unimus-seed ConfigMap, so
            # there is nothing to install and nothing to publish.
            image:
              repository: docker.io/library/python
              tag: 3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
            command:
              - python3
              - /scripts/seed.py
            env:
              TZ: ${TIMEZONE}
              # Nothing is writable, and the log is the only output that
              # matters, so no .pyc files and no buffering.
              PYTHONDONTWRITEBYTECODE: "1"
              PYTHONUNBUFFERED: "1"
              # The in-cluster Service the controller above publishes.
              UNIMUS_URL: http://unimus:8085
              SEED_SECRETS_DIR: /secrets
              # The two lists are data, not secrets: descriptions and the names
              # of the keys to read, so they live in the ConfigMap beside the
              # script that consumes them.
              SEED_DEVICES:
                valueFrom:
                  configMapKeyRef:
                    name: unimus-seed
                    key: devices.json
              SEED_CREDENTIALS:
                valueFrom:
                  configMapKeyRef:
                    name: unimus-seed
                    key: credentials.json
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      # Unimus keeps its configuration, the embedded HSQLDB, and the device
      # credentials it connects with all under /etc/unimus. Unlike oxidized,
      # where the device table is templated into a Secret and never touches
      # disk, here they live on the volume, so this is VolSync-backed.
      config:
        existingClaim: unimus
        # Scoped rather than global: the claim is ReadWriteOnce, and a global
        # mount would attach it to the seed job's pod as well, which stalls the
        # job whenever it is scheduled anywhere but the node already holding
        # the attachment. The job needs no access to it.
        advancedMounts:
          unimus:
            app:
              - path: /etc/unimus
      seed-secrets:
        type: secret
        name: unimus-seed-secret
        defaultMode: 0400
        advancedMounts:
          seed:
            app:
              - path: /secrets
                readOnly: true
      seed-script:
        type: configMap
        name: unimus-seed
        advancedMounts:
          seed:
            app:
              - path: /scripts
                readOnly: true
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        controller: unimus
        ports:
          http:
            port: *port
