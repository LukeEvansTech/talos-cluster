---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unimus
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: unimus
  values:
    controllers:
      unimus:
        annotations:
          reloader.stakater.com/auto: "true"
        # One RWO volume; a rolling update would stall waiting for the old pod's RBD attach.
        strategy: Recreate
        containers:
          app:
            # No vendor image exists; Unimus's wiki points at this community build over the
            # abandoned netcore-jsa/unimus-docker, which calls itself official.
            # The jar is baked in at build time and jarsigner-verified by start.sh before
            # exec'ing java, so the digest pin covers the app, not just a wrapper.
            image:
              repository: docker.io/croc/unimus
              tag: 2.9.1@sha256:fd56497c3118b40ac7632a05a6fd4d2b246da4b0b4b0633015813923b13f6683
            env:
              TZ: ${TIMEZONE}
              # Capped below the container limit so the heap can't be what OOM-kills the pod.
              XMS: 256M
              XMX: 1024M
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8085
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 15
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  # First boot creates the embedded HSQLDB before the web listener comes up,
                  # so this budgets ~5 minutes rather than the chart's default.
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              # start.sh writes /etc/localtime and /etc/timezone before handing off to the
              # JVM, so it needs root and a writable root filesystem, same as tdarr and
              # gameyfin. Set explicitly, or app-template's default runAsNonRoot applies.
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              readOnlyRootFilesystem: false
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1536Mi
      # Daily reconcile of credentials and devices from 1Password; see the seed.py
      # docstring in configmap.yaml for the API-version split and why.
      seed:
        type: cronjob
        cronjob:
          ttlSecondsAfterFinished: 86400
          schedule: "0 4 * * *"
          timeZone: "${TIMEZONE}"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 2
        # Set here, not in defaultPodOptions: the controller runs as root by necessity,
        # and a shared default would have to be widened to accommodate it.
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            # Stock python, no build step: seed.py is standard library only and mounted
            # from the ConfigMap, so there is nothing to install or publish.
            image:
              repository: docker.io/library/python
              tag: 3.14-slim@sha256:3353bb7e9ae99c7cce6cad2b2f2b174e8f22813ac43e3b13e7a742627d2b01d8
            command:
              - python3
              - /scripts/seed.py
            env:
              TZ: ${TIMEZONE}
              # Nothing is writable, and the log is the only output that matters.
              PYTHONDONTWRITEBYTECODE: "1"
              PYTHONUNBUFFERED: "1"
              UNIMUS_URL: http://unimus:8085
              SEED_SECRETS_DIR: /secrets
              # Data, not secrets: descriptions and the key names to read, so these live in
              # the ConfigMap beside the script that consumes them.
              SEED_DEVICES:
                valueFrom:
                  configMapKeyRef:
                    name: unimus-seed
                    key: devices.json
              SEED_CREDENTIALS:
                valueFrom:
                  configMapKeyRef:
                    name: unimus-seed
                    key: credentials.json
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      # Unlike oxidized, where the device table is templated into a Secret and never
      # touches disk, Unimus keeps its config, HSQLDB and device credentials on this
      # volume, so it is VolSync-backed.
      config:
        existingClaim: unimus
        # Scoped, not global: the claim is ReadWriteOnce, and a global mount would attach
        # it to the seed job too, stalling it off the node already holding the attachment.
        advancedMounts:
          unimus:
            app:
              - path: /etc/unimus
      seed-secrets:
        type: secret
        name: unimus-seed-secret
        defaultMode: 0400
        advancedMounts:
          seed:
            app:
              - path: /secrets
                readOnly: true
      seed-script:
        type: configMap
        name: unimus-seed
        advancedMounts:
          seed:
            app:
              - path: /scripts
                readOnly: true
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        controller: unimus
        ports:
          http:
            port: *port
