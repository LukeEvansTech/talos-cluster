---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Addresses live here, not the unimus-seed ConfigMap, only because this repository is
# public; the ConfigMap's device list carries descriptions and resolves each against a
# key below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unimus-seed
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unimus-seed-secret
    template:
      engineVersion: v2
      data:
        UNIMUS_API_TOKEN: "{{ .UNIMUS_API_TOKEN }}"
        UNIMUS_SSH_KEY: "{{ .UNIMUS_SSH_KEY }}"
        # Second key for the same principal: the core switch's SSH profile never
        # authenticates ed25519, so it alone needs an RSA identity in the pool.
        UNIMUS_RSA_SSH_KEY: "{{ .UNIMUS_RSA_SSH_KEY }}"
        # No SSH key auth on the WiFi controller, so the admin credential Oxidized
        # already holds is reused rather than a second, key-incapable account.
        RUCKUS_USERNAME: "{{ .RUCKUS_USERNAME }}"
        RUCKUS_PASSWORD: "{{ .RUCKUS_PASSWORD }}"
        # An empty value is deliberate, not a misconfiguration: the seed job skips a
        # device whose host is empty rather than creating one that isn't reachable yet.
        ONYX_HOST: "{{ .ONYX_HOST }}"
        MIKROTIK_POE_HOST: "{{ .MIKROTIK_POE_HOST }}"
        MIKROTIK_NONPOE_HOST: "{{ .MIKROTIK_NONPOE_HOST }}"
        OPNSENSE_HOST: "{{ .OPNSENSE_HOST }}"
        TRUENAS_HOST: "{{ .TRUENAS_HOST }}"
        RUCKUS_HOST: "{{ .RUCKUS_HOST }}"
        CHATEAU_HOST: "{{ .CHATEAU_HOST }}"
  # Named one by one rather than extracted wholesale: oxidized carries its own copies
  # of several *_HOST fields which have drifted, so a wholesale extract risks a stale
  # address silently winning and the seed job creating a device pointing elsewhere.
  data:
    - secretKey: RUCKUS_USERNAME
      remoteRef:
        key: oxidized
        property: RUCKUS_USERNAME
    - secretKey: RUCKUS_PASSWORD
      remoteRef:
        key: oxidized
        property: RUCKUS_PASSWORD
  dataFrom:
    - extract:
        key: unimus
