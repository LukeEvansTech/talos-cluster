---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Everything the seed CronJob needs: the API token it authenticates with, the
# credentials it pushes into Unimus, and the device addresses. Addresses are
# secrets here only because this repository is public -- the device list in the
# unimus-seed ConfigMap carries descriptions and nothing else, and the job
# resolves each one against a key below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unimus-seed
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: unimus-seed-secret
    template:
      engineVersion: v2
      data:
        UNIMUS_API_TOKEN: "{{ .UNIMUS_API_TOKEN }}"
        UNIMUS_SSH_KEY: "{{ .UNIMUS_SSH_KEY }}"
        # Second private key for the same principal, used by the core switch
        # alone: its SSH profile never authenticates an ed25519 key, whatever
        # the key is, so that one device needs an RSA identity in the pool.
        UNIMUS_RSA_SSH_KEY: "{{ .UNIMUS_RSA_SSH_KEY }}"
        # The WiFi controller offers no SSH key authentication at all, so the
        # admin credential Oxidized already holds is reused rather than a second
        # account being created for a login it cannot key-authenticate.
        RUCKUS_USERNAME: "{{ .RUCKUS_USERNAME }}"
        RUCKUS_PASSWORD: "{{ .RUCKUS_PASSWORD }}"
        # Device addresses. An empty value is a deliberate state, not a
        # misconfiguration: the seed job skips a device whose host is empty, so
        # a device that is not yet reachable simply is not created.
        ONYX_HOST: "{{ .ONYX_HOST }}"
        MIKROTIK_POE_HOST: "{{ .MIKROTIK_POE_HOST }}"
        MIKROTIK_NONPOE_HOST: "{{ .MIKROTIK_NONPOE_HOST }}"
        OPNSENSE_HOST: "{{ .OPNSENSE_HOST }}"
        TRUENAS_HOST: "{{ .TRUENAS_HOST }}"
        RUCKUS_HOST: "{{ .RUCKUS_HOST }}"
        CHATEAU_HOST: "{{ .CHATEAU_HOST }}"
  # Order matters: on overlapping keys a later extract wins. The oxidized item
  # carries its own copies of several *_HOST fields which have drifted, so it is
  # read first for the Ruckus credential and the unimus item overwrites the
  # addresses with the current ones.
  dataFrom:
    - extract:
        key: oxidized
    - extract:
        key: unimus
