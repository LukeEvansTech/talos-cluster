---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: unimus
spec:
  groups:
    - name: unimus-seed
      rules:
        # A failed reconcile is otherwise invisible: it leaves only a line in the Job's
        # log. Follows the repo's "alert on absence of success" principle (see
        # docker-backup.rules): time since the last success, not a count of failures.
        # 86400s (one schedule interval) plus 2h slack fires at ~26h, tolerating one
        # missed run. Falls back to the CronJob's creation time before any success is
        # recorded, so a seed failing from its very first run still alerts eventually.
        - alert: UnimusSeedStale
          annotations:
            summary: >-
              The Unimus seed CronJob (observability/unimus-seed) has not
              succeeded in over 24h - device and credential reconcile is stale.
            description: >-
              No successful run of the unimus-seed CronJob in over 24h. New
              devices and credential changes from 1Password are no longer
              reaching Unimus. Check the most recent unimus-seed Job's logs and
              the unimus-seed ExternalSecret, fix the cause, then trigger a run.
          expr: |-
            time() - (
              kube_cronjob_status_last_successful_time{namespace="observability", cronjob="unimus-seed"}
              or
              kube_cronjob_created{namespace="observability", cronjob="unimus-seed"}
            ) > 86400
          for: 2h
          labels:
            severity: warning
