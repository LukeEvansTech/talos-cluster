---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
#
# idrac_*_health metrics are an enum, not a boolean: 0=OK, 1=Warning, 2=Critical,
# hence `> 0` throughout rather than `== 1`, so a jump straight to Critical is never missed.
# Temperature thresholds are split by sensor class, measured against the running
# fleet, since one blanket threshold cannot fit the spread (docs/apps/bmc-exporter.md).
# job=~"bmc-exporter.*" is the default; only BmcHostPoweredOff pins job="bmc-exporter"
# to exclude the workstation.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bmc-exporter.rules
spec:
  groups:
    - name: bmc-exporter.rules
      rules:
        # Can't tell the exporter dying from one BMC rejecting the login; the ICMP
        # probes in blackbox-exporter tell a dead BMC from a broken one apart.
        - alert: BmcTargetDown
          annotations:
            summary: "Redfish scrape of {{ $labels.instance }} is failing, check the ICMP probe for the same host to tell a dead BMC from a broken login."
          expr: |-
            up{job=~"bmc-exporter.*"} == 0
          for: 15m
          labels:
            severity: critical
        # The gap this exporter exists to close: ICMP can't tell running from powered-off.
        # Pinned to job="bmc-exporter" to exclude the workstation (helmrelease-workstation.yaml).
        # Gated on 24h-ON history: a retired or cold-spare host stops paging after a day
        # (docs/apps/bmc-exporter.md explains why that beats a hostname list).
        - alert: BmcHostPoweredOff
          annotations:
            summary: "Host behind {{ $labels.instance }} is powered off (was on within 24h)."
          expr: |-
            idrac_system_power_on{job="bmc-exporter"} == 0
            and
            max_over_time(idrac_system_power_on{job="bmc-exporter"}[24h]) == 1
          for: 15m
          labels:
            severity: warning
        - alert: BmcSystemUnhealthy
          annotations:
            summary: "{{ $labels.instance }} reports system health {{ $labels.status }}, check the BMC event log."
          expr: |-
            idrac_system_health{job=~"bmc-exporter.*"} > 0
          for: 15m
          labels:
            severity: warning
        - alert: BmcPowerSupplyUnhealthy
          annotations:
            summary: "PSU {{ $labels.id }} on {{ $labels.instance }} reports {{ $labels.status }}."
          expr: |-
            idrac_power_supply_health{job=~"bmc-exporter.*"} > 0
          for: 15m
          labels:
            severity: warning
        # Redundancy lost, not a PSU fault: the module is healthy but its feed
        # (~237V normal) is gone, as from a tripped breaker or a pulled cable.
        - alert: BmcPowerSupplyInputLost
          annotations:
            summary: "PSU {{ $labels.id }} on {{ $labels.instance }} has lost input voltage. The host is running unprotected on its remaining supply."
          expr: |-
            idrac_power_supply_input_voltage{job=~"bmc-exporter.*"} == 0
          for: 5m
          labels:
            severity: critical
        - alert: BmcFanUnhealthy
          annotations:
            summary: "Fan {{ $labels.name }} on {{ $labels.instance }} reports {{ $labels.status }}."
          expr: |-
            idrac_sensors_fan_health{job=~"bmc-exporter.*"} > 0
          for: 10m
          labels:
            severity: warning
        # Guarded on power state: catches spin-down, not a deliberate shutdown
        # reading as a stopped fan.
        - alert: BmcFanStopped
          annotations:
            summary: "Fan {{ $labels.name }} on {{ $labels.instance }} has stopped while the host is running."
          expr: |-
            idrac_sensors_fan_speed{job=~"bmc-exporter.*"} == 0
            and on (instance) idrac_system_power_on{job=~"bmc-exporter.*"} == 1
          for: 10m
          labels:
            severity: critical
        # CPU packages get their own band (docs/apps/bmc-exporter.md has the measured
        # spread). `CPU[0-9]* Temp` covers a second socket without catching the
        # cooler CPU_VRM0/SOC_VRM rails a bare `CPU` prefix would match.
        - alert: BmcCpuTemperatureHigh
          annotations:
            summary: "{{ $labels.name }} on {{ $labels.instance }} is at {{ $value }}C."
          expr: |-
            idrac_sensors_temperature{job=~"bmc-exporter.*", name=~"CPU[0-9]* Temp"} > 90
            and idrac_sensors_temperature{job=~"bmc-exporter.*", name=~"CPU[0-9]* Temp"} <= 95
          for: 15m
          labels:
            severity: warning
        - alert: BmcCpuTemperatureCritical
          annotations:
            summary: "{{ $labels.name }} on {{ $labels.instance }} is at {{ $value }}C, thermal shutdown territory."
          expr: |-
            idrac_sensors_temperature{job=~"bmc-exporter.*", name=~"CPU[0-9]* Temp"} > 95
          for: 5m
          labels:
            severity: critical
        # Everything but the CPU band; these run far cooler, so 80C leaves real
        # headroom here (docs/apps/bmc-exporter.md).
        - alert: BmcTemperatureHigh
          annotations:
            summary: "{{ $labels.name }} on {{ $labels.instance }} is at {{ $value }}C."
          expr: |-
            idrac_sensors_temperature{job=~"bmc-exporter.*", name!~"CPU[0-9]* Temp"} > 80
            and idrac_sensors_temperature{job=~"bmc-exporter.*", name!~"CPU[0-9]* Temp"} <= 90
          for: 15m
          labels:
            severity: warning
        # Bounded away from the warning: no inhibit_rules here, so an unbounded
        # one would double-page alongside the critical.
        - alert: BmcTemperatureCritical
          annotations:
            summary: "{{ $labels.name }} on {{ $labels.instance }} is at {{ $value }}C, thermal shutdown territory."
          expr: |-
            idrac_sensors_temperature{job=~"bmc-exporter.*", name!~"CPU[0-9]* Temp"} > 90
          for: 5m
          labels:
            severity: critical
        # Catches correctable ECC errors degrading a DIMM before outright failure;
        # nothing else in the estate sees this.
        - alert: BmcMemoryModuleUnhealthy
          annotations:
            summary: "DIMM {{ $labels.id }} on {{ $labels.instance }} reports {{ $labels.status }}, likely ECC errors."
          expr: |-
            idrac_memory_module_health{job=~"bmc-exporter.*"} > 0
          for: 15m
          labels:
            severity: warning
        - alert: BmcCpuUnhealthy
          annotations:
            summary: "CPU {{ $labels.id }} on {{ $labels.instance }} reports {{ $labels.status }}."
          expr: |-
            idrac_cpu_health{job=~"bmc-exporter.*"} > 0
          for: 15m
          labels:
            severity: warning
        # Long `for`: a firmware update or BMC reset trips this briefly and self-resolves.
        - alert: BmcManagerUnhealthy
          annotations:
            summary: "BMC {{ $labels.instance }} reports its own health as {{ $labels.status }}."
          expr: |-
            idrac_manager_health{job=~"bmc-exporter.*"} > 0
          for: 30m
          labels:
            severity: warning
        # idrac_events_log_entry's value is a timestamp; presence, not value, is the signal.
        # Aggregated per fault (job, instance, severity, message), not per SEL entry's own `id`
        # (docs/docs/troubleshooting/kb/037-bmc-event-log-per-entry-alert-storm.md).
        # PWR-0020 ("First AC Power on") excluded by exact code, not the PWR- prefix,
        # which also carries real PSU faults.
        # SYS-0067/69 (OS crash/shutdown) excluded for the workstation only: that's the
        # user's own machine telling them something they saw; servers keep both, since an
        # unattended blue-screen is what this alert exists to catch.
        - alert: BmcEventLogWarning
          annotations:
            summary: "{{ $labels.instance }} logged {{ $value }} {{ $labels.severity }} hardware event(s) in the last 7d: {{ $labels.message }}"
          expr: |-
            count by (job, instance, severity, message) (
              idrac_events_log_entry{job=~"bmc-exporter.*", message!~".*PWR-0020.*"}
              unless
              idrac_events_log_entry{job="bmc-exporter-workstation", message=~".*SYS-006[79].*"}
            ) > 0
          for: 5m
          labels:
            severity: warning
