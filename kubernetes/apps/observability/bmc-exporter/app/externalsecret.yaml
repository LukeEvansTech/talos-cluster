---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Whole idrac.yml is templated here, not a ConfigMap, since it must carry every BMC's login.
# `hosts.default` can't be used: the fleet shares one username but each board has its own password.
# Same per-host 1Password items certwarden already deploys certs from.
# Allowlisted in check_internal_identifiers.py like `probes.yaml`: same nine FQDNs already there.
# `${VAR}` substitutes via Flux postBuild; `{{ . }}` is external-secrets' own templating.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bmc-exporter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bmc-exporter-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        idrac.yml: |
          address: 0.0.0.0
          port: 9348
          # A cold scrape of the X12 board takes ~23s and a warm one ~13s, so the
          # 10s default aborts mid-collection. Kept below the 55s scrape timeout
          # in the ScrapeConfig.
          timeout: 45
          metrics:
            all: true
          # Supermicro SEL entries surface here as idrac_events_log_entry. Bounded
          # deliberately: `message` is a label, so an unfiltered log would be a
          # cardinality risk. warning-and-above over 7d is nothing in steady state.
          events:
            severity: warning
            maxage: 7d
          hosts:
            cr-node-01-ipmi.${SECRET_INTERNAL_DOMAIN}:
              username: "{{ .node01_user }}"
              password: "{{ .node01_pass }}"
            cr-node-02-ipmi.${SECRET_INTERNAL_DOMAIN}:
              username: "{{ .node02_user }}"
              password: "{{ .node02_pass }}"
            cr-node-03-ipmi.${SECRET_INTERNAL_DOMAIN}:
              username: "{{ .node03_user }}"
              password: "{{ .node03_pass }}"
            cr-node-04-ipmi.${SECRET_INTERNAL_DOMAIN}:
              username: "{{ .node04_user }}"
              password: "{{ .node04_pass }}"
            cr-node-05-ipmi.${SECRET_INTERNAL_DOMAIN}:
              username: "{{ .node05_user }}"
              password: "{{ .node05_pass }}"
            cr-node-06-ipmi.${SECRET_INTERNAL_DOMAIN}:
              username: "{{ .node06_user }}"
              password: "{{ .node06_pass }}"
            cr-node-07-ipmi.${SECRET_INTERNAL_DOMAIN}:
              username: "{{ .node07_user }}"
              password: "{{ .node07_pass }}"
            cr-node-08-ipmi.${SECRET_INTERNAL_DOMAIN}:
              username: "{{ .node08_user }}"
              password: "{{ .node08_pass }}"
            cr-storage-ipmi.${SECRET_INTERNAL_DOMAIN}:
              username: "{{ .storage_user }}"
              password: "{{ .storage_pass }}"
            # The firewall's BMC, keyed by name since the cr-fw-ipmi Unbound
            # overrides landed (network-ops, 2026-08-02).
            #
            # A mislabeled duplicate target was removed here (2026-08-02):
            # it resolved to this firewall's BMC, crashing the exporter on a
            # duplicate mapping key.
            cr-fw-ipmi.${SECRET_INTERNAL_DOMAIN}:
              username: "{{ .fwbmc_user }}"
              password: "{{ .fwbmc_pass }}"
  data:
    - secretKey: node01_user
      remoteRef:
        key: cr-node-01-ipmi
        property: IPMI_USERNAME
    - secretKey: node01_pass
      remoteRef:
        key: cr-node-01-ipmi
        property: IPMI_PASSWORD
    - secretKey: node02_user
      remoteRef:
        key: cr-node-02-ipmi
        property: IPMI_USERNAME
    - secretKey: node02_pass
      remoteRef:
        key: cr-node-02-ipmi
        property: IPMI_PASSWORD
    - secretKey: node03_user
      remoteRef:
        key: cr-node-03-ipmi
        property: IPMI_USERNAME
    - secretKey: node03_pass
      remoteRef:
        key: cr-node-03-ipmi
        property: IPMI_PASSWORD
    - secretKey: node04_user
      remoteRef:
        key: cr-node-04-ipmi
        property: IPMI_USERNAME
    - secretKey: node04_pass
      remoteRef:
        key: cr-node-04-ipmi
        property: IPMI_PASSWORD
    - secretKey: node05_user
      remoteRef:
        key: cr-node-05-ipmi
        property: IPMI_USERNAME
    - secretKey: node05_pass
      remoteRef:
        key: cr-node-05-ipmi
        property: IPMI_PASSWORD
    - secretKey: node06_user
      remoteRef:
        key: cr-node-06-ipmi
        property: IPMI_USERNAME
    - secretKey: node06_pass
      remoteRef:
        key: cr-node-06-ipmi
        property: IPMI_PASSWORD
    - secretKey: node07_user
      remoteRef:
        key: cr-node-07-ipmi
        property: IPMI_USERNAME
    - secretKey: node07_pass
      remoteRef:
        key: cr-node-07-ipmi
        property: IPMI_PASSWORD
    - secretKey: node08_user
      remoteRef:
        key: cr-node-08-ipmi
        property: IPMI_USERNAME
    - secretKey: node08_pass
      remoteRef:
        key: cr-node-08-ipmi
        property: IPMI_PASSWORD
    - secretKey: storage_user
      remoteRef:
        key: cr-storage-ipmi
        property: IPMI_USERNAME
    - secretKey: storage_pass
      remoteRef:
        key: cr-storage-ipmi
        property: IPMI_PASSWORD
    - secretKey: fwbmc_user
      remoteRef:
        key: cr-fw-ipmi
        property: IPMI_USERNAME
    - secretKey: fwbmc_pass
      remoteRef:
        key: cr-fw-ipmi
        property: IPMI_PASSWORD
