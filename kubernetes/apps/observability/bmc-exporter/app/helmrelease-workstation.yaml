---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
#
# Separate deployment so the workstation gets its own `job` label: excluding it from
# BmcHostPoweredOff any other way would match on a LAN address (docs/docs/apps/bmc-exporter.md).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bmc-exporter-workstation
spec:
  interval: 1h
  chart:
    spec:
      chart: idrac-exporter
      version: 2.6.3
      sourceRef:
        kind: HelmRepository
        name: idrac-exporter
  values:
    fullnameOverride: *app
    image:
      repository: ghcr.io/mrlhansen/idrac_exporter
      tag: 2.6.3@sha256:7a95f2862f9c1cd2b66c1704781bb7a709ea1fc17a1ae58cecb09fc81c829b91
    existingSecret: bmc-exporter-workstation-config
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    serviceAccount:
      automount: false
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
    prometheus:
      monitor:
        enabled: false
      rules:
        enabled: false
      scrapeConfig:
        enabled: true
        interval: 60s
        scrapeTimeout: 55s
        relabelings:
          - action: replace
            replacement: *app
            targetLabel: job
