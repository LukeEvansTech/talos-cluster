---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Keyed by a 1Password address: this BMC has no internal DNS record (docs/apps/bmc-exporter.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bmc-exporter-workstation
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bmc-exporter-workstation-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        idrac.yml: |
          address: 0.0.0.0
          port: 9348
          timeout: 45
          metrics:
            all: true
          events:
            severity: warning
            maxage: 7d
          hosts:
            "{{ .ws_addr }}":
              username: "{{ .ws_user }}"
              password: "{{ .ws_pass }}"
  data:
    - secretKey: ws_addr
      remoteRef:
        key: workstation-ipmi
        property: IPMI_ADDR
    - secretKey: ws_user
      remoteRef:
        key: workstation-ipmi
        property: IPMI_USERNAME
    - secretKey: ws_pass
      remoteRef:
        key: workstation-ipmi
        property: IPMI_PASSWORD
