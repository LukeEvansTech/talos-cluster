---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
#
# Named bmc-exporter but keeps upstream's `idrac_` metric prefix: renaming it would
# orphan every stored series, so upstream's dashboards still apply unchanged.
# A powered-off host drops all sensor series except idrac_system_power_on 0, which
# the alert rules key off. What the boards return, measured against the fleet, and
# why neither generation has storage metrics: docs/apps/bmc-exporter.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bmc-exporter
spec:
  interval: 1h
  chart:
    spec:
      chart: idrac-exporter
      version: 2.6.3
      sourceRef:
        kind: HelmRepository
        name: idrac-exporter
  values:
    fullnameOverride: *app
    image:
      repository: ghcr.io/mrlhansen/idrac_exporter
      tag: 2.6.3@sha256:7a95f2862f9c1cd2b66c1704781bb7a709ea1fc17a1ae58cecb09fc81c829b91
    # Suppresses the chart's own config Secret, so no BMC login is ever built from git values.
    existingSecret: bmc-exporter-config
    # Needed because the exporter only re-reads its config at startup, not on change.
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    # automount: false since nothing here talks to the Kubernetes API, only outbound
    # HTTPS to the BMCs.
    serviceAccount:
      automount: false
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    prometheus:
      # Off: the chart's ServiceMonitor scrapes /metrics with no ?target=, invalid for
      # a multi-target exporter. Per-target `up` and scrape_errors below cover it.
      monitor:
        enabled: false
      # Alerts live in the standalone PrometheusRule here, not the chart's additionalRules.
      rules:
        enabled: false
      # Targets come from the exporter's own /discover endpoint: one source of truth,
      # no second host list to drift out of step with the ExternalSecret.
      #
      # 60s/55s, not the usual 30s: scrapes run longer than that on this hardware
      # (docs/apps/bmc-exporter.md).
      scrapeConfig:
        enabled: true
        interval: 60s
        scrapeTimeout: 55s
        # Sets job explicitly; otherwise the operator names it scrapeConfig/<ns>/<name>
        # (same as nut-appliance).
        relabelings:
          - action: replace
            replacement: *app
            targetLabel: job
