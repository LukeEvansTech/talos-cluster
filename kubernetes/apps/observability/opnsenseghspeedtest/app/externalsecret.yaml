---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opnsenseghspeedtest
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: opnsenseghspeedtest-secret
    template:
      data:
        # json_exporter has no env or file indirection for basic auth, so the config is rendered here.
        config.yml: |
          modules:
            speedtest:
              http_client_config:
                basic_auth:
                  username: "{{ .api_key }}"
                  password: "{{ .api_secret }}"
                # OPNsense ships a self-signed cert by default.
                tls_config:
                  insecure_skip_verify: true
              metrics:
                - name: opnsense_speedtest_download_mbps
                  valuetype: gauge
                  help: Download speed of the most recent test in Mbit/s.
                  path: '{ .download }'
                - name: opnsense_speedtest_upload_mbps
                  valuetype: gauge
                  help: Upload speed of the most recent test in Mbit/s.
                  path: '{ .upload }'
                - name: opnsense_speedtest_latency_ms
                  valuetype: gauge
                  help: Latency of the most recent test in milliseconds.
                  path: '{ .latency }'
                - name: opnsense_speedtest_last
                  valuetype: gauge
                  help: Constant 1 carrying the UTC time of the most recent test as a label.
                  type: object
                  path: '{ @ }'
                  labels:
                    date: '{ .date }'
                  values:
                    info: 1
  dataFrom:
    - extract:
        key: opnsensegh-exporter
