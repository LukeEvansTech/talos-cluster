---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name veeam-windows-exporter
spec:
  # windows_exporter's textfile collector serves veeam_backup_* from a scheduled task that
  # parses the Windows event log every 10 minutes.
  staticConfigs:
    - targets:
        - ${SECRET_VEEAM_HOST}:9182
  metricsPath: /metrics
  scrapeInterval: 60s
  scrapeTimeout: 30s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: veeam-server
