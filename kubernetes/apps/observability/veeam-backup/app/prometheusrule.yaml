---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: veeam-backup.rules
spec:
  groups:
    # Models docker-backup.rules: the core rules alert on the absence of a successful run.
    # The Aug 2026 outage is KB-067; every rule pages, so each should fire almost never.
    - name: veeam-backup.rules
      rules:
        # 36h tolerates one missed nightly run plus 12h slack, so a transient failure self-heals.
        # Added after the Aug 2026 BSOD (KB-067); VeeamBackupMetricsMissing takes over once stale.
        - alert: VeeamBackupStale
          annotations:
            summary: >-
              No successful run of Veeam job "{{ $labels.veeam_job }}" in over 36h.
              backups are stale.
          expr: |-
            time() - veeam_backup_last_success_timestamp_seconds{job="veeam-windows-exporter"} > 129600
          for: 30m
          labels:
            severity: critical
        # Backstops Veeam's failure email if mail breaks; Warning stays unpaged since it still
        # wrote a restore point and already emails.
        - alert: VeeamBackupFailed
          annotations:
            summary: >-
              Last run of Veeam job "{{ $labels.veeam_job }}" finished Failed.
          expr: |-
            veeam_backup_last_result_code{job="veeam-windows-exporter"} == 2
          for: 15m
          labels:
            severity: critical
        # Bare absent() is fine for one box; VeeamServerGuestDown/LanProbeFailed page real outages.
        - alert: VeeamBackupMetricsMissing
          annotations:
            summary: >-
              Veeam backup metrics absent for 2h. Cannot tell whether backups are running.
          expr: |-
            absent(veeam_backup_last_success_timestamp_seconds{job="veeam-windows-exporter"})
          for: 2h
          labels:
            severity: warning
        # Catches the exporter dying while the guest/Veeam stay up; 30m keeps a reboot from paging.
        - alert: VeeamWindowsExporterDown
          annotations:
            summary: >-
              windows_exporter on the Veeam server is not being scraped.
          expr: |-
            up{job="veeam-windows-exporter"} == 0
          for: 30m
          labels:
            severity: warning
