---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmalert
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: vmalert
  dependsOn:
    - name: victoria-logs
  values:
    fullnameOverride: vmalert
    serviceMonitor:
      enabled: true
    server:
      datasource:
        url: http://victoria-logs-server.observability.svc.cluster.local:9428
      notifier:
        url: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      config:
        alerts:
          groups:
            # Absence-of-success for apps that log their work but export no metrics (docs/docs/apps/yourspotify.md).
            - name: yourspotify
              type: vlogs
              interval: 5m
              rules:
                - alert: YourSpotifyNotRecording
                  # Counts completed syncs ("no new music" or the "N tracks" summary), not "refreshing...",
                  # which is logged before the token check. stats count() returns c=0 on an empty match.
                  expr: >-
                    _time:24h {kubernetes.pod_namespace="media",kubernetes.pod_name=~"yourspotify-server-.+"}
                    ~`\]: (no new music|[0-9]+ tracks, [0-9]+ albums, [0-9]+ artists)$`
                    | stats count() as c | filter c:0
                  for: 10m
                  labels:
                    severity: warning
                    namespace: media
                  annotations:
                    summary: "YourSpotify has completed no sync in 24h, so no listens are being recorded."
                - alert: YourSpotifyNoUsers
                  # Every sync-loop line of the last hour said 0 users: the account vanished (2026-09-22,
                  # four weeks unnoticed). A restart that logs one non-zero line clears it.
                  expr: >-
                    _time:1h {kubernetes.pod_namespace="media",kubernetes.pod_name=~"yourspotify-server-.+"}
                    "[DbLoop] starting for" | stats count() if ("starting for 0 users") as zero,
                    count() if (!"starting for 0 users") as active | filter zero:>0 active:0 | fields zero
                  for: 5m
                  labels:
                    severity: warning
                    namespace: media
                  annotations:
                    summary: "YourSpotify's sync loop has run for 0 users for the last hour; log in again to recreate the account."
            - name: epicgames
              type: vlogs
              interval: 5m
              rules:
                - alert: EpicGamesNotClaiming
                  # Runs every 6h. Both lines follow login and the offer fetch; "Exiting successfully" is
                  # logged even when the account failed. 12h tolerates one missed run.
                  expr: >-
                    _time:12h {kubernetes.pod_namespace="games",kubernetes.pod_name=~"epicgames-.+"}
                    ("INFO: No free games available" OR "INFO: Dispatching checkout notification")
                    | stats count() as c | filter c:0
                  for: 10m
                  labels:
                    severity: warning
                    namespace: games
                  annotations:
                    summary: "epicgames has completed no logged-in check in 12h, so free games are not being claimed."
            - name: repowiki
              type: vlogs
              interval: 5m
              rules:
                - alert: RepowikiNotCommitting
                  # A failed repository is logged and skipped and the Job still succeeds, so count commits.
                  # Runs every 12h; the largest gap between commits over 14 days was 21h. "0 to regenerate" is
                  # not treated as healthy: a failed lookup also logs it, and no run has been idle since October.
                  expr: >-
                    _time:36h {kubernetes.pod_namespace="ai",kubernetes.pod_name=~"repowiki-repowiki-gen-.+"}
                    "  committed " | stats count() as c | filter c:0
                  for: 10m
                  labels:
                    severity: warning
                    namespace: ai
                  annotations:
                    summary: "repowiki has committed no regenerated wiki in 36h; check the repowiki-repowiki-gen Job logs for skipped repositories."
            - name: domainpulse
              type: vlogs
              interval: 5m
              rules:
                - alert: DomainPulseScanStale
                  # Daily scan at 02:00; a completion that scanned 0 domains does not count. 48h tolerates
                  # one missed run.
                  expr: >-
                    _time:48h {kubernetes.pod_namespace="custom",kubernetes.pod_name=~"domainpulse-.+"}
                    ~"Scheduled scan completed: [1-9]" | stats count() as c | filter c:0
                  for: 10m
                  labels:
                    severity: warning
                    namespace: custom
                  annotations:
                    summary: "DomainPulse has completed no scheduled domain scan in 48h, so its security results are stale."
