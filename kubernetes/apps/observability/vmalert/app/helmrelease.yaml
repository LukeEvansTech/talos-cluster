---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmalert
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: vmalert
  dependsOn:
    - name: victoria-logs
  values:
    fullnameOverride: vmalert
    serviceMonitor:
      enabled: true
    server:
      datasource:
        url: http://victoria-logs-server.observability.svc.cluster.local:9428
      notifier:
        url: http://kube-prometheus-stack-alertmanager.observability.svc.cluster.local:9093
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      config:
        alerts:
          groups:
            # Absence-of-success for apps that log their work but export no metrics (docs/docs/apps/yourspotify.md).
            - name: yourspotify
              type: vlogs
              interval: 5m
              rules:
                - alert: YourSpotifyNotRecording
                  # Counts completed syncs ("no new music" or the "N tracks" summary), not "refreshing...",
                  # which is logged before the token check. stats count() returns c=0 on an empty match.
                  expr: >-
                    _time:24h {kubernetes.pod_namespace="media",kubernetes.pod_name=~"yourspotify-server-.+"}
                    ~`\]: (no new music|[0-9]+ tracks, [0-9]+ albums, [0-9]+ artists)$`
                    | stats count() as c | filter c:0
                  for: 10m
                  labels:
                    severity: warning
                    namespace: media
                  annotations:
                    summary: "YourSpotify has completed no sync in 24h, so no listens are being recorded."
                - alert: YourSpotifyNoUsers
                  # Every sync-loop line of the last hour said 0 users: the account vanished (2026-09-22,
                  # four weeks unnoticed). A restart that logs one non-zero line clears it.
                  expr: >-
                    _time:1h {kubernetes.pod_namespace="media",kubernetes.pod_name=~"yourspotify-server-.+"}
                    "[DbLoop] starting for" | stats count() if ("starting for 0 users") as zero,
                    count() if (!"starting for 0 users") as active | filter zero:>0 active:0 | fields zero
                  for: 5m
                  labels:
                    severity: warning
                    namespace: media
                  annotations:
                    summary: "YourSpotify's sync loop has run for 0 users for the last hour; log in again to recreate the account."
            - name: epicgames
              type: vlogs
              interval: 5m
              rules:
                - alert: EpicGamesNotClaiming
                  # "Exiting successfully" is logged even when login or the checkout mail failed (mail failed
                  # 2026-10-22 to 11-08 unnoticed), so count delivered results. Runs every 6h; 12h is one missed run.
                  expr: >-
                    _time:12h {kubernetes.pod_namespace="games",kubernetes.pod_name=~"epicgames-.+"}
                    | stats count() if ("INFO: No free games available") as idle,
                    count() if ("INFO: Dispatching checkout notification") as sent,
                    count() if ("ERROR: Error sending email") as failed
                    | math idle + max(sent - failed, 0) as ok | filter ok:<=0 | fields ok
                  for: 10m
                  labels:
                    severity: warning
                    namespace: games
                  annotations:
                    summary: "epicgames has completed no check in 12h that logged in and delivered its result; check its logs for a login or mail failure."
            - name: repowiki
              type: vlogs
              interval: 5m
              rules:
                - alert: RepowikiNotCommitting
                  # A failed repository is logged and skipped and the Job still succeeds, so count commits.
                  # Runs every 12h; the largest gap between commits over 14 days was 21h. "0 to regenerate" is
                  # not treated as healthy: a failed lookup also logs it, and no run has been idle since October.
                  expr: >-
                    _time:36h {kubernetes.pod_namespace="ai",kubernetes.pod_name=~"repowiki-repowiki-gen-.+"}
                    "  committed " | stats count() as c | filter c:0
                  for: 10m
                  labels:
                    severity: warning
                    namespace: ai
                  annotations:
                    summary: "repowiki has committed no regenerated wiki in 36h; check the repowiki-repowiki-gen Job logs for skipped repositories."
            - name: domainpulse
              type: vlogs
              interval: 5m
              rules:
                - alert: DomainPulseScanStale
                  # Daily scan at 02:00; a completion that scanned 0 domains does not count. 48h tolerates
                  # one missed run.
                  expr: >-
                    _time:48h {kubernetes.pod_namespace="custom",kubernetes.pod_name=~"domainpulse-.+"}
                    ~"Scheduled scan completed: [1-9]" | stats count() as c | filter c:0
                  for: 10m
                  labels:
                    severity: warning
                    namespace: custom
                  annotations:
                    summary: "DomainPulse has completed no scheduled domain scan in 48h, so its security results are stale."
            # Run records written by scheduled agent runs, one stream per loop. Rules stay generic:
            # a loop registers itself through its own records and states its allowance in max_age_s.
            - name: loops
              type: vlogs
              interval: 5m
              rules:
                - alert: LoopStale
                  # Age of the last success against the loop's newest max_age_s (24h when unset). A loop
                  # that never succeeded ages from its first record; one retired since its last start is skipped.
                  expr: >-
                    _time:28d {app="loops"}
                    | stats by (loop) max(_time) if (event:=finish outcome:in(changed,nothing)) as last_ok,
                    min(_time) as first_seen, max(_time) if (event:=retire) as retired,
                    max(_time) if (event:=start) as last_start,
                    row_max(_time, max_age_s) if (max_age_s:*) as cfg
                    | unpack_json from cfg fields (max_age_s)
                    | math round((now() - (last_ok default first_seen)) / 1e9) as age_s,
                    (retired default 0) - (last_start default 1) as retired_after,
                    age_s - (max_age_s default 86400) as over
                    | filter over:>0 retired_after:<0 | fields loop, age_s
                  for: 10m
                  labels:
                    severity: warning
                    namespace: observability
                  annotations:
                    summary: "Loop {{ $labels.loop }} has not completed a successful run within its allowed interval; last success {{ $value | humanizeDuration }} ago. Check the task still fires and read its last run log."
                - alert: LoopFailed
                  # The 15m window is three evaluations, so one slow evaluation cannot miss a failure.
                  # pushover_event: the alert clears when the window passes, which is not a recovery.
                  expr: >-
                    _time:15m {app="loops"} event:=finish outcome:=failed
                    | stats by (loop) count() as runs | fields loop, runs
                  labels:
                    severity: warning
                    namespace: observability
                    pushover_event: "true"
                  annotations:
                    summary: "Loop {{ $labels.loop }} finished a run with outcome failed; read its last run log."
                - alert: LoopNeedsHuman
                  # needs_human is grouped on so the text reaches the notification as a label.
                  expr: >-
                    _time:30m {app="loops"} event:=finish needs_human:*
                    | stats by (loop, needs_human) count() as runs | fields loop, needs_human, runs
                  labels:
                    severity: warning
                    namespace: observability
                    pushover_event: "true"
                  annotations:
                    summary: "Loop {{ $labels.loop }} needs a decision from a person: {{ $labels.needs_human }}"
