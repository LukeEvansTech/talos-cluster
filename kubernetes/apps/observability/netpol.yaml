---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cross-namespace-ingress
spec:
  # `fromEntities: world` was for NUT clients reaching an in-cluster LoadBalancer that no longer
  # exists; left as-is on purpose, since tightening it is a blast-radius change for the namespace.
  description: "Allow ingress from gateway and from world (see note above)"
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
    - fromEntities:
        - world
