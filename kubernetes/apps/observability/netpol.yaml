---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cross-namespace-ingress
spec:
  # `fromEntities: world` was for NUT clients reaching an in-cluster LoadBalancer that no longer
  # exists; left as-is on purpose, since tightening it is a blast-radius change for the namespace.
  description: "Allow ingress from gateway and from world (see note above)"
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
    - fromEntities:
        - world
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-in-cluster-consumers
spec:
  # By namespace, not app: grafana, seedbox-pull and the rook operator carry no app.kubernetes.io/name.
  description: "Allow in-cluster consumers of Prometheus, Alertmanager and Grafana (homepage, Flux, tuppr, rook, toolhive, seedbox-pull)"
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: In
              values:
                - ai
                - default
                - downloads
                - flux-system
                - rook-ceph
                - system-upgrade
