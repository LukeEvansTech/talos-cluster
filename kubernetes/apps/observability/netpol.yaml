---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cross-namespace-ingress
spec:
  description: "Allow ingress from gateway (network namespace)"
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-in-cluster-consumers
spec:
  # By namespace, not app: grafana, seedbox-pull and the rook operator carry no app.kubernetes.io/name.
  description: "Allow in-cluster consumers of Prometheus, Alertmanager and Grafana (homepage, Flux, tuppr, rook, toolhive, seedbox-pull)"
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: In
              values:
                - ai
                - default
                - downloads
                - flux-system
                - rook-ceph
                - system-upgrade
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-world-ingress
spec:
  description: "Allow world ingress only to the pod behind this namespace's LoadBalancer service"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs-single
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "5514"
              protocol: TCP
            - port: "5514"
              protocol: UDP
