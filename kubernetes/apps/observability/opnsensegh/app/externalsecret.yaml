---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opnsensegh
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: opnsensegh-secret
    template:
      data:
        # Same least-privilege group as the main firewall's exporter key. The host is the egress
        # Service, not the item's LAN address, which pods cannot route to.
        OPNSENSE_EXPORTER_OPS_API_KEY: "{{ .api_key }}"
        OPNSENSE_EXPORTER_OPS_API_SECRET: "{{ .api_secret }}"
        OPNSENSE_EXPORTER_OPS_API: opnsensegh-fw.observability.svc.cluster.local
  dataFrom:
    - extract:
        key: opnsensegh-exporter
