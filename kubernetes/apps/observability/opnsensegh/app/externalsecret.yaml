---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opnsensegh
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: opnsensegh-secret
    template:
      data:
        # Reached over the site-to-site IPsec tunnel on the main firewall; see docs/docs/apps/opnsensegh.md.
        OPNSENSE_EXPORTER_OPS_API_KEY: "{{ .api_key }}"
        OPNSENSE_EXPORTER_OPS_API_SECRET: "{{ .api_secret }}"
        OPNSENSE_EXPORTER_OPS_API: "{{ .host }}"
  dataFrom:
    - extract:
        key: opnsensegh-exporter
