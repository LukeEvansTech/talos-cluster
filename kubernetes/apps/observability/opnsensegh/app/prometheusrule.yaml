---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: opnsensegh.rules
spec:
  groups:
    - name: opnsensegh.rules
      rules:
        # A missing gateway series on a good scrape is the API-failure signal; opnsense_up misreads
        # this firewall (upstream AthennaMind/opnsense-exporter#119), see docs/docs/apps/opnsensegh.md.
        - alert: OPNsenseGhExporterDown
          annotations:
            summary: "opnsensegh metrics are missing or the exporter cannot reach its API."
          expr: |-
            up{job="opnsensegh"} == 0
            or
            absent(up{job="opnsensegh"})
            or
            (
              absent(opnsense_gateways_status{job="opnsensegh", name="WAN_DHCP"})
              and on()
              up{job="opnsensegh"} == 1
            )
          for: 10m
          labels:
            severity: warning
        # Same threshold as the main firewall's OPNsenseWanGatewayLossHigh.
        - alert: OPNsenseGhWanLossHigh
          annotations:
            summary: "opnsensegh WAN packet loss at {{ $value }}% for 10m."
          expr: |-
            opnsense_gateways_loss_percentage{job="opnsensegh", name="WAN_DHCP"} > 20
          for: 10m
          labels:
            severity: warning
