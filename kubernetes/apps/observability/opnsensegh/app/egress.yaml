---
# Tailscale operator egress proxy: pods have no route to this target, see docs/docs/apps/opnsensegh.md.
apiVersion: v1
kind: Service
metadata:
  name: opnsensegh-fw
  annotations:
    tailscale.com/tailnet-ip: ${GH_OPNSENSE_ADDR}
    tailscale.com/proxy-class: accept-routes
    checkov.io/skip1: CKV_K8S_21=Namespace provided by Flux Kustomization targetNamespace
spec:
  type: ExternalName
  externalName: placeholder
