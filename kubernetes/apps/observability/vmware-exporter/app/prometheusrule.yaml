---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vmware-exporter.rules
spec:
  groups:
    - name: vmware-exporter.rules
      rules:
        - alert: VMwareExporterDown
          annotations:
            summary: "VMware exporter scrape of {{ $labels.instance }} is failing."
          # 15m rides out an occasional slow pryorda scrape rather than a real outage.
          expr: |-
            up{job="vmware-exporter"} == 0
          for: 15m
          labels:
            severity: critical
        - alert: VMwareDatastoreLowSpace
          annotations:
            summary: "Datastore {{ $labels.ds_name }} has less than 10% free space."
          expr: |-
            (
              vmware_datastore_freespace_size{job="vmware-exporter"}
              /
              vmware_datastore_capacity_size{job="vmware-exporter"}
            ) < 0.10
          for: 30m
          labels:
            severity: warning
        - alert: VMwareHostPoweredOff
          annotations:
            summary: "ESXi host {{ $labels.host_name }} is not powered on."
          # vmware_host_power_state == 1 is poweredOn, unconfirmed against live metrics.
          expr: |-
            vmware_host_power_state{job="vmware-exporter"} != 1
          for: 5m
          labels:
            severity: critical
        # toolsNotRunning also covers a powered-off VM (verified live), catching a BSOD or a
        # shutdown alike; see KB-069 for the outage this alert was added for.
        # No absent(): exporter-down is already VMwareExporterDown, and absent() would show
        # toolsOk in the annotation instead of the missing series.
        # VM name comes from cluster-secrets, keeping the vCenter inventory name out of this
        # public repo.
        - alert: VeeamServerGuestDown
          annotations:
            summary: >-
              Veeam B&R server guest is not running (VMware Tools {{ $labels.tools_status }}).
              Check the VM console; backups are not happening.
          expr: |-
            vmware_vm_guest_tools_running_status{job="vmware-exporter", vm_name="${SECRET_VEEAM_VM_NAME}", tools_status!="toolsOk"} == 1
          for: 15m
          labels:
            severity: critical
        - alert: VMwareSnapshotAgeHigh
          annotations:
            summary: "VM {{ $labels.vm_name }} has a snapshot older than 7 days."
          expr: |-
            (time() - vmware_vm_snapshot_timestamp_seconds{job="vmware-exporter"}) > (7 * 24 * 3600)
          for: 1h
          labels:
            severity: warning
