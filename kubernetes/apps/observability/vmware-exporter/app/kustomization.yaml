---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./grafanadashboard.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./prometheusrule.yaml
  - ./servicemonitor.yaml
configMapGenerator:
  - name: vmware-exporter-dashboards
    files:
      - cluster.json=./dashboards/cluster.json
      - esxi.json=./dashboards/esxi.json
      - virtualmachine.json=./dashboards/virtualmachine.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # Grafana's own ${datasource}/${__interval} macros would be blanked by Flux substitution.
    kustomize.toolkit.fluxcd.io/substitute: disabled
