---
# Vendored from pryorda/vmware_exporter v0.18.4 rather than imported via `url:`; see KB-021 for
# why (the upstream JSON hard-codes its $datasource template variable to "Prometheus").
# https://github.com/pryorda/vmware_exporter/tree/v0.18.4/dashboards
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: vmware-exporter-cluster
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  resyncPeriod: 1h
  configMapRef:
    name: vmware-exporter-dashboards
    key: cluster.json
