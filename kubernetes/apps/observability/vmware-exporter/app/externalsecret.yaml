---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vmware-exporter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: vmware-exporter-secret
    template:
      data:
        # Key names match pryorda/vmware_exporter's expected env vars (envFrom below).
        # Backed by vsphere-monitoring: a read-only account, not the vsphere-terraform admin.
        VSPHERE_USER: "{{ .username }}"
        VSPHERE_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: vsphere-monitoring
