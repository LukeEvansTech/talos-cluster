---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dnsblockcheck
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dnsblockcheck-secret
    template:
      data:
        # NEXTDNS_URL is https://link-ip.nextdns.io/<profile>/<key>; only the profile is needed here.
        NEXTDNS_PROFILE: '{{ index (splitList "/" .NEXTDNS_URL) 3 }}'
  dataFrom:
    - extract:
        key: nextdns
