---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pushoverquota
spec:
  groups:
    - name: pushoverquota
      # Routed to email by alertmanagerconfig.yaml: these fire when Pushover itself is the problem.
      rules:
        - alert: PushoverQuotaLow
          annotations:
            description: >-
              Per-sender burn: sum by (target) (increase(chaski_target_sends_total[6h])). Alertmanager
              and other direct senders are not in that metric. The fix is in the PushoverQuota row of known-noise.md.
            summary: "Pushover has {{ $value | humanizePercentage }} of its monthly messages left; every estate app shares it."
          expr: pushover_messages_remaining / pushover_message_limit < 0.2
          for: 15m
          labels:
            severity: warning
        - alert: PushoverQuotaPaceHigh
          annotations:
            description: >-
              Per-sender burn: sum by (target) (increase(chaski_target_sends_total[24h])). Alertmanager
              and other direct senders are not in that metric. The fix is in the PushoverQuota row of known-noise.md.
            summary: "At the last 24h rate Pushover runs out before its monthly reset (projected {{ $value | humanize }} messages left)."
          # The subquery joins the series across exporter pod restarts. A 6h window on a fresh pod
          # forecast an hour's burst over the whole month and fired falsely (2026-11-02).
          expr: >-
            predict_linear(max without (pod, instance) (pushover_messages_remaining)[24h:5m],
              scalar(max(pushover_limit_reset_timestamp_seconds) - time())) < 0
          for: 1h
          labels:
            severity: warning
        - alert: PushoverQuotaExhausted
          annotations:
            summary: "Pushover's monthly quota is spent: no alert reaches the phone until it resets."
          expr: pushover_messages_remaining == 0
          for: 5m
          labels:
            severity: critical
        - alert: PushoverQuotaUnknown
          annotations:
            summary: "The Pushover quota has not been read for over an hour, so a low quota would go unnoticed."
          expr: >-
            (time() - pushover_last_success_timestamp_seconds > 3600)
            or absent(pushover_last_success_timestamp_seconds)
          for: 15m
          labels:
            severity: warning
