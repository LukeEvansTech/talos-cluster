---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pushoverquota
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: pushoverquota
  values:
    controllers:
      pushoverquota:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: python
              tag: 3.15-alpine@sha256:ff4d3c9b1a48f646eedd93182aaea385c7a5452f4c8a8cd7cef686babacf4928
            command:
              - "python"
              - "-u"
              - "/opt/exporter/exporter.py"
            env:
              METRICS_PORT: &port 9185
              POLL_INTERVAL_SECONDS: "300"
            envFrom:
              - secretRef:
                  name: pushoverquota-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /metrics, port: *port }
                  initialDelaySeconds: 10
                  periodSeconds: 60
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
    service:
      app:
        ports:
          metrics:
            port: *port
    persistence:
      exporter:
        type: configMap
        name: pushoverquota-exporter
        globalMounts:
          - path: /opt/exporter
            readOnly: true
