---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: &app seedbox-qbittorrent-exporter
  labels:
    app.kubernetes.io/name: *app
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: *app
  endpoints:
    - port: metrics
      scheme: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
      relabelings:
        # Disambiguate from the cluster qBittorrent's sidecar exporter.
        - action: replace
          targetLabel: job
          replacement: seedbox-qbittorrent
        - action: replace
          targetLabel: instance
          replacement: seedbox
      metricRelabelings:
        # Nothing read per-torrent series, and every cull churns them (36k cut to 5.5k, 2026-08-27).
        # A keep-list could remove `up`, so this is a drop-list. After a bump: docs/apps/seedbox.md.
        - action: drop
          sourceLabels:
            - __name__
          regex: qbittorrent_torrent_(?:added_on|amount_left_bytes|completed_on|download_speed_bytes|eta|leechers|popularity|progress|seeders|session_downloaded_bytes|session_uploaded_bytes|tags|time_active|total_downloaded_bytes|upload_speed_bytes)
