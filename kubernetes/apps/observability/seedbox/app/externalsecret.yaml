---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seedbox-qbittorrent-exporter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: seedbox-qbittorrent-exporter-secret
    template:
      data:
        # A manual copy of the Seedbox vault item, since Connect reads only Talos. Rotate both.
        QBITTORRENT_USERNAME: "{{ .username }}"
        QBITTORRENT_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: seedbox-monitoring
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seedbox-backrest
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: seedbox-backrest-secret
    template:
      data:
        # A manual copy of the box's Backrest login. Rotate the source first, then this, or scrapes
        # get 401. It is an API Credential item because that category keeps no password history.
        username: "{{ .username }}"
        password: "{{ .credential }}"
  dataFrom:
    - extract:
        key: seedbox-backrest-monitoring
