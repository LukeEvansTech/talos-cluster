---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seedbox-qbittorrent-exporter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: seedbox-qbittorrent-exporter-secret
    template:
      data:
        # seedbox-monitoring MANUALLY mirrors op://Seedbox/qbittorrent (Connect
        # serves only Talos), update BOTH on password rotation.
        QBITTORRENT_USERNAME: "{{ .username }}"
        QBITTORRENT_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: seedbox-monitoring
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seedbox-backrest
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: seedbox-backrest-secret
    template:
      data:
        # seedbox-backrest-monitoring MANUALLY mirrors the Backrest UI login from
        # the seedbox vault, for the same reason as the qBittorrent item above:
        # Connect is scoped to the Talos vault only (verified against the live
        # ClusterSecretStore, `vaults: {Talos: 1}`), so an ExternalSecret cannot
        # reach the vault the box itself deploys from.
        #
        # ROTATION: change it at the source FIRST — that is what the box renders
        # its bcrypt hash from — then update the mirror. Both, or this scrape 401s.
        # The mirror is an API Credential item on purpose: that category has no
        # password field, so no 1Password password history can accrue on it.
        username: "{{ .username }}"
        password: "{{ .credential }}"
  dataFrom:
    - extract:
        key: seedbox-backrest-monitoring
