---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seedbox-qbittorrent-exporter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: seedbox-qbittorrent-exporter-secret
    template:
      data:
        # Manual mirror of the Seedbox vault item (Connect reads only Talos): update both on rotation.
        QBITTORRENT_USERNAME: "{{ .username }}"
        QBITTORRENT_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: seedbox-monitoring
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seedbox-backrest
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: seedbox-backrest-secret
    template:
      data:
        # Manual mirror of the box's Backrest login: rotate the source first, then this, or scrapes 401.
        # API Credential category on purpose: no password field, so no password history accrues.
        username: "{{ .username }}"
        password: "{{ .credential }}"
  dataFrom:
    - extract:
        key: seedbox-backrest-monitoring
