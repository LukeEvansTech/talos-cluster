---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: seedbox-public
spec:
  # The public IP bypasses the tailnet, so SeedboxDown fires for a real outage and not a DERP blip.
  # Port 22 is reliably open and firewalled to stay that way.
  jobName: seedbox-public
  interval: 1m
  module: tcp_connect
  prober:
    url: blackbox-exporter-lan.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - ${SEEDBOX_PUBLIC_IP}:22
  metricRelabelings:
    - action: replace
      replacement: seedbox
      targetLabel: service
