---
# Pods cannot reach tailnet IPs, so the Tailscale operator proxies every seedbox port here.
apiVersion: v1
kind: Service
metadata:
  name: seedbox
  annotations:
    tailscale.com/tailnet-ip: ${SEEDBOX_TAILNET_ADDR}
    checkov.io/skip1: CKV_K8S_21=Namespace provided by Flux Kustomization targetNamespace
spec:
  type: ExternalName
  externalName: placeholder
