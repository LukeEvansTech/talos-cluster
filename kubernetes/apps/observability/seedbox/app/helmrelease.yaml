---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app seedbox-qbittorrent-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      seedbox-qbittorrent-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/martabal/qbittorrent-exporter
              tag: v2.0.4@sha256:9289fc5ad5cef7af6af5af5ab5ed7b8d609827490ba374df858905d66da7ec5f
            env:
              QBITTORRENT_BASE_URL: http://seedbox.observability.svc.cluster.local:8080
              QBITTORRENT_COOKIE_NAME: QBT_SID_8080
              EXPORTER_PORT: &port 9710
              # Per-torrent tracker fetches blocked startup under iowait and crashlooped the
              # exporter (2026-07-08). No dashboard uses tracker metrics.
              ENABLE_TRACKER: "false"
              ENABLE_LABEL_WITH_TRACKER: "false"
              # Nothing reads these high-cardinality series.
              ENABLE_HIGH_CARDINALITY: "false"
            envFrom:
              - secretRef:
                  name: seedbox-qbittorrent-exporter-secret
            # The startup qBit fetch lags under iowait, and the default 1s TCP probe
            # killed the exporter before it could bind.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          metrics:
            port: *port
            protocol: TCP
