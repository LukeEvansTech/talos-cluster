# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name seedbox-smartctl
spec:
  # SMART sector counts give warning before mdstat sees a dropped disk.
  staticConfigs:
    - targets:
        - seedbox.observability.svc.cluster.local:9633
  metricsPath: /metrics
  # SMART attributes change over days, and each scrape shells out to four disks.
  scrapeInterval: 300s
  scrapeTimeout: 30s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: seedbox
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name seedbox-docker
spec:
  # The estate's container-lifecycle alerts need container_state_*, which netdata does not provide.
  staticConfigs:
    - targets:
        - seedbox.observability.svc.cluster.local:9419
  metricsPath: /metrics
  scrapeInterval: 60s
  scrapeTimeout: 30s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: seedbox
  metricRelabelings:
    # This is an allow-list, so add a new container label here before any rule uses it. The doco-cd
    # manager label scopes alerts; alerts_oneshot drives the SeedboxContainerDown exclusion.
    - action: labelkeep
      regex: __name__|job|instance|name|status|health_status|container_label_cd_doco_metadata_manager|container_label_alerts_oneshot
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name seedbox-prowlarr
spec:
  # Prowlarr's own /metrics returns the web UI's HTML, so exportarr is the only metrics source.
  staticConfigs:
    - targets:
        - seedbox.observability.svc.cluster.local:9707
  metricsPath: /metrics
  scrapeInterval: 60s
  scrapeTimeout: 30s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: seedbox
  metricRelabelings:
    # exportarr adds the target URL to every series, which duplicates instance and leaks an address.
    - action: labeldrop
      regex: url
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name seedbox-backrest
spec:
  # This is the only source of forget, prune and check results; the textfile metrics cover backups.
  # A host-side prerequisite is documented in the private host repository.
  staticConfigs:
    - targets:
        - seedbox.observability.svc.cluster.local:9898
  metricsPath: /metrics
  basicAuth:
    username:
      name: seedbox-backrest-secret
      key: username
    password:
      name: seedbox-backrest-secret
      key: password
  scrapeInterval: 60s
  scrapeTimeout: 30s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: seedbox
