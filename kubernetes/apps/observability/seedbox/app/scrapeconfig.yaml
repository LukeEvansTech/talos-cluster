---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name seedbox-node
spec:
  staticConfigs:
    - targets:
        - seedbox.observability.svc.cluster.local:9100
  metricsPath: /metrics
  scrapeInterval: 60s
  # Tailnet scrapes exceed 10s under torrent iowait, and the 30s timeout stops false up=0 flaps.
  scrapeTimeout: 30s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: seedbox
  # The ceph-mixin node alerts join on node_uname_info, so dropping it keeps the torrent disk out.
  metricRelabelings:
    - action: drop
      sourceLabels:
        - __name__
      regex: node_uname_info
