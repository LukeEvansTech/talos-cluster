# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name seedbox-smartctl
spec:
  # SMART sector counts warn before mdstat sees a dropped disk.
  staticConfigs:
    - targets:
        - seedbox.observability.svc.cluster.local:9633
  metricsPath: /metrics
  # Attributes move over days, and each scrape shells out to four disks.
  scrapeInterval: 300s
  scrapeTimeout: 30s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: seedbox
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name seedbox-docker
spec:
  # Source of container_state_* for the estate's container-lifecycle alerts; netdata lacks it.
  staticConfigs:
    - targets:
        - seedbox.observability.svc.cluster.local:9419
  metricsPath: /metrics
  scrapeInterval: 60s
  scrapeTimeout: 30s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: seedbox
  metricRelabelings:
    # Allow-list: a new container label needs adding here before any rule can use it.
    # Kept: doco-cd manager (alert scope) and alerts_oneshot (SeedboxContainerDown exclusion).
    - action: labelkeep
      regex: __name__|job|instance|name|status|health_status|container_label_cd_doco_metadata_manager|container_label_alerts_oneshot
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name seedbox-prowlarr
spec:
  # Prowlarr's own /metrics serves the SPA's HTML; exportarr is the only metrics source.
  staticConfigs:
    - targets:
        - seedbox.observability.svc.cluster.local:9707
  metricsPath: /metrics
  scrapeInterval: 60s
  scrapeTimeout: 30s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: seedbox
  metricRelabelings:
    # exportarr stamps the target URL on every series: redundant, and leaks an internal address.
    - action: labeldrop
      regex: url
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name seedbox-backrest
spec:
  # Only source of forget/prune/check outcomes; the textfile leg covers backups alone.
  # Host-side prerequisite is documented in the private host repository.
  staticConfigs:
    - targets:
        - seedbox.observability.svc.cluster.local:9898
  metricsPath: /metrics
  basicAuth:
    username:
      name: seedbox-backrest-secret
      key: username
    password:
      name: seedbox-backrest-secret
      key: password
  scrapeInterval: 60s
  scrapeTimeout: 30s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: seedbox
