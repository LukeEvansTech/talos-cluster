---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name seedbox-node
spec:
  # node-exporter on the seedbox host (:9100) — CPU/memory/disk/network.
  staticConfigs:
    - targets:
        - seedbox.observability.svc.cluster.local:9100
  metricsPath: /metrics
  scrapeInterval: 60s
  # The scrape path is the tailnet egress (DERP-relay-prone): scrapes average
  # ~3.4s and, with the default 10s timeout, spike to the ceiling under torrent
  # iowait → false up=0 flaps (~12% baseline, ~25% during the monthly RAID scrub).
  # 30s (≤ interval) absorbs the slow-but-alive scrapes so they stop reading as down.
  scrapeTimeout: 30s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: seedbox
  # The ceph-mixin node alerts (CephNodeDiskspaceWarning et al) join every
  # node-exporter target via node_uname_info, so the seedbox's spiky torrent
  # disk flaps them. Dropping the metric here breaks that join; nothing else
  # (dashboard, seedbox.rules) reads it.
  metricRelabelings:
    - action: drop
      sourceLabels:
        - __name__
      regex: node_uname_info
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name seedbox-traefik
spec:
  # Traefik metrics entrypoint (:8082) — per-router/service request stats.
  staticConfigs:
    - targets:
        - seedbox.observability.svc.cluster.local:8082
  metricsPath: /metrics
  scrapeInterval: 60s
  scrapeTimeout: 30s # tailnet-egress scrapes are slow; 30s stops false up=0 (see node job)
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: seedbox
