# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name seedbox-smartctl
spec:
  # smartctl-exporter on the seedbox host (:9633), per-disk SMART attributes.
  # netdata's mdstat alarms only catch a disk once it has DROPPED OUT of the
  # array; this is the upstream signal (reallocated/pending sectors) that
  # precedes that. See seedbox-apps apps/smartctl-exporter.
  staticConfigs:
    - targets:
        - seedbox.observability.svc.cluster.local:9633
  metricsPath: /metrics
  # 300s not 60s: smartctl shells out to all four spinning disks per scrape, and
  # the attributes move on a timescale of days, so a 5x cheaper scrape loses nothing.
  scrapeInterval: 300s
  scrapeTimeout: 30s # tailnet-egress scrapes are slow; 30s stops false up=0 (see node job)
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: seedbox
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name seedbox-docker
spec:
  # docker_state_exporter on the seedbox (:9419), per-container state, health,
  # restart count and OOM-kill, keyed by container NAME. Landed with the
  # 2026-07-30 fleet convergence (seedbox-apps): the seedbox was the one box
  # without it, netdata sees containers, but the estate's container-lifecycle
  # alerting keys on container_state_* series only this exposes.
  staticConfigs:
    - targets:
        - seedbox.observability.svc.cluster.local:9419
  metricsPath: /metrics
  scrapeInterval: 60s
  scrapeTimeout: 30s # tailnet-egress scrapes are slow; 30s stops false up=0 (see node job)
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: seedbox
  metricRelabelings:
    # Drop the noisy per-container label set but KEEP two container labels:
    #   - cd_doco_metadata_manager, so "container down" can be scoped to the
    #     GitOps-managed fleet and a hand-run throwaway never pages.
    #   - alerts_oneshot, which marks a container that is SUPPOSED to sit in
    #     exited (0) forever (the restore/config inits in seedbox-apps, every
    #     service with `restart: "no"`). SeedboxContainerDown excludes on it.
    # Otherwise the shape matches the truenas and appliance jobs.
    #
    # ⚠️ This labelkeep is an ALLOW-LIST: a label the exporter publishes but
    # that is not named here simply does not exist in Prometheus. Adding a new
    # container label to seedbox-apps is therefore only half the job, verify
    # with `count(container_state_status{container_label_<x>="..."})` against
    # the real Prometheus before writing a rule that depends on it. Forgetting
    # this on 2026-08-23 made a corrected SeedboxContainerDown match 8
    # containers instead of 0, i.e. worse than the bug it fixed.
    - action: labelkeep
      regex: __name__|job|instance|name|status|health_status|container_label_cd_doco_metadata_manager|container_label_alerts_oneshot
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name seedbox-prowlarr
spec:
  # exportarr against the seedbox's Prowlarr (:9707). Prowlarr serves no metrics
  # of its own — its :9696/metrics returns the SPA's HTML, which reads as a
  # broken exporter rather than an absent feature — so this is the only source of
  # per-indexer query/grab/failure counts on that box. Same exporter and pinned
  # version the cluster runs as a sidecar for the home Prowlarr, so the two
  # instances share one metric vocabulary; they stay separate jobs because this
  # one arrives over the tailnet egress and needs that path's slower timeout.
  staticConfigs:
    - targets:
        - seedbox.observability.svc.cluster.local:9707
  metricsPath: /metrics
  scrapeInterval: 60s
  scrapeTimeout: 30s # tailnet-egress scrapes are slow; 30s stops false up=0 (see node job)
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: seedbox
  metricRelabelings:
    # exportarr v2 stamps the target URL onto every series. It is the same
    # single value for every sample of this job, so it adds a label to each
    # series while distinguishing nothing, and it publishes an internal address
    # into metric labels. `instance` above already names the source.
    - action: labeldrop
      regex: url
