---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: &app ruckus-exporter
  labels:
    app.kubernetes.io/name: *app
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: *app
  # Each per-site Service carries `site`; one job name keeps the alerts site-agnostic.
  targetLabels:
    - site
  endpoints:
    - port: metrics
      path: /metrics
      # Every scrape is a live call to the controller; upstream recommends 60s/30s.
      interval: 60s
      scrapeTimeout: 30s
      relabelings:
        - action: replace
          targetLabel: job
          replacement: *app
