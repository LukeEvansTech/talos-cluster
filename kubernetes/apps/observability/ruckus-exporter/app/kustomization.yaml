---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./grafanadashboard.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./prometheusrule.yaml
  - ./servicemonitor.yaml
configMapGenerator:
  - name: ruckus-exporter-dashboard
    files:
      - ruckus-unleashed.json=./dashboards/ruckus-unleashed.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # Keeps Grafana's own ${DS_PROMETHEUS} and $site macros from being blanked.
    kustomize.toolkit.fluxcd.io/substitute: disabled
