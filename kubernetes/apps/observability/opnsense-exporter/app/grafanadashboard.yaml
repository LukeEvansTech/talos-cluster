---
# Vendored from grafana.com dashboard 21113 rev 1 (AthennaMind "OPNSense Exporter"), with its
# hardcoded datasource __input replaced by a ${datasource} variable: the operator's input-mapping
# substitutes the datasource NAME as the panel uid, but this Grafana's uid is auto-generated, so
# panels would read "No data" otherwise (same pattern as kube-prometheus-stack + truenas-zfs).
# To refresh: re-run ~/Scratch/truenas/vendor_opnsense_dashboard.py; 21113 only has revision 1.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: opnsense-exporter
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  resyncPeriod: 1h
  configMapRef:
    name: opnsense-exporter-dashboard
    key: opnsense-exporter.json
