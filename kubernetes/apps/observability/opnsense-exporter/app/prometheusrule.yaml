---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: opnsense-exporter.rules
spec:
  groups:
    - name: opnsense-exporter.rules
      rules:
        - alert: OPNsenseExporterDown
          annotations:
            summary: "OPNsense exporter ({{ $labels.instance }}) is not being scraped."
          expr: |-
            up{job="opnsense-exporter"} == 0
          for: 5m
          labels:
            severity: critical
        # The no_route signal is set from the routing table when a gateway loses
        # its default route — independent of dpinger, so it stays as the
        # belt-and-braces down signal alongside the loss alert below.
        - alert: OPNsenseGatewayDown
          annotations:
            summary: "OPNsense gateway {{ $labels.name }} has no route (down)."
          expr: |-
            opnsense_gateways_monitor_info{job="opnsense-exporter", no_route="true"}
          for: 5m
          labels:
            severity: critical
        # dpinger was enabled on the v4 WAN gateway 2026-08-02 (monitor 1.1.1.1),
        # which populated the loss/RTT series for the first time. Sustained loss
        # is upstream/ISP degradation the routing table can't see.
        - alert: OPNsenseWanGatewayLossHigh
          annotations:
            summary: "WAN gateway packet loss at {{ $value }}% for 10m."
          expr: |-
            opnsense_gateways_loss_percentage{job="opnsense-exporter", name="WAN_DHCP"} > 20
          for: 10m
          labels:
            severity: critical
        # The 2026-08-02 outage signature: both WAN counters froze to exactly
        # zero for 15 minutes while the link stayed up and no watchdog logged —
        # dpinger's monitor traffic rides this interface, so a healthy WAN can
        # never legitimately read zero-in-both-directions for 5 minutes.
        - alert: OPNsenseWanTrafficFrozen
          annotations:
            summary: "WAN has passed zero bytes in BOTH directions for 5m — NIC/modem wedge, likely needs a link bounce."
          expr: |-
            rate(opnsense_interfaces_received_bytes_total{job="opnsense-exporter", interface="WAN"}[5m]) == 0
            and
            rate(opnsense_interfaces_transmitted_bytes_total{job="opnsense-exporter", interface="WAN"}[5m]) == 0
          for: 5m
          labels:
            severity: critical
        # Backup WAN tiers (2026-08-02): 5G routers on transit VLANs feed the
        # WAN_FAILOVER gateway group. A dead backup tier is invisible in daily
        # use — it only matters mid-outage, which is exactly when it must not
        # be discovered broken. Gated on the tier having been healthy in the
        # last 24h so a not-yet-cabled or deliberately-parked tier never
        # alerts; it self-arms on first successful dpinger and stands down a
        # day after a deliberate decommission.
        - alert: OPNsenseBackupWanTierDown
          annotations:
            summary: "Backup WAN tier {{ $labels.name }} is at 100% loss — the failover path is dead while the primary is fine."
          expr: |-
            opnsense_gateways_loss_percentage{job="opnsense-exporter", name=~"WAN[23]_5G_.+"} == 100
            and
            min_over_time(opnsense_gateways_loss_percentage{job="opnsense-exporter", name=~"WAN[23]_5G_.+"}[24h]) < 100
          for: 30m
          labels:
            severity: warning
        # Unbound (the resolver behind opnsense-dns / split-horizon) being down
        # breaks internal name resolution cluster-wide. The exporter has no
        # unbound-specific metric, so it surfaces via opnsense_services_status.
        - alert: OPNsenseUnboundDown
          annotations:
            summary: "OPNsense Unbound DNS service is not running."
          expr: |-
            opnsense_services_status{job="opnsense-exporter", name="unbound"} == 0
          for: 5m
          labels:
            severity: warning
