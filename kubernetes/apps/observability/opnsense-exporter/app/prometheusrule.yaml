---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: opnsense-exporter.rules
spec:
  groups:
    - name: opnsense-exporter.rules
      rules:
        - alert: OPNsenseExporterDown
          annotations:
            summary: "OPNsense exporter ({{ $labels.instance }}) is not being scraped."
          expr: |-
            up{job="opnsense-exporter"} == 0
          for: 5m
          labels:
            severity: critical
        # no_route comes from the routing table, independent of dpinger, so this stays a
        # belt-and-braces signal alongside the loss alert below.
        - alert: OPNsenseGatewayDown
          annotations:
            summary: "OPNsense gateway {{ $labels.name }} has no route (down)."
          expr: |-
            opnsense_gateways_monitor_info{job="opnsense-exporter", no_route="true"}
          for: 5m
          labels:
            severity: critical
        # dpinger populates the loss/RTT series; sustained loss is upstream/ISP
        # degradation the routing table alone can't see.
        - alert: OPNsenseWanGatewayLossHigh
          annotations:
            summary: "WAN gateway packet loss at {{ $value }}% for 10m."
          expr: |-
            opnsense_gateways_loss_percentage{job="opnsense-exporter", name="WAN_DHCP"} > 20
          for: 10m
          labels:
            severity: critical
        # A healthy WAN can never legitimately read zero in both directions for 5m, since
        # dpinger's own monitor traffic rides this interface. See
        # docs/docs/apps/opnsense-exporter.md for why `for` stays short instead of stacking.
        - alert: OPNsenseWanTrafficFrozen
          annotations:
            summary: "WAN has passed zero bytes in BOTH directions for 5m, NIC/modem wedge, likely needs a link bounce."
          expr: |-
            rate(opnsense_interfaces_received_bytes_total{job="opnsense-exporter", interface="WAN"}[5m]) == 0
            and
            rate(opnsense_interfaces_transmitted_bytes_total{job="opnsense-exporter", interface="WAN"}[5m]) == 0
          for: 1m
          labels:
            severity: critical
        # A dead backup tier is invisible in daily use and only matters mid-outage, which is
        # exactly when it must not be discovered broken. Gated on the exporter's own
        # forced-down state, not a time window; see docs/docs/apps/opnsense-exporter.md for
        # why a rolling window silently self-resolved during the one case this must catch.
        - alert: OPNsenseBackupWanTierDown
          annotations:
            summary: "Backup WAN tier {{ $labels.name }} is at 100% loss. The failover path is dead while the primary is fine."
          expr: |-
            opnsense_gateways_loss_percentage{job="opnsense-exporter", name=~"WAN[23]_5G_.+"} == 100
            and
            opnsense_gateways_status{job="opnsense-exporter", name=~"WAN[23]_5G_.+"} != 6
          for: 30m
          labels:
            severity: warning
        # No unbound-specific metric exists, so this surfaces via opnsense_services_status.
        - alert: OPNsenseUnboundDown
          annotations:
            summary: "OPNsense Unbound DNS service is not running."
          expr: |-
            opnsense_services_status{job="opnsense-exporter", name="unbound"} == 0
          for: 5m
          labels:
            severity: warning
        # Both IKE ends are pinned to a literal IP, so an upstream address change needs a
        # manual, two-sided fix; see docs/docs/apps/opnsense-exporter.md.
        # absent() matters: a removed or renamed connection makes the series vanish, and
        # `== 0` can never fire on an empty vector, the same blind spot that left mktxp
        # unmonitored for 8 days.
        - alert: OPNsenseIPsecTunnelDown
          annotations:
            summary: "IPsec tunnel {{ $labels.description }} is down or no longer reported, check the WAN address against the far-end gateway pin."
          expr: |-
            opnsense_ipsec_phase1_status{job=~"opnsense-exporter|opnsensegh"} == 0
            or
            absent(opnsense_ipsec_phase1_status{job="opnsense-exporter", description="azure-hub-vpngw"})
          for: 10m
          labels:
            severity: critical
        # Phase 1 up but no child SA means IKE negotiated and the traffic path is still
        # dead, invisible to the alert above; `and on()` phase1 so a full outage pages once.
        # No phase2_status metric exists, and byte counters aren't a substitute: a healthy
        # idle tunnel legitimately reads zero. 15m clears a phase2 rekey window, see
        # docs/docs/apps/opnsense-exporter.md.
        - alert: OPNsenseIPsecChildSAMissing
          annotations:
            summary: "IPsec phase 2 (azure-hub-traffic) has no child SA while phase 1 is up, traffic path down."
          expr: |-
            absent(opnsense_ipsec_phase2_install_time{job="opnsense-exporter", description="azure-hub-traffic"})
            and on()
            (opnsense_ipsec_phase1_status{job="opnsense-exporter", description="azure-hub-vpngw"} == 1)
          for: 15m
          labels:
            severity: critical
