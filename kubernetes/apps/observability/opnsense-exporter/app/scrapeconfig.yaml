---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name opnsense-node
spec:
  # Kernel-level metrics the API-based opnsense-exporter can't see, added after a WAN-wedge
  # outage had to be reconstructed from cluster-side probes with no OS-level metrics.
  # Plain LAN scrape (the nut-appliance shape), no egress Service like the seedbox.
  staticConfigs:
    - targets:
        - ${OPNSENSE_ADDR}:9100
  metricsPath: /metrics
  scrapeInterval: 60s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      # Matches OPNSENSE_EXPORTER_INSTANCE_LABEL on the API exporter so both
      # jobs' series join on the same instance.
      replacement: opnsense
  metricRelabelings:
    # Same load-bearing drop as nut-appliance and the seedbox: unscoped ceph-mixin alerts
    # join through this metric and would otherwise adopt this target; see
    # docs/docs/apps/nut-appliance.md.
    - action: drop
      sourceLabels:
        - __name__
      regex: node_uname_info
