---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opnsense-exporter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: opnsense-exporter-secret
    template:
      data:
        # A dedicated, least-privilege API key, not the shared `opnsense` item, whose key
        # 403s on these endpoints. Host is stored bare, so no scheme-stripping is needed.
        OPNSENSE_EXPORTER_OPS_API_KEY: "{{ .api_key }}"
        OPNSENSE_EXPORTER_OPS_API_SECRET: "{{ .api_secret }}"
        OPNSENSE_EXPORTER_OPS_API: "{{ .host }}"
  dataFrom:
    - extract:
        key: opnsense-exporter
