---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name truenas-graphite-exporter
spec:
  # Graphite ingest bridge: netdata pushes to :9109, re-exposed as Prometheus on :9108.
  # Setup: docs/docs/operations/truenas-monitoring.md.
  staticConfigs:
    - targets:
        - ${SECRET_STORAGE_SERVER}:9108
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name truenas-docker-exporter
spec:
  # docker_state_exporter (:9419), keyed by container name so it survives restarts,
  # unlike the graphite bridge's ID-keyed cgroup_* series.
  # metricRelabelings drop noisy container_label_* but keep cd_doco_metadata_manager,
  # scoping truenas-docker.rules to the GitOps-managed fleet.
  staticConfigs:
    - targets:
        - ${SECRET_STORAGE_SERVER}:9419
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
  metricRelabelings:
    - action: labelkeep
      regex: __name__|job|instance|name|status|health_status|container_label_cd_doco_metadata_manager
# node-exporter (:9100) and smartctl-exporter (:9633) are NOT scraped here: kube-prometheus-stack's
# own ScrapeConfig already covers both ports under those job names
# (docs/docs/troubleshooting/kb/038-truenas-double-scraped-on-both-ports.md).
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name truenas-traefik
spec:
  # Traefik metrics (:8082) for the NAS dashboards + Garage S3 routes; unreachable until
  # the 2026-07-30 truenas-apps convergence exposed the entrypoint.
  staticConfigs:
    - targets:
        # SECRET_STORAGE_INGRESS, not _SERVER: Traefik binds the NAS's dedicated ingress
        # alias, not the primary address the host-network exporters answer on.
        - ${SECRET_STORAGE_INGRESS}:8082
  metricsPath: /metrics
  scrapeInterval: 60s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: truenas
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name truenas-doco-cd
spec:
  # doco-cd metrics (:9120): doco_cd_polls_total catches a doco-cd that's up but has
  # stopped polling, which the truenas-docker-exporter job's "container is running" can't.
  staticConfigs:
    - targets:
        # SECRET_STORAGE_INGRESS, not _SERVER: doco-cd binds the NAS's dedicated ingress
        # alias, not the primary address the host-network exporters answer on.
        - ${SECRET_STORAGE_INGRESS}:9120
  metricsPath: /metrics
  scrapeInterval: 60s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: truenas
