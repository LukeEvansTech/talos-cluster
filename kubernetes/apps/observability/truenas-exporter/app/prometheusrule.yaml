---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: truenas-exporter.rules
spec:
  groups:
    # Bridges 25.10's raw truenas_arcstats{type=...} into zfs_arc_* series (truenas-monitoring.md).
    - name: truenas-exporter.recording
      rules:
        # Matches the upstream panel's op=~"arcsz|target"; no separate "target" series exists.
        - record: zfs_arc_size
          expr: |-
            label_replace(truenas_arcstats{job="truenas-graphite-exporter", type="size"}, "op", "arcsz", "", "")
        - record: zfs_arc_free_bytes
          expr: |-
            truenas_arcstats{job="truenas-graphite-exporter", type="free"}
        # dmhit/ddhit = demand data+metadata hits; dmmis/ddmis = corresponding misses.
        - record: zfs_arc_hit_ratio
          expr: |-
            100
            * sum by (instance) (truenas_arcstats{job="truenas-graphite-exporter", type=~"dmhit|ddhit"})
            / clamp_min(sum by (instance) (truenas_arcstats{job="truenas-graphite-exporter", type=~"dmhit|ddhit|dmmis|ddmis"}), 1)

    - name: truenas-exporter.rules
      rules:
        - alert: TrueNASGraphiteExporterDown
          annotations:
            summary: "TrueNAS graphite exporter ({{ $labels.instance }}) is not being scraped."
          expr: |-
            up{job="truenas-graphite-exporter"} == 0
          for: 5m
          labels:
            severity: critical
        # smartctl-exporter, not the graphite bridge: 25.10 netdata has no disk_temperature series.
        - alert: TrueNASDiskTemperatureHigh
          annotations:
            summary: "TrueNAS disk {{ $labels.device }} temperature is {{ $value }}°C."
          expr: |-
            smartctl_device_temperature{job="smartctl-exporter", temperature_type="current"} > 60
          for: 10m
          labels:
            severity: warning
        - alert: TrueNASCPUTemperatureHigh
          annotations:
            summary: "TrueNAS CPU temperature is {{ $value }}°C."
          expr: |-
            cpu_temperature{job="truenas-graphite-exporter"} > 85
          for: 10m
          labels:
            severity: warning
            # No ZFS pool-state alert: the graphite bridge exposes no zfs_pool/scrub metric;
            # TrueNAS's own native ZFS event detection covers pool/scrub failures instead.

    - name: truenas-docker.rules
      rules:
        - alert: TrueNASDockerStateExporterDown
          annotations:
            summary: "TrueNAS docker-state exporter is not being scraped."
          expr: |-
            up{job="truenas-docker-exporter"} == 0
          for: 5m
          labels:
            severity: critical
        # Restore inits excluded by NAME (exit 0, stay exited); `created` catches a failed one.
        # Same fleet-wide incident as seedbox's (#4088), but matched by name, not their label.
        - alert: TrueNASContainerDown
          annotations:
            summary: "TrueNAS container {{ $labels.name }} is not running (state: {{ $labels.status }})."
          expr: |-
            container_state_status{job="truenas-docker-exporter", status=~"exited|dead|created", container_label_cd_doco_metadata_manager="doco-cd", name!~".*-restore-.*-[0-9]+"} == 1
          for: 5m
          labels:
            severity: critical
        - alert: TrueNASContainerUnhealthy
          annotations:
            summary: "TrueNAS container {{ $labels.name }} healthcheck is failing (unhealthy)."
          expr: |-
            container_state_health_status{job="truenas-docker-exporter", health_status="unhealthy"} == 1
          for: 5m
          labels:
            severity: critical
        - alert: TrueNASContainerRestarting
          annotations:
            summary: "TrueNAS container {{ $labels.name }} is stuck restarting (crash loop)."
          expr: |-
            container_state_status{job="truenas-docker-exporter", status="restarting"} == 1
          for: 5m
          labels:
            severity: critical
        - alert: TrueNASContainerOOMKilled
          annotations:
            summary: "TrueNAS container {{ $labels.name }} was OOM-killed."
          expr: |-
            container_state_oomkilled{job="truenas-docker-exporter"} == 1
          for: 0m
          labels:
            severity: critical
        - alert: TrueNASContainerFlapping
          annotations:
            summary: "TrueNAS container {{ $labels.name }} restart count changed {{ $value }} times in the last hour."
          expr: |-
            changes(container_restartcount{job="truenas-docker-exporter"}[1h]) > 3
          for: 5m
          labels:
            severity: warning

    # Host-side cron + textfile collector (the graphite bridge has no replication series);
    # metrics are generic over every task, the DR task is the load-bearing one. Alert design
    # (absence-of-success philosophy, seed-period caveat): docs/docs/apps/truenas-exporter.md.
    - name: truenas-replication.rules
      rules:
        # Load-bearing: 36h covers a missed daily cycle plus slack; last_success>0 and
        # state!=1 guard the initial seed, disabled tasks, and a long in-progress run.
        - alert: TrueNASReplicationStale
          annotations:
            summary: >-
              No successful off-site replication of {{ $labels.task }} in over 36h.
              the DR copy is stale.
          expr: |-
            (time() - zfs_replication_last_success_timestamp_seconds{box="truenas"} > 129600)
            and (zfs_replication_last_success_timestamp_seconds{box="truenas"} > 0)
            and (zfs_replication_state{box="truenas"} != 1)
          for: 30m
          labels:
            severity: critical
        # Fires on terminal ERROR only; zettarepl retries transient blips within a run,
        # and the 15m fuse rides out that retry window.
        - alert: TrueNASReplicationFailing
          annotations:
            summary: >-
              Replication task {{ $labels.task }} is in ERROR, check its log on the
              NAS and whether the off-site target is reachable.
          expr: |-
            zfs_replication_state{box="truenas"} == 2
          for: 15m
          labels:
            severity: warning
        # Scoped to the DR task's middleware id=11 so other disabled tasks don't page;
        # update the id if the task is ever recreated.
        - alert: TrueNASReplicationDisabled
          annotations:
            summary: >-
              DR replication task {{ $labels.task }} is DISABLED. The off-site copy
              is not running.
          expr: |-
            zfs_replication_enabled{box="truenas", id="11"} == 0
          for: 15m
          labels:
            severity: warning
        # Catches the series vanishing entirely, which Stale can't see; scoped to id=11
        # like Disabled above. 2h fuse; a real box outage is covered elsewhere.
        - alert: TrueNASReplicationMetricsMissing
          annotations:
            summary: >-
              DR replication metrics absent for 2h, cannot tell whether the
              off-site copy is running.
          expr: |-
            absent(zfs_replication_last_success_timestamp_seconds{box="truenas", id="11"})
          for: 2h
          labels:
            severity: warning
        # Catches a frozen textfile (series present but not updating), which
        # MetricsMissing can't see; 1h is four missed 15m cron runs.
        - alert: TrueNASReplicationCollectorStale
          annotations:
            summary: >-
              The ZFS-replication metrics collector on the NAS has not run in over
              1h. Replication alerts may be blind.
          expr: |-
            time() - zfs_replication_scrape_timestamp_seconds{box="truenas"} > 3600
          for: 15m
          labels:
            severity: warning
        # Backstop: a task that never triggers or never finishes keeps last_success=0
        # forever, invisible to Stale and Failing; 168h clears the multi-day seed window.
        - alert: TrueNASReplicationNeverSucceeded
          annotations:
            summary: >-
              Replication task {{ $labels.task }} has never completed a
              successful run in over 7 days. It may be stuck, or its
              schedule never launched.
          expr: |-
            (zfs_replication_last_success_timestamp_seconds{box="truenas"} == 0)
            and (zfs_replication_enabled{box="truenas"} == 1)
          for: 168h
          labels:
            severity: warning
