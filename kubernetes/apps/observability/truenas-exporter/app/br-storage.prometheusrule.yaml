---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: br-storage.rules
spec:
  groups:
    # br-storage is the off-site DR target, powered on only for its nightly replication window.
    # br-power (truenas-apps) reads its health once per window with a read-only API key and
    # writes br_health_* to the NAS's node-exporter textfile dir. Every value below is
    # therefore a once-a-night sample that persists all day: an alert stays up until the next
    # good snapshot, and `for:` only guards against a half-written scrape.
    - name: br-storage.rules
      rules:
        # 36h (129600s): one missed window plus slack. A failed read still stamps the
        # timestamp, so this catches br-power not reaching the snapshot at all.
        - alert: BrStorageHealthStale
          annotations:
            summary: >-
              No br-storage health snapshot in over 36h. br may not be powering on, or
              br-power is not reaching it. Check `docker logs br-power` on the NAS.
          expr: |-
            time() - br_health_collect_timestamp_seconds > 129600
          for: 30m
          labels:
            severity: warning
        - alert: BrStorageHealthSnapshotFailing
          annotations:
            summary: >-
              br-power could not read br-storage's health in tonight's window. Its
              read-only API key may be revoked or br's HTTPS may be down.
          expr: |-
            br_health_collect_success == 0
          for: 15m
          labels:
            severity: warning
        - alert: BrStorageHealthMetricsMissing
          annotations:
            summary: >-
              br-storage health metrics are absent; cannot tell whether the DR box is healthy.
          expr: |-
            absent(br_health_collect_timestamp_seconds)
          for: 2h
          labels:
            severity: warning
        - alert: BrStoragePoolUnhealthy
          annotations:
            summary: >-
              br-storage pool {{ $labels.pool }} is not healthy or not ONLINE. The off-site
              DR copy is at risk.
          expr: |-
            br_health_pool_healthy == 0 or br_health_pool_online == 0
          for: 5m
          labels:
            severity: critical
        - alert: BrStoragePoolScanErrors
          annotations:
            summary: >-
              br-storage pool {{ $labels.pool }}'s last scrub found {{ $value }} errors.
          expr: |-
            br_health_pool_scan_errors > 0
          for: 5m
          labels:
            severity: warning
        # br runs ~7h a night, so a scrub can take several windows; 45 days is TrueNAS's
        # 35-day default schedule plus ten nights. -1 means br reported no scrub at all.
        - alert: BrStorageScrubOverdue
          annotations:
            summary: >-
              br-storage pool {{ $labels.pool }} has not finished a scrub in 45 days.
          expr: |-
            br_health_pool_scan_end_timestamp_seconds > 0
            and time() - br_health_pool_scan_end_timestamp_seconds > 3888000
          for: 30m
          labels:
            severity: warning
        - alert: BrStorageAlertsActive
          annotations:
            summary: >-
              br-storage has {{ $value }} active TrueNAS alerts at ERROR or above. Check its
              alert list in the UI.
          expr: |-
            sum(br_health_alerts{level=~"ERROR|CRITICAL|ALERT|EMERGENCY"}) > 0
          for: 15m
          labels:
            severity: warning
        # Sampled minutes after power-on, while the disks are still cool (31-40C on
        # 2026-10-14), so this sits below cr's 60C: a cold reading over 50C is a cooling fault.
        - alert: BrStorageDiskHot
          annotations:
            summary: >-
              br-storage disk {{ $labels.disk }} read {{ $value }}C shortly after power-on.
          expr: |-
            br_health_disk_temperature_celsius > 50
          for: 10m
          labels:
            severity: warning
        # The UI certificate keeps br's API on TLS; without it TrueNAS revokes br-power's key
        # on first use. TrueNAS renews at 10 days left and retries daily, so 20 days left means
        # renewals are failing (most likely the Cloudflare token's pinned IP no longer matches
        # br's egress, see terraform-cloudflare tokens.tf br_storage_ip).
        - alert: BrStorageCertificateExpiring
          annotations:
            summary: >-
              br-storage's web UI certificate expires in under 20 days; its ACME renewal is
              failing.
          expr: |-
            br_health_certificate_expiry_timestamp_seconds{name="br-storage-le"} - time() < 1728000
          for: 30m
          labels:
            severity: warning
        - alert: BrStorageCertificateUnknown
          annotations:
            summary: >-
              br-power could not read br-storage's certificates, or br-storage-le is gone.
          expr: |-
            br_health_certificates_ok == 0
            or (br_health_collect_success == 1
              unless on() br_health_certificate_expiry_timestamp_seconds{name="br-storage-le"})
          for: 30m
          labels:
            severity: warning
        # br_smartctl_*, br_node_* and br_container_* come from br's own exporters, which
        # br-power reads in the same nightly pass and republishes with a br_ prefix (cr's
        # node-exporter carries cr's own series under the unprefixed names). Same caveat as
        # above: each value is a once-a-night sample that holds all day.
        - alert: BrStorageExportersUnread
          annotations:
            summary: >-
              br-power could not read br-storage's {{ $labels.exporter }} exporter in
              tonight's window, so its SMART or container metrics are stale.
          expr: |-
            br_exporter_scrape_success == 0
          for: 15m
          labels:
            severity: warning
        # 36h, as BrStorageHealthStale: one missed window plus slack.
        - alert: BrStorageExportersStale
          annotations:
            summary: >-
              No br-storage exporter snapshot in over 36h.
          expr: |-
            time() - br_exporter_collect_timestamp_seconds > 129600
          for: 30m
          labels:
            severity: warning
        # The file only appears after a window, so allow a full day before calling it missing.
        - alert: BrStorageExportersMissing
          annotations:
            summary: >-
              br-storage exporter metrics are absent; br-power has not written its exporter
              snapshot.
          expr: |-
            absent(br_exporter_collect_timestamp_seconds)
          for: 26h
          labels:
            severity: warning
        - alert: BrStorageDiskSmartFailed
          annotations:
            summary: >-
              br-storage disk {{ $labels.serial_number }} fails its SMART overall health check.
          expr: |-
            sum by (serial_number) (
              br_smartctl_device_smart_status * on (device) group_left (serial_number) br_smartctl_device
            ) != 1
          for: 10m
          labels:
            severity: critical
        # Disks are keyed by serial: br power-cycles nightly and sdX letters drift between boots.
        - alert: BrStorageDiskPendingSectors
          annotations:
            summary: >-
              br-storage disk {{ $labels.serial_number }} has {{ $value }} pending sector(s),
              unreadable data awaiting remap.
          expr: |-
            sum by (serial_number) (
              br_smartctl_device_attribute{
                attribute_name="Current_Pending_Sector",
                attribute_value_type="raw"
              }
              * on (device) group_left (serial_number) br_smartctl_device
            ) > 0
          for: 15m
          labels:
            severity: warning
        # One sample a night, so compare with the lowest value in the last 36h: fires for
        # up to a day and a half after a night whose count went up. Keyed by serial, since
        # sdX letters can name a different disk after the nightly power-on.
        - alert: BrStorageDiskReallocatedSectorsGrowing
          annotations:
            summary: >-
              br-storage disk {{ $labels.serial_number }} reallocated {{ $value }} more sectors
              since the previous night, plan a replacement.
          expr: |-
            sum by (serial_number) (
              br_smartctl_device_attribute{
                attribute_name="Reallocated_Sector_Ct",
                attribute_value_type="raw"
              }
              * on (device) group_left (serial_number) br_smartctl_device
            )
            - min_over_time(
              (
                sum by (serial_number) (
                  br_smartctl_device_attribute{
                    attribute_name="Reallocated_Sector_Ct",
                    attribute_value_type="raw"
                  }
                  * on (device) group_left (serial_number) br_smartctl_device
                )
              )[36h:15m]
            ) > 0
          for: 30m
          labels:
            severity: warning
        # tailscale-state-check is a one-shot gate that exits by design.
        - alert: BrStorageContainerDown
          annotations:
            summary: >-
              Container {{ $labels.name }} on br-storage was {{ $labels.status }} in
              tonight's window.
          expr: |-
            br_container_state_status{status=~"exited|dead|created|restarting", name!~".*state-check.*"} == 1
          for: 15m
          labels:
            severity: warning
        - alert: BrStorageContainerUnhealthy
          annotations:
            summary: >-
              Container {{ $labels.name }} on br-storage was unhealthy in tonight's window.
          expr: |-
            br_container_state_health_status{health_status="unhealthy"} == 1
          for: 15m
          labels:
            severity: warning
