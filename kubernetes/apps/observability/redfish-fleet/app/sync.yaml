---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The private repo has the drift exporter, monitoring rules, and BMC metrics-credentials secret.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: redfish-fleet-sync
spec:
  interval: 1h
  path: ./kubernetes
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: redfish-fleet
  timeout: 5m
  wait: false
