---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netdata
spec:
  interval: 1h
  chart:
    spec:
      chart: netdata
      version: 3.7.175
      sourceRef:
        kind: HelmRepository
        name: netdata
      interval: 1h
  values:
    image:
      repository: netdata/netdata
      tag: v2.12.1@sha256:5cfa05a5fa5686b98e0c70e884f00685fb3c662e9c5d727cf46c96d8e37b7818

    ingress:
      enabled: false

    parent:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 4Gi
        limits:
          memory: 16Gi
      alarms:
        persistence: true
        storageclass: ceph-block
        volumesize: 1Gi
      database:
        persistence: true
        storageclass: ceph-block
        volumesize: 20Gi

    child:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 2Gi
        limits:
          memory: 8Gi

    k8sState:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 1Gi
        limits:
          memory: 4Gi
      persistence:
        enabled: true
        storageclass: ceph-block
        volumesize: 1Gi
