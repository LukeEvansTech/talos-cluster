---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netdata
spec:
  interval: 1h
  chart:
    spec:
      chart: netdata
      version: 3.7.172
      sourceRef:
        kind: HelmRepository
        name: netdata
      interval: 1h
  values:
    image:
      repository: netdata/netdata
      tag: v2.11.0@sha256:c45c71eb23ff3f1012bcda7832bf08c0b09954363557e84511bcfaf6cafa3aa8

    ingress:
      enabled: false

    parent:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 4Gi
        limits:
          memory: 16Gi
      alarms:
        persistence: true
        storageclass: ceph-block
        volumesize: 1Gi
      database:
        persistence: true
        storageclass: ceph-block
        volumesize: 20Gi

    child:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 2Gi
        limits:
          memory: 8Gi

    k8sState:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 1Gi
        limits:
          memory: 4Gi
      persistence:
        enabled: true
        storageclass: ceph-block
        volumesize: 1Gi
