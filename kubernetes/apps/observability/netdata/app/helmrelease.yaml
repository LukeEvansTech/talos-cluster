---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netdata
spec:
  interval: 1h
  chart:
    spec:
      chart: netdata
      version: 3.7.178
      sourceRef:
        kind: HelmRepository
        name: netdata
      interval: 1h
  values:
    image:
      repository: netdata/netdata
      tag: v2.12.3@sha256:c7eab00e20901eb60595ebae0fbfe88e59464e663924461874719d40de0735d2

    ingress:
      enabled: false

    parent:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 4Gi
        limits:
          memory: 16Gi
      configs:
        netdata:
          # Chart default plus [health]. Both disk alerts are stock `to: silent` and only flap with
          # workload I/O on rbd and EPHEMERAL volumes; Netdata Cloud flagged them as misconfigured.
          data: |
            [global]
              hostname = {{ .Values.parent.hostname }}
            [db]
              mode = dbengine
            [health]
              enabled alarms = !10min_disk_backlog !10min_disk_utilization *

            [plugins]
              cgroups = no
              tc = no
              enable running new plugins = no
              check for new plugins every = 72000
              python.d = no
              charts.d = no
              go.d = no
              node.d = no
              apps = no
              proc = no
              idlejitter = no
              diskspace = no
      alarms:
        persistence: true
        storageclass: ceph-block
        volumesize: 1Gi
      database:
        persistence: true
        storageclass: ceph-block
        volumesize: 20Gi

    child:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 2Gi
        limits:
          memory: 8Gi

    k8sState:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 1Gi
        limits:
          memory: 4Gi
      persistence:
        enabled: true
        storageclass: ceph-block
        volumesize: 1Gi
