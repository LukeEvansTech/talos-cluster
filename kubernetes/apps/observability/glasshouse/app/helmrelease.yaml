---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: glasshouse
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: glasshouse
  values:
    controllers:
      # Every 15 minutes so a TV gets its work soon after someone turns it on; it never
      # wakes a TV. Sets new Bing wallpapers once per photo and installs the latest
      # Glasshouse release when the installed one is a week old.
      wallpapers:
        type: cronjob
        cronjob:
          ttlSecondsAfterFinished: 3600
          schedule: "*/15 * * * *"
          timeZone: "${TIMEZONE}"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 2
        containers:
          app:
            # Stock python, no build step: tvjobs.py is standard library only and
            # mounted from the ConfigMap.
            image:
              repository: docker.io/library/python
              tag: 3.15-slim@sha256:63bb298d2b7b88f176f51b5189f54ce6535c997682ea70885d2132f5d473a8a5
            command:
              - python3
              - /scripts/tvjobs.py
            env:
              TZ: ${TIMEZONE}
              PYTHONDONTWRITEBYTECODE: "1"
              PYTHONUNBUFFERED: "1"
              # Addresses come from cluster-secrets, as in the ScrapeConfig.
              TV_HOSTS: ${SECRET_GLASSHOUSE_TV1_HOST},${SECRET_GLASSHOUSE_TV2_HOST},${SECRET_GLASSHOUSE_TV3_HOST}
              UPDATE_EVERY_DAYS: "7"
              UPDATE_SOAK_HOURS: "2"
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      secrets:
        type: secret
        name: glasshouse-secret
        defaultMode: 0400
        globalMounts:
          - path: /secrets
            readOnly: true
      scripts:
        type: configMap
        name: glasshouse-wallpapers
        globalMounts:
          - path: /scripts
            readOnly: true
