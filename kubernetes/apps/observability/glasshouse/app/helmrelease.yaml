---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: glasshouse
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: glasshouse
  values:
    controllers:
      # Rotates the TVs' Glasshouse Home backgrounds through Bing's photo of the day.
      # Several runs a day because a TV in deep sleep misses one; a repeat upload of
      # the same photos changes nothing on screen.
      wallpapers:
        type: cronjob
        cronjob:
          ttlSecondsAfterFinished: 86400
          schedule: "20 7-23/4 * * *"
          timeZone: "${TIMEZONE}"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 2
        containers:
          app:
            # Stock python, no build step: wallpapers.py is standard library only and
            # mounted from the ConfigMap.
            image:
              repository: docker.io/library/python
              tag: 3.15-slim@sha256:533b0b2f9b5d46fd097091cf826f27902f1d6c3bca714b6dc74551356aa97a51
            command:
              - python3
              - /scripts/wallpapers.py
            env:
              TZ: ${TIMEZONE}
              PYTHONDONTWRITEBYTECODE: "1"
              PYTHONUNBUFFERED: "1"
              # Addresses come from cluster-secrets, as in the ScrapeConfig.
              TV_HOSTS: ${SECRET_GLASSHOUSE_TV1_HOST},${SECRET_GLASSHOUSE_TV2_HOST},${SECRET_GLASSHOUSE_TV3_HOST}
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      secrets:
        type: secret
        name: glasshouse-secret
        defaultMode: 0400
        globalMounts:
          - path: /secrets
            readOnly: true
      scripts:
        type: configMap
        name: glasshouse-wallpapers
        globalMounts:
          - path: /scripts
            readOnly: true
