---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glasshouse-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: glasshouse-secret
    template:
      engineVersion: v2
      data:
        # Bearer token for the dashboard API, shared by every TV.
        token: "{{ .GLASSHOUSE_TOKEN }}"
  dataFrom:
    - extract:
        key: glasshouse
