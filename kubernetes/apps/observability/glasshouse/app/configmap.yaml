---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/v1/configmap.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: glasshouse-wallpapers
  namespace: observability
data:
  # Standard library only, so it runs on stock python with nothing to install.
  tvjobs.py: |-
    """Keep the Glasshouse TVs current whenever one is on: new wallpapers, and a weekly update.

    Runs every 15 minutes and never wakes a TV: one that is off or unreachable is skipped,
    so the work lands on the first run after someone turns it on.

    Wallpapers: Glasshouse Home's time-of-day slots get Bing's latest four photos (newest to
    morning). Skipped when the TV's four slots were all uploaded after Bing's newest photo went up,
    read from the upload time in /api/home's wallpaper revision; if that cannot be read, upload.

    Update: install Glasshouse's latest release when the installed release is at least
    UPDATE_EVERY_DAYS old and the latest one has been out UPDATE_SOAK_HOURS. The TV fetches
    and installs it itself and keeps the previous version for rollback.

    Only failing to reach Bing or GitHub is reported; a TV's own failure never fails the job.
    Standard library only. DRY_RUN=1 prints what it would do and changes nothing.
    """
    import datetime as dt
    import json
    import os
    import re
    import urllib.request

    SLOTS = ("morning", "afternoon", "evening", "night")
    BING = "https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=4&mkt=en-GB"
    GITHUB = "https://api.github.com/repos/rorygallagher2024/glasshouse/releases"
    BEARER = open(os.environ.get("TOKEN_FILE", "/secrets/token")).read().strip()
    HOSTS = [h for h in os.environ["TV_HOSTS"].split(",") if h]
    EVERY = dt.timedelta(days=float(os.environ.get("UPDATE_EVERY_DAYS", "7")))
    SOAK = dt.timedelta(hours=float(os.environ.get("UPDATE_SOAK_HOURS", "2")))
    DRY = os.environ.get("DRY_RUN") == "1"
    NOW = dt.datetime.now(dt.timezone.utc)

    def fetch(url, data=None, ctype=None, timeout=60):
        headers = {"User-Agent": "glasshouse-tvjobs"}
        if url.startswith("http://"):
            headers["Authorization"] = "Bearer " + BEARER
        if url.startswith(GITHUB):
            headers["Accept"] = "application/vnd.github+json"
        if ctype:
            headers["Content-Type"] = ctype
        req = urllib.request.Request(url, data=data, headers=headers)
        with urllib.request.urlopen(req, timeout=timeout) as r:
            return r.read()

    def get(url, timeout=10):
        return json.loads(fetch(url, timeout=timeout))

    def control(base, action, value=None, timeout=180):
        body = {"action": action}
        if value is not None:
            body["value"] = value
        return json.loads(fetch(base + "/api/control", json.dumps(body).encode(), "application/json", timeout))

    def when(stamp):
        return dt.datetime.fromisoformat(stamp.replace("Z", "+00:00"))

    # Bing's newest photo, and when it went up (fullstartdate is UTC, YYYYMMDDHHMM).
    bing = get(BING, 60)["images"][: len(SLOTS)]
    bing_since = dt.datetime.strptime(bing[0]["fullstartdate"], "%Y%m%d%H%M").replace(tzinfo=dt.timezone.utc)
    images = None  # downloaded on first need

    latest = get(GITHUB + "/latest", 30)
    latest_ver = latest["tag_name"].lstrip("v")
    latest_age = NOW - when(latest["published_at"])
    published = {}

    def release_age(ver):
        if ver not in published:
            try:
                published[ver] = NOW - when(get(GITHUB + "/tags/v" + ver, 30)["published_at"])
            except OSError:
                published[ver] = None
        return published[ver]

    def wallpapers(host, base, home):
        global images
        if not home.get("enabled"):
            return print(host, "wallpapers: skipped, Glasshouse Home is off")
        rev = (home.get("wallpapers") or {}).get("revision") or ""
        stamps = re.findall(r"(\d{13})-\d+", rev) if rev.startswith("own.") else []
        if len(stamps) == len(SLOTS) and all(
                dt.datetime.fromtimestamp(int(s) / 1000, dt.timezone.utc) >= bing_since for s in stamps):
            return print(host, "wallpapers: already has", bing[0].get("title"))
        if DRY:
            return print(host, "wallpapers: would upload", [p.get("title") for p in bing])
        if images is None:
            images = [(p.get("title") or p["urlbase"], fetch("https://www.bing.com" + p["urlbase"] + "_1920x1080.jpg"))
                      for p in bing]
        for slot, (title, data) in zip(SLOTS, images):
            try:
                ok = json.loads(fetch(base + "/api/home/wallpapers/upload?slot=" + slot, data, "image/jpeg", 120)).get("ok")
            except OSError as e:
                ok = e
            print(host, "wallpapers:", slot, title, "->", ok)

    def update(host, base):
        state = get(base + "/api/update")
        have = str(state.get("installed") or "").split("+")[0]
        if not have or have == latest_ver:
            return print(host, "update: on", have or "?", "(latest", latest_ver + ")")
        # A finished check leaves available/current/error/offline until Glasshouse restarts;
        # only these mean an update is under way.
        if state.get("state") in ("checking", "downloading", "installing", "installed"):
            return print(host, "update: busy,", state.get("state"))
        if latest_age < SOAK:
            return print(host, "update:", latest_ver, "is only", latest_age, "old; waiting")
        age = release_age(have)
        if age is None:
            return print(host, "update: cannot read when", have, "was released; skipped")
        if age < EVERY:
            return print(host, "update: on", have, "released", age.days, "days ago; next after", EVERY.days)
        if DRY:
            return print(host, "update: would install", latest_ver, "over", have)
        check = control(base, "updateCheck", True)
        if not check.get("available"):
            return print(host, "update: TV sees nothing to install", check.get("error") or "")
        r = control(base, "update")
        print(host, "update:", have, "->", latest_ver, "ok" if r.get("ok") else r)

    for host in HOSTS:
        base = "http://" + host + ":8080"
        try:
            home = get(base + "/api/home")
        except OSError as e:
            print(host, "skipped, not on:", e)
            continue
        for job in (lambda: wallpapers(host, base, home), lambda: update(host, base)):
            try:
                job()
            except (OSError, ValueError, KeyError) as e:
                print(host, "failed:", e)
