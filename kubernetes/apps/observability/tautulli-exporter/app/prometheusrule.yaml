---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tautulli-exporter.rules
spec:
  groups:
    - name: tautulli-exporter.rules
      rules:
        - alert: TautulliExporterDown
          annotations:
            summary: "Tautulli exporter scrape is failing."
          expr: |-
            up{job="tautulli-exporter"} == 0
          for: 10m
          labels:
            severity: warning
        - alert: TautulliUnreachable
          annotations:
            summary: "Tautulli exporter is up but cannot reach the Tautulli API."
          # v1.0.0+ freezes gauges on failure instead of clearing, so absent() never fires.
          expr: |-
            plex_up{job="tautulli-exporter"} == 0
          for: 15m
          labels:
            severity: warning
        - alert: PlexTranscodingOnCPU
          annotations:
            summary: "Plex has transcoded for 30m with its GPU encoder idle, so it is transcoding on the CPU."
            description: >-
              Check the probe under gpu-operator in docs/docs/operations/upgrade-playbooks.md; the
              usual cause is libcuda moving off the transcoder's musl search path (#7153).
          # plex_transcode_video_sessions is always 0 from this exporter; active_streams_transcode is live.
          # The encoder series is per-card, so a co-tenant encoding on Plex's card can mask this, never fake it.
          expr: |-
            (max(min_over_time(plex_active_streams_transcode{job="tautulli-exporter"}[20m])) > 0)
            and on ()
            (max(max_over_time(DCGM_FI_DEV_ENC_UTIL{exported_namespace="media", exported_pod=~"plex-[0-9a-f]+-[0-9a-z]+"}[20m])) == 0)
          for: 10m
          labels:
            severity: warning
