---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./grafanadashboard.yaml
  - ./prometheusrule.yaml
configMapGenerator:
  - name: dococd-dashboard
    files:
      - dococd.json=./dashboards/dococd.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # Keeps Grafana's own ${DS_PROMETHEUS}/$__rate_interval macros from being blanked.
    kustomize.toolkit.fluxcd.io/substitute: disabled
