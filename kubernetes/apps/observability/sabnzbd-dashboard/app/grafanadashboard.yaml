---
# Mirrors exportarr's Media Dashboard; panels query exportarr's own sabnzbd_* series natively.
# Public grafana.com SABnzbd dashboards target msroest/sabnzbd_exporter instead and render blank.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: sabnzbd
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  resyncPeriod: 1h
  configMapRef:
    name: sabnzbd-dashboard
    key: sabnzbd.json
