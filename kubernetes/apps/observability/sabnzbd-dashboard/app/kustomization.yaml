---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./grafanadashboard.yaml
configMapGenerator:
  - name: sabnzbd-dashboard
    files:
      - sabnzbd.json=./dashboards/sabnzbd.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # Disables Flux substitution so ${DS_PROMETHEUS} isn't blanked in the dashboard JSON.
    kustomize.toolkit.fluxcd.io/substitute: disabled
