---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-icmp
spec:
  interval: 1m
  module: icmp
  prober:
    url: blackbox-exporter-lan.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        # Add your internal hosts here - customize as needed for your infrastructure
        - cr-node-01-ipmi.${SECRET_INTERNAL_DOMAIN}
        - cr-node-02-ipmi.${SECRET_INTERNAL_DOMAIN}
        - cr-node-03-ipmi.${SECRET_INTERNAL_DOMAIN}
        - cr-node-04-ipmi.${SECRET_INTERNAL_DOMAIN}
        - cr-node-05-ipmi.${SECRET_INTERNAL_DOMAIN}
        - cr-node-06-ipmi.${SECRET_INTERNAL_DOMAIN}
        - cr-node-07-ipmi.${SECRET_INTERNAL_DOMAIN}
        - cr-node-08-ipmi.${SECRET_INTERNAL_DOMAIN}
        # Storage BMC. The eight above are compute nodes; this one was simply
        # never added, so the box holding the bulk data had no out-of-band
        # liveness signal at all.
        - cr-storage-ipmi.${SECRET_INTERNAL_DOMAIN}
  metricRelabelings:
    - action: replace
      replacement: blackbox-exporter-lan
      targetLabel: service
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-tcp-nfs
spec:
  jobName: nfs_probe
  interval: 1m
  module: tcp_connect
  prober:
    url: blackbox-exporter-lan.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - ${SECRET_STORAGE_SERVER}:2049
  metricRelabelings:
    - action: replace
      replacement: blackbox-exporter-lan
      targetLabel: service
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-tls-cert
spec:
  # Certificate expiry for the two Traefik instances OUTSIDE the cluster, which
  # issue their own Let's Encrypt certificates over Cloudflare DNS-01 and had no
  # expiry monitoring of any kind until 2026-07-29. In-cluster certificates are
  # deliberately not listed: cert-manager owns those and reports on them itself.
  #
  # 5m, not 1m — a certificate's expiry does not change minute to minute, and
  # these are handshakes against boxes whose job is something else.
  jobName: tls_cert
  interval: 5m
  module: tls_connect
  prober:
    url: blackbox-exporter-lan.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        # cr-nut — the box whose rebuild exposed the broken token.
        - peanut.${SECRET_DOMAIN}:443
        # TrueNAS. Every host here is served by the one Traefik from a single
        # acme.json, so in principle one target would do — they are listed
        # individually because a per-host issuance failure is exactly the kind
        # of partial breakage a single sampled target would hide.
        #
        # This list is hand-maintained and WILL drift: traefik-nas was removed
        # on 2026-07-30 after truenas-apps#34 retired that hostname, which left
        # this probe paging LanProbeFailed against a name external-dns had
        # already deleted. If a NAS hostname is added or retired there, change
        # it here too.
        - dozzle.${SECRET_DOMAIN}:443
        - garage-nas.${SECRET_DOMAIN}:443
        - s3-nas.${SECRET_DOMAIN}:443
        - scrutiny-nas.${SECRET_DOMAIN}:443
        - syncthing.${SECRET_DOMAIN}:443
        # Supermicro BMCs. Certwarden renews these certificates and pushes
        # them to each BMC via a deploy Job — a chain with two failure modes
        # seen in production: the Job fails outright (CertDeployJobFailed
        # covers that, but only for ~5 minutes per failure), and the upload
        # "succeeds" while the BMC keeps serving the old certificate until
        # reboot. Probing what the socket actually serves catches both, weeks
        # before expiry. One BMC served an expired certificate for 3.5 months
        # with nothing anywhere to say so — these targets close that gap.
        # (The UPS NMC belongs here too once its stale DNS record is fixed
        # and its first certificate deployment lands.)
        - cr-node-01-ipmi.${SECRET_INTERNAL_DOMAIN}:443
        - cr-node-02-ipmi.${SECRET_INTERNAL_DOMAIN}:443
        - cr-node-03-ipmi.${SECRET_INTERNAL_DOMAIN}:443
        - cr-node-04-ipmi.${SECRET_INTERNAL_DOMAIN}:443
        - cr-node-05-ipmi.${SECRET_INTERNAL_DOMAIN}:443
        - cr-node-06-ipmi.${SECRET_INTERNAL_DOMAIN}:443
        - cr-node-07-ipmi.${SECRET_INTERNAL_DOMAIN}:443
        - cr-node-08-ipmi.${SECRET_INTERNAL_DOMAIN}:443
        - cr-storage-ipmi.${SECRET_INTERNAL_DOMAIN}:443
  metricRelabelings:
    - action: replace
      replacement: blackbox-exporter-lan
      targetLabel: service
