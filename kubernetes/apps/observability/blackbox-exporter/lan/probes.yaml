---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-icmp
spec:
  interval: 1m
  module: icmp
  prober:
    url: blackbox-exporter-lan.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - cr-node-01-ipmi.${SECRET_INTERNAL_DOMAIN}
        - cr-node-02-ipmi.${SECRET_INTERNAL_DOMAIN}
        - cr-node-03-ipmi.${SECRET_INTERNAL_DOMAIN}
        - cr-node-04-ipmi.${SECRET_INTERNAL_DOMAIN}
        - cr-node-05-ipmi.${SECRET_INTERNAL_DOMAIN}
        - cr-node-06-ipmi.${SECRET_INTERNAL_DOMAIN}
        - cr-node-07-ipmi.${SECRET_INTERNAL_DOMAIN}
        - cr-node-08-ipmi.${SECRET_INTERNAL_DOMAIN}
        # This one was simply never added, so the box holding the bulk data had no
        # out-of-band liveness signal at all.
        - cr-storage-ipmi.${SECRET_INTERNAL_DOMAIN}
        # Named 2026-08-02 after the WAN outage: the device that matters most in a
        # recovery previously had no OOB liveness signal.
        - cr-fw-ipmi.${SECRET_INTERNAL_DOMAIN}
  metricRelabelings:
    - action: replace
      replacement: blackbox-exporter-lan
      targetLabel: service
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-icmp-ap
spec:
  # Separate from lan-icmp so severity can differ: critical is right for a BMC or the
  # firewall but wrong for one of four overlapping APs; see AccessPointDown /
  # AllAccessPointsDown. Second, independent signal alongside the switch's per-port PoE
  # reading (snmp-exporter): a hung AP still draws power, so neither check subsumes the
  # other. See docs/docs/apps/blackbox-exporter.md for the DNS-naming reason.
  jobName: ap_probe
  interval: 1m
  module: icmp
  prober:
    url: blackbox-exporter-lan.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - ap-garage.${SECRET_INTERNAL_DOMAIN}
        - ap-hall.${SECRET_INTERNAL_DOMAIN}
        - ap-living-room.${SECRET_INTERNAL_DOMAIN}
        - ap-attic.${SECRET_INTERNAL_DOMAIN}
  metricRelabelings:
    - action: replace
      replacement: blackbox-exporter-lan
      targetLabel: service
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-tcp-nfs
spec:
  jobName: nfs_probe
  interval: 1m
  module: tcp_connect
  prober:
    url: blackbox-exporter-lan.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - ${SECRET_STORAGE_SERVER}:2049
  metricRelabelings:
    - action: replace
      replacement: blackbox-exporter-lan
      targetLabel: service
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-tls-cert
spec:
  # Certificate expiry for the two Traefik instances outside the cluster; see KB-049.
  # In-cluster certificates are excluded: cert-manager owns and reports on those itself.
  # 5m, not 1m: expiry does not change minute to minute, and these are handshakes
  # against boxes whose job is something else.
  jobName: tls_cert
  interval: 5m
  module: tls_connect
  prober:
    url: blackbox-exporter-lan.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - peanut.${SECRET_DOMAIN}:443
        # Every TrueNAS host here is served by one Traefik from a single acme.json, so in
        # principle one target would do; listed individually because a per-host issuance
        # failure is exactly the partial breakage a single sampled target would hide.
        # Hand-maintained and WILL drift: add or retire a NAS hostname here to match.
        - dozzle.${SECRET_DOMAIN}:443
        - garage-nas.${SECRET_DOMAIN}:443
        - s3-nas.${SECRET_DOMAIN}:443
        - scrutiny-nas.${SECRET_DOMAIN}:443
        - syncthing.${SECRET_DOMAIN}:443
        # Certwarden's apc-p15-tool embeds the full chain, so this verifies cleanly and
        # belongs on the strict probe, unlike the BMCs below.
        - cr-ups-main.${SECRET_DOMAIN}:443
  metricRelabelings:
    - action: replace
      replacement: blackbox-exporter-lan
      targetLabel: service
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-tls-cert-device
spec:
  # Catches a Certwarden deploy Job that "succeeds" while the device keeps serving the
  # old certificate until reboot; see docs/docs/apps/blackbox-exporter.md. Separate Probe
  # from lan-tls-cert: these BMCs serve a chainless leaf (a firmware constraint), so the
  # verifying tls_connect module can never pass here, see tls_connect_noverify in the
  # HelmRelease. Same jobName, so dashboards and expiry alerts treat both probes as one fleet.
  jobName: tls_cert
  interval: 5m
  # Default 10s scrape timeout clamps the module's 30s to 9.5s; see
  # docs/docs/apps/blackbox-exporter.md. Keep this above the module timeout.
  scrapeTimeout: 35s
  module: tls_connect_noverify
  prober:
    url: blackbox-exporter-lan.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        # Supermicro BMCs.
        - cr-node-01-ipmi.${SECRET_INTERNAL_DOMAIN}:443
        - cr-node-02-ipmi.${SECRET_INTERNAL_DOMAIN}:443
        - cr-node-03-ipmi.${SECRET_INTERNAL_DOMAIN}:443
        - cr-node-04-ipmi.${SECRET_INTERNAL_DOMAIN}:443
        - cr-node-05-ipmi.${SECRET_INTERNAL_DOMAIN}:443
        - cr-node-06-ipmi.${SECRET_INTERNAL_DOMAIN}:443
        - cr-node-07-ipmi.${SECRET_INTERNAL_DOMAIN}:443
        - cr-node-08-ipmi.${SECRET_INTERNAL_DOMAIN}:443
        - cr-storage-ipmi.${SECRET_INTERNAL_DOMAIN}:443
  metricRelabelings:
    - action: replace
      replacement: blackbox-exporter-lan
      targetLabel: service
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-tcp-veeam
spec:
  # Complements VeeamServerGuestDown (vmware-exporter, a dead guest OS): this catches the
  # Veeam services being down while the OS is up, e.g. failing to start after a reboot.
  jobName: veeam_probe
  interval: 1m
  module: tcp_connect
  prober:
    url: blackbox-exporter-lan.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - ${SECRET_VEEAM_HOST}:9419
  metricRelabelings:
    - action: replace
      replacement: blackbox-exporter-lan
      targetLabel: service
