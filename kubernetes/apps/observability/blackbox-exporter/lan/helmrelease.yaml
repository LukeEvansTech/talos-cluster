---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter-lan
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter-lan
  values:
    fullnameOverride: blackbox-exporter-lan
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
            follow_redirects: true
            preferred_ip_protocol: ip4
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        tcp_connect:
          prober: tcp
          timeout: 5s
        # TLS handshake only — deliberately NOT http_2xx. Several of the probed
        # endpoints are auth-gated and answer 401/403, which http_2xx scores as
        # probe_success=0 and would spuriously fire the critical LanProbeFailed
        # alert below. A bare handshake yields probe_ssl_earliest_cert_expiry
        # without any HTTP semantics to get wrong, and doubles as a genuine
        # "is TLS answering" signal. The tcp prober sends the target's hostname
        # as SNI, which matters because these are Traefik instances serving
        # several hosts from one listener.
        tls_connect:
          prober: tcp
          timeout: 5s
          tcp:
            tls: true
            preferred_ip_protocol: ip4
        # Device management endpoints (BMCs, the UPS NMC) serve a chainless
        # leaf — the Certwarden device deploy paths install only the server
        # certificate, so Go's verifier has no intermediate to chain with and
        # a verifying probe scores every device probe_success=0. These probes
        # exist to harvest expiry, not to validate trust; skip verification
        # for the device module only, keeping the stricter tls_connect for
        # the Traefik targets (where a broken chain IS worth failing on).
        # 30s, not 5s: the H12-generation storage BMC holds an RSA-4096 key
        # (the H13s carry ECDSA) and its BMC processor takes several seconds
        # for the private-key operation, so its handshake blows a 5s budget.
        # Probes run every 5m; a generous timeout costs nothing.
        #
        # This value is only half the setting — blackbox clamps it to the
        # scrape timeout Prometheus sends in X-Prometheus-Scrape-Timeout-
        # Seconds, minus a 0.5s offset. Against the 10s default that is 9.5s,
        # so the 15s set here on 2026-08-02 never applied and the probe kept
        # the 9.5s budget it was written to escape. The matching scrapeTimeout
        # lives on the lan-tls-cert-device Probe; raise both or neither.
        tls_connect_noverify:
          prober: tcp
          timeout: 30s
          tcp:
            tls: true
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: true
    serviceMonitor:
      enabled: true
      selfMonitor:
        enabled: true
    prometheusRule:
      enabled: true
      rules:
        - alert: LanProbeFailed
          expr: |-
            probe_success{service="blackbox-exporter-lan"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: |-
              The probe targeting {{ $labels.instance }} is currently having connectivity issues
        # ── Why these exist ──────────────────────────────────────────────────
        # Added 2026-07-29 after an incident that was invisible for weeks. Two
        # hand-made Cloudflare DNS-01 tokens carried an IP allowlist that no
        # longer matched the home WAN address, so ACME renewal was dead on both
        # non-cluster Traefik instances. It only came to light because a rebuild
        # of one of them destroyed its acme.json and forced an immediate
        # re-issue; TrueNAS still held a cached certificate valid for
        # another six weeks and would have failed silently at its renewal, with
        # nothing in the estate to say so until a browser threw a warning.
        #
        # Nothing anywhere alerted on certificate expiry before this. These two
        # rules are the safety net that makes the whole class of ACME failure
        # loud, independent of what caused it.
        #
        # Let's Encrypt issues for 90d and renews at 30d remaining, so 21d means
        # renewal has already been failing for about nine days — early enough to
        # fix calmly, late enough not to fire on a renewal that is merely due.
        # Bounded at the bottom by the critical threshold below. There are no
        # inhibit_rules in this Alertmanager, so an unbounded warning would page
        # a second time alongside the critical for the same certificate.
        - alert: CertificateExpiringSoon
          expr: |-
            (
              probe_ssl_earliest_cert_expiry{service="blackbox-exporter-lan"}
                - time()
            ) / 86400 < 21
              and
            (
              probe_ssl_earliest_cert_expiry{service="blackbox-exporter-lan"}
                - time()
            ) / 86400 >= 7
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: >-
              TLS certificate for {{ $labels.instance }} expires in
              {{ $value | humanize }} days — ACME renewal is probably failing
        - alert: CertificateExpiringCritical
          expr: |-
            (
              probe_ssl_earliest_cert_expiry{service="blackbox-exporter-lan"}
                - time()
            ) / 86400 < 7
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: >-
              TLS certificate for {{ $labels.instance }} expires in under
              7 days and ACME renewal has not succeeded
