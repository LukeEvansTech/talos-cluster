---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter-lan
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter-lan
  values:
    fullnameOverride: blackbox-exporter-lan
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
            follow_redirects: true
            preferred_ip_protocol: ip4
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        tcp_connect:
          prober: tcp
          timeout: 5s
        # Handshake only, not http_2xx: several endpoints are auth-gated and answer
        # 401/403, which http_2xx scores as failed and would spuriously page. The tcp
        # prober sends the target hostname as SNI, which matters for a multi-host listener.
        tls_connect:
          prober: tcp
          timeout: 5s
          tcp:
            tls: true
            preferred_ip_protocol: ip4
        # Device management endpoints install only the server certificate (Certwarden), so
        # a verifying probe scores every one as failed; these exist to harvest expiry, not
        # to validate trust. Keep the stricter tls_connect for the Traefik targets.
        # 30s: blackbox clamps this to the scrapeTimeout Prometheus sends, minus 0.5s, so
        # it is only ever half-effective; see docs/docs/apps/blackbox-exporter.md. Raise
        # this and the lan-tls-cert-device Probe's scrapeTimeout together, or neither.
        tls_connect_noverify:
          prober: tcp
          timeout: 30s
          tcp:
            tls: true
            preferred_ip_protocol: ip4
            tls_config:
              insecure_skip_verify: true
    serviceMonitor:
      enabled: true
      selfMonitor:
        enabled: true
    prometheusRule:
      enabled: true
      rules:
        # job="ap_probe" is excluded: losing one of four overlapping radios is degraded
        # coverage, not an outage. It gets the two rules below instead, split by blast radius.
        - alert: LanProbeFailed
          expr: |-
            probe_success{service="blackbox-exporter-lan", job!="ap_probe"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: |-
              The probe targeting {{ $labels.instance }} is currently having connectivity issues
        # Warning, not critical: the other three APs carry the clients. `for: 15m` rides
        # out a firmware reboot. Complements rather than duplicates MikrotikPoeDeviceLostPower
        # (sees lost power); a hung AP draws power as happily as a healthy one, so both
        # firing together points at power, this one alone points at the AP.
        - alert: AccessPointDown
          expr: |-
            probe_success{job="ap_probe"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: |-
              Access point {{ $labels.instance }} is not answering ICMP, powered but off the network, or dead.
        # The whole wireless estate at once earns the critical the individual rule does
        # not take. Usually the switch or its power, not the APs; check SnmpTargetDown first.
        - alert: AllAccessPointsDown
          expr: |-
            sum(probe_success{job="ap_probe"}) == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: |-
              All wireless access points are unreachable. Wireless is down estate-wide.
        # Added after an incident invisible for weeks; see
        # docs/docs/troubleshooting/kb/049-acme-token-ip-allowlist-broke-renewal-silently.md.
        # 21d: Let's Encrypt renews at 30d remaining, so this means renewal has already been
        # failing for about nine days, early enough to fix calmly. Bounded below by the
        # critical threshold since this Alertmanager has no inhibit_rules.
        - alert: CertificateExpiringSoon
          expr: |-
            (
              probe_ssl_earliest_cert_expiry{service="blackbox-exporter-lan"}
                - time()
            ) / 86400 < 21
              and
            (
              probe_ssl_earliest_cert_expiry{service="blackbox-exporter-lan"}
                - time()
            ) / 86400 >= 7
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: >-
              TLS certificate for {{ $labels.instance }} expires in
              {{ $value | humanize }} days, ACME renewal is probably failing
        - alert: CertificateExpiringCritical
          expr: |-
            (
              probe_ssl_earliest_cert_expiry{service="blackbox-exporter-lan"}
                - time()
            ) / 86400 < 7
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: >-
              TLS certificate for {{ $labels.instance }} expires in under
              7 days and ACME renewal has not succeeded
