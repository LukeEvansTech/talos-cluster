---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oxidized
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: oxidized-secret
    template:
      engineVersion: v2
      data:
        GITHUB_DEPLOY_KEY: "{{ .GITHUB_DEPLOY_KEY }}"
        GITHUB_DEPLOY_KEY_PUB: "{{ .GITHUB_DEPLOY_KEY_PUB }}"
        GITHUB_KNOWN_HOSTS: "{{ .GITHUB_KNOWN_HOSTS }}"
        PUSHOVER_TOKEN: "{{ .PUSHOVER_TOKEN }}"
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
        # Core switch and WiFi controller stay out: Oxidized ships no built-in model for either.
        # The firewall stays out too: its config dump leaked secrets to Git, while the switches'
        # exports hide them (docs/docs/troubleshooting/kb/070-firewall-backup-leaked-secrets.md).
        router.db: |
          mikrotik_poe:{{ .MIKROTIK_POE_HOST }}:routeros:{{ .MIKROTIK_POE_USERNAME }}:{{ .MIKROTIK_POE_PASSWORD }}
          mikrotik_nonpoe:{{ .MIKROTIK_NONPOE_HOST }}:routeros:{{ .MIKROTIK_NONPOE_USERNAME }}:{{ .MIKROTIK_NONPOE_PASSWORD }}
  dataFrom:
    - extract:
        key: oxidized
