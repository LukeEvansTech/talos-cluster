---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-logs-collector
  values:
    fullnameOverride: victoria-logs-collector
    global:
      image:
        registry: quay.io
    podMonitor:
      enabled: true
    # HostToContainer on /var/lib: the chart's default private propagation pins any CSI staging
    # mount live at pod start, blocking that PVC from ever attaching on another node (#3729).
    defaultVolumeMounts:
      - name: varlog
        mountPath: /var/log
        readOnly: true
      - name: varlib
        mountPath: /var/lib
        readOnly: true
        mountPropagation: HostToContainer
    remoteWrite:
      - url: http://victoria-logs-server.observability.svc.cluster.local:9428
        maxDiskUsagePerURL: 10GB
    collector:
      # Keep this list small: each field multiplies VictoriaLogs' stream cardinality.
      streamFields:
        - kubernetes.pod_name
        - kubernetes.pod_namespace
        - kubernetes.container_name
        - kubernetes.pod_labels.app.kubernetes.io/name
    extraArgs:
      # Strip ANSI colour codes from the log message body for grep-ability.
      "kubernetesCollector.decolorizeFields": _msg
