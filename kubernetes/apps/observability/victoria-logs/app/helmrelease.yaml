---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  values:
    fullnameOverride: victoria-logs
    server:
      # Local syslog sink: some hosts log here by compliance requirement, kept off sentinel-syslog.
      extraArgs:
        # 5514, not 514: the pod is non-root. The LB Service below remaps 514 -> 5514.
        syslog.listenAddr.tcp: ":5514"
        # UDP truncates syslog at 480 bytes, so TCP listens too for senders that can use it.
        syslog.listenAddr.udp: ":5514"
        # UTC because RFC3164 has no timezone field and both current senders already run UTC.
        syslog.timezone: "UTC"
      resources:
        requests:
          cpu: 10m
          memory: 1Gi
        limits:
          memory: 2Gi
      persistentVolume:
        enabled: true
        storageClass: ceph-block
        size: 100Gi
      retentionPeriod: 28d
      route:
        enabled: true
        hostnames:
          - victorialogs.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        extraRules:
          - matches:
              - path:
                  type: Exact
                  value: /
            filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /select/vmui/
                  statusCode: 302
    serviceMonitor:
      enabled: true
    dashboards:
      enabled: true
    extraObjects:
      # Separate Service: tailscale-operator rejects the chart's headless one, and clusterIP
      # can't change in place. Lets the seedbox's Vector push logs to this instance.
      - apiVersion: v1
        kind: Service
        metadata:
          name: victoria-logs-tailnet
          annotations:
            tailscale.com/expose: "true"
            tailscale.com/hostname: victoria-logs
        spec:
          type: ClusterIP
          selector:
            app: server
            app.kubernetes.io/instance: victoria-logs
            app.kubernetes.io/name: victoria-logs-single
          ports:
            - name: http
              port: 9428
              protocol: TCP
              targetPort: http
      # Cluster, not Local: a Local lease can land off-pod and drop traffic (sentinel-syslog #4070).
      - apiVersion: v1
        kind: Service
        metadata:
          name: victoria-logs-syslog
          annotations:
            lbipam.cilium.io/ips: ${SVC_VLSYSLOG_ADDR}
            external-dns.alpha.kubernetes.io/hostname: vlsyslog.${SECRET_DOMAIN}
        spec:
          type: LoadBalancer
          externalTrafficPolicy: Cluster
          selector:
            app: server
            app.kubernetes.io/instance: victoria-logs
            app.kubernetes.io/name: victoria-logs-single
          ports:
            # Names the chart's own ports, so a future listenAddr change needs no edit here.
            - name: syslog-tcp
              port: 514
              protocol: TCP
              targetPort: syslog-tcp
            - name: syslog-udp
              port: 514
              protocol: UDP
              targetPort: syslog-udp
