---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nut-appliance.rules
spec:
  groups:
    # Four host-level rules, wide margins: every severity pages (docs/docs/apps/nut-appliance.md).
    # No RAPL power-regression alert: the tuning delta sits inside run-to-run noise
    # (docs/docs/apps/nut-appliance.md); graphed on the dashboard instead.
    - name: nut-appliance.rules
      rules:
        # Not "box is down" (UPSUnreachable covers that): gated on nut-exporter still
        # reading upsd, so this means only "alive, but blind on it". Covers every
        # appliance scrape in one rule rather than five near-identical ones (Zincati
        # reboots and the smartctl job's 300s interval both fit inside the 15m fuse).
        - alert: NutApplianceHostMetricsMissing
          annotations:
            description: >-
              At least one appliance exporter (node, smartctl or docker-state) has not
              been scraped for 15 minutes, but nut-exporter is still reading upsd on the
              same host, so the box is up and only its metrics are blind. Check the
              monitoring stack (nut-apps apps/monitoring) rather than the box itself.
            summary: NUT appliance metrics are missing while the box is still up.
          expr: |-
            min(up{job=~"nut-appliance-.*"}) == 0
            and on()
            (max(up{job="nut-exporter"}) == 1)
          for: 15m
          labels:
            severity: warning
        # Three rules, not truenas-docker.rules' five: OOM and exporter-down are
        # already covered above (docs/docs/apps/nut-appliance.md). Scoped to the doco-cd
        # fleet so a hand-run throwaway container never pages.
        # Restore-init one-shots exit 0 and stay exited, excluded by name (#4088,
        # docs/docs/apps/seedbox.md). `created` catches one that fails instead.
        - alert: NutApplianceContainerDown
          annotations:
            description: >-
              Container {{ $labels.name }} on the NUT appliance is {{ $labels.status }}.
              If this is doco-cd, GitOps has stopped and the box is drifting from
              nut-apps with no other symptom.
            summary: NUT appliance container {{ $labels.name }} is not running.
          expr: |-
            container_state_status{job="nut-appliance-docker", status=~"exited|dead|created", container_label_cd_doco_metadata_manager="doco-cd", name!~".*-restore-.*-[0-9]+"} == 1
          for: 5m
          labels:
            severity: warning
        - alert: NutApplianceContainerUnhealthy
          annotations:
            description: >-
              Container {{ $labels.name }} on the NUT appliance is failing its
              healthcheck. traefik, doco-cd and nut-upsd all define one.
            summary: NUT appliance container {{ $labels.name }} is unhealthy.
          expr: |-
            container_state_health_status{job="nut-appliance-docker", status="unhealthy"} == 1
          for: 5m
          labels:
            severity: warning
        - alert: NutApplianceContainerFlapping
          annotations:
            description: >-
              Container {{ $labels.name }} on the NUT appliance restarted {{ $value }}
              times in the last hour, a crash loop, which `restart: unless-stopped`
              will hide indefinitely.
            summary: NUT appliance container {{ $labels.name }} is crash-looping.
          expr: |-
            changes(container_restartcount{job="nut-appliance-docker"}[1h]) > 3
          for: 5m
          labels:
            severity: warning
        # mountpoint="/var" is load-bearing: FCOS mounts the same xfs at four places, and
        # "/" isn't exposed by node-exporter here at all (docs/docs/apps/nut-appliance.md).
        # /boot excluded: already too full for rpm-ostree to stage a kernel, so this
        # threshold would be useless there; needs its own rule if it needs watching.
        - alert: NutApplianceDiskFillHigh
          annotations:
            description: >-
              /var on the NUT appliance is {{ $value | humanizePercentage }} full.
              Baseline is 3.4%, so something is growing that should not be, most
              likely container logs or unpruned images.
            summary: NUT appliance /var is above 85% full.
          expr: |-
            1 - (
              node_filesystem_avail_bytes{job="nut-appliance-node", mountpoint="/var"}
              / node_filesystem_size_bytes{job="nut-appliance-node", mountpoint="/var"}
            ) > 0.85
          for: 30m
          labels:
            severity: warning
        # 75C against a 36C idle baseline means a dead fan or blocked intake, not load.
        # NVMe temperature is covered by the shared smartctl-exporter.rules instead.
        - alert: NutApplianceCPUTemperatureHigh
          annotations:
            description: >-
              Hottest CPU core on the NUT appliance is {{ $value }}°C, against a
              35-36°C idle baseline. On a box this idle that means cooling, not load,
              check the fan and the intake.
            summary: NUT appliance CPU temperature is high.
          expr: |-
            max(node_hwmon_temp_celsius{job="nut-appliance-node", chip="platform_coretemp_0"}) > 75
          for: 15m
          labels:
            severity: warning
        # No swap on this box, so exhaustion goes straight to the OOM killer, and
        # upsd is a candidate victim. Baseline is 89% available.
        - alert: NutApplianceMemoryLow
          annotations:
            description: >-
              Available memory on the NUT appliance is {{ $value | humanizePercentage }}
              of total (baseline 89%). There is no swap on this box, so the next step is
              the OOM killer, and upsd is a candidate.
            summary: NUT appliance is low on available memory.
          expr: |-
            node_memory_MemAvailable_bytes{job="nut-appliance-node"}
            / node_memory_MemTotal_bytes{job="nut-appliance-node"} < 0.10
          for: 30m
          labels:
            severity: warning
