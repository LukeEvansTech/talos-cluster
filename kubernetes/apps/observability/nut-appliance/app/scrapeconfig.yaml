---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name nut-appliance-node
spec:
  # node-exporter (:9100), plus RAPL package power. Plain LAN scrape, no egress
  # Service: unlike the seedbox, this appliance is not reached over the tailnet.
  staticConfigs:
    - targets:
        - ${NUT_SERVER_ADDR}:9100
  metricsPath: /metrics
  scrapeInterval: 60s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: nut-appliance
  metricRelabelings:
    # Load-bearing: unscoped ceph-mixin alerts adopt every node-exporter target, and
    # CephNodeDiskspaceWarning joins on node_uname_info, so dropping it keeps a 5-day
    # predict_linear from paging on this appliance (docs/docs/apps/nut-appliance.md).
    - action: drop
      sourceLabels:
        - __name__
      regex: node_uname_info
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name nut-appliance-smartctl
spec:
  # smartctl-exporter (:9633): node-exporter can't see SMART, and smartmontools
  # isn't in the FCOS base image, so a container is the only route on this OS.
  # Inherits the shared smartctl-exporter.rules for free, no job selector there.
  staticConfigs:
    - targets:
        - ${NUT_SERVER_ADDR}:9633
  metricsPath: /metrics
  # 300s, matching the seedbox: SMART attributes move on a timescale of days.
  scrapeInterval: 300s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: nut-appliance
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name nut-appliance-docker
spec:
  # docker_state_exporter (:9419), keyed by container name. Closes a real hole:
  # traefik, peanut and doco-cd dying were invisible; a dead doco-cd is the worst,
  # since GitOps then silently stops with no other symptom.
  staticConfigs:
    - targets:
        - ${NUT_SERVER_ADDR}:9419
  metricsPath: /metrics
  scrapeInterval: 60s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: nut-appliance
  metricRelabelings:
    # Keeps cd_doco_metadata_manager so "container down" scopes to the GitOps fleet
    # and a hand-run throwaway container never pages.
    - action: labelkeep
      regex: __name__|job|instance|name|status|health_status|container_label_cd_doco_metadata_manager
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name nut-appliance-doco-cd
spec:
  # doco-cd's own metrics (:9120): doco_cd_polls_total proves the repo is actually
  # being polled, stricter than "the container is running". Publishing the port
  # needed a systemd unit change outside GitOps; a live box needs it by hand.
  staticConfigs:
    - targets:
        - ${NUT_SERVER_ADDR}:9120
  metricsPath: /metrics
  scrapeInterval: 60s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: nut-appliance
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name nut-appliance-traefik
spec:
  # Traefik metrics entrypoint (:8082), same shape as the seedbox-traefik job.
  staticConfigs:
    - targets:
        - ${NUT_SERVER_ADDR}:8082
  metricsPath: /metrics
  scrapeInterval: 60s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: nut-appliance
