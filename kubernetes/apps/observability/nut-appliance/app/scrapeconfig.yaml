---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name nut-appliance-node
spec:
  # node-exporter on the NUT appliance (:9100) — CPU/memory/disk/network, plus
  # RAPL package power. Same host as the ${NUT_SERVER_ADDR} the nut-exporter
  # ServiceMonitor already talks to on :3493; the exporters live in nut-apps
  # under apps/monitoring.
  #
  # Plain LAN scrape, no egress Service. This is the truenas-exporter shape, not
  # the seedbox one — the seedbox needs egress.yaml because it is reached over
  # the tailnet, and this appliance is not.
  staticConfigs:
    - targets:
        - ${NUT_SERVER_ADDR}:9100
  metricsPath: /metrics
  scrapeInterval: 60s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: nut-appliance
  metricRelabelings:
    # Load-bearing, not tidying. Several ceph-mixin alerts are shipped with NO
    # job selector and therefore adopt every node-exporter target in the cluster.
    # CephNodeDiskspaceWarning joins through node_uname_info
    # (`* on(cluster, instance) group_left(nodename) node_uname_info`), so
    # dropping the metric here breaks that join and keeps a 5-day predict_linear
    # on an appliance's filesystems from paging. The seedbox does the same for
    # the same reason. Nothing else reads it — the dashboard deliberately does
    # not show a kernel-version panel.
    #
    # The other two unscoped ceph node alerts were checked against this box
    # rather than assumed, and are safe as-is:
    #   CephNodeRootFilesystemFull — keys on mountpoint="/", which FCOS 44 does
    #     not expose to node-exporter at all (/ is a 5 MB composefs overlay,
    #     permanently 100% full; the real xfs surfaces as /var, /etc, /sysroot).
    #   CephNodeInconsistentMTU — compares each device against the cluster-wide
    #     median for that device name. Verified: eno1 1500, docker0 1500 and
    #     tailscale0 1280 all match the existing medians, and the br-*/veth*
    #     names are unique to this host so each is its own median.
    - action: drop
      sourceLabels:
        - __name__
      regex: node_uname_info
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name nut-appliance-smartctl
spec:
  # smartctl-exporter on the NUT appliance (:9633) — NVMe health for the single
  # boot/data drive. node-exporter cannot see SMART, and smartmontools is not in
  # the FCOS base image, so on an immutable OS a container is the only route.
  #
  # This target needs no rules of its own: the shared smartctl-exporter.rules
  # carry no job selector, so it inherits smart_status / critical_warning /
  # media_errors / available_spare / temperature for free.
  staticConfigs:
    - targets:
        - ${NUT_SERVER_ADDR}:9633
  metricsPath: /metrics
  # 300s, matching the seedbox: SMART attributes move on a timescale of days, so
  # a 5x cheaper scrape loses nothing.
  scrapeInterval: 300s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: nut-appliance
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name nut-appliance-docker
spec:
  # docker_state_exporter on the appliance (:9419) — per-container state, health,
  # restart count and OOM-kill, keyed by container NAME.
  #
  # Closes a real hole: upsd dying is covered by UPSUnreachable / UPSMetricsMissing
  # and the two host exporters are covered by their own scrapes failing, but
  # traefik, peanut and doco-cd dying were invisible. A dead doco-cd is the worst
  # of those — GitOps silently stops and the box drifts from its repo with no
  # symptom at all.
  staticConfigs:
    - targets:
        - ${NUT_SERVER_ADDR}:9419
  metricsPath: /metrics
  scrapeInterval: 60s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: nut-appliance
  metricRelabelings:
    # Drop the noisy per-container label set (compose/doco-cd digests, image refs,
    # container ids) but KEEP cd_doco_metadata_manager, so "container down" can be
    # scoped to the GitOps-managed fleet and a hand-run throwaway never pages.
    # Same shape as the truenas-docker-exporter job.
    - action: labelkeep
      regex: __name__|job|instance|name|status|health_status|container_label_cd_doco_metadata_manager
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name nut-appliance-doco-cd
spec:
  # doco-cd's own metrics (:9120) — GitOps poll and deploy status for the
  # appliance, matching the seedbox-doco-cd job.
  #
  # Strictly better than "the container is running", which docker_state_exporter
  # already covers: doco_cd_polls_total is the signal that the repo is actually
  # being polled. A doco-cd that is up but has stopped polling deploys nothing,
  # and the box drifts from nut-apps with no other symptom.
  #
  # The container always served these; they were simply never published. Exposing
  # them needed a `--publish` on the doco-cd systemd unit, declared in the Butane
  # config under nut-apps provision/ignition/ — doco-cd deploys compose stacks, it
  # does not manage its own unit, so that change is NOT GitOps-applied and a live
  # box needs the unit updated by hand.
  staticConfigs:
    - targets:
        - ${NUT_SERVER_ADDR}:9120
  metricsPath: /metrics
  scrapeInterval: 60s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: nut-appliance
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name nut-appliance-traefik
spec:
  # Traefik metrics entrypoint (:8082) — per-router/service request stats for
  # the two dashboards, matching the seedbox-traefik job. The entrypoint landed
  # with the 2026-07-30 fleet convergence (nut-apps), bound to the LAN address
  # like the exporters above.
  staticConfigs:
    - targets:
        - ${NUT_SERVER_ADDR}:8082
  metricsPath: /metrics
  scrapeInterval: 60s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
    - action: replace
      targetLabel: instance
      replacement: nut-appliance
