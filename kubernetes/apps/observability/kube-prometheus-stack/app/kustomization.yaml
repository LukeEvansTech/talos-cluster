---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./alertmanagerconfig.yaml
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./grafanadashboard.yaml
  - ./grafanadashboard-node-exporter.yaml
  - ./scrapeconfig.yaml
configMapGenerator:
  - name: kubernetes-volumes-dashboard
    files:
      - kubernetes-volumes.json=./dashboards/kubernetes-volumes.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # Grafana's own ${DS_OPENSHIFT_PROMETHEUS} macro would be blanked by Flux substitution.
    kustomize.toolkit.fluxcd.io/substitute: disabled
