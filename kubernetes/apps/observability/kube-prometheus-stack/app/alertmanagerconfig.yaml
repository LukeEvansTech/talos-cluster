---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    groupBy:
      - "alertname"
      - "job"
    groupInterval: 5m
    groupWait: 1m
    receiver: pushover
    repeatInterval: 12h
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      - receiver: "null"
        matchers:
          - name: alertname
            value: DockerhubRateLimitRisk
            matchType: =
      - receiver: heartbeat
        groupWait: 0s
        repeatInterval: 5m
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
      # First match wins, so this UPS route (priority 2, retry/expire) only catches alerts labelled
      # pushover_priority=emergency; every other critical alert still uses the route below.
      - receiver: pushover-emergency
        groupWait: 0s
        repeatInterval: 30m
        matchers:
          - name: pushover_priority
            value: emergency
            matchType: =
      - receiver: pushover
        matchers:
          - name: severity
            value: critical
            matchType: =
      # Pushover caps the whole account at 10,000 messages a month, shared by every app. Info
      # alerts stay on the Alertmanager UI only; warnings push once, re-notify at most daily, and
      # skip the resolved message, which halves their cost.
      - receiver: "null"
        matchers:
          - name: severity
            value: info
            matchType: =
      - receiver: pushover-warning
        groupInterval: 1h
        repeatInterval: 24h
        matchers:
          - name: severity
            value: warning
            matchType: =
  inhibitRules:
    - equal:
        - "alertname"
        - "namespace"
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =
    # Suppresses the CephHealthWarning catch-all while a specific Ceph alert covers the same
    # HEALTH_WARN, so one event doesn't double-page; source/target are kept disjoint on purpose.
    - equal:
        - "cluster"
        - "namespace"
      sourceMatch:
        - name: alertname
          value: "Ceph.+"
          matchType: "=~"
        - name: alertname
          value: "CephHealth(Warning|Error)"
          matchType: "!~"
      targetMatch:
        - name: alertname
          value: CephHealthWarning
          matchType: =
  receivers:
    - name: "null"
    # sendResolved must stay false. Healthchecks.io reads any ping as success, so a "resolved" ping
    # looks identical to "alive" and would reset the dead man's switch exactly when the signal dies.
    # resolveTimeout: 5m means a Prometheus outage triggers that resolve for real.
    - name: heartbeat
      webhookConfigs:
        - urlSecret:
            name: &secret alertmanager-secret
            key: ALERTMANAGER_HEARTBEAT_URL
          sendResolved: false
    - name: pushover
      pushoverConfigs:
        - html: true
          message: &message |-
            {{- range .Alerts }}
              {{- if ne .Annotations.description "" }}
                {{ .Annotations.description }}
              {{- else if ne .Annotations.summary "" }}
                {{ .Annotations.summary }}
              {{- else if ne .Annotations.message "" }}
                {{ .Annotations.message }}
              {{- else }}
                Alert description not available
              {{- end }}
              {{- if gt (len .Labels.SortedPairs) 0 }}
                <small>
                  {{- range .Labels.SortedPairs }}
                    <b>{{ .Name }}:</b> {{ .Value }}
                  {{- end }}
                </small>
              {{- end }}
            {{- end }}
          priority: |-
            {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
          sendResolved: true
          sound: gamelan
          title: &title >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
            {{ .CommonLabels.alertname }}
          ttl: 86400s
          token:
            name: *secret
            key: ALERTMANAGER_PUSHOVER_TOKEN
          userKey:
            name: *secret
            key: PUSHOVER_USER_KEY
          urlTitle: View in Alertmanager
    - name: pushover-warning
      pushoverConfigs:
        - html: true
          message: *message
          priority: "0"
          sendResolved: false
          title: *title
          ttl: 86400s
          token:
            name: *secret
            key: ALERTMANAGER_PUSHOVER_TOKEN
          userKey:
            name: *secret
            key: PUSHOVER_USER_KEY
          urlTitle: View in Alertmanager
    # UPS power alerts only, routed via pushover_priority=emergency. Priority 2 re-alerts on `retry`
    # until acknowledged or `expire` elapses; resolved always sends at priority 0.
    - name: pushover-emergency
      pushoverConfigs:
        - html: true
          message: |-
            {{- range .Alerts }}
              {{- if ne .Annotations.description "" }}
                {{ .Annotations.description }}
              {{- else if ne .Annotations.summary "" }}
                {{ .Annotations.summary }}
              {{- else if ne .Annotations.message "" }}
                {{ .Annotations.message }}
              {{- else }}
                Alert description not available
              {{- end }}
              {{- if gt (len .Labels.SortedPairs) 0 }}
                <small>
                  {{- range .Labels.SortedPairs }}
                    <b>{{ .Name }}:</b> {{ .Value }}
                  {{- end }}
                </small>
              {{- end }}
            {{- end }}
          priority: |-
            {{ if eq .Status "firing" }}2{{ else }}0{{ end }}
          retry: 1m
          expire: 1h
          sendResolved: true
          sound: siren
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
            {{ .CommonLabels.alertname }}
          ttl: 86400s
          token:
            name: *secret
            key: ALERTMANAGER_PUSHOVER_TOKEN
          userKey:
            name: *secret
            key: PUSHOVER_USER_KEY
          urlTitle: View in Alertmanager
