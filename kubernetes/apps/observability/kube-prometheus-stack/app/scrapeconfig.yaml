---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name node-exporter
spec:
  # Adds the NAS to job="node-exporter" (cluster nodes reach it via a ServiceMonitor) so the NAS
  # keeps the 22 default node alert rules; see truenas-exporter/app/scrapeconfig.yaml for why.
  staticConfigs:
    - targets:
        - ${SECRET_STORAGE_SERVER}:9100
  metricsPath: /metrics
  # Host metrics on a non-cluster box do not need the cluster's default scrape cadence.
  scrapeInterval: 60s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
  metricRelabelings:
    # Ceph-mixin rules with no job selector would otherwise adopt this host's filesystems through
    # node_uname_info (docs/docs/apps/kube-prometheus-stack.md).
    - action: drop
      sourceLabels:
        - __name__
      regex: node_uname_info
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name smartctl-exporter
spec:
  # Adds the NAS to job="smartctl-exporter"; truenas-exporter's rule and dashboard hardcode that
  # job name in five places, so renaming it would blank a drive-temperature alert and four panels.
  staticConfigs:
    - targets:
        - ${SECRET_STORAGE_SERVER}:9633
  metricsPath: /metrics
  # SMART attributes move over days, so this matches the seedbox and NUT appliance's 5x cheaper
  # scrape interval, on a host with far more drives than either.
  scrapeInterval: 300s
  relabelings:
    - action: replace
      targetLabel: job
      replacement: *name
