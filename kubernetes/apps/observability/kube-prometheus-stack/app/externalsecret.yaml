---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alertmanager-secret
    template:
      data:
        ALERTMANAGER_HEARTBEAT_URL: "{{ .ALERTMANAGER_HEARTBEAT_URL }}"
        # PREREQUISITE: add a SEEDBOX_HEARTBEAT_URL field to the `alertmanager`
        # 1Password item BEFORE this merges. Both heartbeat URLs are
        # Healthchecks.io slug-format pings (hc-ping.com/<ping-key>/<slug>), so
        # this is the same ping key with the seedbox check's slug.
        #
        # Deriving it from ALERTMANAGER_HEARTBEAT_URL with sprig (`| dir` then
        # append a slug) was rejected: it would silently produce a valid-looking
        # 404 URL the day that check is recreated in UUID format, and a heartbeat
        # that pings nowhere fails exactly like a box that has stopped pinging.
        # An absent field is the honest failure — ESO reports SecretSyncError and
        # leaves the last-good secret in place, so existing alerting keeps
        # working and only the new receiver stays dark.
        SEEDBOX_HEARTBEAT_URL: "{{ .SEEDBOX_HEARTBEAT_URL }}"
        ALERTMANAGER_PUSHOVER_TOKEN: "{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
  dataFrom:
    - extract:
        key: pushover
    - extract:
        key: alertmanager
