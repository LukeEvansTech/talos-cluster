---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: docker-backup.rules
spec:
  groups:
    # Backups land on Cloudflare R2 (seedbox-apps / truenas-apps handle the backup jobs).
    #
    # Every alert here pages: each checks a boolean, not a threshold on a live metric.
    #
    # Alerts fire on absence of success, not presence of errors: silence writes no error event.
    #
    # No alert on backup duration yet: not enough run history to pick a real threshold.
    # Design notes and incident history: docs/docs/apps/docker-backup.md
    - name: docker-backup.rules
      rules:
        # 36h (129600s) gives a daily backup a missed run plus 12h slack before this pages.
        - alert: DockerBackupStale
          annotations:
            summary: >-
              No successful {{ $labels.tier }} backup from {{ $labels.box }} in over 36h.
              offsite protection is stale.
          expr: |-
            time() - restic_backup_last_success_timestamp_seconds > 129600
          for: 30m
          labels:
            severity: critical
        # Per-box absent() selectors: a single bare absent() would only fire once every box stopped.
        # Also selects the NAS source-freshness metric, which the rules below can't catch missing.
        # 2h/warning: a real outage already pages via SeedboxDown; this just covers metric-gone.
        - alert: DockerBackupMetricsMissing
          annotations:
            summary: >-
              Backup metrics absent for {{ $labels.box }} for 2h, cannot tell whether
              its offsite backup is running.
          expr: |-
            absent(restic_backup_last_success_timestamp_seconds{box="seedbox"})
            or
            absent(restic_backup_last_success_timestamp_seconds{box="truenas"})
            or
            absent(restic_backup_last_success_timestamp_seconds{box="nut"})
            or
            absent(restic_snapshot_source_last_success_timestamp_seconds{box="truenas"})
          for: 2h
          labels:
            severity: warning
        # Fires within 15m, well before the 36h stale alert, since the cause is usually fixable now.
        - alert: DockerBackupFailing
          annotations:
            summary: >-
              Last {{ $labels.tier }} backup run on {{ $labels.box }} exited non-zero,
              check `docker logs backrest` on that box.
          expr: |-
            restic_backup_exit_code != 0
          for: 15m
          labels:
            severity: warning
        # Fixed-name NAS snapshot: a failed cron refresh leaves restic silently reading stale data.
        # No separate absent() here: DockerBackupMetricsMissing already covers this going missing.
        # 36h/30m, same as DockerBackupStale: catches the cron not running, unlike the flag rule.
        - alert: DockerBackupSourceStale
          annotations:
            summary: >-
              The {{ $labels.dataset }} source snapshot on {{ $labels.box }} has not
              refreshed in over 36h. Backups are copying stale data and still
              reporting success.
          expr: |-
            time() - restic_snapshot_source_last_success_timestamp_seconds > 129600
          for: 30m
          labels:
            severity: critical
        # The refresh script traps EXIT and writes 0 on failure, so this fires in 15m, not 36h.
        - alert: DockerBackupSourceRefreshFailing
          annotations:
            summary: >-
              The {{ $labels.dataset }} source snapshot refresh on {{ $labels.box }}
              failed. tonight's backup will exit 0 against a stale source. Check
              `zfs list -t snapshot {{ $labels.dataset }}` and the cron log.
          expr: |-
            restic_snapshot_source_refresh_ok == 0
          for: 15m
          labels:
            severity: warning
