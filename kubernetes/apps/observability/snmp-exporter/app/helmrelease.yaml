---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app snmp-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: prometheus-snmp-exporter
  values:
    fullnameOverride: *app
    image:
      repository: quay.io/prometheus/snmp-exporter
      tag: v0.30.1@sha256:e5fd5e8b43ace6c088fe9bf0b37b7fff0e04380bee352be7ec41b853a4dd5859
    extraArgs:
      - --config.file=/etc/snmp_exporter/snmp.yml
      - --config.file=/run/snmp-extra/snmp.yml
      - --config.file=/run/snmp-printer/snmp.yml
      - --config.file=/run/snmp-apc/snmp.yml
      - --config.file=/run/snmp-mikrotik/snmp.yml
      - --config.file=/run/snmp-auth/snmp.yml
    extraConfigmapMounts:
      - name: entity-sensor
        configMap: snmp-exporter-entity-sensor
        mountPath: /run/snmp-extra
        readOnly: true
      - name: brother-printer
        configMap: snmp-exporter-brother-printer
        mountPath: /run/snmp-printer
        readOnly: true
      - name: apc-pdu
        configMap: snmp-exporter-apc-pdu
        mountPath: /run/snmp-apc
        readOnly: true
      - name: mikrotik
        configMap: snmp-exporter-mikrotik
        mountPath: /run/snmp-mikrotik
        readOnly: true
    # Credentials only; templated by the ExternalSecret so no community string lives in git.
    extraSecretMounts:
      - name: auth
        secretName: snmp-exporter-auth
        mountPath: /run/snmp-auth
        readOnly: true
    # Targets live under serviceMonitor.params[], not a top-level params: (chart 9.x).
    serviceMonitor:
      enabled: true
      path: /snmp
      module:
        - if_mib
      auth:
        - public_v2
      params:
        # Two targets, not one with both modules: combining them marked the whole
        # target down ~29% of the day (docs/docs/apps/snmp-exporter.md).
        - name: onyx-core
          target: ${ONYX_ADDR}
          module:
            - if_mib
          auth:
            - onyx_ro
          interval: 60s
          scrapeTimeout: 30s
          relabelings:
            - sourceLabels:
                - __param_target
              targetLabel: instance
        # Sensor readings are slow-moving, so a 5m interval costs nothing and cuts
        # agent load five-fold. device_class=sensors excludes it from SnmpTargetDown.
        - name: onyx-core-sensors
          target: ${ONYX_ADDR}
          module:
            - entity_sensor
          auth:
            - onyx_ro
          interval: 300s
          scrapeTimeout: 30s
          relabelings:
            - sourceLabels:
                - __param_target
              targetLabel: instance
            - targetLabel: device_class
              replacement: sensors
        # device_class=printer excludes the label printers (which power themselves
        # off) from SnmpTargetDown; they get supply/fault alerts instead.
        - name: printer-hl
          target: ${PRINTER_HL_ADDR}
          module:
            - if_mib
            - brother_printer
          auth:
            - printer_hl
          interval: 120s
          scrapeTimeout: 30s
          relabelings:
            - sourceLabels:
                - __param_target
              targetLabel: instance
            - targetLabel: device_class
              replacement: printer
        - name: printer-mfc
          target: ${PRINTER_MFC_ADDR}
          module:
            - if_mib
            - brother_printer
          auth:
            - printer_mfc
          interval: 120s
          scrapeTimeout: 30s
          relabelings:
            - sourceLabels:
                - __param_target
              targetLabel: instance
            - targetLabel: device_class
              replacement: printer
        - name: printer-ql
          target: ${PRINTER_QL_ADDR}
          module:
            - if_mib
            - brother_printer
          auth:
            - printer_ql
          interval: 120s
          scrapeTimeout: 30s
          relabelings:
            - sourceLabels:
                - __param_target
              targetLabel: instance
            - targetLabel: device_class
              replacement: printer
        - name: printer-pt
          target: ${PRINTER_PT_ADDR}
          module:
            - if_mib
            - brother_printer
          auth:
            - printer_pt
          interval: 120s
          scrapeTimeout: 30s
          relabelings:
            - sourceLabels:
                - __param_target
              targetLabel: instance
            - targetLabel: device_class
              replacement: printer
        # NMC2 cards speak SNMPv1/v3 only; apc_ro is the v1 read-only community.
        # The two 2G PDUs use the rPDU2 MIB, the legacy PDU the classic rPDU MIB.
        - name: apc-pdu-main-1
          target: ${APC_PDU_MAIN1_ADDR}
          module:
            - apc_rpdu2
          auth:
            - apc_ro
          interval: 60s
          scrapeTimeout: 30s
          relabelings:
            - sourceLabels:
                - __param_target
              targetLabel: instance
            - targetLabel: device_class
              replacement: pdu
        - name: apc-pdu-main-2
          target: ${APC_PDU_MAIN2_ADDR}
          module:
            - apc_rpdu2
          auth:
            - apc_ro
          interval: 60s
          scrapeTimeout: 30s
          relabelings:
            - sourceLabels:
                - __param_target
              targetLabel: instance
            - targetLabel: device_class
              replacement: pdu
        - name: apc-pdu-comms
          target: ${APC_PDU_COMMS_ADDR}
          module:
            - apc_rpdu
          auth:
            - apc_ro
          interval: 60s
          scrapeTimeout: 30s
          relabelings:
            - sourceLabels:
                - __param_target
              targetLabel: instance
            - targetLabel: device_class
              replacement: pdu
        # Split health/interface per switch, same reason as the core switch: the
        # walks are wildly unequal, see docs/docs/apps/snmp-exporter.md.
        - name: mikrotik-poe
          target: ${MIKROTIK_POE_ADDR}
          module:
            - mikrotik_health
          auth:
            - mikrotik_ro
          interval: 60s
          scrapeTimeout: 30s
          relabelings:
            - sourceLabels:
                - __param_target
              targetLabel: instance
            - targetLabel: device_class
              replacement: switch
        - name: mikrotik-nonpoe
          target: ${MIKROTIK_NONPOE_ADDR}
          module:
            - mikrotik_health
          auth:
            - mikrotik_ro
          interval: 60s
          scrapeTimeout: 30s
          relabelings:
            - sourceLabels:
                - __param_target
              targetLabel: instance
            - targetLabel: device_class
              replacement: switch
        # 5m interval and timeout clear of the walk time, so it degrades resolution
        # rather than registering the switch as down; see MikrotikInterfaceScrapeDegraded.
        - name: mikrotik-poe-interfaces
          target: ${MIKROTIK_POE_ADDR}
          module:
            - if_mib
          auth:
            - mikrotik_ro
          interval: 300s
          scrapeTimeout: 60s
          relabelings:
            - sourceLabels:
                - __param_target
              targetLabel: instance
            - targetLabel: device_class
              replacement: switch-if
        - name: mikrotik-nonpoe-interfaces
          target: ${MIKROTIK_NONPOE_ADDR}
          module:
            - if_mib
          auth:
            - mikrotik_ro
          interval: 300s
          scrapeTimeout: 60s
          relabelings:
            - sourceLabels:
                - __param_target
              targetLabel: instance
            - targetLabel: device_class
              replacement: switch-if
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  # snmp_exporter only reads --config.file at startup; Reloader needs this annotation
  # patched in since chart 9.14.1 has no Deployment-level annotations value.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: snmp-exporter
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: snmp-exporter
                annotations:
                  reloader.stakater.com/auto: "true"
