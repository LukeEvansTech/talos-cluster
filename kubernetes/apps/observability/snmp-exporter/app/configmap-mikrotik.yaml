---
# MIKROTIK-MIB for the two switches; the bundled module is too slow to use, see
# docs/docs/apps/snmp-exporter.md. Sensors and unit-code scaling differ per model
# and are not hardcoded here; nothing depends on an unconfirmed scaling factor.
# Per-port PoE names are looked up from the switch at scrape time, not hardcoded
# (public repo). Auths live in the snmp-exporter-auth Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: snmp-exporter-mikrotik
  namespace: observability
data:
  snmp.yml: |-
    modules:
      mikrotik_health:
        walk:
          - 1.3.6.1.2.1.1.3                  # sysUpTime
          - 1.3.6.1.4.1.14988.1.1.3.100.1    # mtxrHealthTable
          - 1.3.6.1.4.1.14988.1.1.15.1.1     # mtxrPOETable
        metrics:
          - name: sysUpTime
            oid: 1.3.6.1.2.1.1.3
            type: gauge
            help: Time since the SNMP agent was last re-initialized (hundredths of a second)
          - name: mtxrHealthValue
            oid: 1.3.6.1.4.1.14988.1.1.3.100.1.3
            type: gauge
            help: Health sensor reading; see mtxrHealthName for what it measures and mtxrHealthUnit for the device's unit code
            indexes:
              - labelname: mtxrHealthIndex
                type: gauge
            lookups:
              - labels: [mtxrHealthIndex]
                labelname: mtxrHealthName
                oid: 1.3.6.1.4.1.14988.1.1.3.100.1.2
                type: DisplayString
              - labels: [mtxrHealthIndex]
                labelname: mtxrHealthUnit
                oid: 1.3.6.1.4.1.14988.1.1.3.100.1.4
                type: gauge
          - name: mtxrPOEStatus
            oid: 1.3.6.1.4.1.14988.1.1.15.1.1.3
            type: gauge
            help: PoE-out status per port; 3 is the value observed on every port actually delivering power
            indexes:
              - labelname: mtxrPOEInterfaceIndex
                type: gauge
            lookups:
              - labels: [mtxrPOEInterfaceIndex]
                labelname: poe_port
                oid: 1.3.6.1.4.1.14988.1.1.15.1.1.2
                type: DisplayString
          - name: mtxrPOEPower
            oid: 1.3.6.1.4.1.14988.1.1.15.1.1.5
            type: gauge
            help: PoE-out power drawn by the device on this port (raw device units, unconfirmed scaling; 0 means nothing is drawing)
            indexes:
              - labelname: mtxrPOEInterfaceIndex
                type: gauge
            lookups:
              - labels: [mtxrPOEInterfaceIndex]
                labelname: poe_port
                oid: 1.3.6.1.4.1.14988.1.1.15.1.1.2
                type: DisplayString
          - name: mtxrPOEVoltage
            oid: 1.3.6.1.4.1.14988.1.1.15.1.1.4
            type: gauge
            help: PoE-out voltage on this port (raw device units, unconfirmed scaling)
            indexes:
              - labelname: mtxrPOEInterfaceIndex
                type: gauge
            lookups:
              - labels: [mtxrPOEInterfaceIndex]
                labelname: poe_port
                oid: 1.3.6.1.4.1.14988.1.1.15.1.1.2
                type: DisplayString
          - name: mtxrPOECurrent
            oid: 1.3.6.1.4.1.14988.1.1.15.1.1.6
            type: gauge
            help: PoE-out current on this port (raw device units, unconfirmed scaling)
            indexes:
              - labelname: mtxrPOEInterfaceIndex
                type: gauge
            lookups:
              - labels: [mtxrPOEInterfaceIndex]
                labelname: poe_port
                oid: 1.3.6.1.4.1.14988.1.1.15.1.1.2
                type: DisplayString
