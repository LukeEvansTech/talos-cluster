---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: snmp-exporter.rules
spec:
  groups:
    - name: snmp-exporter.rules
      rules:
        # Printers are excluded here: the label printers (QL/PT) power themselves
        # off by design, so a blanket down-alert on them is pure noise. Printer
        # health is covered by PrinterFault + PrinterSupplyLow below instead.
        #
        # device_class=sensors is excluded on the same basis: that target walks
        # the whole entPhysicalTable on an agent that serves it slowly, so its
        # `up` tracks how busy the agent is, not whether the device is reachable.
        # Reachability for that box is already carried by its if_mib target,
        # which is fast and stable; sustained sensor loss is covered by
        # OnyxSensorScrapeDegraded below at a severity that fits it.
        #
        # device_class=switch-if is excluded for the same reason, in the other
        # direction: on the MikroTik switches it is the INTERFACE walk that is
        # slow (~15.4s measured) while the health/PoE walk is ~1.5s, so the
        # health target is the honest reachability signal and the interface
        # target gets MikrotikInterfaceScrapeDegraded instead.
        - alert: SnmpTargetDown
          annotations:
            summary: "SNMP target {{ $labels.instance }} is not being scraped."
          expr: |-
            up{job="snmp-exporter", device_class!~"printer|sensors|switch-if"} == 0
          for: 5m
          labels:
            severity: critical
        # Deliberately a failure RATE over a window, not `up == 0` with a long
        # `for:`. This walk fails intermittently in short bursts — 29% of a day
        # in stalls mostly under 5m — which never trips a `for:` and so went
        # completely unalerted while the combined target flapped ~130 times a
        # day. A rate catches exactly that shape: steady partial loss. At 5m
        # scrapes, >0.5 over 1h means more than half the readings are missing.
        #
        # Written as `1 - avg_over_time(...)` rather than comparing the success
        # rate directly so that $value IS the failure fraction the summary
        # quotes. avg_over_time(up) is the SUCCESS fraction, so the direct form
        # would report "failing 25%" for a walk that is actually failing 75%.
        - alert: OnyxSensorScrapeDegraded
          annotations:
            summary: "Sensor walk on {{ $labels.instance }} is failing {{ $value | humanizePercentage }} of the time — temps/fans/PSU/optics readings are incomplete."
          expr: |-
            1 - avg_over_time(up{job="snmp-exporter", device_class="sensors"}[1h]) > 0.5
          for: 30m
          labels:
            severity: warning
        # The access points and the Zigbee coordinator are PoE-powered off the
        # comms-rack switch and have no exporter, no agent and no probe of their
        # own — the switch's own PoE meter is the only signal that says they are
        # alive. Verified 2026-08-28: the four AP ports draw an order of
        # magnitude more than anything else on the switch, and every other port
        # reads exactly 0, so "was drawing, now draws nothing" is unambiguous.
        #
        # Deliberately expressed against POWER rather than mtxrPOEStatus: the
        # status enum was inferred from observation, not from a MIB we hold, so
        # an alert built on it would encode a guess. Zero-versus-nonzero needs
        # neither the enum nor the (unconfirmed) power scaling factor.
        #
        # The port list is NOT hardcoded — any port seen delivering power is
        # covered, so a device moved to a different port, or a new PoE device, is
        # picked up with no change here. `for: 15m` clears an AP reboot. If a
        # device is decommissioned the alert self-resolves once the whole 6h
        # window is zeroes, i.e. ~6.5h after it was unplugged.
        #
        # The second term is max_over_time, NOT min_over_time. It has to answer
        # "was this port ever powered recently", and min answers "was it powered
        # at EVERY sample", which breaks the rule in two ways. A single zero —
        # from exactly the reboot the `for:` above exists to tolerate — would
        # blank the evidence for the next 6.5h and suppress a real outage in
        # that period. Worse, during a sustained outage the first zero enters
        # the offset window ~30m in, so the alert would resolve itself ~15
        # minutes after firing while the device was still dead: an alert that
        # says "recovered" about a dead access point is worse than no alert.
        - alert: MikrotikPoeDeviceLostPower
          annotations:
            summary: "PoE device on {{ $labels.poe_port }} ({{ $labels.instance }}) has stopped drawing power — the attached device is off, unplugged or dead."
          expr: |-
            mtxrPOEPower{job="snmp-exporter"} == 0
            and
            max_over_time(mtxrPOEPower{job="snmp-exporter"}[6h] offset 30m) > 0
          for: 15m
          labels:
            severity: warning
        # Same shape and rationale as OnyxSensorScrapeDegraded: a failure RATE,
        # because a slow walk fails in short bursts that never trip a `for:`.
        # Written as `1 - avg_over_time(...)` so $value is the failure fraction
        # the summary quotes, not the success fraction.
        - alert: MikrotikInterfaceScrapeDegraded
          annotations:
            summary: "Interface walk on {{ $labels.instance }} is failing {{ $value | humanizePercentage }} of the time — port counters and link state are incomplete."
          expr: |-
            1 - avg_over_time(up{job="snmp-exporter", device_class="switch-if"}[1h]) > 0.5
          for: 30m
          labels:
            severity: warning
        # entPhySensorOperStatus: 1=ok, 2=unavailable, 3=nonoperational. Catches
        # fan/PSU/temperature sensor hardware faults on the core switch.
        # (entPhySensorValue carries the readings for dashboards; raw value must
        # be divided by 10^entPhySensorPrecision for the real figure.)
        - alert: OnyxSensorFault
          annotations:
            summary: "Onyx sensor {{ $labels.entPhysicalName }} (idx {{ $labels.entPhysicalIndex }}) is faulted (operStatus {{ $value }})."
          expr: |-
            entPhySensorOperStatus{job="snmp-exporter"} > 1
          for: 5m
          labels:
            severity: warning
        # Brother raises hrDeviceStatus to warning(3)/down(5) on low-supply, cover
        # open, paper jam/out etc. — the reliable numeric fault signal (the
        # hrPrinterDetectedErrorState bitfield is kept as a label only). idle/
        # printing/sleep all report running(2), so this does not false-fire.
        - alert: PrinterFault
          annotations:
            summary: "Printer {{ $labels.instance }} needs attention (hrDeviceStatus {{ $value }}: 3=warning, 5=down)."
          expr: |-
            hrDeviceStatus{job="snmp-exporter", device_class="printer"} >= 3
          for: 15m
          labels:
            severity: warning
        # Real supply percentage only exists where MaxCapacity>0 and Level>=0 —
        # this excludes Brother toners (Level -3, "present, unmeasured") and the
        # label rolls (Level -2, unknown), leaving drum/belt units which report
        # true ratios. Fires below 10% remaining.
        - alert: PrinterSupplyLow
          annotations:
            summary: "Printer {{ $labels.instance }} supply '{{ $labels.prtMarkerSuppliesDescription }}' at {{ $value | humanizePercentage }} remaining."
          expr: |-
            (
              prtMarkerSuppliesLevel{job="snmp-exporter", device_class="printer"}
              / prtMarkerSuppliesMaxCapacity{job="snmp-exporter", device_class="printer"}
            ) < 0.10
            and prtMarkerSuppliesMaxCapacity{job="snmp-exporter", device_class="printer"} > 0
            and prtMarkerSuppliesLevel{job="snmp-exporter", device_class="printer"} >= 0
          for: 1h
          labels:
            severity: warning
