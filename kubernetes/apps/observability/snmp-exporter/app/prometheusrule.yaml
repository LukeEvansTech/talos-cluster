---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: snmp-exporter.rules
spec:
  groups:
    - name: snmp-exporter.rules
      rules:
        # printer: label printers power themselves off by design; covered by PrinterFault
        # and PrinterSupplyLow instead. sensors, switch-if: their own walk is the slow
        # one, so `up` tracks agent load, not reachability; see the *ScrapeDegraded rules.
        - alert: SnmpTargetDown
          annotations:
            summary: "SNMP target {{ $labels.instance }} is not being scraped."
          expr: |-
            up{job="snmp-exporter", device_class!~"printer|sensors|switch-if"} == 0
          for: 5m
          labels:
            severity: critical
        # A rate over a window, not `up == 0` with a long `for:`: this walk fails in
        # short bursts too brief to trip a `for:` (docs/docs/apps/snmp-exporter.md).
        # `1 - avg_over_time(up)` so $value is the failure fraction, not the success one.
        - alert: OnyxSensorScrapeDegraded
          annotations:
            summary: "Sensor walk on {{ $labels.instance }} is failing {{ $value | humanizePercentage }} of the time. temps/fans/PSU/optics readings are incomplete."
          expr: |-
            1 - avg_over_time(up{job="snmp-exporter", device_class="sensors"}[1h]) > 0.5
          for: 30m
          labels:
            severity: warning
        # PoE-only devices (no exporter, agent or probe of their own) are watched via
        # the switch's own PoE meter instead; see docs/docs/apps/snmp-exporter.md.
        # Power, not mtxrPOEStatus: that enum is inferred, not from a held MIB.
        # The port list is not hardcoded, so a moved or new device needs no change here.
        # max_over_time, not min_over_time: min would blank the evidence after a single
        # sample during the tolerated reboot window and could self-resolve mid-outage.
        - alert: MikrotikPoeDeviceLostPower
          annotations:
            summary: "PoE device on {{ $labels.poe_port }} ({{ $labels.instance }}) has stopped drawing power. The attached device is off, unplugged or dead."
          expr: |-
            mtxrPOEPower{job="snmp-exporter"} == 0
            and
            max_over_time(mtxrPOEPower{job="snmp-exporter"}[6h] offset 30m) > 0
          for: 15m
          labels:
            severity: warning
        # Same shape as OnyxSensorScrapeDegraded: a rate, since a slow walk fails in
        # short bursts that never trip a `for:`.
        - alert: MikrotikInterfaceScrapeDegraded
          annotations:
            summary: "Interface walk on {{ $labels.instance }} is failing {{ $value | humanizePercentage }} of the time. Port counters and link state are incomplete."
          expr: |-
            1 - avg_over_time(up{job="snmp-exporter", device_class="switch-if"}[1h]) > 0.5
          for: 30m
          labels:
            severity: warning
        # entPhySensorOperStatus: 1=ok, 2=unavailable, 3=nonoperational.
        - alert: OnyxSensorFault
          annotations:
            summary: "Onyx sensor {{ $labels.entPhysicalName }} (idx {{ $labels.entPhysicalIndex }}) is faulted (operStatus {{ $value }})."
          expr: |-
            entPhySensorOperStatus{job="snmp-exporter"} > 1
          for: 5m
          labels:
            severity: warning
        # idle/printing/sleep all report running(2), so this does not false-fire.
        - alert: PrinterFault
          annotations:
            summary: "Printer {{ $labels.instance }} needs attention (hrDeviceStatus {{ $value }}: 3=warning, 5=down)."
          expr: |-
            hrDeviceStatus{job="snmp-exporter", device_class="printer"} >= 3
          for: 15m
          labels:
            severity: warning
        # MaxCapacity>0 and Level>=0 excludes toners (-3) and label rolls (-2, unknown).
        - alert: PrinterSupplyLow
          annotations:
            summary: "Printer {{ $labels.instance }} supply '{{ $labels.prtMarkerSuppliesDescription }}' at {{ $value | humanizePercentage }} remaining."
          expr: |-
            (
              prtMarkerSuppliesLevel{job="snmp-exporter", device_class="printer"}
              / prtMarkerSuppliesMaxCapacity{job="snmp-exporter", device_class="printer"}
            ) < 0.10
            and prtMarkerSuppliesMaxCapacity{job="snmp-exporter", device_class="printer"} > 0
            and prtMarkerSuppliesLevel{job="snmp-exporter", device_class="printer"} >= 0
          for: 1h
          labels:
            severity: warning
