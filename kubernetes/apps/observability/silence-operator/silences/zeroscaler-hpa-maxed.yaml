---
# Alertmanager matches only the alert's own labels, not the HPA's part-of label, see KB-024.
apiVersion: monitoring.giantswarm.io/v1alpha1
kind: Silence
metadata:
  name: zeroscaler-hpa-maxed
spec:
  matchers:
    - name: alertname
      value: KubeHpaMaxedOut
      isRegex: false
      isEqual: true
