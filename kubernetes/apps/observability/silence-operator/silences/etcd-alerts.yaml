---
# etcd's commit-duration thresholds assume enterprise SSDs; ours exceed them harmlessly under load.
apiVersion: monitoring.giantswarm.io/v1alpha1
kind: Silence
metadata:
  name: etcd-high-commit-durations
spec:
  matchers:
    - name: alertname
      value: etcdHighCommitDurations
      isRegex: false
      isEqual: true
---
apiVersion: monitoring.giantswarm.io/v1alpha1
kind: Silence
metadata:
  name: etcd-member-communication-slow
spec:
  matchers:
    - name: alertname
      value: etcdMemberCommunicationSlow
      isRegex: false
      isEqual: true
