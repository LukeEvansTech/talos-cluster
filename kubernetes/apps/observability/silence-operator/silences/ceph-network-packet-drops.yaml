---
# Storage-node interface packet drops are transient and benign but fired about 20 alerts a day.
apiVersion: monitoring.giantswarm.io/v1alpha1
kind: Silence
metadata:
  name: ceph-network-packet-drops
spec:
  matchers:
    - name: alertname
      value: CephNodeNetworkPacketDrops
      isRegex: false
      isEqual: true
