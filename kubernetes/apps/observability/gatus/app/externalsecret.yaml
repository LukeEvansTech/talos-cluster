---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: gatus-secret
    template:
      data:
        # Feed gatus's own ${VAR} expansion for the split-DNS checks in resources/config.yaml,
        # not Flux postBuild substitution (disabled on that ConfigMap).
        OPNSENSE_ADDR: "{{ .OPNSENSE_ADDR }}"
        SVC_IMGUR_PROXY_ADDR: "{{ .SVC_IMGUR_PROXY_ADDR }}"
  dataFrom:
    - extract:
        key: cluster-secrets
