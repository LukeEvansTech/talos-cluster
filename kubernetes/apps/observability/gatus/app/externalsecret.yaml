---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: gatus-secret
    template:
      data:
        # Addresses for the split-DNS checks in resources/config.yaml. They
        # arrive as environment variables, not via Flux substitution: the
        # gatus ConfigMap is generated with
        # `kustomize.toolkit.fluxcd.io/substitute: disabled` so that gatus's
        # own `${VAR}` expansion still works, which means postBuild never
        # touches it. Gatus expands these when it reads the config, so the
        # checks can assert on real addresses while Git keeps only the
        # variable names.
        OPNSENSE_ADDR: "{{ .OPNSENSE_ADDR }}"
        SVC_IMGUR_PROXY_ADDR: "{{ .SVC_IMGUR_PROXY_ADDR }}"
  dataFrom:
    - extract:
        key: cluster-secrets
