---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# gatus-sidecar bundles gatus, discovery sidecar, and RBAC (replaces app-template, upstream #11077).
# Images are chart-managed: sidecar digest-pinned per release, gatus tag-pinned to appVersion.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gatus
  values:
    # Avoids gatus-gatus-sidecar: the naming helper only collapses when the release
    # name contains the chart name.
    fullnameOverride: gatus
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    gatus:
      delayStartSeconds: "5"
      env:
        TZ: ${TIMEZONE}
      # Feeds the split-DNS checks in resources/config.yaml, expanded by gatus itself
      # since Flux substitution is off on this ConfigMap.
      #
      # extraEnv+optional, not envFrom: a missing Secret there would CreateContainerConfigError
      # the whole pod. A missing key here just fails the two DNS checks, so GatusEndpointDown
      # pages instead of taking down the monitoring stack.
      extraEnv:
        - name: OPNSENSE_ADDR
          valueFrom:
            secretKeyRef:
              name: gatus-secret
              key: OPNSENSE_ADDR
              optional: true
        - name: SVC_IMGUR_PROXY_ADDR
          valueFrom:
            secretKeyRef:
              name: gatus-secret
              key: SVC_IMGUR_PROXY_ADDR
              optional: true
    sidecar:
      kinds:
        httproute:
          enable: true
          auto: true
        service:
          enable: true
    config:
      existingConfigMap: gatus-configmap
      items:
        - key: config.yaml
          path: config.yaml
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/enabled: "false"
        gethomepage.dev/enabled: "true"
        gethomepage.dev/app: gatus-sidecar
        gethomepage.dev/name: Gatus
        gethomepage.dev/group: Monitoring
        gethomepage.dev/icon: gatus.svg
        gethomepage.dev/description: Status page
      hostnames:
        - status.${SECRET_DOMAIN}
      parentRefs:
        - name: envoy-external
          namespace: network
        - name: envoy-internal
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    persistence:
      enabled: true
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
    resources:
      # Pod-level budget shared by gatus + sidecar; needs k8s >=1.34, enforced by kubeVersion.
      requests:
        cpu: 100m
      limits:
        memory: 512Mi
