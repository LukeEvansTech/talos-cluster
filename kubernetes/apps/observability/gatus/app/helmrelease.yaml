---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Gatus - Health monitoring and alerting. The gatus-sidecar chart bundles
# gatus + the endpoint-discovery sidecar (and their RBAC), replacing the
# app-template + initContainer wiring (upstream home-ops #11077). Images are
# chart-managed: the sidecar is digest-pinned per chart release, gatus is
# tag-pinned as the chart appVersion.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gatus
  values:
    # Release "gatus" + chart "gatus-sidecar" would otherwise render resource
    # names as gatus-gatus-sidecar (helper only collapses when the release
    # name CONTAINS the chart name).
    fullnameOverride: gatus
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    gatus:
      delayStartSeconds: "5"
      env:
        TZ: ${TIMEZONE}
      # Addresses for the split-DNS checks in resources/config.yaml. Gatus
      # expands ${VAR} from its own environment when it reads the config, and
      # the config ConfigMap opts out of Flux substitution, so this is the only
      # route by which a real address reaches those checks.
      #
      # Deliberately extraEnv + optional rather than envFrom on the whole
      # Secret: envFrom with a missing Secret wedges the pod in
      # CreateContainerConfigError, which would take the entire monitoring
      # stack down over two DNS checks. Optional keys instead leave the vars
      # empty, the two split-dns endpoints then fail their conditions, and
      # GatusEndpointDown pages, so the failure stays loud but contained.
      extraEnv:
        - name: OPNSENSE_ADDR
          valueFrom:
            secretKeyRef:
              name: gatus-secret
              key: OPNSENSE_ADDR
              optional: true
        - name: SVC_IMGUR_PROXY_ADDR
          valueFrom:
            secretKeyRef:
              name: gatus-secret
              key: SVC_IMGUR_PROXY_ADDR
              optional: true
    sidecar:
      kinds:
        httproute:
          enable: true
          auto: true
        service:
          enable: true
    config:
      existingConfigMap: gatus-configmap
      items:
        - key: config.yaml
          path: config.yaml
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/enabled: "false"
        gethomepage.dev/enabled: "true"
        gethomepage.dev/app: gatus-sidecar
        gethomepage.dev/name: Gatus
        gethomepage.dev/group: Monitoring
        gethomepage.dev/icon: gatus.svg
        gethomepage.dev/description: Status page
      hostnames:
        - status.${SECRET_DOMAIN}
      parentRefs:
        - name: envoy-external
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    persistence:
      enabled: true
      storageClass: ceph-block
      accessMode: ReadWriteOnce
      size: 5Gi
    resources:
      # Pod-level budget shared by gatus + sidecar (needs k8s ≥1.34; the
      # chart's kubeVersion enforces it).
      requests:
        cpu: 100m
      limits:
        memory: 512Mi
