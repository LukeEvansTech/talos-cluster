---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gatus-rules
spec:
  groups:
    - name: gatus.rules
      rules:
        - alert: GatusEndpointDown
          # Denylist, not allowlist: an allowlist here once dropped two auto-discovered
          # groups silently for months (KB-065). `connectivity` stays excluded on purpose.
          expr: |
            gatus_results_endpoint_success{group!="connectivity"} == 0
          for: 5m
          annotations:
            summary: >-
              The {{ $labels.name }} endpoint is down
          labels:
            severity: critical
