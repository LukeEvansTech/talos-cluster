---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./prometheusrule.yaml
  # Not the whole volsync component: its pvc.yaml would collide with the PVC the
  # gatus-sidecar chart already creates. See docs/docs/apps/gatus.md.
  # sourcePVC already matches the chart's claim name, so unlike grafana/satisfactory
  # this needs no patch.
  - ../../../../components/volsync/nfs
  - ../../../../components/volsync/remote
configMapGenerator:
  - name: gatus-configmap
    files:
      - config.yaml=./resources/config.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
