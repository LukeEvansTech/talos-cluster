---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./grafanadatasource.yaml
  - ./grafana.yaml
  - ./servicemonitor.yaml
  # nfs+remote only, not the parent component: the operator already owns the real
  # volume (grafana-pvc), so the component's pvc.yaml would add a second, unused PVC.
  # See docs/docs/apps/grafana.md for what the backup protects.
  - ../../../../components/volsync/nfs
  - ../../../../components/volsync/remote
patches:
  # sourcePVC defaults to ${APP} (grafana); patched to the operator's real claim name.
  - target:
      kind: ReplicationSource
    patch: |-
      - op: replace
        path: /spec/sourcePVC
        value: grafana-pvc
