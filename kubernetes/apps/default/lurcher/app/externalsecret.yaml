---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lurcher
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: lurcher-secret
    template:
      engineVersion: v2
      data:
        # Residential proxy (IPRoyal) — the code appends _country-gb at runtime.
        PROXY_PROVIDER: "{{ .PROXY_PROVIDER }}"
        PROXY_USERNAME: "{{ .PROXY_USERNAME }}"
        PROXY_PASSWORD: "{{ .PROXY_PASSWORD }}"
        # Notifications via Apprise → Pushover (lurcher's own app token).
        APPRISE_URLS: "pover://{{ .PUSHOVER_USER_KEY }}@{{ .LURCHER_PUSHOVER_TOKEN }}"
        # In-cluster LiteLLM auth for description formatting — operator-issued key scoped to
        # self-hosted (+ its cloud fallback), pushed onto the litellm item by
        # ai/litellm/app/virtualkeys/lurcher.yaml rather than the account-wide master key.
        LLM_API_KEY: "{{ .LITELLM_LURCHER_API_KEY }}"
  dataFrom:
    - extract:
        key: lurcher
    - extract:
        key: pushover
    - extract:
        key: litellm
