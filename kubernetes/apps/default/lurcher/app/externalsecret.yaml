---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lurcher
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: lurcher-secret
    template:
      engineVersion: v2
      data:
        # Residential proxy; the app appends _country-gb to the username at runtime.
        PROXY_PROVIDER: "{{ .PROXY_PROVIDER }}"
        PROXY_USERNAME: "{{ .PROXY_USERNAME }}"
        PROXY_PASSWORD: "{{ .PROXY_PASSWORD }}"
        APPRISE_URLS: "pover://{{ .PUSHOVER_USER_KEY }}@{{ .LURCHER_PUSHOVER_TOKEN }}"
        # Per-app key, not the account-wide master key; minted by
        # ai/litellm/app/virtualkeys/lurcher.yaml (docs/docs/architecture/ai-llm-stack.md).
        LLM_API_KEY: "{{ .LITELLM_LURCHER_API_KEY }}"
  dataFrom:
    - extract:
        key: lurcher
    - extract:
        key: pushover
    - extract:
        key: litellm
