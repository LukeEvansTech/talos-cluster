---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lurcher-searches
data:
  searches.yaml: |-
    # Luke Evans — Microsoft security/identity/devops architect (4x MVP), remote-only.
    # Keywords are OR (any match); exclude rejects; rate/location/IR35 AND together.
    # rateMin/rateMax are whole £/day. Edit + commit — the CronJob picks it up next run.
    - name: "MS Security / Identity / DevOps (remote, Outside IR35)"
      keywords:
        - "security architect"
        - "identity architect"
        - "solutions architect"
        - "security consultant"
        - "technical design authority"
        - "devops engineer"
        - "azure devops"
        - "bicep"
        - "platform engineer"
        - "entra"
        - "azure ad"
        - "active directory"
        - "conditional access"
        - "microsoft sentinel"
        - "microsoft purview"
        - "microsoft defender"
        - "defender for"
        - "zero trust"
        - "identity and access"
        - "iam"
        - "intune"
        - "m365"
        - "microsoft 365"
        - "office 365"
        - "copilot"
      exclude:
        - "1st line"
        - "2nd line"
        - "service desk"
        - "helpdesk"
        - "graduate"
        - "data engineer"
        - "data engineering"
        - "databricks"
        - "data platform"
        - "software developer"
        - "front end"
        - "frontend"
        - "rust"
        - "golang"
        - "aws"
        - "gcp"
        - "kafka"
      ir35: outside
      rateMin: 500
      locations: [remote]
      matchIn: both
