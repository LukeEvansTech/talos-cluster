---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lurcher
  namespace: default
spec:
  # Source publishes its daily batch ~06:00-08:00 UTC (peak 07:00 UTC), weekdays.
  # Run at 10:00 London (09:00 UTC in summer / 10:00 UTC in winter) so the scrape
  # lands AFTER the batch and catches new roles same-morning, not a day late.
  schedule: "0 10 * * *" # daily 10:00 London
  timeZone: "Europe/London"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: lurcher
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: lurcher
              image: ghcr.io/lukeevanstech/lurcher:1.8.0@sha256:cee06bdf08c6745f905b5339fd359e5c17f075b1682dca1469ca151a913715a0
              args:
                - "run"
              env:
                - name: LURCHER_DB
                  value: /data/lurcher.db
                - name: HOME # apprise/node need a writable home under readOnlyRootFilesystem
                  value: /tmp
              envFrom:
                - secretRef:
                    name: lurcher-secret
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: searches
                  mountPath: /app/searches.yaml
                  subPath: searches.yaml
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - "ALL"
              resources:
                requests:
                  cpu: 25m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: lurcher
            - name: searches
              secret:
                secretName: lurcher-secret
                items:
                  - key: SEARCHES_YAML
                    path: searches.yaml
            - name: tmp
              emptyDir: {}
