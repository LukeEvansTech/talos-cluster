---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lurcher
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: lurcher
  values:
    controllers:
      lurcher:
        annotations:
          reloader.stakater.com/auto: "true"
        # Recreate avoids a multi-attach deadlock on this RWO ceph-block PVC: the new pod
        # can't mount until the old one releases it.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/lukeevanstech/lurcher
              tag: 2.3.0@sha256:156c0e41e049982efe764364cc5e66e713df9b58324064348f62585a858c2650
            env:
              TZ: ${TIMEZONE}
              HOME: /tmp # Apprise and Node need a writable home under readOnlyRootFilesystem
              LURCHER_DB: /data/lurcher.db
              # Source publishes its daily batch ~06:00-08:00 UTC, so 10:00 London lands
              # after it and catches new roles same-morning.
              LURCHER_SCHEDULE: "0 10 * * *"
              LURCHER_TZ: Europe/London
              LURCHER_PUBLIC_URL: https://lurcher.${SECRET_DOMAIN}
              # Feeds description formatting through the in-cluster LiteLLM gateway. Routing and its
              # cloud fallback are documented in docs/docs/architecture/ai-llm-stack.md.
              LLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              LLM_MODEL: self-hosted
              # Pinned so the heap ceiling is visible and sits under the container limit, leaving
              # room for native memory. The 2026-09 crash this fixed is in
              # docs/docs/troubleshooting/kb/085-lurcher-oom-invisible-to-health-check.md.
              NODE_OPTIONS: --max-old-space-size=768
            envFrom:
              - secretRef:
                  name: lurcher-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # Matches the PVC's uid; keep it or lose access to existing files.
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: lurcher
        ports:
          http:
            port: *port
    # /metrics carries the last-delivered timestamp; /health cannot see that.
    serviceMonitor:
      app:
        serviceName: "{{ .Release.Name }}"
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: lurcher
            group: internal
            url: http://lurcher.default.svc.cluster.local:8080/health
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "lurcher.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: lurcher
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
