---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lurcher
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: lurcher
  values:
    controllers:
      lurcher:
        annotations:
          reloader.stakater.com/auto: "true"
        # RWO ceph-block PVC: single replica, recreate on rollout to avoid a
        # multi-attach deadlock (the new pod can't mount until the old releases).
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/lukeevanstech/lurcher
              tag: 2.0.0
            env:
              TZ: ${TIMEZONE}
              HOME: /tmp # apprise/node need a writable home under readOnlyRootFilesystem
              LURCHER_DB: /data/lurcher.db
              # The CronJob's schedule: source publishes its daily batch ~06:00-08:00 UTC,
              # so 10:00 London lands after it and catches new roles same-morning.
              LURCHER_SCHEDULE: "0 10 * * *"
              LURCHER_TZ: Europe/London
              LURCHER_PUBLIC_URL: https://lurcher.${SECRET_DOMAIN}
              # The secret's SEARCHES_YAML key is file CONTENT (mounted below), but serve
              # reads this env var as a PATH; explicit env outranks the envFrom'd content,
              # which would otherwise silently import nothing.
              SEARCHES_YAML: /app/searches.yaml
            envFrom:
              - secretRef:
                  name: lurcher-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # the CronJob's uid — the PVC's files are owned by it
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: lurcher
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: lurcher
            group: internal
            url: http://lurcher.default.svc.cluster.local:8080/health
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "lurcher.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: lurcher
        globalMounts:
          - path: /data
      searches:
        type: secret
        name: lurcher-secret
        globalMounts:
          - path: /app/searches.yaml
            subPath: SEARCHES_YAML # secret keys project as filenames; subPath picks this one
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
