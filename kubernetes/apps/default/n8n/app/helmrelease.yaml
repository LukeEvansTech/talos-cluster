---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app n8n
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: n8n
  values:
    controllers:
      n8n:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/n8n-io/n8n
              tag: 3.2.2@sha256:c5d94cb443ff3d7b3abd65927fd8c9af1281f026ebfed9b208cf8d0f6b199a94
            env:
              GENERIC_TIMEZONE: ${TIMEZONE}
              N8N_HOST: "{{ .Release.Name }}.${SECRET_DOMAIN}"
              N8N_PORT: &port 5678
              N8N_PROTOCOL: https
              N8N_WEBHOOK_URL: "https://{{ .Release.Name }}.${SECRET_DOMAIN}"
              DB_TYPE: sqlite
              DB_SQLITE_VACUUM_ON_STARTUP: "true"
              EXECUTIONS_DATA_PRUNE: "true"
              EXECUTIONS_DATA_MAX_AGE: "168"
              EXECUTIONS_DATA_SAVE_ON_ERROR: all
              EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
              EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
              # Code nodes run in the runners sidecar, away from the credentials and encryption key
              N8N_RUNNERS_MODE: external
              # n8n 3.0 lowers these defaults; pin the 2.x values
              N8N_RUNNERS_TASK_TIMEOUT: &taskTimeout "300"
              N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "2147483648"
              N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "5000"
            envFrom:
              - secretRef:
                  name: n8n-secret
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 2Gi
          runners:
            image:
              repository: ghcr.io/n8n-io/runners
              tag: 3.2.2@sha256:7e64bb2cbcfddf644dbb1f6ef703ce6e70adf8880f6494c870dcc54aa976f099
            env:
              GENERIC_TIMEZONE: ${TIMEZONE}
              N8N_RUNNERS_AUTH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: n8n-secret
                    key: N8N_RUNNERS_AUTH_TOKEN
              N8N_RUNNERS_TASK_BROKER_URI: http://127.0.0.1:5679
              N8N_RUNNERS_TASK_TIMEOUT: *taskTimeout
            probes:
              liveness: &runnerProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 5680
                  periodSeconds: 10
              readiness: *runnerProbe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: n8n
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          n8n:
            app:
              - path: /home/node/.n8n
      runner-tmp:
        type: emptyDir
        advancedMounts:
          n8n:
            runners:
              # Python runner's multiprocessing forkserver socket
              - path: /tmp
