---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app n8n
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: n8n
  values:
    controllers:
      n8n:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/n8n-io/n8n
              tag: 2.46.4@sha256:4384b9ff20a78bc1708c35ce7864f84f724611de7801fb36d715998db7c000f1
            env:
              GENERIC_TIMEZONE: ${TIMEZONE}
              N8N_HOST: "{{ .Release.Name }}.${SECRET_DOMAIN}"
              N8N_PORT: &port 5678
              N8N_PROTOCOL: https
              WEBHOOK_URL: "https://{{ .Release.Name }}.${SECRET_DOMAIN}"
              DB_TYPE: sqlite
              DB_SQLITE_VACUUM_ON_STARTUP: "true"
              EXECUTIONS_DATA_PRUNE: "true"
              EXECUTIONS_DATA_MAX_AGE: "168"
              EXECUTIONS_DATA_SAVE_ON_ERROR: all
              EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
              EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
              # n8n 3.0 lowers these defaults; pin the 2.x values
              N8N_RUNNERS_TASK_TIMEOUT: "300"
              N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "2147483648"
              N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "5000"
            envFrom:
              - secretRef:
                  name: n8n-secret
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: n8n
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /home/node/.n8n
