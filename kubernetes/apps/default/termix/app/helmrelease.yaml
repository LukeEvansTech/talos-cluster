---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: termix
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: termix
  values:
    controllers:
      termix:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/termix-ssh/termix
              tag: 26.11.2@sha256:9fe1ff21badf4c85be14fa2129122d87690f9012d3e5a341f46d6bd3b7a8d862
            env:
              TZ: ${TIMEZONE}
              PORT: &port 8080
              # Sign-in moves to termix's own SSO against Pocket ID (client `termix`, infra tier).
              # Auto-provisioning stays off: the existing admin is linked to SSO under Settings,
              # then ALLOW_PASSWORD_LOGIN turns off and the gateway component comes off.
              OIDC_CLIENT_ID: termix
              OIDC_ISSUER_URL: https://id.${SECRET_DOMAIN}
              OIDC_AUTHORIZATION_URL: https://id.${SECRET_DOMAIN}/authorize
              OIDC_TOKEN_URL: https://id.${SECRET_DOMAIN}/api/oidc/token
              OIDC_USERINFO_URL: https://id.${SECRET_DOMAIN}/api/oidc/userinfo
              OIDC_SCOPES: openid email profile groups
              OIDC_ENV_OVERRIDE: "true"
              OIDC_LEGACY_CALLBACK: "false"
              EXTERNAL_FORCE_HTTPS: "true"
            envFrom:
              - secretRef:
                  name: termix-oidc-secret
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              # 26.11.2 runs each plugin in its own Node process; 512Mi OOM-killed it during startup.
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
    service:
      app:
        # The pod has no readiness probe, so this is the check that sees the app itself.
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |-
            name: termix-service
            group: internal
            url: http://termix.default.svc.cluster.local:8080/
            conditions: ["[STATUS] == 200"]
        controller: termix
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
