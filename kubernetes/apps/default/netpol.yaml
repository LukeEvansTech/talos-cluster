---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cross-namespace-ingress
spec:
  description: "Allow ingress from gateway (network namespace)"
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values:
          # Holds a signed-in mail session with no auth of its own, reached only by `kubectl
          # port-forward`; allow-kube-apiserver already grants that host-ingress path.
          - thunderbird
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-searxng-from-ai
spec:
  # open-webui and mcp-searxng (ai) call SearXNG directly by its ClusterIP DNS name rather than
  # through the envoy-internal route; additive to the namespace-wide policy above.
  description: "Allow ai namespace pods to reach searxng"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: searxng
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-chaski-from-media
spec:
  # curatorjudge and kometa (media) post straight to chaski's ClusterIP rather than out through
  # the gateway and back; additive to the policy above, which otherwise admits only `network`.
  description: "Allow the curatorjudge and kometa jobs (media) to reach chaski"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: chaski
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: curatorjudge
        - matchLabels:
            io.kubernetes.pod.namespace: media
            app.kubernetes.io/name: kometa
