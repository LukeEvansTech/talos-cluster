---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jobops
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: jobops-secret
    template:
      engineVersion: v2
      data:
        JWT_SECRET: "{{ .JWT_SECRET }}"
        RXRESUME_API_KEY: "{{ .RXRESUME_API_KEY }}"
        # In-cluster LiteLLM auth — operator-issued key scoped to self-hosted
        # + its cloud fallback, rather than the account-wide master key.
        LLM_API_KEY: "{{ .LITELLM_JOBOPS_API_KEY }}"
  dataFrom:
    - extract:
        key: job-ops
    - extract:
        key: litellm
