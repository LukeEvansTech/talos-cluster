---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jobops
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: jobops
  values:
    controllers:
      jobops:
        annotations:
          reloader.stakater.com/auto: "true"
        # RWO ceph-block PVC: Recreate avoids a multi-attach deadlock waiting on the old pod.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/dakheera47/job-ops
              tag: v0.13.1@sha256:42831cacd2021d65f808c9f0363e53d081fb55cb2626da7c9d233616618276c9
            env:
              TZ: ${TIMEZONE}
              PORT: &port 3001
              # Self-hosted (not the multi-tenant "hosted" SaaS) mode.
              JOBOPS_APP_MODE: local
              JOBOPS_PUBLIC_BASE_URL: "https://{{ .Release.Name }}.${SECRET_DOMAIN}"
              # MODEL self-hosted routes to llmkube's llama.cpp backend, with an openrouter/auto
              # fallback in LiteLLM; provider, URL, model and key are overridable in the app UI.
              LLM_PROVIDER: openai_compatible
              LLM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              MODEL: self-hosted
              # CV generation via the self-hosted Reactive Resume (internal).
              RXRESUME_URL: https://reactiveresume.${SECRET_DOMAIN}
            envFrom:
              - secretRef:
                  name: jobops-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  failureThreshold: 6
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi

    defaultPodOptions:
      # Upstream image has no USER and runs as root; Playwright/Camoufox write to /root/.cache,
      # /ms-playwright and /tmp on the writable rootfs.
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: jobops
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          # SQLite DB, generated PDFs, cloudflare-cookies.
          - path: /app/data
            subPath: data
          # LLM auth / session tokens (codex/gemini-cli).
          - path: /app/codex-home
            subPath: codex-home
