---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebrowser-config
  annotations:
    checkov.io/skip1: CKV_K8S_21=Namespace managed by Kustomize targetNamespace
data:
  config.yaml: |-
    server:
      cacheDir: "/tmp"
      database:
        path: "/config/filebrowser.sqlite"
      logging:
        - levels: "info|warning|error"
      sources:
        - path: "/media"
          name: media
          config:
            defaultEnabled: true
            defaultPermissions: &perms
              view: true
              download: true
              modify: true
              create: true
              delete: false
              configured: true
        - path: "/roms"
          name: roms
          config:
            defaultEnabled: true
            defaultPermissions: *perms
        - path: "/backups/rook"
          name: backups-rook
          config:
            defaultEnabled: true
            defaultPermissions: *perms
        - path: "/backups/postgres"
          name: backups-postgres
          config:
            defaultEnabled: true
            defaultPermissions: *perms
        - path: "/backups/volsync"
          name: backups-volsync
          config:
            defaultEnabled: true
            defaultPermissions: *perms
        - path: "/backups/timemachine"
          name: backups-timemachine
          config:
            defaultEnabled: true
            defaultPermissions: *perms
    http:
      port: 80
      # Behind Envoy, so client IPs and share URLs come from the forwarded headers.
      trustProxyHeaders: true
      # 2.1+ reads the client IP (X-Forwarded-For, X-Real-IP) only from peers listed here, the pod
      # network Envoy runs on. Host and scheme headers still follow trustProxyHeaders alone.
      trustedProxies:
        - 10.42.0.0/16
    userDefaults:
      ui:
        darkMode: true
      listing:
        singleClick: false
      account:
        permissions:
          admin: true
          share: true
          api: false
    # One login: filebrowser's own OIDC against Pocket ID (client `filebrowser`, infra tier).
    # Members of `infra` get admin; the callback is /api/auth/oidc/callback.
    auth:
      methods:
        noauth: false
        password:
          enabled: false
        oidc:
          enabled: true
          clientId: filebrowser
          clientSecret: "$${POCKET_ID_CLIENT_SECRET}"
          issuerUrl: https://id.${SECRET_DOMAIN}
          scopes: openid email profile groups
          userIdentifier: preferred_username
          groupsClaim: groups
          adminGroup: infra
