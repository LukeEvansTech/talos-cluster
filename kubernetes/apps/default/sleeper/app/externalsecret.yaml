---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sleeper
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sleeper-secret
    template:
      engineVersion: v2
      data:
        # The Pushover "eBay" app, shared with the card-wants watch it replaces.
        APPRISE_URLS: "pover://{{ .PUSHOVER_USER_KEY }}@{{ .EBAY_PUSHOVER_TOKEN }}"
        # eBay Browse API keyset; with both set, sweeps search through the API, not the browser.
        EBAY_CLIENT_ID: "{{ .EBAY_CLIENT_ID }}"
        EBAY_CLIENT_SECRET: "{{ .EBAY_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: pushover
    - extract:
        key: ebay-api
