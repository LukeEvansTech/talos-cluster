---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sleeper
  namespace: default
spec:
  groups:
    - name: sleeper
      rules:
        # Alerts on the outcome, not process health (the lurcher lesson): a sweep counts only when
        # it searched and its alerts did not fail. Sweeps run four times a day, so 26h tolerates
        # several failed sweeps; the 7h wait covers the first sweep after a fresh install (up to 6h
        # until the next scheduled sweep plus its run time), when the metric is still 0.
        - alert: SleeperNotDelivering
          annotations:
            summary: >-
              sleeper has not completed a delivering sweep in over 26h, so card deal
              alerts have stopped.
            description: >-
              The last sleeper sweep that searched eBay and sent its alerts finished
              {{ $value | humanizeDuration }} ago. Check the Runs page, or
              kubectl -n default logs deploy/sleeper for browser or eBay failures.
          expr: |-
            time() - sleeper_last_success_timestamp_seconds > 93600
          for: 7h
          labels:
            severity: warning
        - alert: SleeperMetricsMissing
          annotations:
            summary: >-
              sleeper /metrics has not been scraped for 30m, so sweep delivery is
              unmonitored.
          expr: |-
            absent(sleeper_last_success_timestamp_seconds)
          for: 30m
          labels:
            severity: warning
