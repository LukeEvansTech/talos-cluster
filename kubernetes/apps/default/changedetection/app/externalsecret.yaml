---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: changedetection
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: changedetection-secret
    template:
      engineVersion: v2
      data:
        # A scoped LiteLLM key (virtualkeys/changedetection.yaml), mirrored to the litellm item by PushSecret.
        LLM_API_KEY: "{{ .LITELLM_CHANGEDETECTION_API_KEY }}"
  dataFrom:
    - extract:
        key: litellm
