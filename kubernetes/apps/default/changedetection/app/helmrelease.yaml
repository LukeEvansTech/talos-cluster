---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: changedetection
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: changedetection
  uninstall:
    keepHistory: false
  values:
    controllers:
      changedetection:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/dgtlmoon/changedetection.io
              tag: 0.60.9@sha256:04eaae7915bad711160cb15abe160f6d3fabe98bbbd658509d4b7a654000fb2d
            env:
              TZ: ${TIMEZONE}
              BASE_URL: https://{{ .Release.Name }}.${SECRET_DOMAIN}
              PORT: &port 5000
              USE_X_SETTINGS: 1
              # browserless v2 dropped the stealth and ad-block env defaults; both are per-connection options now.
              PLAYWRIGHT_DRIVER_URL: 'ws://localhost:3000/chromium?blockAds=true&launch={"stealth":true,"args":["--disable-web-security"]}'
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 512Mi
          browser:
            image:
              repository: ghcr.io/browserless/chromium
              tag: v2.57.0@sha256:6bac628b3d8293f8fb251d3a6b63030dfc5a1cb0c7e5c39abe5efd8f4b25360b
            env:
              TIMEOUT: "300000"
              CONCURRENT: "10"
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 2Gi
    service:
      app:
        controller: changedetection
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /datastore
