---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: changedetection
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: changedetection
  uninstall:
    keepHistory: false
  values:
    controllers:
      changedetection:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/dgtlmoon/changedetection.io
              tag: 0.60.10@sha256:72f97681f390e4d6ae3e6585e1e0036449910f347144b766fc23910458566a1a
            env:
              TZ: ${TIMEZONE}
              BASE_URL: https://{{ .Release.Name }}.${SECRET_DOMAIN}
              PORT: &port 5000
              USE_X_SETTINGS: 1
              # No blockAds: v2 blocks ads with an extension that only loads in the default CDP context,
              # and changedetection opens a new context per check.
              PLAYWRIGHT_DRIVER_URL: 'ws://localhost:3000/chromium?launch={"stealth":true,"args":["--disable-web-security"]}'
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 512Mi
          browser:
            image:
              repository: ghcr.io/browserless/chromium
              tag: v2.57.3@sha256:40dff7c23e0e378ba451c23ef66394ffb81bd11e6b9fe8ef3066d59eb402cc5d
            env:
              TIMEOUT: "300000"
              CONCURRENT: "10"
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 2Gi
    service:
      app:
        controller: changedetection
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /datastore
