---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: forgejo
  values:
    replicaCount: 1
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        # Mirror migrations run git clone inside this container, and the
        # first gickup pass OOM-killed the pod at 256Mi on a small private
        # repository (steady state is ~110Mi). The starred set includes
        # multi-GB repositories, so the ceiling has to cover index-pack on
        # those, not the web process.
        memory: 2Gi

    strategy:
      type: Recreate

    gitea:
      admin:
        existingSecret: forgejo-secret
        passwordMode: initialOnlyNoReset

      config:
        server:
          DOMAIN: "forgejo.${SECRET_DOMAIN}"
          ROOT_URL: "https://forgejo.${SECRET_DOMAIN}"
          # The SSH service is ClusterIP-only and nothing clones over it, so
          # stop the UI advertising an ssh:// clone URL that cannot connect.
          DISABLE_SSH: true

        service:
          # This instance holds mirrors of private repositories: no
          # self-registration, and nothing is browsable without signing in.
          DISABLE_REGISTRATION: true
          REQUIRE_SIGNIN_VIEW: true

        git.timeout:
          # gickup registers each mirror through the synchronous migrate
          # endpoint. The largest starred repository is ~4 GB, which the 600s
          # default cannot clone; a failed migrate is deleted and retried daily,
          # so it would never land.
          MIGRATE: 3600
          MIRROR: 900

        database:
          DB_TYPE: sqlite3
          PATH: /data/forgejo/forgejo.db

        session:
          PROVIDER: file

        cache:
          ADAPTER: memory

        queue:
          TYPE: level

    service:
      http:
        type: ClusterIP
        port: 3000
      ssh:
        type: ClusterIP
        port: 22

    ingress:
      enabled: false

    persistence:
      enabled: true
      create: false
      claimName: forgejo
      # forgejo-helm 17.1.0 changed `mount` from a string (the path) to a
      # boolean (whether to mount at all); the mount path is now hardcoded
      # to /data in the chart's deployment template. Dropped the redundant
      # `existingClaim`. Current schema uses claimName + create: false.
      mount: true

    redis-cluster:
      enabled: false

    postgresql:
      enabled: false

    postgresql-ha:
      enabled: false

    securityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
