---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: forgejo
  values:
    replicaCount: 1
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        # Migrations run git clone here; 256Mi OOM-killed it once (docs/docs/apps/forgejo.md).
        memory: 2Gi

    strategy:
      type: Recreate

    gitea:
      admin:
        existingSecret: forgejo-secret
        passwordMode: initialOnlyNoReset

      config:
        server:
          DOMAIN: "forgejo.${SECRET_DOMAIN}"
          ROOT_URL: "https://forgejo.${SECRET_DOMAIN}"
          # SSH is ClusterIP-only, so stop the UI advertising an ssh:// URL nothing can reach.
          DISABLE_SSH: true

        service:
          # Mirrors private repositories, so no self-registration and no anonymous browsing.
          DISABLE_REGISTRATION: true
          REQUIRE_SIGNIN_VIEW: true

        git.timeout:
          # The largest starred repository is about 4 GB, past what the 600s default can clone.
          MIGRATE: 3600
          MIRROR: 900

        database:
          DB_TYPE: sqlite3
          PATH: /data/forgejo/forgejo.db

        session:
          PROVIDER: file

        cache:
          ADAPTER: memory

        queue:
          TYPE: level

    service:
      http:
        type: ClusterIP
        port: 3000
      ssh:
        type: ClusterIP
        port: 22

    ingress:
      enabled: false

    persistence:
      enabled: true
      create: false
      claimName: forgejo
      # forgejo-helm 17.1.0 made `mount` a boolean; the chart hardcodes the path to /data now.
      mount: true

    redis-cluster:
      enabled: false

    postgresql:
      enabled: false

    postgresql-ha:
      enabled: false

    securityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
