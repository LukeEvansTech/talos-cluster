---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reactiveresume
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: reactiveresume-secret
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://reactive_resume:{{ .RR_POSTGRES_PASSWORD }}@postgres18-rw.database.svc.cluster.local:5432/reactive_resume?sslmode=require"
        REDIS_URL: "redis://default:{{ .DRAGONFLY_PASSWORD }}@dragonfly.database.svc.cluster.local:6379"
        AUTH_SECRET: "{{ .AUTH_SECRET }}"
        ENCRYPTION_SECRET: "{{ .ENCRYPTION_SECRET }}"
        S3_ACCESS_KEY_ID: "{{ .RR_ACCESS_KEY_ID }}"
        S3_SECRET_ACCESS_KEY: "{{ .RR_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: dragonfly
    - extract:
        key: garage
    - extract:
        key: reactive-resume
