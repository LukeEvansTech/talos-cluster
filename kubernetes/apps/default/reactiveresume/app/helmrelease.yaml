---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reactiveresume
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: reactiveresume
  values:
    controllers:
      reactiveresume:
        annotations:
          reloader.stakater.com/auto: "true"
        # RWO data PVC, and v6 migrations drop columns v5 reads, so pods must never overlap.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/reactive-resume/reactive-resume
              tag: v6.0.2@sha256:2b08d01446f8b775e0bf5888cc15b0a3fd6805521efefb0a0e21a4f5bfb253b3
            env:
              TZ: ${TIMEZONE}
              PORT: &port 3000
              APP_URL: "https://{{ .Release.Name }}.${SECRET_DOMAIN}"
              # Envoy forwards every request, so without this all visitors share one auth rate-limit bucket.
              TRUSTED_PROXIES: ${CLUSTER_PODS_CIDR}
              STRICT_SCHEMA_CHECK: "true"
              # RR's Postgres driver ignores TLS params; the in-cluster CA isn't reachable
              # from here (docs/docs/apps/reactiveresume.md).
              NODE_TLS_REJECT_UNAUTHORIZED: "0"
              S3_ENDPOINT: http://garage.storage.svc.cluster.local:3900
              S3_REGION: us-east-1
              S3_BUCKET: reactive-resume
              S3_FORCE_PATH_STYLE: "true"
              # Account registered; signups locked down.
              FLAG_DISABLE_SIGNUPS: "true"
              FLAG_DISABLE_EMAIL_AUTH: "false"
            envFrom:
              - secretRef:
                  name: reactiveresume-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 6
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: reactiveresume
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
