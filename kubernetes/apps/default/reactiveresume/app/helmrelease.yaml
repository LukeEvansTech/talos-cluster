---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reactiveresume
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: reactiveresume
  values:
    controllers:
      reactiveresume:
        annotations:
          reloader.stakater.com/auto: "true"
        # RWO data PVC: avoid multi-attach deadlock on rollout.
        strategy: Recreate
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b"
            envFrom:
              - secretRef:
                  name: reactiveresume-secret
        containers:
          app:
            image:
              repository: ghcr.io/amruthpillai/reactive-resume
              tag: v5.3.0@sha256:c487ec5edcfe054bcb312fcd498f868e56f274756d0046b01c83f210855017ab
            env:
              TZ: ${TIMEZONE}
              PORT: &port 3000
              SERVER_PORT: "3001"
              APP_URL: "https://{{ .Release.Name }}.${SECRET_DOMAIN}"
              # RR's Postgres driver ignores TLS params; the in-cluster CA isn't reachable
              # from here (docs/docs/apps/reactiveresume.md).
              NODE_TLS_REJECT_UNAUTHORIZED: "0"
              S3_ENDPOINT: http://garage.storage.svc.cluster.local:3900
              S3_REGION: us-east-1
              S3_BUCKET: reactive-resume
              S3_FORCE_PATH_STYLE: "true"
              # Account registered; signups locked down.
              FLAG_DISABLE_SIGNUPS: "true"
              FLAG_DISABLE_EMAIL_AUTH: "false"
            envFrom:
              - secretRef:
                  name: reactiveresume-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 6
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: reactiveresume
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      # Headless-Chrome PDF rendering needs more than the default 64Mi /dev/shm.
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        globalMounts:
          - path: /dev/shm
