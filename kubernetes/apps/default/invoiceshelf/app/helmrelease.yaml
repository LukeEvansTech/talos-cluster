---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app invoiceshelf
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: invoiceshelf
  values:
    controllers:
      invoiceshelf:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: invoiceshelf/invoiceshelf
              tag: 2.4.7@sha256:599dc6aa9d7303c9ae0d099397817c7f6002cd6f7af099bc90511d5eae4e9cd2
            env:
              TZ: ${TIMEZONE}
              APP_ENV: production
              APP_DEBUG: "false"
              APP_URL: "https://invoiceshelf.${SECRET_DOMAIN}"
              APP_TIMEZONE: ${TIMEZONE}
              DB_CONNECTION: sqlite
              DB_DATABASE: /var/www/html/storage/app/database.sqlite
              TRUSTED_PROXIES: "*"
              SESSION_SECURE_COOKIE: "true"
              SESSION_DOMAIN: "invoiceshelf.${SECRET_DOMAIN}"
              SANCTUM_STATEFUL_DOMAINS: "invoiceshelf.${SECRET_DOMAIN}"
            envFrom:
              - secretRef:
                  name: invoiceshelf-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: invoiceshelf
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          # The database moved from conf/ to data/app/ with the 2.2 image; conf/ is kept as a rollback copy.
          - path: /var/www/html/storage
            subPath: data
