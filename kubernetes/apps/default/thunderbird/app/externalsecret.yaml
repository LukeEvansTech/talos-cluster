---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thunderbird
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: thunderbird-secret
    template:
      engineVersion: v2
      data:
        # Basic auth on the remote-desktop front end. The container holds a
        # signed-in mail session, so it must never be reachable unauthenticated.
        CUSTOM_USER: "{{ .CUSTOM_USER }}"
        PASSWORD: "{{ .PASSWORD }}"
  dataFrom:
    - extract:
        key: thunderbird
