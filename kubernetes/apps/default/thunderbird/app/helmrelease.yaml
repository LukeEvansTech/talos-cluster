---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thunderbird
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: thunderbird
  values:
    controllers:
      thunderbird:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/thunderbird
              tag: 1140.15.0@sha256:59c6ca272976c77d00d1d519e31617af7b1c6a75c2bced66094b7d756331b83e
            env:
              TZ: ${TIMEZONE}
              PUID: "1000"
              PGID: "1000"
              # The desktop ships a terminal with passwordless sudo. This
              # container holds a signed-in mail session, so both are removed.
              DISABLE_SUDO: "true"
              DISABLE_TERMINALS: "true"
              # Relaunch Thunderbird if it is ever closed. Without this the
              # window can be shut from the desktop and mail sync stops with
              # the pod still Running and the web UI still answering.
              RESTART_APP: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 3000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 3Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: thunderbird
        ports:
          http:
            port: *port
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 512Mi
        globalMounts:
          - path: /dev/shm
