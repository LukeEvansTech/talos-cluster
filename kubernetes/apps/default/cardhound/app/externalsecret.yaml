---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cardhound
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cardhound-secret
    template:
      engineVersion: v2
      data:
        # The Pushover "eBay" app, shared with the card-wants watch it replaces.
        APPRISE_URLS: "pover://{{ .PUSHOVER_USER_KEY }}@{{ .EBAY_PUSHOVER_TOKEN }}"
  dataFrom:
    - extract:
        key: pushover
