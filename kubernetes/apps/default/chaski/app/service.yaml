---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes-service.json
# Published by the tailscale-operator as a tailnet device so the daily
# queue-triage routine can POST /hooks/queue-triage. Separate from the chart's
# own Service so the metrics port stays off the tailnet.
apiVersion: v1
kind: Service
metadata:
  name: chaski-tailnet
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: chaski
    checkov.io/skip1: CKV_K8S_21=Application intentionally deployed in default namespace
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: chaski
    app.kubernetes.io/name: chaski
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
