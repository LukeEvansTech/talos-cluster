---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# Reached by the daily queue-triage routine, which runs outside the cluster and
# gets in over the tailnet subnet route to this gateway. A tailnet device was
# tried first and is unreachable from there -- the subnet router is permitted,
# tagged devices are not. Inbound is gated by the route's own verify.token.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chaski
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
  hostnames:
    - "chaski.${SECRET_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: chaski
          port: 8080
