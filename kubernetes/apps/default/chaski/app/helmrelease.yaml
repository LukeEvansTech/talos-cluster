---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaski
spec:
  chartRef:
    kind: OCIRepository
    name: chaski
  interval: 1h
  values:
    replicaCount: 2
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    env:
      TZ: ${TIMEZONE}
    envFrom:
      - secretRef:
          name: chaski-secret
    config:
      targets:
        radarr:
          apprise:
            url: pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "RADARR_PUSHOVER_TOKEN" }}
        sonarr:
          apprise:
            url: pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "SONARR_PUSHOVER_TOKEN" }}
        # Reuses RADARR_PUSHOVER_TOKEN; swap it if the digest ever earns its own app.
        triage:
          apprise:
            url: pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "RADARR_PUSHOVER_TOKEN" }}
        # Its own Pushover application, so notifications show as Kometa rather than Radarr.
        kometa:
          apprise:
            url: pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "KOMETA_PUSHOVER_TOKEN" }}
      routes:
        radarr-download:
          target: radarr
          title: "Movie {{ if .payload.isUpgrade }}Upgraded{{ else }}Added{{ end }}"
          message: |-
            <b>{{ .payload.movie.title }} ({{ .payload.movie.year }})</b>
            <small>{{ .payload.movie.overview | ellipsis 300 }}</small>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: low
            url: "{{ .payload.applicationUrl }}/movie/{{ .payload.movie.tmdbId }}"
            url_title: View Movie
          # Kometa's add-missing titles (tagged kometa*) are bulk backfill; pushing each one spent the
          # shared Pushover quota.
          whenExpr: >-
            payload.eventType == "Download"
            && !(has(payload.movie.tags) && payload.movie.tags.exists(t, t.startsWith("kometa")))
        radarr-manual:
          target: radarr
          title: Movie Requires Manual Interaction
          message: |-
            <b>{{ .payload.movie.title }} ({{ .payload.movie.year }})</b>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: high
            url: "{{ .payload.applicationUrl }}/activity/queue"
            url_title: View Queue
          whenExpr: payload.eventType == "ManualInteractionRequired"
        # Sonarr sends this on Import Complete only: one push per download, so a season pack
        # is a single message rather than one per episode.
        sonarr-download:
          target: sonarr
          title: Download Complete
          message: |-
            <b>{{ .payload.series.title }} ({{ printf "S%02dE%02d" (toInt (index .payload.episodes 0).seasonNumber) (toInt (index .payload.episodes 0).episodeNumber) }}{{ if gt (len .payload.episodes) 1 }}, {{ len .payload.episodes }} episodes{{ end }})</b>
            <small>{{ if eq (len .payload.episodes) 1 }}{{ (index .payload.episodes 0).title }}{{ else }}Multi-episode import{{ end }}</small>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: low
            url: "{{ .payload.applicationUrl }}/series/{{ .payload.series.titleSlug }}"
            url_title: View Series
          # Sonarr v4 sends Import Complete as eventType "Download"; "ImportComplete" is accepted too
          # in case a later release gives it its own type. Kometa-tagged series skip, as above.
          whenExpr: >-
            (payload.eventType == "Download" || payload.eventType == "ImportComplete")
            && !(has(payload.series.tags) && payload.series.tags.exists(t, t.startsWith("kometa")))
        sonarr-manual:
          target: sonarr
          title: Episode Requires Manual Interaction
          message: |-
            <b>{{ .payload.series.title }}</b>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: high
            url: "{{ .payload.applicationUrl }}/activity/queue"
            url_title: View Queue
          whenExpr: payload.eventType == "ManualInteractionRequired"
        # This sender runs off-cluster, so the route needs its own token: the chart's global
        # CHASKI_WEBHOOK_TOKEN would also 401 the arr webhooks, which send none.
        queue-triage:
          target: triage
          title: "{{ .payload.title }}"
          message: "{{ .payload.message }}"
          params:
            format: html
          verify:
            token:
              header: X-Chaski-Token
              secret: '{{ env "TRIAGE_WEBHOOK_TOKEN" }}'
        # Same off-cluster sender and token as queue-triage, kept as its own route so a deletion
        # digest doesn't read like a stuck queue.
        library-cleanup:
          target: triage
          title: "{{ .payload.title }}"
          message: "{{ .payload.message }}"
          params:
            format: html
            priority: high
          verify:
            token:
              header: X-Chaski-Token
              secret: '{{ env "TRIAGE_WEBHOOK_TOKEN" }}'
        # Kometa exits 0 even when a collection fails to build; this is the only failure signal.
        kometa-error:
          target: kometa
          title: "Kometa error{{ if .payload.critical }} (critical){{ end }}"
          message: |-
            <b>{{ .payload.library_name | default "global" }}{{ if .payload.collection }} / {{ .payload.collection }}{{ end }}</b>
            <small>{{ .payload.error | ellipsis 500 }}</small>
          params:
            format: html
            priority: high
          whenExpr: payload.event == "error"
        kometa-run:
          target: kometa
          title: Kometa run finished
          message: |-
            <b>{{ .payload.run_time }}</b>
            <small>Collections: {{ .payload.collections_created }} created, {{ .payload.collections_modified }} modified, {{ .payload.collections_deleted }} deleted</small>
            <small>Items: {{ .payload.items_added }} added, {{ .payload.items_removed }} removed</small>
            <small>Sent to Radarr: {{ .payload.added_to_radarr }}, Sonarr: {{ .payload.added_to_sonarr }}</small>
          params:
            format: html
            priority: low
          whenExpr: payload.event == "run_end"
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi
