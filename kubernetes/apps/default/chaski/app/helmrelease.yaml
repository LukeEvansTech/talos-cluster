---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaski
spec:
  chartRef:
    kind: OCIRepository
    name: chaski
  interval: 1h
  values:
    replicaCount: 2
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    env:
      TZ: ${TIMEZONE}
    envFrom:
      - secretRef:
          name: chaski-secret
    config:
      targets:
        radarr:
          apprise:
            url: pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "RADARR_PUSHOVER_TOKEN" }}
        sonarr:
          apprise:
            url: pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "SONARR_PUSHOVER_TOKEN" }}
        # Reuses the Radarr Pushover application; swap the token here if the
        # digest ever earns its own app.
        triage:
          apprise:
            url: pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "RADARR_PUSHOVER_TOKEN" }}
        # Kometa's nightly run webhooks. Same Pushover application as triage.
        kometa:
          apprise:
            url: pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "RADARR_PUSHOVER_TOKEN" }}
      routes:
        radarr-download:
          target: radarr
          title: "Movie {{ if .payload.isUpgrade }}Upgraded{{ else }}Added{{ end }}"
          message: |-
            <b>{{ .payload.movie.title }} ({{ .payload.movie.year }})</b>
            <small>{{ .payload.movie.overview | ellipsis 300 }}</small>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: low
            url: "{{ .payload.applicationUrl }}/movie/{{ .payload.movie.tmdbId }}"
            url_title: View Movie
          whenExpr: payload.eventType == "Download"
        radarr-manual:
          target: radarr
          title: Movie Requires Manual Interaction
          message: |-
            <b>{{ .payload.movie.title }} ({{ .payload.movie.year }})</b>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: high
            url: "{{ .payload.applicationUrl }}/activity/queue"
            url_title: View Queue
          whenExpr: payload.eventType == "ManualInteractionRequired"
        sonarr-download:
          target: sonarr
          title: "Episode {{ if .payload.isUpgrade }}Upgraded{{ else }}Added{{ end }}"
          message: |-
            <b>{{ .payload.series.title }} ({{ printf "S%02dE%02d" (toInt (index .payload.episodes 0).seasonNumber) (toInt (index .payload.episodes 0).episodeNumber) }})</b>
            <small>{{ (index .payload.episodes 0).title }}</small>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: low
            url: "{{ .payload.applicationUrl }}/series/{{ .payload.series.titleSlug }}"
            url_title: View Series
          whenExpr: payload.eventType == "Download"
        sonarr-manual:
          target: sonarr
          title: Episode Requires Manual Interaction
          message: |-
            <b>{{ .payload.series.title }}</b>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: high
            url: "{{ .payload.applicationUrl }}/activity/queue"
            url_title: View Queue
          whenExpr: payload.eventType == "ManualInteractionRequired"
        # Free-text digest from the daily queue-triage routine. That sender is
        # on the tailnet rather than in-cluster, so this route carries its own
        # token -- the global CHASKI_WEBHOOK_TOKEN would 401 the arr webhooks,
        # which are configured in each arr's UI outside Git.
        queue-triage:
          target: triage
          title: "{{ .payload.title }}"
          message: "{{ .payload.message }}"
          params:
            format: html
          verify:
            token:
              header: X-Chaski-Token
              secret: '{{ env "TRIAGE_WEBHOOK_TOKEN" }}'
        # Free-text digest from the weekly Radarr library-cleanup routine. Same
        # off-cluster sender as queue-triage so it reuses that token, but kept as
        # its own route: a deletion digest and a stuck queue need to be tellable
        # apart at a glance on a phone, and this one wants high priority.
        library-cleanup:
          target: triage
          title: "{{ .payload.title }}"
          message: "{{ .payload.message }}"
          params:
            format: html
            priority: high
          verify:
            token:
              header: X-Chaski-Token
              secret: '{{ env "TRIAGE_WEBHOOK_TOKEN" }}'
        # Kometa exits 0 even when collections fail to build, so its own
        # webhooks are the only failure signal. In-cluster sender, no token,
        # same as the arr routes.
        kometa-error:
          target: kometa
          title: "Kometa error{{ if .payload.critical }} (critical){{ end }}"
          message: |-
            <b>{{ .payload.library_name | default "global" }}{{ if .payload.collection }} / {{ .payload.collection }}{{ end }}</b>
            <small>{{ .payload.error | ellipsis 500 }}</small>
          params:
            format: html
            priority: high
          whenExpr: payload.event == "error"
        kometa-run:
          target: kometa
          title: Kometa run finished
          message: |-
            <b>{{ .payload.run_time }}</b>
            <small>Collections: {{ .payload.collections_created }} created, {{ .payload.collections_modified }} modified, {{ .payload.collections_deleted }} deleted</small>
            <small>Items: {{ .payload.items_added }} added, {{ .payload.items_removed }} removed</small>
            <small>Sent to Radarr: {{ .payload.added_to_radarr }}, Sonarr: {{ .payload.added_to_sonarr }}</small>
          params:
            format: html
            priority: low
          whenExpr: payload.event == "run_end"
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi
