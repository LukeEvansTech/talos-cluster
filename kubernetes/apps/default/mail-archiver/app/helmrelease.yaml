---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mail-archiver
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: mail-archiver
  values:
    controllers:
      mail-archiver:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b"
            envFrom:
              - secretRef:
                  name: mailarchiver-secret

        containers:
          app:
            image:
              repository: ghcr.io/s1t5/mailarchiver
              tag: 2609.1@sha256:8a05e3c99f63c03ab2599c04078c7de4ee5ecf1988e8adec8d233a457913ab44
            env:
              TZ: ${TIMEZONE}
              Authentication__Enabled: "true"
              # Gmail caps IMAP downloads at 2500 MB/day. Tracking per-account
              # usage lets the initial full sync pause at the quota and resume
              # from its checkpoint (upstream doc/GmailBestPractices.md).
              BandwidthTracking__Enabled: "true"
              BandwidthTracking__DailyLimitMb: "2500"
              BandwidthTracking__WarningThresholdPercent: "80"
              BandwidthTracking__PauseHoursOnLimit: "24"
              MailSync__IntervalMinutes: "120"
            envFrom:
              - secretRef:
                  name: mailarchiver-secret
            probes:
              # Startup migrations run before Kestrel listens, and from 2609.1
              # one of them builds a full index on ArchivedEmails under an
              # exclusive lock, so startup time scales with archive size. Give
              # it 5 minutes before liveness applies, otherwise a slow build
              # gets killed mid-transaction and restarts from scratch.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 5000
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 30
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 4Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: mail-archiver
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "mailarchiver.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/DataProtection-Keys
