---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app miniflux
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/homepage
  dependsOn:
    - name: cloudnative-pg-cluster
      namespace: database
    - name: envoy-gateway
      namespace: network
  interval: 1h
  path: ./kubernetes/apps/default/miniflux/app
  postBuild:
    substitute:
      APP: *app
      HOMEPAGE_NAME: Miniflux
      HOMEPAGE_GROUP: Productivity
      HOMEPAGE_ICON: miniflux.svg
      HOMEPAGE_DESCRIPTION: RSS reader
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: true
