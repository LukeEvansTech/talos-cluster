---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless-ai
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: paperless-ai
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      paperless-ai:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/clusterzx/paperless-ai
              tag: 4.3.0@sha256:a80f17d24f974bb56a95353f05ec421c94ca082f4f69393d78c1a6a978a443ca
            env:
              TZ: ${TIMEZONE}
              # LiteLLM's OpenAI-compatible endpoint with a scoped key (litellm virtualkeys/paperless-ai.yaml).
              AI_PROVIDER: custom
              CUSTOM_BASE_URL: http://litellm.ai.svc.cluster.local:4000/v1
              CUSTOM_MODEL: self-hosted
              PAPERLESS_AI_PORT: &port 3000
              PAPERLESS_API_URL: "http://paperless.default.svc.cluster.local:8000/api"
              RAG_ENABLED: "true"
              SCAN_INTERVAL: "*/30 * * * *"
              # PaddleOCR (local, CPU) re-reads documents with missing or poor text before tagging and
              # writes the cleaner text back to Paperless; models cache under /app/data/models.
              OCR_ENABLED: "true"
              OCR_MODE: poor
              # Write-back replaces the whole document text, so read every page (default cap is 50).
              OCR_MAX_PAGES: "0"
              # Envoy terminates TLS, so trust one hop for req.protocol (Secure cookie) and client IPs.
              TRUST_PROXY: "1"
            envFrom:
              - secretRef:
                  name: paperless-ai-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 2Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: paperless-ai
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 100Mi
        globalMounts:
          - path: /tmp
