---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paperless-ai-secret
    template:
      engineVersion: v2
      data:
        PAPERLESS_API_TOKEN: "{{ .PAPERLESS_API_KEY }}"
        PAPERLESS_USERNAME: "{{ .PAPERLESS_ADMIN_USER }}"
        # A scoped LiteLLM key (virtualkeys/paperless-ai.yaml), mirrored to the litellm item by PushSecret.
        CUSTOM_API_KEY: "{{ .LITELLM_PAPERLESS_AI_API_KEY }}"
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: paperless
