---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: paperless
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      paperless:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/paperlessngx/paperless-ngx
              tag: 3.4.2@sha256:d704e84f88300eb6ab001ab15720a2330ff99169cf9f94d6b8fcc44b63a84c84
            env:
              TZ: ${TIMEZONE}
              PAPERLESS_TIME_ZONE: ${TIMEZONE}
              PAPERLESS_OCR_LANGUAGE: eng
              PAPERLESS_PORT: &port 8000
              PAPERLESS_CONSUMPTION_DIR: /data/consume
              PAPERLESS_DATA_DIR: /data/data
              PAPERLESS_EXPORT_DIR: /data/export
              PAPERLESS_MEDIA_ROOT: /data/media
              # /data/consume is an NFS mount that scanners fill over SMB on the NAS; inotify
              # never sees those writes, so poll instead of v3's default native watch.
              PAPERLESS_CONSUMER_POLLING_INTERVAL: "360"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              # PATCH-T separator sheets split a batch into documents; ASN labels set the
              # archive serial number that matches the paper binder.
              PAPERLESS_CONSUMER_ENABLE_BARCODES: "true"
              PAPERLESS_CONSUMER_ENABLE_ASN_BARCODE: "true"
              PAPERLESS_FILENAME_FORMAT: "{correspondent}/{created_year}/{title}"
              PAPERLESS_TASK_WORKERS: "2"
              PAPERLESS_WEBSERVER_WORKERS: "2"
              PAPERLESS_URL: "https://paperless.${SECRET_DOMAIN}"
              # Dragonfly's cluster_mode=emulated forces every app onto db 0, so this prefixes
              # paperless's Celery keys away from prowler's worker.
              PAPERLESS_REDIS_PREFIX: "paperless:"
              PAPERLESS_DBENGINE: postgresql
              PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
              PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
            envFrom:
              - secretRef:
                  name: paperless-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - SETGID
                  - SETUID
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 4Gi

    defaultPodOptions:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: paperless
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      consume:
        type: custom
        volumeSpec:
          nfs:
            server: "${SECRET_STORAGE_SERVER}"
            path: /mnt/pool/paperless-consume
        globalMounts:
          - path: /data/consume
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          paperless:
            app:
              - path: /data/data
                subPath: data
              - path: /data/export
                subPath: export
              - path: /data/media
                subPath: media
