---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app paperless
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: paperless
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      paperless:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec"
            envFrom:
              - secretRef:
                  name: paperless-secret
        containers:
          app:
            image:
              repository: docker.io/paperlessngx/paperless-ngx
              tag: 3.0.4@sha256:3838b9a4260d23acc5bb63aed407138435e70b56e5806f4baa350ca184e57582
            env:
              TZ: ${TIMEZONE}
              PAPERLESS_TIME_ZONE: ${TIMEZONE}
              PAPERLESS_OCR_LANGUAGE: eng
              PAPERLESS_PORT: &port 8000
              PAPERLESS_CONSUMPTION_DIR: /data/consume
              PAPERLESS_DATA_DIR: /data/data
              PAPERLESS_EXPORT_DIR: /data/export
              PAPERLESS_MEDIA_ROOT: /data/media
              # v3.0.0 rewrote the consumer around watchfiles and RENAMED this key
              # (PAPERLESS_CONSUMER_POLLING -> _INTERVAL, upstream #11753).
              # CONSUMER_POLLING_DELAY / _RETRY_COUNT / CONSUMER_INOTIFY_DELAY are
              # gone too. Same seconds semantics. Keep polling rather than taking the
              # v3 default of 0 (native filesystem notifications): /data/consume is a
              # subPath mount on a PVC, where inotify does not fire reliably, so the
              # default would silently miss newly dropped files.
              PAPERLESS_CONSUMER_POLLING_INTERVAL: "360"
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              PAPERLESS_FILENAME_FORMAT: "{correspondent}/{created_year}/{title}"
              PAPERLESS_TASK_WORKERS: "2"
              PAPERLESS_WEBSERVER_WORKERS: "2"
              PAPERLESS_URL: "https://paperless.${SECRET_DOMAIN}"
              # Namespace every broker/cache key (kombu global_keyprefix).
              # Dragonfly runs cluster_mode=emulated (db 0 only), and prowler's
              # Celery worker also consumes the default "celery" queue there —
              # without a prefix it steals paperless tasks (observed as
              # KeyError: paperless_mail.tasks.process_mail_accounts in the
              # prowler worker once it finally started consuming).
              PAPERLESS_REDIS_PREFIX: "paperless:"
              PAPERLESS_DBENGINE: postgresql
              PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
              PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
            envFrom:
              - secretRef:
                  name: paperless-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - SETGID
                  - SETUID
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 4Gi

    defaultPodOptions:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: paperless
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          paperless:
            app:
              - path: /data/consume
                subPath: consume
              - path: /data/data
                subPath: data
              - path: /data/export
                subPath: export
              - path: /data/media
                subPath: media
