---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app invio
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: invio
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/kittendevv/invio
              repository: ghcr.io/kittendevv/invio
              tag: v2.2.0@sha256:d8eae8d8872c3a55c4ee7c4284f3bd8899a4ab133722cf445f26b9420b2c4ec3
            # Default Cmd logs where user 1000 can't write; -l redirects the logfile to /tmp.
            command:
              - "/usr/bin/supervisord"
            args:
              - "-n"
              - "-c"
              - "/etc/supervisor/conf.d/supervisord.conf"
              - "-l"
              - "/tmp/supervisord.log"
            env:
              TZ: ${TIMEZONE}
              DATABASE_PATH: /app/data/invio.db
              # SvelteKit's CSRF check requires ORIGIN to match the route's exact hostname.
              ORIGIN: https://invio.${SECRET_DOMAIN}
              # The pod sees plain HTTP behind Envoy's TLS; SvelteKit needs this to set cookies.
              COOKIE_SECURE: "false"
            envFrom:
              - secretRef:
                  name: invio-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: false
        initContainers:
          # The image ships /app/backend root-owned; deno 2.6.8 rewrites its lockfile at startup,
          # user 1000 can't write there, so this copies it into a writable emptyDir instead (#2739).
          init-backend:
            image:
              # renovate: datasource=docker depName=ghcr.io/kittendevv/invio
              repository: ghcr.io/kittendevv/invio
              tag: v2.2.0@sha256:d8eae8d8872c3a55c4ee7c4284f3bd8899a4ab133722cf445f26b9420b2c4ec3
            command:
              - sh
              - -c
              # cp -r, not -a: uid 1000 can't preserve timestamps, and ownership shouldn't survive.
              - cp -r /app/backend/. /writable-backend/

    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        controller: app
        ports:
          http:
            port: 8000

    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: invio
                port: 8000

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          app:
            app:
              - path: /app/data
      # Deno's npm cache lives at /.cache/deno, unwritable by user 1000; emptyDir makes it writable.
      cache:
        type: emptyDir
        advancedMounts:
          app:
            app:
              - path: /.cache
      backend:
        type: emptyDir
        advancedMounts:
          app:
            init-backend:
              - path: /writable-backend
            app:
              - path: /app/backend
