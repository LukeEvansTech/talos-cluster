---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app securo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: securo
  values:
    controllers:
      securo:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          migrate:
            image: &backendImage
              repository: ghcr.io/securo-finance/securo-backend
              tag: 0.23.0@sha256:13e9187d2a89f9724776df4ebb92afa56d159eb947ca57cb8c7d1e5d6f6d1277
            command:
              - "alembic"
              - "upgrade"
              - "head"
            env: &env
              TZ: ${TIMEZONE}
              FRONTEND_URL: "https://securo.${SECRET_DOMAIN}"
              DEFAULT_CURRENCY: GBP
              # Envoy and the in-pod nginx are both proxies ahead of the backend.
              TRUSTED_PROXY_HOPS: "2"
              STORAGE_PROVIDER: local
              STORAGE_LOCAL_PATH: /app/data/attachments
              AGENTS_KNOWLEDGE_STORAGE_PATH: /app/data/agent_knowledge
              AGENTS_ENABLED: "false"
              PLUGINS_ENABLED: "false"
              TESOURO_DIRETO_ENABLED: "false"
            envFrom: &envFrom
              - secretRef:
                  name: securo-secret
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image: *backendImage
            command:
              - "uvicorn"
              - "app.main:app"
              - "--host"
              - "127.0.0.1"
              - "--port"
              - "8000"
            env: *env
            envFrom: *envFrom
            # Bound to loopback so only the in-pod nginx reaches it and TRUSTED_PROXY_HOPS holds;
            # kubelet probes come from outside the pod, so they exec instead.
            probes:
              liveness: &backendProbe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &healthCheck
                      - python
                      - -c
                      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)
                  periodSeconds: 15
                  timeoutSeconds: 6
                  failureThreshold: 4
              readiness: *backendProbe
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthCheck
                  periodSeconds: 5
                  timeoutSeconds: 6
                  failureThreshold: 30
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
          worker:
            image: *backendImage
            command:
              - "celery"
              - "-A"
              - "app.worker"
              - "worker"
              - "--loglevel=info"
              - "--concurrency=2"
            env: *env
            envFrom: *envFrom
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
          beat:
            image: *backendImage
            # On the PVC: a lost schedule restarts every interval, so frequent pod replacement can starve the 24h jobs.
            command:
              - "celery"
              - "-A"
              - "app.worker"
              - "beat"
              - "--loglevel=info"
              - "--schedule=/app/data/celerybeat-schedule"
            env: *env
            envFrom: *envFrom
            securityContext: *securityContext
            resources:
              requests:
                cpu: 5m
                memory: 128Mi
              limits:
                memory: 512Mi
          frontend:
            image:
              repository: ghcr.io/securo-finance/securo-frontend
              tag: 0.23.0@sha256:51854f000ee0ebf76deff9e68f95b8564f8cbb2d7c2ec9bc0be1ea3041dffd7d
            env:
              BACKEND_URL: http://127.0.0.1:8000
              FRONTEND_URL: "https://securo.${SECRET_DOMAIN}"
            probes:
              liveness: &frontendProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
                  periodSeconds: 15
              readiness: *frontendProbe
            securityContext:
              runAsUser: 101
              runAsGroup: 101
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: securo
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          securo:
            app:
              - path: /app/data
            worker:
              - path: /app/data
            beat:
              - path: /app/data
