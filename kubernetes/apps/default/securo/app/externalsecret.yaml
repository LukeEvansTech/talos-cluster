---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: securo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: securo-secret
    template:
      engineVersion: v2
      data:
        SECRET_KEY: "{{ .SECURO_SECRET_KEY }}"
        # asyncpg's ssl=require encrypts without verifying the cert-manager CA, which the app cannot reach.
        DATABASE_URL: "postgresql+asyncpg://securo:{{ .SECURO_POSTGRES_PASSWORD }}@postgres18-rw.database.svc.cluster.local:5432/securo?ssl=require"
  dataFrom:
    - extract:
        key: securo
