---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gickup
spec:
  groups:
    - name: gickup
      rules:
        # Time since last success, not failed-Job count, so this also catches a stuck or unscheduled
        # CronJob (same shape as UnimusSeedStale).
        # 86400s + 2h `for` tolerates one missed night; the creation-time fallback still alerts if a
        # run has never succeeded.
        - alert: GickupBackupStale
          annotations:
            summary: >-
              The gickup CronJob (default/gickup) has not succeeded in over
              24h - GitHub to Forgejo mirror registration is stale.
            description: >-
              No successful run of the gickup CronJob in over 24h. New GitHub
              repositories and stars are no longer being registered as Forgejo
              mirrors (existing mirrors keep syncing on Forgejo's own schedule).
              Check the latest gickup Job's token init container and app logs,
              fix the cause, then trigger a run with
              kubectl -n default create job --from=cronjob/gickup.
          expr: |-
            time() - (
              kube_cronjob_status_last_successful_time{namespace="default", cronjob="gickup"}
              or
              kube_cronjob_created{namespace="default", cronjob="gickup"}
            ) > 86400
          for: 2h
          labels:
            severity: warning
