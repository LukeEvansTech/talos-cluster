---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gickup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: gickup-secret
    template:
      engineVersion: v2
      data:
        # Classic PAT (repo + admin:org): lists and clones the private
        # repositories. Mounted as a file, never an env var, so it does not
        # reach the pod's environment or the logs.
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
  dataFrom:
    - extract:
        key: gickup
