---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gickup
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gickup
  values:
    controllers:
      # Registers GitHub repos/stars as Forgejo pull mirrors; Forgejo syncs on its own 24h timer.
      gickup:
        type: cronjob
        cronjob:
          ttlSecondsAfterFinished: 86400
          schedule: "0 2 * * *"
          timeZone: "${TIMEZONE}"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 1
          # Migrate is synchronous, so the first pass over several hundred repositories takes hours
          # (docs/docs/apps/forgejo.md).
          activeDeadlineSeconds: 21600
        pod:
          automountServiceAccountToken: false
        initContainers:
          # Forgejo shows an access token once, so mint_token.py deletes and recreates it each run
          # (docs/docs/apps/forgejo.md).
          token:
            image:
              repository: docker.io/library/python
              tag: 3.14-slim@sha256:f85c5697265c178cc6887276c55fe16cf3d14ca35c3df6a5eab3b360534a55d2
            command:
              - python3
              - /config/mint_token.py
            env:
              PYTHONDONTWRITEBYTECODE: "1"
              PYTHONUNBUFFERED: "1"
              FORGEJO_URL: http://forgejo-http:3000
              TOKEN_NAME: gickup
              # read:misc covers the SDK's /version probe; REQUIRE_SIGNIN_VIEW otherwise rejects it.
              TOKEN_SCOPES: read:misc,read:user,write:organization,write:repository
              TOKEN_PATH: /token/forgejo
              FORGEJO_ADMIN_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: forgejo-secret
                    key: username
              FORGEJO_ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: forgejo-secret
                    key: password
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image:
              repository: docker.io/buddyspencer/gickup
              tag: 0.10.47@sha256:a0307e9c131b45b0d2039417f291b7ef44580d9d9e303bb5a6083aaf82691044
            args:
              - /config/conf.yml
            env:
              TZ: ${TIMEZONE}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      config:
        type: configMap
        name: gickup
        globalMounts:
          - path: /config
            readOnly: true
      secrets:
        type: secret
        name: gickup-secret
        defaultMode: 0400
        globalMounts:
          - path: /secrets
            readOnly: true
      # Hand-off from the token init container to the gickup container.
      token:
        type: emptyDir
        globalMounts:
          - path: /token
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
