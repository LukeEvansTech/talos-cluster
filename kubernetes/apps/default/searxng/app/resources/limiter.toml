# SearXNG bot-detection / limiter configuration.
#
# The limiter middleware itself stays off (server.limiter: false) because it
# needs a Valkey/Redis backend this instance deliberately does not run. This
# file ships the intended policy so the limiter is one flag away: pass_ip lets
# our in-cluster automation callers (mcp-searxng, open-webui RAG) and LAN
# clients through unthrottled if it is ever enabled.

[botdetection]
# Number of leading bits compared to bucket a client address into a network
# for rate-limiting. Formerly [real_ip].ipv4_prefix / ipv6_prefix. SearXNG
# 2026.8 moved both under [botdetection] (searx/limiter.toml upstream schema
# at the tag this instance runs, 2026.8.22-9fea41204).
ipv4_prefix = 32
ipv6_prefix = 48
# X-Forwarded-For / X-Real-IP are only trusted when the connecting peer is in
# one of these networks. Formerly [real_ip].x_for, a hop count (we set 1 for
# the single Envoy Gateway hop); SearXNG 2026.8 replaced the hop count with an
# explicit proxy allowlist and does not auto-migrate the value (only the
# prefix keys carry over, see searx/compat.py's LIMITER_CFG_DEPRECATED).
# Envoy Gateway is the only hop in front of this instance and lives in the
# same in-cluster range as pass_ip below.
trusted_proxies = [
  '10.0.0.0/8', # RFC1918 private range in use by this cluster (Envoy Gateway)
]

[botdetection.ip_limit]
# Link-local networks are never rate-limited.
filter_link_local = true
# link_token needs the Valkey backend, so keep it off here.
link_token = false

[botdetection.ip_lists]
block_ip = []

# RFC1918 pass list. This cluster's pods, services, and LAN all live inside
# 10.0.0.0/8, so that single block covers every internal caller. The 172.16/12
# and 192.168/16 RFC1918 blocks are unused here and are intentionally omitted.
pass_ip = [
  '10.0.0.0/8', # RFC1918 private range in use by this cluster
]

pass_searxng_org = false
