# The limiter middleware stays off; it needs a Redis/Valkey backend this instance doesn't run.
# pass_ip stays populated so in-cluster callers aren't rate-limited if it's ever turned on.

[botdetection]
# Prefix length used to bucket client addresses for rate limiting, moved here
# from [real_ip] in SearXNG 2026.8.
ipv4_prefix = 32
ipv6_prefix = 48
# Trusted-proxy allowlist for X-Forwarded-For/X-Real-IP, replacing [real_ip].x_for's hop count;
# SearXNG 2026.8 doesn't auto-migrate this one (searx/compat.py's LIMITER_CFG_DEPRECATED).
trusted_proxies = [
  '10.0.0.0/8', # Envoy Gateway is the only hop in front of this instance
]

[botdetection.ip_limit]
filter_link_local = true
link_token = false

[botdetection.ip_lists]
block_ip = []

# This cluster's pods, services and LAN all sit inside 10.0.0.0/8; the other two RFC1918
# blocks are omitted since nothing here uses them.
pass_ip = [
  '10.0.0.0/8',
]

pass_searxng_org = false
