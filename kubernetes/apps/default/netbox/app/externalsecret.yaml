---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: netbox-secret
    template:
      engineVersion: v2
      data:
        secret_key: "{{ .NETBOX_SECRET_KEY }}"
        # Chart names this key `email_password` unless email.existingSecretName is set.
        email_password: ""
        username: admin
        email: "admin@${SECRET_DOMAIN}"
        password: "{{ .NETBOX_SUPERUSER_PASSWORD }}"
        api_token: "{{ .NETBOX_SUPERUSER_API_TOKEN }}"
        db_password: "{{ .NETBOX_POSTGRES_PASSWORD }}"
        tasks_password: "{{ .DRAGONFLY_PASSWORD }}"
        cache_password: "{{ .DRAGONFLY_PASSWORD }}"
  dataFrom:
    - extract:
        key: netbox
    - extract:
        key: dragonfly
