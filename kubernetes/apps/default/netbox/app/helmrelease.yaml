---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: netbox
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    commonAnnotations:
      reloader.stakater.com/auto: "true"
    replicaCount: 1
    timeZone: "${TIMEZONE}"
    loginRequired: true
    superuser:
      name: admin
      email: "admin@${SECRET_DOMAIN}"
      existingSecret: netbox-secret
    existingSecret: netbox-secret
    allowedHosts:
      - "netbox.${SECRET_DOMAIN}"
    allowedHostsIncludesPodIP: true
    csrf:
      trustedOrigins:
        - "https://netbox.${SECRET_DOMAIN}"
    plugins: []
    persistence:
      enabled: true
      existingClaim: netbox
    # Web and worker share the RWO media PVC, so pin web to the worker to avoid multi-attach.
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: netbox
                app.kubernetes.io/component: worker
            topologyKey: kubernetes.io/hostname
    resourcesPreset: none
    resources:
      requests:
        cpu: 100m
        # The web pod's steady-state usage is above 500Mi; 256Mi under-reserved it.
        memory: 512Mi
      limits:
        # 4 Granian workers pushed the pod to ~956Mi and OOMKilled it against a 1Gi limit.
        memory: 1536Mi
    extraEnvs:
      # The chart defaults to 4 workers, more than this low-traffic instance needs.
      - name: GRANIAN_WORKERS
        value: "2"
    initContainers:
      - name: init-db
        image: ghcr.io/home-operations/postgres-init:18@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
        envFrom:
          - secretRef:
              name: netbox-secret
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    postgresql:
      enabled: false
    externalDatabase:
      host: postgres18-rw.database.svc.cluster.local
      port: 5432
      database: netbox
      username: netbox
      existingSecretName: netbox-secret
      existingSecretKey: db_password
      options:
        sslmode: require
        target_session_attrs: read-write
    valkey:
      enabled: false
    tasksDatabase:
      host: dragonfly.database.svc.cluster.local
      port: 6379
      database: 0
      username: default
      existingSecretName: netbox-secret
      existingSecretKey: tasks_password
    cachingDatabase:
      host: dragonfly.database.svc.cluster.local
      port: 6379
      database: 1
      username: default
      existingSecretName: netbox-secret
      existingSecretKey: cache_password
    worker:
      enabled: true
    housekeeping:
      # Disabled: v4.7.0 removed the command this CronJob runs; the worker covers it now (kb/032).
      enabled: false
      # Kept for a future re-enable: pins the job to the media PVC's node to avoid multi-attach.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: netbox
                  app.kubernetes.io/component: netbox
              topologyKey: kubernetes.io/hostname
