---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/service_v1.json
apiVersion: v1
kind: Service
metadata:
  name: wazuh-indexer-headless
  namespace: security
  labels:
    app: wazuh-indexer
spec:
  clusterIP: None
  selector:
    app: wazuh-indexer
  ports:
    - name: nodes
      port: 9300
      targetPort: 9300
---
# Indexer REST API, used in-cluster by Filebeat and the dashboard. Upstream makes it a
# LoadBalancer; nothing outside the cluster needs the raw indexer API.
apiVersion: v1
kind: Service
metadata:
  name: wazuh-indexer
  namespace: security
  labels:
    app: wazuh-indexer
spec:
  type: ClusterIP
  selector:
    app: wazuh-indexer
  ports:
    - name: rest
      port: 9200
      targetPort: 9200
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager-headless
  namespace: security
  labels:
    app: wazuh-manager
spec:
  clusterIP: None
  selector:
    app: wazuh-manager
  ports:
    - name: api
      port: 55000
      targetPort: 55000
---
# Manager API, dialled by the dashboard (WAZUH_API_URL).
apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager
  namespace: security
  labels:
    app: wazuh-manager
spec:
  type: ClusterIP
  selector:
    app: wazuh-manager
  ports:
    - name: api
      port: 55000
      targetPort: 55000
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-dashboard
  namespace: security
  labels:
    app: wazuh-dashboard
spec:
  type: ClusterIP
  selector:
    app: wazuh-dashboard
  ports:
    - name: http
      port: 5601
      targetPort: 5601
---
# LAN endpoint for syslog (firewall, hypervisors, network kit) plus agent enrolment
# (1515) and events (1514); the real address is the cluster-secrets 1Password item.
apiVersion: v1
kind: Service
metadata:
  name: wazuh-syslog
  namespace: security
  annotations:
    lbipam.cilium.io/ips: ${SVC_WAZUH_SYSLOG_ADDR}
    external-dns.alpha.kubernetes.io/hostname: wazuh-syslog.${SECRET_DOMAIN}
  labels:
    app: wazuh-manager
spec:
  type: LoadBalancer
  # Cluster, not Local: a Local lease can land off-pod and drop traffic (days of lost
  # logs on sentinel-syslog, #4070); the SNAT cost is why ossec.conf allow-lists a CIDR.
  externalTrafficPolicy: Cluster
  selector:
    app: wazuh-manager
  ports:
    - name: syslog-udp
      port: 514
      targetPort: 514
      protocol: UDP
    - name: syslog-tcp
      port: 514
      targetPort: 514
      protocol: TCP
    - name: agents-tcp
      port: 1514
      targetPort: 1514
      protocol: TCP
    - name: registration
      port: 1515
      targetPort: 1515
      protocol: TCP
