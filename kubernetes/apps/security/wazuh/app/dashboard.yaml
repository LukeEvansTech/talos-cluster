---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-dashboard
  template:
    metadata:
      labels:
        app: wazuh-dashboard
    spec:
      volumes:
        - name: conf
          configMap:
            name: wazuh-dashboard-conf
        - name: certs
          secret:
            secretName: wazuh-certs
      containers:
        - name: wazuh-dashboard
          image: docker.io/wazuh/wazuh-dashboard:4.14.7
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 2Gi
          env:
            - name: INDEXER_URL
              value: https://wazuh-indexer:9200
            - name: INDEXER_USERNAME
              valueFrom:
                { secretKeyRef: { name: wazuh, key: INDEXER_USERNAME } }
            - name: INDEXER_PASSWORD
              valueFrom:
                { secretKeyRef: { name: wazuh, key: INDEXER_PASSWORD } }
            - name: DASHBOARD_USERNAME
              valueFrom:
                { secretKeyRef: { name: wazuh, key: DASHBOARD_USERNAME } }
            - name: DASHBOARD_PASSWORD
              valueFrom:
                { secretKeyRef: { name: wazuh, key: DASHBOARD_PASSWORD } }
            # Envoy Gateway terminates TLS; the pod serves plain HTTP in-cluster,
            # as every other app here does.
            - name: SERVER_SSL_ENABLED
              value: "false"
            # Upstream ships https://wazuh-manager-master-0.wazuh-cluster, which is
            # wrong for the whole 4.x line and leaves the dashboard reporting the
            # API as unreachable (#902). Point it at the manager Service instead.
            - name: WAZUH_API_URL
              value: https://wazuh-manager
            - name: API_USERNAME
              valueFrom: { secretKeyRef: { name: wazuh, key: API_USERNAME } }
            - name: API_PASSWORD
              valueFrom: { secretKeyRef: { name: wazuh, key: API_PASSWORD } }
          ports:
            - containerPort: 5601
              name: http
          startupProbe:
            tcpSocket:
              port: 5601
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: conf
              mountPath: /usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
              subPath: opensearch_dashboards.yml
            - {
                name: certs,
                mountPath: /usr/share/wazuh-dashboard/certs/root-ca.pem,
                subPath: root-ca.pem,
                readOnly: true,
              }
