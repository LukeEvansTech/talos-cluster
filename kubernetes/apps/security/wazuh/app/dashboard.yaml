---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    checkov.io/skip1: "CKV_K8S_11=CPU is compressible; limits are omitted repository-wide because throttling an indexer mid-merge or analysisd under a log burst worsens an overload. CPU requests are set on every container."
    checkov.io/skip2: "CKV2_K8S_6=False positive. Ingress IS restricted: the cluster runs default-deny via kube-system cilium-policies, and this app ships a CiliumNetworkPolicy (networkpolicy.yaml) allowing only world->manager on the ingest ports. Checkov does not recognise CiliumNetworkPolicy as an associated policy."
    checkov.io/skip3: "CKV_K8S_35=The Wazuh images read these credentials from environment variables in their entrypoints; there is no file-based option without forking the image. Values come from a Secret built by ExternalSecret, never from Git."
    checkov.io/skip4: "CKV_K8S_40=uid is baked into the upstream images (1000 indexer/dashboard, 101 manager). Raising it means rebuilding the vendor's containers. These pods mount no host paths and set no hostPID/hostIPC/hostNetwork, so host uid collision is not a live risk."
    # Scoped deliberately, NOT reloader auto. Auto would also watch the
    # `wazuh` Secret, which carries both the client passwords AND the
    # internal_users.yml hashes — so a credential rotation would restart
    # every pod onto the new plaintext passwords the moment the
    # ExternalSecret refreshed, while the indexer security index still
    # held the old hashes. That race takes the stack down and cannot be
    # ordered around by hand. Config and certificates reload freely;
    # rotating credentials is a deliberate, ordered procedure documented
    # in externalsecret.yaml.
    configmap.reloader.stakater.com/reload: wazuh-dashboard-conf
    secret.reloader.stakater.com/reload: wazuh-certs
  name: wazuh-dashboard
  namespace: security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-dashboard
  template:
    metadata:
      labels:
        app: wazuh-dashboard
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The dashboard image builds and runs as uid/gid 1000.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: conf
          configMap:
            name: wazuh-dashboard-conf
        - name: certs
          secret:
            secretName: wazuh-certs
      containers:
        - name: wazuh-dashboard
          image: docker.io/wazuh/wazuh-dashboard:4.14.7@sha256:a7b565642dcb88ebfc2fe411169bad1d39fd02de4e5e1fa70f4b441380e62f47
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 2Gi
          env:
            - name: INDEXER_URL
              value: https://wazuh-indexer:9200
            - name: INDEXER_USERNAME
              valueFrom:
                { secretKeyRef: { name: wazuh, key: INDEXER_USERNAME } }
            - name: INDEXER_PASSWORD
              valueFrom:
                { secretKeyRef: { name: wazuh, key: INDEXER_PASSWORD } }
            - name: DASHBOARD_USERNAME
              valueFrom:
                { secretKeyRef: { name: wazuh, key: DASHBOARD_USERNAME } }
            - name: DASHBOARD_PASSWORD
              valueFrom:
                { secretKeyRef: { name: wazuh, key: DASHBOARD_PASSWORD } }
            # Envoy Gateway terminates TLS; the pod serves plain HTTP in-cluster,
            # as every other app here does.
            - name: SERVER_SSL_ENABLED
              value: "false"
            # Upstream ships https://wazuh-manager-master-0.wazuh-cluster, which is
            # wrong for the whole 4.x line and leaves the dashboard reporting the
            # API as unreachable (#902). Point it at the manager Service instead.
            - name: WAZUH_API_URL
              value: https://wazuh-manager
            - name: API_USERNAME
              valueFrom: { secretKeyRef: { name: wazuh, key: API_USERNAME } }
            - name: API_PASSWORD
              valueFrom: { secretKeyRef: { name: wazuh, key: API_PASSWORD } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          ports:
            - containerPort: 5601
              name: http
          startupProbe:
            tcpSocket:
              port: 5601
            periodSeconds: 10
            failureThreshold: 60
          # NOT /api/status. That is the canonical OpenSearch Dashboards health
          # endpoint, but the security plugin authenticates it, so an unauthenticated
          # kubelet probe gets 401 and the kubelet restarts a perfectly healthy pod
          # in a loop (observed: 128 restarts in 11h, while the app was serving the
          # UI throughout). A probe cannot read a Secret, so there is no credential
          # to give it. /app/login is served unauthenticated and returns 200 only
          # once the plugins — including the security plugin that issues the 401
          # above — have finished loading, so it is a stronger readiness signal than
          # the 302 on /. Verified against the running pod:
          #   /api/status 401 | /status 401 | / 302 | /app/login 200
          readinessProbe:
            httpGet:
              path: /app/login
              port: 5601
            periodSeconds: 20
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /app/login
              port: 5601
            periodSeconds: 30
            failureThreshold: 10
          volumeMounts:
            - name: conf
              mountPath: /usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
              subPath: opensearch_dashboards.yml
            - {
                name: certs,
                mountPath: /usr/share/wazuh-dashboard/certs/root-ca.pem,
                subPath: root-ca.pem,
                readOnly: true,
              }
