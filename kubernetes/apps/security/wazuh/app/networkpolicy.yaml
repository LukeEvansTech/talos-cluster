---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: wazuh-allow-external-ingest
  namespace: security
spec:
  # Default-deny ingress drops external senders without this rule; the manager would look
  # healthy while receiving nothing, the worst failure mode for a log collector.
  #
  # Scoped to the ingest ports only, not :55000; `world`, not a CIDR, keeps LAN addresses
  # out of this public repository. Same shape as sentinel-syslog's policy.
  description: "Allow external (LAN) syslog senders and Wazuh agents to reach the manager"
  endpointSelector:
    matchLabels:
      app: wazuh-manager
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            # Agentless syslog from the firewall, hypervisors and network kit.
            - port: "514"
              protocol: UDP
            - port: "514"
              protocol: TCP
            # Agent event channel.
            - port: "1514"
              protocol: TCP
            # Agent enrolment (authd).
            - port: "1515"
              protocol: TCP
