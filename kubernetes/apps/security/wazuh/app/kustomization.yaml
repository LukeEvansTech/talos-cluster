---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
#
# Vendored from wazuh/wazuh-kubernetes, not consumed: upstream ships no Helm chart, and
# its Kustomize base has defects fixed here instead (docs/docs/apps/wazuh.md).
#
# The marker below only tracks upstream's manifest releases; a new tag opens a PR to
# re-vendor by hand, since no tool can diff manifest shape for us.
# renovate: datasource=github-tags depName=wazuh/wazuh-kubernetes
# upstream-manifests: v4.14.7
resources:
  - ./externalsecret.yaml
  - ./configmap-indexer.yaml
  - ./configmap-manager.yaml
  - ./configmap-dashboard.yaml
  - ./indexer.yaml
  - ./manager.yaml
  - ./dashboard.yaml
  - ./services.yaml
  - ./httproute.yaml
  - ./retention.yaml
  - ./networkpolicy.yaml
