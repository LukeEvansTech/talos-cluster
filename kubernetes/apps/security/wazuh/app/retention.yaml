---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-retention
  namespace: security
data:
  # Applies ONLY to the date-partitioned time-series indices. Deliberately NOT
  # wazuh-states-vulnerabilities-*: that holds the CURRENT vulnerability
  # inventory rather than a disposable time slice, so an index-age rule would
  # delete the whole live inventory at 90 days however recently it was updated.
  policy.json: |
    {
      "policy": {
        "description": "Wazuh alert retention: delete indices older than 90 days.",
        "default_state": "hot",
        "states": [
          {
            "name": "hot",
            "actions": [],
            "transitions": [
              { "state_name": "delete", "conditions": { "min_index_age": "90d" } }
            ]
          },
          {
            "name": "delete",
            "actions": [{ "delete": {} }],
            "transitions": []
          }
        ],
        "ism_template": [
          { "index_patterns": ["wazuh-alerts-*"], "priority": 100 },
          { "index_patterns": ["wazuh-archives-*"], "priority": 100 }
        ]
      }
    }
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wazuh-retention
  namespace: security
  annotations:
    checkov.io/skip1: "CKV_K8S_11=CPU is compressible; limits are omitted repository-wide because throttling worsens an overload rather than containing it. CPU requests are set."
    checkov.io/skip2: "CKV_K8S_35=The indexer credentials are read from environment variables by curl's -u flag. Values come from a Secret built by ExternalSecret, never from Git."
spec:
  # Upstream ships NO index lifecycle policy at all, so alert indices grow until
  # the volume fills. This runs daily rather than as a one-shot Job on purpose:
  # the PUT is idempotent, so a daily apply also re-establishes the policy after
  # an indexer rebuild or a manual change, instead of silently never running again.
  #
  # The hot state deliberately has NO actions. Wazuh writes date-named indices
  # (wazuh-alerts-4.x-YYYY.MM.DD) with no rollover alias behind them, so a
  # rollover action fails, the index parks in a failed state, and ISM never
  # evaluates the transition — retention would silently never happen at all.
  # Age-based deletion needs no action in the source state.
  schedule: "17 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: policy
              configMap:
                name: wazuh-retention
            - name: certs
              secret:
                secretName: wazuh-certs
                items:
                  - key: root-ca.pem
                    path: root-ca.pem
            # curl writes the response body here; the root filesystem is read-only.
            - name: tmp
              emptyDir: {}
          containers:
            - name: apply
              image: docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
              env:
                - name: INDEXER_USERNAME
                  valueFrom:
                    { secretKeyRef: { name: wazuh, key: INDEXER_USERNAME } }
                - name: INDEXER_PASSWORD
                  valueFrom:
                    { secretKeyRef: { name: wazuh, key: INDEXER_PASSWORD } }
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              command:
                - sh
                - -c
                - |
                  set -eu
                  # Dollar signs are doubled throughout: Flux postBuild substitutes
                  # single-dollar placeholders against cluster-secrets and blanks
                  # anything undefined, so writing these shell variables unescaped
                  # would ship an empty string into the container.
                  API="https://wazuh-indexer:9200"

                  # The credential goes in a curl config file, never on the
                  # command line: an argument is visible in /proc and to anything
                  # that can run ps in this namespace, and would be echoed by any
                  # future `set -x`. /tmp is a private emptyDir.
                  umask 077
                  printf 'user = "%s:%s"\n' "$${INDEXER_USERNAME}" "$${INDEXER_PASSWORD}" > /tmp/curlrc
                  CURL="curl -sS --cacert /certs/root-ca.pem -K /tmp/curlrc"

                  # --- 1. Create or UPDATE the policy -------------------------
                  # A bare PUT on an existing policy returns 409 and changes
                  # nothing. Treating that as success (an earlier version of this
                  # script did) would pin the cluster to whatever policy landed
                  # first and report OK forever. An update must carry the current
                  # sequence number and primary term, so read them first.
                  cur=$$($$CURL -o /tmp/cur -w '%{http_code}' "$${API}/_plugins/_ism/policies/wazuh-retention")
                  q=""
                  if [ "$$cur" = "200" ]; then
                    seq=$$(sed -n 's/.*"_seq_no":\([0-9]*\).*/\1/p' /tmp/cur)
                    pt=$$(sed -n 's/.*"_primary_term":\([0-9]*\).*/\1/p' /tmp/cur)
                    if [ -n "$$seq" ] && [ -n "$$pt" ]; then
                      q="?if_seq_no=$${seq}&if_primary_term=$${pt}"
                    fi
                  fi

                  code=$$($$CURL -o /tmp/out -w '%{http_code}' \
                    -X PUT "$${API}/_plugins/_ism/policies/wazuh-retention$${q}" \
                    -H 'Content-Type: application/json' \
                    --data @/policy/policy.json)
                  cat /tmp/out; echo
                  case "$$code" in
                    2*) echo "policy applied ($$code)" ;;
                    *)  echo "policy FAILED ($$code)" >&2; exit 1 ;;
                  esac

                  # --- 2. Attach to indices that predate the policy ------------
                  # An ism_template is evaluated at index CREATION only. Any index
                  # Wazuh created before this job first ran -- which is the normal
                  # case, since ingestion starts as soon as the manager is up --
                  # stays unmanaged forever otherwise. `add` is a no-op for indices
                  # that already have a policy, so this is safe to repeat daily.
                  add=$$($$CURL -o /tmp/add -w '%{http_code}' \
                    -X POST "$${API}/_plugins/_ism/add/wazuh-alerts-*,wazuh-archives-*" \
                    -H 'Content-Type: application/json' \
                    -d '{"policy_id":"wazuh-retention"}')
                  cat /tmp/add; echo
                  # 404 simply means no matching index exists yet on a fresh cluster.
                  case "$$add" in
                    2*|404) echo "attach OK ($$add)" ;;
                    *)      echo "attach FAILED ($$add)" >&2; exit 1 ;;
                  esac
              volumeMounts:
                - { name: policy, mountPath: /policy, readOnly: true }
                - { name: certs, mountPath: /certs, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - "ALL"
