---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/statefulset_v1.json
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    checkov.io/skip1: "CKV_K8S_11=CPU is compressible; limits are omitted repository-wide because throttling an indexer mid-merge or analysisd under a log burst worsens an overload. CPU requests are set on every container."
    checkov.io/skip2: "CKV2_K8S_6=False positive. Ingress IS restricted: the cluster runs default-deny via kube-system cilium-policies, and this app ships a CiliumNetworkPolicy (networkpolicy.yaml) allowing only world->manager on the ingest ports. Checkov does not recognise CiliumNetworkPolicy as an associated policy."
    checkov.io/skip3: "CKV_K8S_40=uid is baked into the upstream images (1000 indexer/dashboard, 101 manager). Raising it means rebuilding the vendor's containers. These pods mount no host paths and set no hostPID/hostIPC/hostNetwork, so host uid collision is not a live risk."
    checkov.io/skip4: "CKV_K8S_25=Capabilities are added back only after dropping ALL, which is tighter than upstream (drops nothing). The sets are empirically verified against the images; a smaller set crashes the manager."
    # Not reloader auto: it also watches the wazuh Secret, whose passwords rotate on a
    # different clock than the indexer accepts new hashes (docs/apps/wazuh.md).
    configmap.reloader.stakater.com/reload: wazuh-indexer-conf
    secret.reloader.stakater.com/reload: wazuh-certs
  name: wazuh-indexer
  namespace: security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-indexer
  serviceName: wazuh-indexer
  template:
    metadata:
      labels:
        app: wazuh-indexer
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: certs
          secret:
            secretName: wazuh-certs
            defaultMode: 0600
        - name: conf
          configMap:
            name: wazuh-indexer-conf
            defaultMode: 0600
        - name: internal-users
          secret:
            secretName: wazuh
            defaultMode: 0600
            items:
              - key: internal_users.yml
                path: internal_users.yml
      initContainers:
        # No privileged sysctl init container (PSA baseline); vm.max_map_count=262144 lives
        # in talos/patches/global/machine-sysctls.yaml, apply to nodes first (docs/apps/wazuh.md).
        - name: chown-data
          image: docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command:
            - "sh"
            - "-c"
            - "chown -R 1000:1000 /var/lib/wazuh-indexer"
          securityContext:
            # Root only to chown the freshly provisioned volume; the main container
            # does not run as root.
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
              add:
                - "CHOWN"
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/wazuh-indexer
      containers:
        - name: wazuh-indexer
          image: docker.io/wazuh/wazuh-indexer:4.14.8@sha256:929179d223dc44e40c2e5c8bdbd1df19c6f68ab8f4ac255dfce98d92ee831a17
          env:
            # Half the container limit, per OpenSearch guidance; upstream's 65%-of-limit
            # default OOM-kills with no OutOfMemoryError logged (wazuh-kubernetes#879).
            - name: OPENSEARCH_JAVA_OPTS
              value: -Xms2g -Xmx2g -Dlog4j2.formatMsgNoLookups=true
            - name: CLUSTER_NAME
              value: wazuh
            - name: NETWORK_HOST
              value: 0.0.0.0
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              memory: 4Gi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
              # The indexer entrypoint chroots at startup; without this it exits before
              # reaching OpenSearch.
              add:
                - "SYS_CHROOT"
          ports:
            - containerPort: 9200
              name: rest
            - containerPort: 9300
              name: nodes
          startupProbe:
            tcpSocket:
              port: 9200
            # Security-index bootstrap is slow on first boot; a shorter window restarts
            # the pod mid-initialisation.
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 9200
            periodSeconds: 20
          livenessProbe:
            tcpSocket:
              port: 9200
            periodSeconds: 30
            # Generous: a busy indexer can stall the REST listener under merge pressure,
            # and restarting it mid-merge makes things worse.
            failureThreshold: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/wazuh-indexer
            - {
                name: certs,
                mountPath: /usr/share/wazuh-indexer/config/certs/node.pem,
                subPath: node.pem,
                readOnly: true,
              }
            - {
                name: certs,
                mountPath: /usr/share/wazuh-indexer/config/certs/node-key.pem,
                subPath: node-key.pem,
                readOnly: true,
              }
            - {
                name: certs,
                mountPath: /usr/share/wazuh-indexer/config/certs/root-ca.pem,
                subPath: root-ca.pem,
                readOnly: true,
              }
            - {
                name: certs,
                mountPath: /usr/share/wazuh-indexer/config/certs/admin.pem,
                subPath: admin.pem,
                readOnly: true,
              }
            - {
                name: certs,
                mountPath: /usr/share/wazuh-indexer/config/certs/admin-key.pem,
                subPath: admin-key.pem,
                readOnly: true,
              }
            - {
                name: conf,
                mountPath: /usr/share/wazuh-indexer/config/opensearch.yml,
                subPath: opensearch.yml,
                readOnly: true,
              }
            - name: internal-users
              mountPath: /usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
              subPath: internal_users.yml
              readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - "ReadWriteOnce"
        # ceph-block, never NFS: wazuh-db is SQLite, and upstream confirms its locking
        # is unsafe over a network filesystem.
        storageClassName: ceph-block
        resources:
          requests:
            storage: 100Gi
