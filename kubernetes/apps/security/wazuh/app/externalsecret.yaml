---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh-certs
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: wazuh-certs
    creationPolicy: Owner
  # Listed key-by-key rather than dataFrom.extract: the 1Password item also holds
  # root-ca-key.pem so the leaf certs can be reissued, and the CA private key has
  # no business inside the cluster. An extract would pull it in silently.
  data:
    - secretKey: root-ca.pem
      remoteRef: &ref { key: wazuh-certs, property: root-ca.pem }
    - secretKey: node.pem
      remoteRef: { <<: *ref, property: node.pem }
    - secretKey: node-key.pem
      remoteRef: { <<: *ref, property: node-key.pem }
    - secretKey: admin.pem
      remoteRef: { <<: *ref, property: admin.pem }
    - secretKey: admin-key.pem
      remoteRef: { <<: *ref, property: admin-key.pem }
    - secretKey: dashboard.pem
      remoteRef: { <<: *ref, property: dashboard.pem }
    - secretKey: dashboard-key.pem
      remoteRef: { <<: *ref, property: dashboard-key.pem }
    - secretKey: filebeat.pem
      remoteRef: { <<: *ref, property: filebeat.pem }
    - secretKey: filebeat-key.pem
      remoteRef: { <<: *ref, property: filebeat-key.pem }
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: wazuh
    creationPolicy: Owner
    template:
      data:
        INDEXER_USERNAME: "{{ .INDEXER_USERNAME }}"
        INDEXER_PASSWORD: "{{ .INDEXER_PASSWORD }}"
        DASHBOARD_USERNAME: "{{ .DASHBOARD_USERNAME }}"
        DASHBOARD_PASSWORD: "{{ .DASHBOARD_PASSWORD }}"
        API_USERNAME: "{{ .API_USERNAME }}"
        API_PASSWORD: "{{ .API_PASSWORD }}"
        CLUSTER_KEY: "{{ .CLUSTER_KEY }}"
        # authd reads the shared registration password from a file, not an env var.
        authd.pass: "{{ .AUTHD_PASSWORD }}"
        # internal_users.yml carries bcrypt hashes, so it is rendered here rather
        # than committed as a ConfigMap. Upstream ships this file with the PUBLIC
        # OpenSearch demo hashes for every account, leaving those in place is a
        # remote-access credential, not a placeholder.
        #
        # ⚠️  ROTATING THESE PASSWORDS IN 1PASSWORD IS NOT SUFFICIENT ON ITS OWN.
        # OpenSearch Security reads internal_users.yml only while it initialises
        # its persisted .opendistro_security index (allow_default_init_securityindex,
        # which fires when that index does not yet exist). A restart against an
        # existing index does NOT re-import the file. So on rotation the manager
        # and dashboard pick up the new plaintext passwords from this same Secret
        # and Reloader restarts them, while the indexer still accepts only the old
        # hashes. Every component fails to authenticate and the stack goes down.
        #
        # This is why the workloads do NOT carry `reloader.stakater.com/auto`.
        # Auto would watch this Secret too, so the rollout would start the instant
        # the ExternalSecret refreshed and there would be no window in which to
        # run the import first. The ordering below would be impossible to honour.
        # They watch their own ConfigMap and wazuh-certs instead, so nothing here
        # restarts a pod on its own and the sequence is yours to control.
        #
        # Rotation runbook. The ORDER matters, and step 3 is the non-obvious one:
        #
        #   1. Update the passwords in the 1Password item.
        #   2. Wait for this ExternalSecret to refresh (or force it:
        #      `kubectl annotate es wazuh -n security force-sync=$(date +%s) --overwrite`).
        #   3. Restart the INDEXER FIRST, and WAIT for it:
        #      `kubectl rollout restart sts/wazuh-indexer -n security`
        #      `kubectl rollout status  sts/wazuh-indexer -n security`
        #      The `status` call is not optional. `rollout restart` returns as
        #      soon as the restart is requested, so without it step 4 can exec
        #      into the OLD pod that is still terminating and import its stale
        #      file, the same silent no-op this ordering exists to prevent.
        #      internal_users.yml is mounted with subPath, and Kubernetes never
        #      refreshes a subPath mount in a running container. Without this the
        #      file on disk is still the OLD one, so step 4 would faithfully
        #      re-import the old hashes and the rotation would silently no-op.
        #      (The restart alone does not import anything: the security index
        #      already exists, so allow_default_init_securityindex does not fire.)
        #   4. Import the new hashes from the now-current file:
        #
        #      kubectl exec -n security sts/wazuh-indexer -- env \
        #        JAVA_HOME=/usr/share/wazuh-indexer/jdk \
        #        OPENSEARCH_PATH_CONF=/usr/share/wazuh-indexer/config \
        #        bash /usr/share/wazuh-indexer/plugins/opensearch-security/tools/securityadmin.sh \
        #        -f /usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml \
        #        -t internalusers -nhnv -p 9300 \
        #        -cacert /usr/share/wazuh-indexer/config/certs/root-ca.pem \
        #        -cert   /usr/share/wazuh-indexer/config/certs/admin.pem \
        #        -key    /usr/share/wazuh-indexer/config/certs/admin-key.pem
        #
        #      -nhnv is required: the certs carry SANs but transport hostname
        #      verification is disabled, matching opensearch.yml.
        #   5. Only now move the clients onto the new passwords:
        #      `kubectl rollout restart sts/wazuh-manager deploy/wazuh-dashboard -n security`
        #
        # Between 3 and 5 the manager and dashboard are still using the OLD
        # passwords, which the indexer still accepts until step 4 lands, so the
        # stack keeps working throughout rather than breaking mid-procedure.
        internal_users.yml: |
          ---
          _meta:
            type: "internalusers"
            config_version: 2
          admin:
            hash: "{{ .INDEXER_HASH }}"
            reserved: true
            backend_roles:
              - "admin"
            description: "Wazuh indexer admin"
          kibanaserver:
            hash: "{{ .DASHBOARD_HASH }}"
            reserved: true
            description: "Wazuh dashboard service account"
  dataFrom:
    - extract:
        key: wazuh
