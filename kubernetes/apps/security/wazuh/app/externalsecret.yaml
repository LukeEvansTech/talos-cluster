---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh-certs
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: wazuh-certs
    creationPolicy: Owner
  # Listed key-by-key, not dataFrom.extract: the 1Password item also holds
  # root-ca-key.pem, and an extract would silently pull that CA private key in.
  data:
    - secretKey: root-ca.pem
      remoteRef: &ref { key: wazuh-certs, property: root-ca.pem }
    - secretKey: node.pem
      remoteRef: { <<: *ref, property: node.pem }
    - secretKey: node-key.pem
      remoteRef: { <<: *ref, property: node-key.pem }
    - secretKey: admin.pem
      remoteRef: { <<: *ref, property: admin.pem }
    - secretKey: admin-key.pem
      remoteRef: { <<: *ref, property: admin-key.pem }
    - secretKey: dashboard.pem
      remoteRef: { <<: *ref, property: dashboard.pem }
    - secretKey: dashboard-key.pem
      remoteRef: { <<: *ref, property: dashboard-key.pem }
    - secretKey: filebeat.pem
      remoteRef: { <<: *ref, property: filebeat.pem }
    - secretKey: filebeat-key.pem
      remoteRef: { <<: *ref, property: filebeat-key.pem }
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh
  namespace: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: wazuh
    creationPolicy: Owner
    template:
      data:
        INDEXER_USERNAME: "{{ .INDEXER_USERNAME }}"
        INDEXER_PASSWORD: "{{ .INDEXER_PASSWORD }}"
        DASHBOARD_USERNAME: "{{ .DASHBOARD_USERNAME }}"
        DASHBOARD_PASSWORD: "{{ .DASHBOARD_PASSWORD }}"
        API_USERNAME: "{{ .API_USERNAME }}"
        API_PASSWORD: "{{ .API_PASSWORD }}"
        CLUSTER_KEY: "{{ .CLUSTER_KEY }}"
        # authd reads the shared registration password from a file, not an env var.
        authd.pass: "{{ .AUTHD_PASSWORD }}"
        # internal_users.yml carries bcrypt hashes, rendered here rather than a ConfigMap.
        # Upstream ships this file with OpenSearch's public demo hashes for every account;
        # left in place, that is a remote-access credential, not a placeholder.
        #
        # Rotating 1Password alone is not enough: the indexer only re-reads this file while
        # bootstrapping its security index, never on a plain restart. That is also why no
        # workload here carries reloader.stakater.com/auto: it would restart onto the new
        # passwords before the indexer re-imports them. Rotation runbook: docs/apps/wazuh.md.
        internal_users.yml: |
          ---
          _meta:
            type: "internalusers"
            config_version: 2
          admin:
            hash: "{{ .INDEXER_HASH }}"
            reserved: true
            backend_roles:
              - "admin"
            description: "Wazuh indexer admin"
          kibanaserver:
            hash: "{{ .DASHBOARD_HASH }}"
            reserved: true
            description: "Wazuh dashboard service account"
  dataFrom:
    - extract:
        key: wazuh
