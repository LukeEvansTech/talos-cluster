---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sentinel-syslog-allow-external-syslog
spec:
  # Default-deny ingress drops external senders without this rule; the collector would look
  # healthy while receiving nothing, the worst failure mode for a log collector.
  #
  # Scoped to the syslog ports only, not :9600 (the Logstash monitoring API); `world`, not a
  # CIDR, keeps LAN addresses out of this public repository. Same shape as wazuh's policy.
  description: "Allow external (LAN) syslog senders to reach the sentinel-syslog collector on 514/udp+tcp"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: sentinel-syslog
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "514"
              protocol: UDP
            - port: "514"
              protocol: TCP
