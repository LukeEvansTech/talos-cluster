---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowler
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: prowler-secret
    template:
      engineVersion: v2
      data:
        POSTGRES_HOST: postgres18-rw.database.svc.cluster.local
        POSTGRES_PORT: "5432"
        POSTGRES_DB: prowlerdb
        POSTGRES_USER: prowlerdb
        POSTGRES_PASSWORD: "{{ .PROWLER_DBPASS }}"
        # The "admin" role only manages partitions here; it reuses the app credentials.
        POSTGRES_ADMIN_USER: prowlerdb
        POSTGRES_ADMIN_PASSWORD: "{{ .PROWLER_DBPASS }}"
        VALKEY_HOST: dragonfly.database.svc.cluster.local
        VALKEY_PORT: "6379"
        VALKEY_DB: "0"
        # Missing auth makes Celery retry silently for about an hour, then die
        # (docs/docs/troubleshooting/kb/159-prowler-dragonfly-auth-silent-failure.md).
        VALKEY_USERNAME: default
        VALKEY_PASSWORD: "{{ .DRAGONFLY_PASSWORD }}"
        NEO4J_HOST: dozerdb.database.svc.cluster.local
        NEO4J_PORT: "7687"
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: "{{ .NEO4J_PASSWORD }}"
        DJANGO_TOKEN_SIGNING_KEY: "{{ .DJANGO_TOKEN_SIGNING_KEY }}"
        DJANGO_TOKEN_VERIFYING_KEY: "{{ .DJANGO_TOKEN_VERIFYING_KEY }}"
        DJANGO_SECRETS_ENCRYPTION_KEY: "{{ .DJANGO_SECRETS_ENCRYPTION_KEY }}"
  dataFrom:
    - extract:
        key: dragonfly
    - extract:
        key: prowler
    - extract:
        key: dozerdb
