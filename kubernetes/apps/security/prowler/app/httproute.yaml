---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowler
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
  hostnames:
    - "prowler.${SECRET_DOMAIN}"
  rules:
    # Longest-prefix match sends this rule ahead of the catch-all "/" rule below.
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: prowler-api
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prowler-ui
          port: 3000
