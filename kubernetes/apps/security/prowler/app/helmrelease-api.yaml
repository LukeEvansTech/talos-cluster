---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app prowler-api
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      prowler-api:
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: prowler
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b"
            envFrom: &envFrom
              - secretRef:
                  name: prowler-secret
        containers:
          api:
            image: &image
              repository: prowlercloud/prowler-api
              tag: 5.43.0@sha256:3a75af3b5cd83bfa6e3ac5c98bd887e8c4090d41bffda9f3068d3fc131b62370
            env: &commonEnv
              TZ: ${TIMEZONE}
              DJANGO_SETTINGS_MODULE: config.django.production
              DJANGO_BIND_ADDRESS: 0.0.0.0
              DJANGO_PORT: "8080"
              DJANGO_ALLOWED_HOSTS: "prowler-api,prowler.${SECRET_DOMAIN}"
              DJANGO_LOGGING_FORMATTER: ndjson
              DJANGO_LOGGING_LEVEL: INFO
              DJANGO_MANAGE_DB_PARTITIONS: "True"
              # Auto-detect hit 49 workers on a 24-core node, about 4GB before any traffic.
              DJANGO_WORKERS: "4"
              # Same problem hits Celery's prefork pool, which also defaults to the core count.
              DJANGO_CELERY_WORKER_CONCURRENCY: "4"
            envFrom: *envFrom
            probes:
              # Kubelet probes by pod IP, which fails Django's ALLOWED_HOSTS check; override Host.
              liveness: &apiProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/
                    port: &port 8080
                    httpHeaders:
                      - name: Host
                        value: prowler-api
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *apiProbe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 768Mi
              limits:
                memory: 2Gi
          worker:
            image: *image
            # Runs celery directly; the entrypoint's worker mode can't disable mingle/gossip.
            command:
              - "/bin/sh"
              - "-c"
            args:
              - >-
                DJANGO_APP_COMPONENT=worker exec uv run python -m celery
                -A config.celery worker
                -n "worker@$(hostname)"
                -l "$${DJANGO_LOGGING_LEVEL:-info}"
                -Q celery,scans,scan-reports,deletion,backfill,overview,integrations,compliance,attack-paths-scans
                -E --max-tasks-per-child 1
                --without-mingle --without-gossip
            env: *commonEnv
            envFrom: *envFrom
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 768Mi
              limits:
                memory: 4Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    serviceAccount:
      prowler: {}

    service:
      app:
        controller: prowler-api
        ports:
          http:
            port: *port

    persistence:
      # Shared scan-output volume, written by `worker`, served by `api`.
      output:
        type: emptyDir
        globalMounts:
          - path: /tmp/prowler_api_output
      # Django config dir (the upstream image writes here at startup).
      config:
        type: emptyDir
        advancedMounts:
          prowler-api:
            api:
              - path: /home/prowler/.config/prowler-api
            worker:
              - path: /home/prowler/.config/prowler-api
      tmp:
        type: emptyDir
        advancedMounts:
          prowler-api:
            api:
              - path: /tmp
                subPath: api-tmp
            worker:
              - path: /tmp
                subPath: worker-tmp
