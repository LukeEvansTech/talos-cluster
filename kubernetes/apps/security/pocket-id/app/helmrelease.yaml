---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pocket-id
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      pocket-id:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/pocket-id/pocket-id
              tag: v2.19.1@sha256:f085157f0b6ea4b2e8aa5ecfd99eada0d83a4960f3a3dcfd46014097d0ef7ab5
            env:
              TZ: ${TIMEZONE}
              ALLOW_USER_SIGNUPS: "withToken" # Can be: disabled, withToken, open
              ANALYTICS_DISABLED: "true"
              APP_URL: "https://id.${SECRET_DOMAIN}"
              DB_PROVIDER: postgres
              # Replaces a bare EMAILS_VERIFIED: "true", which marked any user-edited
              # email as OIDC-verified without proving the user controlled it. v2.19.0 renamed
              # EMAIL_VERIFICATION_ENABLED: "true" to this; "optional" is the same behaviour.
              EMAIL_VERIFICATION: "optional"
              KEYS_STORAGE: database
              UI_CONFIG_DISABLED: "true"
              SMTP_FROM: "pocket-id@${SECRET_DOMAIN}"
              SMTP_HOST: "smtp.${SECRET_DOMAIN}"
              SMTP_PORT: "25"
              SMTP_TLS: starttls
              SESSION_DURATION: "43800"
              TRUST_PROXY: "true"
              UPLOAD_PATH: /app/data/uploads
              # GeoLite2-City is a redownloadable cache, so it stays off the VolSync-backed PVC.
              GEOLITE_DB_PATH: /app/geolite/GeoLite2-City.mmdb
            envFrom:
              - secretRef:
                  name: pocket-id-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 1411
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: Always
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: pocket-id
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "id.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
        advancedMounts:
          pocket-id:
            app:
              - path: /tmp
                subPath: tmp
      geolite:
        # ~60 MiB mmdb plus its in-flight replacement during a refresh.
        type: emptyDir
        sizeLimit: 256Mi
        advancedMounts:
          pocket-id:
            app:
              - path: /app/geolite
