---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pocket-id
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      pocket-id:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec"
            envFrom: &envFrom
              - secretRef:
                  name: pocket-id-secret
        containers:
          app:
            image:
              repository: ghcr.io/pocket-id/pocket-id
              tag: v2.13.0@sha256:c9c1d7b70006968d673a1073df048a3fdec73ccb54e182320b56bb911340f6f1
            env:
              TZ: ${TIMEZONE}
              ALLOW_USER_SIGNUPS: "withToken" # Can be: disabled, withToken, open
              ANALYTICS_DISABLED: "true"
              APP_URL: "https://id.${SECRET_DOMAIN}"
              DB_PROVIDER: postgres
              # Verify email addresses for real rather than asserting them.
              #
              # EMAILS_VERIFIED (previously "true") is what a changed or newly
              # signed-up address is set to, so with it on, a user editing their
              # own account had any address they typed emitted as
              # email_verified: true in OIDC claims without ever proving control
              # of it. AllowOwnAccountEdit defaults to true and we do not
              # override it, so that path was open to every account.
              #
              # EMAIL_VERIFICATION_ENABLED is a SEPARATE setting that also
              # defaults to false, and it gates the "verify your email" prompt.
              # Dropping EMAILS_VERIFIED without it would leave new and changed
              # addresses permanently unverified with no way to verify them.
              # Both are required; neither is sufficient alone.
              #
              # Not a lockout risk: EmailVerified feeds only the OIDC
              # email_verified claim and is never used to gate login. Existing
              # rows are untouched — the flag is written only at signup or on an
              # email change.
              EMAIL_VERIFICATION_ENABLED: "true"
              KEYS_STORAGE: database
              UI_CONFIG_DISABLED: "true"
              # TODO: Enable LDAP when Active Directory is configured
              # LDAP_ENABLED: "true"
              # LDAP_URL: "ldaps://your-ldap-server"
              # LDAP_SKIP_CERT_VERIFY: "true"
              # LDAP_USER_GROUP_SEARCH_FILTER: "(&(objectClass=group)(cn=ID*))"
              # LDAP_ATTRIBUTE_USER_UNIQUE_IDENTIFIER: objectGUID
              # LDAP_ATTRIBUTE_GROUP_UNIQUE_IDENTIFIER: objectGUID
              # LDAP_ATTRIBUTE_USER_FIRST_NAME: givenName
              # LDAP_ATTRIBUTE_USER_LAST_NAME: sn
              # LDAP_ATTRIBUTE_USER_USERNAME: sAMAccountName
              # LDAP_ATTRIBUTE_USER_EMAIL: mail
              # LDAP_ATTRIBUTE_GROUP_MEMBER: member
              # LDAP_ATTRIBUTE_GROUP_NAME: cn
              # LDAP_ATTRIBUTE_ADMIN_GROUP: ID-Admin
              SMTP_FROM: "pocket-id@${SECRET_DOMAIN}"
              SMTP_HOST: "smtp2graph.infrastructure.svc.cluster.local"
              SMTP_PORT: "25"
              SESSION_DURATION: "43800"
              TRUST_PROXY: "true"
              UPLOAD_PATH: /app/data/uploads
              # TODO: Enable when MaxMind is configured
              # GEOLITE_DB_PATH: /app/data/GeoLite2-City.mmdb
            envFrom: *envFrom
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 1411
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: Always
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: pocket-id
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - "id.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
        advancedMounts:
          pocket-id:
            app:
              - path: /tmp
                subPath: tmp
