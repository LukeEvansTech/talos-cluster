---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loupe
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: loupe-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        APP_KEY: "{{ .APP_KEY }}"
        ADMIN_PASSWORD: "{{ .ADMIN_PASSWORD }}"
        # Secret key name kept as LITELLM_MASTER_KEY (matches the
        # HelmRelease's secretKeyRef); value is now the operator-issued
        # key scoped to self-hosted + its cloud fallback, not the master key.
        LITELLM_MASTER_KEY: "{{ .LITELLM_LOUPE_API_KEY }}"
  dataFrom:
    - extract:
        key: loupe
    - extract:
        key: litellm
