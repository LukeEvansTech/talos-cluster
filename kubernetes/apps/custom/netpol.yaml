---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cross-namespace-ingress
spec:
  description: "Allow ingress from gateway (network namespace)"
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-curator-from-judges
spec:
  # curator is left out of allow-same-namespace (components/netpol): its buttons write tags, so
  # only the gateway and the two judges that publish review documents may reach it.
  description: "Allow the curator judges to publish review documents to curator"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: curator
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: curatorfilmjudge
        - matchLabels:
            app.kubernetes.io/name: curatortvjudge
