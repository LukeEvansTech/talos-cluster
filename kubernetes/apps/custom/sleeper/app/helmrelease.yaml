---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sleeper
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sleeper
  values:
    controllers:
      sleeper:
        annotations:
          reloader.stakater.com/auto: "true"
        # Recreate avoids a multi-attach deadlock on this RWO ceph-block PVC.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/lukeevanstech/sleeper
              # Built from main (f88be70); switch to the v0.1.0 release tag once it is cut.
              tag: f88be70@sha256:3be9989d3802c307f3ad2f3cdef26e2782ca407fcef8deaa82a4a27e610200e8
            env:
              TZ: ${TIMEZONE}
              SLEEPER_DATA: /data
              SLEEPER_PUBLIC_URL: https://sleeper.${SECRET_DOMAIN}
              SLEEPER_LLM_URL: http://litellm.ai.svc.cluster.local:4000/v1
              SLEEPER_LLM_MODEL: claude
              # Four sweeps a day, as the Mac watch it replaces ran.
              SLEEPER_SCHEDULE: "0 2,8,14,20 * * *"
              SLEEPER_TZ: Europe/London
              # Daily summary email at 08:30 through smtp2graph; the LAN name matches its
              # certificate. The recipient comes from the secret (SLEEPER_SUMMARY_TO).
              SLEEPER_SMTP_HOST: smtp.${SECRET_DOMAIN}
              SLEEPER_MAIL_FROM: noreply@${SECRET_DOMAIN}
              SLEEPER_SUMMARY_SCHEDULE: "30 8 * * *"
            envFrom:
              - secretRef:
                  name: sleeper-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            # Headless Chromium runs inside the pod during a sweep; it needs the headroom.
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: sleeper
        ports:
          http:
            port: *port
    # /metrics carries the last delivering sweep; /health cannot see that.
    serviceMonitor:
      app:
        serviceName: "{{ .Release.Name }}"
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: sleeper
            group: internal
            url: http://sleeper.custom.svc.cluster.local:8080/health
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "sleeper.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: sleeper
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
