---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: curatorfilm
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: curatorfilm
  values:
    controllers:
      # Assesses the library and writes cleanup-plan/plan.json; never deletes
      # or tags. curatorfilmjudge judges the plan half an hour later.
      curatorfilm:
        type: cronjob
        cronjob:
          ttlSecondsAfterFinished: 86400
          schedule: "0 8 * * 6"
          timeZone: "${TIMEZONE}"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 1
          # A cold run resolves every new Plex rating key one at a time; warm it
          # is about fifteen seconds.
          activeDeadlineSeconds: 1800
        pod:
          automountServiceAccountToken: false
        containers:
          app:
            image:
              repository: docker.io/library/python
              tag: 3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
            command:
              - python3
              - -m
              - curator
              - plan
              - --out
              - /state/cleanup-plan
            env:
              PYTHONPATH: /app
              PYTHONDONTWRITEBYTECODE: "1"
              PYTHONUNBUFFERED: "1"
              TZ: "${TIMEZONE}"
              # In-cluster Services: no gateway, no proxy, no tailnet.
              RADARR_URL: http://radarr.media.svc.cluster.local
              TAUTULLI_URL: http://tautulli.media.svc.cluster.local
              SEERR_URL: http://seerr.media.svc.cluster.local
              # LEDGER_DIR selects the filesystem backend, so the ledger is snapshotted
              # with the volume.
              LEDGER_DIR: /state/ledger
              # Set here, not on curatorfilmjudge: the plan names the candidates the judge is
              # asked about, largest first, and defers the rest.
              CLEANUP_JUDGE_LIMIT: "150"
              # plan deletes nothing either way; set so the ledger namespaces its
              # records the same as execute will.
              CLEANUP_MODE: act
            envFrom:
              - secretRef:
                  name: curatorfilm-secret
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      code:
        type: configMap
        name: curatorfilm-code
        globalMounts:
          - path: /app/curator
            readOnly: true
      # Created by the volsync component from the APP substitution in ks.yaml.
      state:
        existingClaim: curatorfilm
        globalMounts:
          - path: /state
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
