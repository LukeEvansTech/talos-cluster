---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: curatortvjudge
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: curatortvjudge
  values:
    controllers:
      # Three steps (prompt, ask, act) keep the least-trusted part of the pipeline small: only
      # 'ask' talks to Claude, holding no credential but the gateway key. The executor re-checks
      # every protection live, so a hostile answer can only choose among series already cleared.
      curatortvjudge:
        type: cronjob
        cronjob:
          ttlSecondsAfterFinished: 86400
          # Half an hour after curatortv, and an hour after curatorfilmjudge so the two never overlap.
          schedule: &schedule "30 9 * * 6"
          timeZone: "${TIMEZONE}"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          # Never retry: this pipeline ends in DELETEs, and a retry would re-run judgement against
          # an already-acted plan (docs/docs/apps/curatorfilmjudge.md).
          backoffLimit: 0
          activeDeadlineSeconds: 3600
        pod:
          automountServiceAccountToken: false
        initContainers:
          # 1. Plan -> one batch file per request. Refuses a stale or blocked plan, or one with
          #    nothing to judge, leaving a marker so later steps skip paying for a rejected judgement.
          prompt:
            image: &python
              repository: docker.io/library/python
              tag: 3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
            command:
              - python3
              - /prompt/build_prompt.py
            env: &pythonEnv
              PYTHONDONTWRITEBYTECODE: "1"
              PYTHONUNBUFFERED: "1"
              TZ: "${TIMEZONE}"
              # Series per request to the judge; read by the prompt step only.
              CLEANUP_JUDGE_BATCH: "15"
            resources: &small
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext: &hardened
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          # 2. Ask Claude through the LiteLLM gateway, one request per batch. The SDK installs at
          #    start-up into a writable /tmp prefix (root filesystem is read-only); version pinned here.
          judge:
            # The chart falls back to alphabetical key order for initContainers, so without this
            # `judge` ran before `prompt` existed, every time.
            dependsOn: prompt
            image: *python
            command:
              - /bin/sh
              - -c
              # $${VAR} survives Flux postBuild substitution; a bare ${VAR}
              # would be replaced with an empty string before the pod ever runs.
              - |
                set -u
                if [ -f /work/skip ]; then
                  echo "skipping: $$(cat /work/skip)"
                  exit 0
                fi
                # A judgement this step cannot obtain is recorded and reported,
                # not allowed to kill the pod before the digest is sent. What is
                # due was judged a week ago, so that work and the week's report go
                # ahead without this week's new verdicts.
                fail() {
                  echo "$$1" >&2
                  printf '%s' "$$1" > /work/judge-failed
                  exit 0
                }
                pip install --quiet --no-cache-dir --disable-pip-version-check \
                  --target /tmp/sdk "anthropic==$${ANTHROPIC_SDK_VERSION}" \
                  || fail "could not install the SDK"
                # judge.py records each batch's outcome itself and exits 0; this
                # catches only an interpreter that could not start.
                PYTHONPATH=/tmp/sdk python3 /prompt/judge.py \
                  || fail "judge.py exited non-zero"
                exit 0
            env:
              <<: *pythonEnv
              ANTHROPIC_SDK_VERSION: "2.10.0"
              # The SDK's zero-argument client reads this and ANTHROPIC_AUTH_TOKEN from the Secret.
              ANTHROPIC_BASE_URL: http://litellm.ai.svc.cluster.local:4000
              # A gateway model group, not a model id. It is kept out of the router's fallbacks,
              # and judge.py refuses a reply the gateway attributes to any other group.
              JUDGE_MODEL: claude-opus
              # pip wants a writable home; this one dies with the pod.
              HOME: /tmp/home
            envFrom:
              - secretRef:
                  name: curatortvjudge-gateway
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext: *hardened
        containers:
          # 3. Validate the answer, apply what the engine still agrees with, then send the digest.
          #    Exits non-zero if any step failed, so the Job surfaces it, not a false success.
          app:
            image: *python
            command:
              - /bin/sh
              - -c
              - |
                set -u
                rc=0
                keep() { [ "$$rc" -eq 0 ] && rc="$$1"; return 0; }

                python3 /prompt/read_verdicts.py || keep $$?
                python3 -m curatortv execute \
                  --plan /state/cleanup-plan/plan.json \
                  --recommendations /state/cleanup-plan/recommendations.json \
                  --out /state/cleanup-plan/result.json || keep $$?
                # The digest is how the run reaches a person, so it goes
                # out whatever the steps above did. Its own failure earns a red
                # Job: an undelivered digest is indistinguishable, from the
                # phone, from a week in which nothing ran at all.
                python3 -m curatortv report \
                  --plan /state/cleanup-plan/plan.json \
                  --result /state/cleanup-plan/result.json \
                  --judgement /state/cleanup-plan/judgement.json \
                  --out /state/cleanup-plan/report.md || keep $$?
                exit "$$rc"
            env:
              <<: *pythonEnv
              PYTHONPATH: /app
              SONARR_URL: http://sonarr.media.svc.cluster.local
              TAUTULLI_URL: http://tautulli.media.svc.cluster.local
              SEERR_URL: http://seerr.media.svc.cluster.local
              LEDGER_DIR: /state/ledger
              # Deletions per weekly run, counted over six days so a second run in the same week
              # still counts the first; the engine's own default, stated.
              CLEANUP_MAX_DELETIONS: "10"
              # Days a verdict waits, as a proposal a person can still overrule with a tag, before
              # execute acts on it; six, so it is due at the next weekly run.
              CLEANUP_GRACE_DAYS: "6"
              # Days a judge's keep spares a title once its wait is over; it is then judged again.
              # Only a person (cleanup-keep) or the rating bar keeps a title for good.
              CLEANUP_KEEP_DAYS: "365"
              # Must match curatortv's mode: the ledger keeps dry-run state apart, and execute refuses
              # a plan made in the other mode. Going back to rehearsing takes this and `--read-only` above.
              CLEANUP_MODE: act
              # The CronJob's schedule above, read in TZ: execute measures "due" against its last firing
              # and report dates the next run from it, so a run
              # started by hand on another day still names the scheduled one.
              CLEANUP_SCHEDULE: *schedule
              # report posts the review document to <url>/publish/tv, signed with the same arr key,
              # and the push opens the page (docs/docs/apps/curator.md).
              CLEANUP_REVIEW_URL: http://curator.custom.svc.cluster.local:8080
              CLEANUP_REVIEW_LINK: https://curator.${SECRET_DOMAIN}/
              # Reclaimerr spares anything tagged keep, so the rating bar's keeps are written even in a
              # dry run (a judge's keep is never a tag);
              # inert in act mode, which tags them anyway (docs/docs/apps/curatortvjudge.md).
              TAG_KEEPS_IN_DRY_RUN: "true"
              FEED_TAGS: kometa
              # Fans out to Pushover. The route verifies its own token, which
              # is why the digest carries one. The title says TV, which tells it from curatorfilmjudge.
              CLEANUP_WEBHOOK_URL: http://chaski.default.svc.cluster.local:8080/hooks/library-cleanup
            envFrom:
              - secretRef:
                  name: curatortvjudge-secret
            resources: *small
            securityContext: *hardened
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      prompt:
        type: configMap
        name: curatortvjudge-prompt
        defaultMode: 0555
        globalMounts:
          - path: /prompt
            readOnly: true
      # Owned by the curatortv app; mounted here to run execute.
      code:
        type: configMap
        name: curatortv-code
        globalMounts:
          - path: /app/curatortv
            readOnly: true
      # Deliberately not a globalMount: the judge never sees this volume. With write access it
      # could rewrite plan.json to add a protected series to `candidates`, which the executor's live
      # re-checks don't cover; the prompt builder gets it read-only, only the executor writes.
      state:
        existingClaim: curatortv
        advancedMounts:
          curatortvjudge:
            prompt:
              - path: /state
                readOnly: true
            app:
              - path: /state
      # Hand-off between the three steps: batches in, one result file per batch out.
      work:
        type: emptyDir
        globalMounts:
          - path: /work
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
