---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: curatortvjudge-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: curatortvjudge-token
  data:
    # Alone in its own Secret: the judge installs an npm package and is the least-trusted step,
    # so handing it the Sonarr/webhook credentials too would let a bad package reach the library.
    # Shares curatorjudge's token: one expiry to track rather than two.
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: claude-code-curator
        property: credential
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: curatortvjudge
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: curatortvjudge-secret
  data:
    # The executor re-validates every protection against live Sonarr
    # immediately before each deletion, so it needs what the plan needed.
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: sonarr
        property: SONARR_API_KEY
    - secretKey: TAUTULLI_API_KEY
      remoteRef:
        key: tautulli
        property: TAUTULLI_API_KEY
    - secretKey: SEERR_API_KEY
      remoteRef:
        key: seerr
        property: SEERR_API_KEY
    # Shares the queue-triage token on purpose: both land on the same phone, and a second
    # secret to rotate would buy nothing.
    - secretKey: CLEANUP_WEBHOOK_TOKEN
      remoteRef:
        key: chaski
        property: TRIAGE_WEBHOOK_TOKEN
