---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sakuga
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sakuga-secret
    template:
      engineVersion: v2
      data:
        # The Pushover "Cels" app, made for the celwatch watcher this replaces.
        APPRISE_URLS: "pover://{{ .PUSHOVER_USER_KEY }}@{{ .PUSHOVER_APP_TOKEN }}"
        # A scoped LiteLLM key (virtualkeys/sakuga.yaml), mirrored to the litellm item by PushSecret.
        SAKUGA_LLM_KEY: "{{ .LITELLM_SAKUGA_API_KEY }}"
        # eBay Browse API app keys (shared Production keyset), for the eBay source.
        EBAY_CLIENT_ID: "{{ .EBAY_CLIENT_ID }}"
        EBAY_CLIENT_SECRET: "{{ .EBAY_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: sakuga
    - extract:
        key: litellm
    - extract:
        key: ebay-api
