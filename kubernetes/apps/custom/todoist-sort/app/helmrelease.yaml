---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: todoist-sort
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: todoist-sort
  values:
    controllers:
      sort-inbox:
        type: cronjob
        cronjob:
          ttlSecondsAfterFinished: 86400
          schedule: "*/15 7-22 * * *"
          timeZone: &timeZone Europe/London
          concurrencyPolicy: Forbid
          # Kills a wedged run so Forbid doesn't skip the next */15 tick; it recovers on its own.
          # 660s covers 2x 300s LLM attempts (config.toml's [llm] timeout) plus 35s retry_backoff.
          activeDeadlineSeconds: 660
          # Safe to retry once: the sort pass is idempotent, so a respawn after a
          # Todoist blip is a silent success, not a page (docs/docs/apps/todoist-sort.md).
          backoffLimit: 1
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app:
            # Not aliased to plan-day's image: Renovate's extractor walks resolved YAML
            # and an alias corrupts the digest-pin write (renovate#24942).
            image:
              repository: ghcr.io/lukeevanstech/todoist-sort
              tag: 0.2.5@sha256:3566626a3c9aaff1a165864ebce7d8a2ad4160a97ce45b2c86689d4f0bb372e4
            command:
              - "sort-inbox"
              - "--root"
              - "/config"
            env: &env
              TZ: *timeZone
            envFrom: &envFrom
              - secretRef:
                  name: todoist-sort-secret
            resources: &resources
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
      plan-day:
        type: cronjob
        cronjob:
          ttlSecondsAfterFinished: 86400
          schedule: "0 7 * * *"
          timeZone: *timeZone
          concurrencyPolicy: Forbid
          # 660s covers 2x 300s LLM attempts (config.toml's [llm] timeout) plus 35s retry_backoff.
          activeDeadlineSeconds: 660
          # backoffLimit stays 0: a k8s retry starts a second process that could blow
          # the max_today budget (docs/docs/apps/todoist-sort.md).
          backoffLimit: 0
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app:
            # Duplicated from sort-inbox on purpose, see the comment there.
            image:
              repository: ghcr.io/lukeevanstech/todoist-sort
              tag: 0.2.5@sha256:3566626a3c9aaff1a165864ebce7d8a2ad4160a97ce45b2c86689d4f0bb372e4
            command:
              - "plan-day"
              - "--root"
              - "/config"
            env: *env
            envFrom: *envFrom
            resources: *resources
            securityContext: *securityContext
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      config:
        type: configMap
        name: todoist-sort-config
        globalMounts:
          - path: /config
            readOnly: true
      tmp:
        type: emptyDir
        # CLI flock lives here; root filesystem is read-only
        globalMounts:
          - path: /tmp
