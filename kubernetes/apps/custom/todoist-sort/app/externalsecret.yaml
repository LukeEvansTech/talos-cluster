---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: todoist-sort
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: todoist-sort-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        TODOIST_API_TOKEN: "{{ .TODOIST_API_TOKEN }}"
        # config.py reads this as ANTHROPIC_API_KEY; the key is litellm-issued,
        # scoped to self-hosted plus its cloud fallback.
        ANTHROPIC_API_KEY: "{{ .LITELLM_TODOIST_SORT_API_KEY }}"
  dataFrom:
    - extract:
        key: todoist-sort
    - extract:
        key: litellm
