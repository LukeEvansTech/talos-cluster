---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: custom
components:
  - ../../components/global-vars
  - ../../components/alerts
  - ../../components/netpol
resources:
  - ./namespace.yaml
  - ./netpol.yaml
  - ./curator/ks.yaml
  - ./curatorjudge/ks.yaml
  - ./curatortv/ks.yaml
  - ./curatortvjudge/ks.yaml
  - ./domainpulse/ks.yaml
  - ./examprep/ks.yaml
  - ./lurcher/ks.yaml
  - ./reconcilable/ks.yaml
  - ./redditvault/ks.yaml
  - ./sakuga/ks.yaml
  - ./sleeper/ks.yaml
  - ./subspy/ks.yaml
  - ./todoist-sort/ks.yaml
patches:
  # Every app here sits in the Custom homepage group (first on the page; homepage
  # settings.yaml layout), so a new app lands there without setting it itself.
  - target:
      kind: Kustomization
      group: kustomize.toolkit.fluxcd.io
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: placeholder
      spec:
        postBuild:
          substitute:
            HOMEPAGE_GROUP: Custom
