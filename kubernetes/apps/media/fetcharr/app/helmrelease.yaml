---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fetcharr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: fetcharr
  values:
    controllers:
      fetcharr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/egg82/fetcharr
              tag: 2.2.1@sha256:f3cf8a850b57497c529774f9791590cf799db2173a3ba068f9ac13c6535b8b5b
            env:
              TZ: ${TIMEZONE}
              SEARCH_INTERVAL: 1hour
              SEARCH_AMOUNT: "5"
              MONITORED_ONLY: "true"
              # Missing-only: Profilarr v2 Upgrades now owns quality upgrades
              # (cutoff-unmet re-search). fetcharr only acquires missing items.
              MISSING_ONLY: "true"
              RADARR_0_URL: http://radarr.media.svc.cluster.local
              SONARR_0_URL: http://sonarr.media.svc.cluster.local
            envFrom:
              - secretRef:
                  name: fetcharr-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        type: emptyDir
        globalMounts:
          - path: /app/config
      cache:
        type: emptyDir
        globalMounts:
          - path: /app/cache
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/logs
      tmp:
        type: emptyDir
