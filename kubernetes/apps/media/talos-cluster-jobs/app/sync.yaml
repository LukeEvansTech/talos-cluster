---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Each job in the private repository sets its own namespace; the first, arrqueue, runs in media.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: talos-cluster-jobs-sync
spec:
  interval: 1h
  path: ./kubernetes
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: talos-cluster-jobs
  timeout: 5m
  wait: false
