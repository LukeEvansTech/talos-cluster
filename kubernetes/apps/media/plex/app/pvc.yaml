---
# Separate PVC for cache, to keep regenerable cache files out of the backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-cache
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: 100Gi
  storageClassName: ceph-block
---
# Same reasoning as plex-cache, far larger: generated trickplay/BIF preview bundles,
# regenerable from the library (docs/docs/migrations/plex-media-bundles-volume.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-bundles
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: 500Gi
  storageClassName: ceph-block
