---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
spec:
  interval: 1h
  # Recreate can spend the full 300s terminationGracePeriod waiting for the old pod to
  # exit, which blows past Helm's default 5m timeout and rolls the upgrade back mid-flight.
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: plex
  values:
    controllers:
      plex:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            # Caps pod egress so BBR can't burst into an Apple TV's tiny receive window and
            # collapse the connection's MSS (KB-002).
            kubernetes.io/egress-bandwidth: "200M"
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: any-nvidia-gpu
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/plex
              tag: 1.43.4.10903@sha256:fdc6fe82bc7d8acd08fc0aa581fcb76722803ba5905e2537135a697347dd6149
            env:
              TZ: "${TIMEZONE}"
              PLEX_NO_AUTH_NETWORKS: "${CR_LAN_CIDR:-0.0.0.0/0},${GH_LAN_CIDR:-0.0.0.0/0}"
              # Published to plex.tv as candidate connections; the svc URL gives in-cluster
              # clients a direct path and is skipped fast off-cluster (KB-003).
              PLEX_ADVERTISE_URL: "http://${SVC_PLEX_ADDR:-127.0.0.1}:32400,https://plex.${SECRET_DOMAIN:-local}:443,http://plex.media.svc.cluster.local:32400"
              PLEX_PREFERENCE_1: "AllowMediaDeletion=0"
              PLEX_PREFERENCE_2: "EnableIPv6=0"
              PLEX_PREFERENCE_3: "FriendlyName=Talos Plex"
              PLEX_PREFERENCE_4: "LanNetworksBandwidth=${CR_LAN_CIDR:-0.0.0.0/0},${GH_LAN_CIDR:-0.0.0.0/0}"
              PLEX_PREFERENCE_5: "HardwareAcceleratedCodecs=1"
              PLEX_PREFERENCE_6: "HardwareAcceleratedEncoders=1"
              # (7 retired: TranscoderTempDirectory=/transcode is the image entrypoint default)
              # Disable services that don't work in Kubernetes
              PLEX_PREFERENCE_8: "GdmEnabled=0"
              PLEX_PREFERENCE_9: "DlnaEnabled=0"
              PLEX_PREFERENCE_10: "RelayEnabled=0"
              # Reduce NFS I/O
              PLEX_PREFERENCE_11: "ButlerTaskDeepMediaAnalysis=0"
              PLEX_PREFERENCE_12: "ScannerLowPriority=1"
              PLEX_PREFERENCE_13: "logDebug=0"
              # Limit remote streams to 20 Mbps (forces 4K to transcode; see KB-018)
              PLEX_PREFERENCE_14: "WanPerStreamMaxUploadRate=20000"
              # ~5 concurrent at the per-stream cap; declared to match the live UI value.
              PLEX_PREFERENCE_15: "WanTotalMaxUploadRate=100000"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: &port 32400
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 2000m
                memory: 4Gi
              limits:
                memory: 16Gi
              claims:
                - name: gpu
          # Plex only logs to files, never stdout; tails the log (config-logs emptyDir) so
          # VictoriaLogs ships it like every other app.
          logs:
            image:
              repository: mirror.gcr.io/library/busybox
              tag: "1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e"
            command:
              - /bin/sh
              - -c
              - tail -n0 -F "/config/Library/Application Support/Plex Media Server/Logs/Plex Media Server.log"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 10Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      labels:
        gpu-workload: "true"
      # Lets Plex checkpoint its SQLite DB on shutdown instead of a 30s-default SIGKILL mid-write.
      terminationGracePeriodSeconds: 300
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: In
                    values:
                      - "true"
        podAntiAffinity:
          # Preferred, not required (three nodes, no workers, a hard rule would wedge Pending):
          # keeps transcodes off the GPU running the inference model, no VRAM headroom to share.
          # `namespaces` is load-bearing: pod affinity is namespace-scoped, model runs in `ai`.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                namespaces:
                  - "ai"
                labelSelector:
                  matchLabels:
                    llm-gpu-model: "true"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              gpu-workload: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: plex
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${SVC_PLEX_ADDR}
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: external
            url: https://plex.${SECRET_DOMAIN}/identity
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
          - name: envoy-internal
            namespace: network
        rules:
          # 0s disables Envoy's default route timeout: transcode decisions can take >15s,
          # streams run for hours, and the SSE notifications endpoint stays open all session.
          - name: app
            matches:
              - path:
                  type: PathPrefix
                  value: /
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier: &pipeline
                  # Without this, Plex closes an idle connection at ~20s while Envoy still
                  # thinks it's poolable (onedr0p/home-ops#11702).
                  set:
                    - name: X-Plex-Http-Pipeline
                      value: infinite
            backendRefs: &backendRefs
              - identifier: app
                port: *port
            timeouts: &timeouts
              request: 0s
              backendRequest: 0s
          # Strips Range on external-subtitle fetches; SRT breaks through a reverse proxy otherwise.
          - name: subtitles
            matches:
              - path:
                  type: PathPrefix
                  value: /library/streams
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  <<: *pipeline
                  remove:
                    - "Range"
            backendRefs: *backendRefs
            timeouts: *timeouts
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      # Separate PVC for cache to avoid backing up cache files
      cache:
        existingClaim: "{{ .Release.Name }}-cache"
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Cache
      # Same idea, ~247G larger: generated trickplay/BIF preview bundles, regenerable from
      # the library (docs/docs/migrations/plex-media-bundles-volume.md).
      bundles:
        existingClaim: "{{ .Release.Name }}-bundles"
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Media
      config-logs:
        type: emptyDir
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Logs
      # Custom client-profile overrides (KB-026); remove this mount to restore stock profiles.
      profiles:
        type: configMap
        name: plex-client-profiles
        advancedMounts:
          plex:
            app:
              - path: /config/Library/Application Support/Plex Media Server/Profiles
      tmp:
        type: emptyDir
      transcode:
        type: emptyDir
      media:
        type: nfs
        server: ${SECRET_STORAGE_SERVER:-localhost}
        path: /mnt/pool/media
        globalMounts:
          - path: /media
            readOnly: true
