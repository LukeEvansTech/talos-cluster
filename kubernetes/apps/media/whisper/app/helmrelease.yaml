---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whisper
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: whisper
  values:
    controllers:
      whisper: &controller
        strategy: Recreate
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: any-nvidia-gpu
        containers:
          app: &container
            # subgen serves the same /asr and /detect-language API as the webservice it replaced.
            # Since 2026.11.4 it runs whisper.cpp instead of faster-whisper with stable-ts, so the
            # faster-whisper settings (TRANSCRIBE_DEVICE, COMPUTE_TYPE, SUBGEN_KWARGS) are gone.
            image:
              repository: docker.io/mccloud/subgen
              tag: 2026.11.5@sha256:ef98e8dc44054d7efcd89cf56e52e771a782885cd3a71573483e68e1dcf94dda
            env: &env
              # Multilingual, so Bazarr can also request task=translate; the turbo and distil
              # variants cannot translate.
              WHISPER_MODEL: large-v3
              # One job at a time: the card is shared, and a second film-length job doubled RAM.
              CONCURRENT_TRANSCRIPTIONS: "1"
              # Frees the VRAM between jobs for the other tenants of this card; there is no VRAM
              # isolation between DRA shares.
              CLEAR_VRAM_ON_COMPLETE: "True"
              MODEL_CLEANUP_DELAY: "300"
              # Serve Bazarr and dubsub only: no webhooks, folder scans or Plex queueing.
              PROCESS_ADDED_MEDIA: "False"
              PROCESS_MEDIA_ON_PLAY: "False"
              MONITOR: "False"
              SKIP_STARTUP_SCAN: "True"
              DEBUG: "False"
              # whisper.cpp downloads its GGML file here on the first request, not at start; the
              # faster-whisper folders beside it are unused and can be deleted.
              MODEL_PATH: /models/whisper
              HF_HOME: /models/huggingface
              HOME: /tmp
              XDG_CACHE_HOME: /tmp/.cache
              MPLCONFIGDIR: /tmp/.cache/matplotlib
            probes:
              # TCP, not HTTP: the previous webservice answered no HTTP during a job; subgen has no
              # documented health endpoint.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 9000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 500m
                memory: 4Gi
              # The webservice holds a whole film's decoded audio in RAM; 8Gi was OOMKilled on
              # ~2.5 h films with a second request in flight.
              limits:
                memory: 24Gi
              claims:
                - name: gpu
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
      # A second instance for bulk re-transcription runs, on another GPU node; Bazarr keeps
      # the whisper service to itself. Same pod spec, but its own model copy (see persistence).
      batch:
        <<: *controller
        # Off by default. Nothing in the cluster calls it, and a loaded CUDA context keeps the
        # card at P0 (about 34 W against 16 W with no context) even when idle. Scale it up for a
        # bulk run: `kubectl -n media scale deploy/whisper-batch --replicas=1`, and back to 0
        # afterwards. A Helm upgrade (any change to this file) resets it to this value.
        replicas: 0
        containers:
          app:
            <<: *container
            env:
              <<: *env
              # Its bulk work is English transcription (dub-matched and re-timed subtitles),
              # which turbo does several times faster at close to large-v3's accuracy. Turbo
              # can't translate, so Bazarr's own requests stay on the whisper service.
              WHISPER_MODEL: large-v3-turbo
    defaultPodOptions:
      labels:
        gpu-workload: "true"
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: In
                    values:
                      - "true"
        podAntiAffinity:
          # Required, unlike the media neighbours: the inference model leaves ~1 GiB of VRAM on
          # its card and this model needs several GiB, so co-locating fails at load.
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              namespaces:
                - "ai"
              labelSelector:
                matchLabels:
                  llm-gpu-model: "true"
            # One instance per card: whisper and batch each saturate a GPU on their own.
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: whisper
          # Keeps transcription compute off the card Plex transcodes on when there is a choice.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: plex
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              gpu-workload: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: whisper
        # Keeps the name Bazarr points at; a second service would otherwise rename it whisper-app.
        forceRename: whisper
        ports:
          http:
            port: *port
      batch:
        controller: batch
        ports:
          http:
            port: *port
    persistence:
      models:
        existingClaim: whisper-models
        advancedMounts:
          whisper:
            app:
              - path: /models
      # whisper-models is ReadWriteOnce, so batch downloads its own ~3 GB copy at start.
      models-batch:
        type: emptyDir
        advancedMounts:
          batch:
            app:
              - path: /models
      tmp:
        type: emptyDir
