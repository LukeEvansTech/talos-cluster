---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whisper
spec:
  interval: 1h
  # First start downloads the model before the pod turns Ready; Helm's 5m default rolls it back.
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: whisper
  values:
    controllers:
      whisper: &controller
        strategy: Recreate
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: any-nvidia-gpu
        containers:
          app: &container
            # subgen serves the same /asr and /detect-language API as the webservice it replaced,
            # but times cues with stable-ts. Plain faster-whisper segments can open minutes before
            # the line is spoken, so subtitles appeared during silences.
            image:
              repository: docker.io/mccloud/subgen
              tag: 2026.07.3@sha256:2841515a3b409677669f0a10d77d49160bffb8111db91640fb33a4db06b3396c
            env: &env
              TRANSCRIBE_DEVICE: cuda
              # Multilingual, so Bazarr can also request task=translate; the turbo and distil
              # variants cannot translate.
              WHISPER_MODEL: large-v3
              # float32 is about twice the VRAM for no accuracy gain.
              COMPUTE_TYPE: float16
              # One job at a time: the card is shared, and a second film-length job doubled RAM.
              CONCURRENT_TRANSCRIPTIONS: "1"
              # Frees the VRAM between jobs for the other tenants of this card; there is no VRAM
              # isolation between DRA shares.
              CLEAR_VRAM_ON_COMPLETE: "True"
              MODEL_CLEANUP_DELAY: "300"
              # Parsed with ast.literal_eval, so Python's True, not JSON's true.
              SUBGEN_KWARGS: "{'vad': True}"
              # Serve Bazarr and dubsub only: no webhooks, folder scans or Plex queueing.
              PROCESS_ADDED_MEDIA: "False"
              PROCESS_MEDIA_ON_PLAY: "False"
              MONITOR: "False"
              SKIP_STARTUP_SCAN: "True"
              DEBUG: "False"
              # Already holds faster-whisper-large-v3 in Hugging Face cache layout.
              MODEL_PATH: /models/whisper
              HF_HOME: /models/huggingface
              HOME: /tmp
              XDG_CACHE_HOME: /tmp/.cache
              MPLCONFIGDIR: /tmp/.cache/matplotlib
            probes:
              # TCP, not HTTP: the previous webservice answered no HTTP during a job; subgen has no
              # documented health endpoint.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 9000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              # The model loads before the server binds, including the first-start download.
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 90
            resources:
              requests:
                cpu: 500m
                memory: 4Gi
              # The webservice holds a whole film's decoded audio in RAM; 8Gi was OOMKilled on
              # ~2.5 h films with a second request in flight.
              limits:
                memory: 24Gi
              claims:
                - name: gpu
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
      # A second instance for bulk re-transcription runs, on another GPU node; Bazarr keeps
      # the whisper service to itself. Same pod spec, but its own model copy (see persistence).
      batch:
        <<: *controller
        containers:
          app:
            <<: *container
            env:
              <<: *env
              # Its bulk work is English transcription (dub-matched and re-timed subtitles),
              # which turbo does several times faster at close to large-v3's accuracy. Turbo
              # can't translate, so Bazarr's own requests stay on the whisper service.
              WHISPER_MODEL: large-v3-turbo
    defaultPodOptions:
      labels:
        gpu-workload: "true"
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: In
                    values:
                      - "true"
        podAntiAffinity:
          # Required, unlike the media neighbours: the inference model leaves ~1 GiB of VRAM on
          # its card and this model needs several GiB, so co-locating fails at load.
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              namespaces:
                - "ai"
              labelSelector:
                matchLabels:
                  llm-gpu-model: "true"
            # One instance per card: whisper and batch each saturate a GPU on their own.
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: whisper
          # Keeps transcription compute off the card Plex transcodes on when there is a choice.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: plex
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              gpu-workload: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: whisper
        # Keeps the name Bazarr points at; a second service would otherwise rename it whisper-app.
        forceRename: whisper
        ports:
          http:
            port: *port
      batch:
        controller: batch
        ports:
          http:
            port: *port
    persistence:
      models:
        existingClaim: whisper-models
        advancedMounts:
          whisper:
            app:
              - path: /models
      # whisper-models is ReadWriteOnce, so batch downloads its own ~3 GB copy at start.
      models-batch:
        type: emptyDir
        advancedMounts:
          batch:
            app:
              - path: /models
      tmp:
        type: emptyDir
