---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sonarr
  values:
    controllers:
      sonarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 5.0.0.2870@sha256:d90a762127d86cd3b7e27cc05b7acd2cf5cf33766cc8d5a5e23a0254e6a61f97
            env:
              SONARR__APP__INSTANCENAME: Sonarr
              SONARR__APP__THEME: dark
              # v5 coerces None/Basic to Forms; the env var wins over whatever config.xml holds.
              SONARR__AUTH__METHOD: Forms
              # Not DisabledForLocalAddresses (Envoy's pod IP looks local, exempting all traffic) nor
              # DisabledForLocalhost (in-pod callers already send the API key).
              SONARR__AUTH__REQUIRED: Enabled
              SONARR__LOG__DBENABLED: "False"
              SONARR__LOG__LEVEL: info
              # localhost, loopback, and the pod hostname are auto-allowed for exportarr; other
              # clients use the FQDN service name.
              SONARR__SERVER__ALLOWEDHOSTS: sonarr.${SECRET_DOMAIN},sonarr.media.svc.cluster.local
              SONARR__SERVER__PORT: &port 80
              # Trusts X-Forwarded-* from Envoy for real client logging; needs Sonarr >= 4.0.19.
              SONARR__SERVER__TRUSTEDNETWORKS: ${CLUSTER_PODS_CIDR}
              SONARR__UPDATE__BRANCH: develop
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: sonarr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                    # kubelet sends the pod IP as Host; the allowlist above accepts only localhost.
                    httpHeaders:
                      - name: Host
                        value: localhost
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  # 1s killed a busy-but-alive Sonarr: big release searches pin its CPU and /ping
                  # answers slowly (3 liveness restarts on 2026-09-29/30). A wedged Sonarr still fails.
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              # The first start on a new major runs schema migrations before /ping binds; on this
              # library's multi-GB database that outlasts liveness's 30s budget (allows 30 min).
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: localhost
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 180
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 500m
              limits:
                # .NET caps the managed heap at 75% of this; at 4Gi Sonarr hit
                # OutOfMemoryException near 3.2GiB during large series searches
                # and queue reads, six times in two days (2026-10-22/24). At 6Gi
                # it still ran out near 4.5GiB, most hours, on the hourly
                # Profilarr upgrade search of Bleach (2026-10-29/30). At 10Gi that
                # search reached 7Gi of a 7.5GiB heap; nodes have ~190Gi each.
                # At 16Gi it reached 10.6Gi of a 12GiB heap (2026-10-30).
                memory: 24Gi
          metrics:
            dependsOn: app
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
            args:
              - "sonarr"
            env:
              PORT: &metricsPort 9707
              URL: "http://localhost:80"
              ENABLE_ADDITIONAL_METRICS: "true"
              API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-secret
                    key: SONARR__AUTH__APIKEY
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                # ENABLE_ADDITIONAL_METRICS pulls the whole queue per scrape; 128Mi
                # was OOMKilled twice with ~5.5k queued items (2026-09-28/29).
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: sonarr
        ports:
          http:
            port: *port
          metrics:
            port: *metricsPort
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      config-cache:
        existingClaim: "{{ .Release.Name }}-cache"
        globalMounts:
          - path: /config/MediaCover
      scripts:
        type: configMap
        name: sonarr-configmap
        defaultMode: 0775
        globalMounts:
          - path: /scripts/refresh-series.sh
            subPath: refresh-series.sh
            readOnly: true
      tmp:
        type: emptyDir
      media:
        type: nfs
        server: ${SECRET_STORAGE_SERVER:-localhost}
        path: /mnt/pool/media
        globalMounts:
          - path: /media
