---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sonarr-secret
    template:
      data:
        SONARR__AUTH__APIKEY: "{{ .SONARR_API_KEY }}"
        # Seeds the forms login only when sonarr.db has no user, instead of a password logged once.
        SONARR__AUTH__INITIALUSERNAME: "{{ .SONARR_INITIAL_USERNAME }}"
        SONARR__AUTH__INITIALPASSWORD: "{{ .SONARR_INITIAL_PASSWORD }}"
        PUSHOVER_TOKEN: "{{ .SONARR_PUSHOVER_TOKEN }}"
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
  # Named refs: the generic login labels would collide across the merged dataFrom items.
  data:
    - secretKey: SONARR_INITIAL_USERNAME
      remoteRef:
        key: sonarr
        property: username
    - secretKey: SONARR_INITIAL_PASSWORD
      remoteRef:
        key: sonarr
        property: password
  dataFrom:
    - extract:
        key: sonarr
    - extract:
        key: pushover
