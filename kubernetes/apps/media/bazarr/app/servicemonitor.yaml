---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bazarr
  labels:
    app.kubernetes.io/name: bazarr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: bazarr
  endpoints:
    - port: metrics
      scheme: http
      # A Bazarr scrape takes ~7s and peaks at 10s, so the
      # default 10s timeout flapped ExportarrDown (140 up/down changes in 72h).
      path: /metrics
      interval: 60s
      scrapeTimeout: 50s
      relabelings:
        - action: replace
          targetLabel: instance
          replacement: bazarr
