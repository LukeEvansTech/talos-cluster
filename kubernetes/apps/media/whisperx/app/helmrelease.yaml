---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whisperx
spec:
  interval: 1h
  # First start downloads the model before the pod turns Ready; Helm's 5m default rolls it back.
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: whisperx
  values:
    controllers:
      whisperx:
        strategy: Recreate
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: any-nvidia-gpu
        containers:
          app:
            image:
              repository: docker.io/onerahmet/openai-whisper-asr-webservice
              tag: v1.10.0-gpu@sha256:3deb30cfd3d5614fd3885e6dfbef7dfcf95fe897300ecc703f7f3b3682b717ae
            env:
              # Same image and API as whisper; WhisperX adds a forced-alignment pass for word timing.
              ASR_ENGINE: whisperx
              # Multilingual, so Bazarr can also request task=translate; the turbo and distil
              # variants cannot translate.
              ASR_MODEL: large-v3
              # The image defaults to float32 on GPU, about twice the VRAM for no accuracy gain.
              ASR_QUANTIZATION: float16
              # No MODEL_IDLE_TIMEOUT: the v1.10.0 whisperx engine cannot reload after an idle
              # unload (it assigns into a model dict that the unload set to None).
              # The engine ignores ASR_MODEL_PATH; weights, VAD and alignment models land in
              # these caches, kept on the PVC so a restart does not refetch them.
              # v1.10.0 ships lightning 2.6, under which pyannote's VAD checkpoint fails torch's
              # weights_only load and the pod crash-loops (upstream issue #383). This restores the
              # pre-2.6 behaviour for the whole process, which loads only pinned upstream models.
              TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: "1"
              # The image defaults to 1000 characters, which emits one cue per Whisper segment.
              SUBTITLE_MAX_LINE_WIDTH: "42"
              SUBTITLE_MAX_LINE_COUNT: "2"
              HF_HOME: /models/huggingface
              TORCH_HOME: /models/torch
              XDG_CACHE_HOME: /models/cache
              MPLCONFIGDIR: /tmp/matplotlib
              HOME: /tmp
            probes:
              # TCP, not HTTP: /asr transcribes on the event loop, so the single process answers
              # nothing else until a job finishes, while the kernel still accepts connections.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 9000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              # The model loads before the server binds, including the first-start download.
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 90
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 10Gi
              claims:
                - name: gpu
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      labels:
        gpu-workload: "true"
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: In
                    values:
                      - "true"
        podAntiAffinity:
          # Required, unlike the media neighbours: the inference model leaves ~1 GiB of VRAM on
          # its card and this model needs several GiB, so co-locating fails at load.
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              namespaces:
                - "ai"
              labelSelector:
                matchLabels:
                  llm-gpu-model: "true"
          # Keeps transcription compute off the card Plex transcodes on when there is a choice.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: plex
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              gpu-workload: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      models:
        existingClaim: whisperx-models
        globalMounts:
          - path: /models
      tmp:
        type: emptyDir
