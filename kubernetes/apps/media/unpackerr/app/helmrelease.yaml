---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: unpackerr
  values:
    controllers:
      unpackerr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/unpackerr/unpackerr
              tag: v1.0.1@sha256:22b4693fbeaae4bd927905d63b59b8f67b4a1446682d965ac876c61a48976658
            # Newer Starr versions report the protocol's class name; list both spellings.
            env:
              TZ: ${TIMEZONE}
              UN_INTERVAL: 2m
              UN_START_DELAY: 1m
              UN_PARALLEL: "1"
              UN_WEBSERVER_METRICS: "true"
              UN_WEBSERVER_LISTEN_ADDR: 0.0.0.0:5656
              # v1 serves /metrics only to an API key with system:metrics:read. The key
              # (UN_WEBSERVER_API_KEYS_0_KEY) comes from the secret; the scrape below sends it.
              UN_WEBSERVER_ROLES_metrics_PERMISSIONS_0: system:metrics:read
              UN_WEBSERVER_API_KEYS_0_NAME: prometheus
              UN_WEBSERVER_API_KEYS_0_ROLES_0: metrics
              UN_SONARR_0_URL: http://sonarr.media.svc.cluster.local
              UN_SONARR_0_PATHS_0: /media/downloads/seedbox/sonarr-home
              UN_SONARR_0_PROTOCOLS: torrent,TorrentDownloadProtocol
              UN_SONARR_0_DELETE_ORIG: "false"
              UN_SONARR_0_DELETE_DELAY: 5m
              # v0.16 defaults (20GB Sonarr, 75GB Radarr) fail season packs without retry.
              UN_SONARR_0_MAX_BYTES: 400GB
              UN_RADARR_0_URL: http://radarr.media.svc.cluster.local
              UN_RADARR_0_PATHS_0: /media/downloads/seedbox/radarr-home
              UN_RADARR_0_PROTOCOLS: torrent,TorrentDownloadProtocol
              UN_RADARR_0_DELETE_ORIG: "false"
              UN_RADARR_0_DELETE_DELAY: 5m
              UN_RADARR_0_MAX_BYTES: 200GB
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: unpackerr
        ports:
          http:
            port: 5656
    serviceMonitor:
      app:
        serviceName: unpackerr
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
            authorization:
              type: Bearer
              credentials:
                name: unpackerr-secret
                key: UN_WEBSERVER_API_KEYS_0_KEY
    persistence:
      tmp:
        type: emptyDir
      # Only the seedbox tree, at the arrs' path: UN_*_PATHS is a fallback, not a
      # filter, so anything mounted here can be extracted. See README.md.
      seedbox:
        type: nfs
        server: ${SECRET_STORAGE_SERVER:-localhost}
        path: /mnt/pool/media/downloads/seedbox
        globalMounts:
          - path: /media/downloads/seedbox
