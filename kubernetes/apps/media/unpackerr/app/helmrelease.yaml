---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: unpackerr
  values:
    controllers:
      unpackerr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/unpackerr/unpackerr
              tag: v0.16.1@sha256:406586865431b40b29353d899fb75a788f5384743f7f381444db5fe55d206914
            # Sonarr and Radarr do not unpack torrent downloads. Scene releases
            # grabbed through the seedbox (downloads/seedbox-pull) arrive as RAR
            # sets, so the arrs only see the sample and the item sits at
            # importPending. Unpackerr watches both queues and extracts in place.
            # The original RARs are never deleted (DELETE_ORIG=false); the
            # extracted copy is removed once the arr has imported it, and
            # seedbox-pull prunes the entry after 14 days.
            # Both protocol spellings: newer Starr versions report the class name
            # (unpackerr's own default lists both).
            env:
              TZ: ${TIMEZONE}
              UN_INTERVAL: 2m
              UN_START_DELAY: 1m
              UN_PARALLEL: "1"
              UN_WEBSERVER_METRICS: "true"
              UN_WEBSERVER_LISTEN_ADDR: 0.0.0.0:5656
              UN_SONARR_0_URL: http://sonarr.media.svc.cluster.local
              UN_SONARR_0_PATHS_0: /media/downloads/seedbox/sonarr-home
              UN_SONARR_0_PROTOCOLS: torrent,TorrentDownloadProtocol
              UN_SONARR_0_DELETE_ORIG: "false"
              UN_SONARR_0_DELETE_DELAY: 5m
              UN_RADARR_0_URL: http://radarr.media.svc.cluster.local
              UN_RADARR_0_PATHS_0: /media/downloads/seedbox/radarr-home
              UN_RADARR_0_PROTOCOLS: torrent,TorrentDownloadProtocol
              UN_RADARR_0_DELETE_ORIG: "false"
              UN_RADARR_0_DELETE_DELAY: 5m
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        # The arrs' identity: they import what this extracts.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: unpackerr
        ports:
          http:
            port: 5656
    serviceMonitor:
      app:
        serviceName: unpackerr
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    persistence:
      tmp:
        type: emptyDir
      # ONLY the seedbox staging tree, at the same path the arrs see it.
      # UN_*_PATHS is a fallback for unreachable paths, not a filter: unpackerr
      # extracts whatever path a queue item reports if it can reach it. Not
      # mounting the rest of /media/downloads is what keeps it off the home
      # qBittorrent and SABnzbd output.
      seedbox:
        type: nfs
        server: ${SECRET_STORAGE_SERVER:-localhost}
        path: /mnt/pool/media/downloads/seedbox
        globalMounts:
          - path: /media/downloads/seedbox
