---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cross-namespace-ingress
spec:
  description: "Allow ingress from gateway, downloads (arr apps)"
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
        - matchLabels:
            io.kubernetes.pod.namespace: downloads
    - fromEntities:
        - world
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-arrmcp-from-ai
spec:
  # Additive to the namespace-wide policy above (Cilium unions allows); arrmcp (ai namespace)
  # is a plain app-template workload, not a ToolHive server, so it needs its own rule.
  description: "Allow the arrmcp app (ai) to reach the media services"
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - sonarr
          - radarr
          - bazarr
          - plex
          - seerr
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: arrmcp
