---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autopulse-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: autopulse-secret
    template:
      engineVersion: v2
      # Design reasoning (Jellyfin-only target, no rewrite blocks, trigger auth) is in
      # docs/docs/apps/autopulse.md.
      data:
        config.yaml: |
          app:
            database_url: sqlite://data/autopulse.db
          auth:
            username: "{{ .username }}"
            password: "{{ .password }}"
          opts:
            check_path: true
          triggers:
            sonarr:
              type: sonarr
            radarr:
              type: radarr
          targets:
            jellyfin:
              type: jellyfin
              url: http://jellyfin.media.svc.cluster.local:8096
              token: "{{ .JELLYFIN_TOKEN }}"
  dataFrom:
    - extract:
        key: autopulse
