---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/imagecatalog_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: timescaledb
spec:
  images:
    # CNPG cannot parse a major version from this tag, so imageName is rejected; the catalog states it.
    # Timescale's HA image carries the TSL build (continuous aggregates); CNPG's timescaledb-oss does not.
    - major: 18
      image: timescale/timescaledb-ha:pg18.7-ts2.32.1@sha256:b24dd8779e7e73bd2d74de224955446434cdc30e48b2c54a4ae3f55e24ab1ce1
