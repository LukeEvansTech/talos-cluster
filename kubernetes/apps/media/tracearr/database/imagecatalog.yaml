    # CNPG cannot parse a major version from this tag, so imageName is rejected; the catalog states it.
    # Timescale's HA image carries the TSL build (continuous aggregates); CNPG's timescaledb-oss does not.
    - major: 18
      image: timescale/timescaledb-ha:pg18.7-ts2.32.1@sha256:cfde258edee845c7ad0879e87a20c28600d4b9a7599ec22884a5aa65493716cf
