---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr-postgres-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: tracearr-postgres-app
    template:
      metadata:
        labels:
          # CNPG applies a changed role password at once only when its Secret carries this label.
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: tracearr
        password: "{{ .TRACEARR_POSTGRES_PASS }}"
  dataFrom:
    - extract:
        key: tracearr
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracearr-postgres-s3
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: tracearr-postgres-s3
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .TRACEARR_CNPG_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .TRACEARR_CNPG_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: garage
