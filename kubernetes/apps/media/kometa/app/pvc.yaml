---
# Holds only the rebuildable MDBList/rating lookup cache, so it skips VolSync.
# Losing it costs a full re-fetch of every rating against the daily MDBList quota.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kometa-cache
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ceph-block
