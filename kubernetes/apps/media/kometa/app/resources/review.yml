---
# Owner-only review playlists: everything Kometa asked Radarr or Sonarr to add
# (tag "kometa") that arrived more than 30 days ago. Plex playlists belong to
# one account, and exclude_users keeps these off every shared user's account,
# unlike a collection, which anyone with library access can browse.
#
# There is deliberately no play-count filter: Kometa reads plays through the
# owner's account only, so it cannot tell whether anyone else watched a title.
# Tautulli's per-title history answers that. The per-source tags
# (kometa-top250, kometa-bestpicture, kometa-trending) in Radarr and Sonarr say
# which list added each title.
playlists:
  Kometa Adds - Movies:
    libraries: Movies
    exclude_users: all
    radarr_taglist: kometa
    filters:
      added.not: 30
    sync_mode: sync
    summary: Films Kometa added from the IMDb Top 250, Oscar Best Picture and TMDb Trending lists, more than 30 days ago.
  Kometa Adds - TV:
    libraries: TV
    exclude_users: all
    sonarr_taglist: kometa
    filters:
      added.not: 30
    sync_mode: sync
    summary: Shows Kometa added from the IMDb Top 250 and TMDb Trending lists, more than 30 days ago.
