---
# Radarr feed for TMDb Trending, kept apart from the Plex collection so it can
# be filtered. TMDb's weekly chart is worldwide and carried Indian releases
# every week (15 added in a month, none wanted). check_missing_filters applies
# TMDb filters such as original_language to missing items before the add.
# The rating floor keeps out direct-to-video releases.
collections:
  TMDb Trending Radarr Feed:
    tmdb_trending_weekly: 100
    build_collection: false
    sync_mode: append # Kometa requires append with build_collection: false
    filters:
      original_language.not: hi, ta, te, ml, kn, bn, mr, pa # codespell:ignore te
      tmdb_vote_average.gte: 6.5
      tmdb_vote_count.gte: 200
    radarr_add_missing: true
    radarr_search: true
    radarr_tag: kometa, kometa-trending
