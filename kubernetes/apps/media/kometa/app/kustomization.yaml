---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./pvc.yaml
configMapGenerator:
  - name: kometa-configmap
    namespace: media
    files:
      - config.yml=./resources/config.yml
      - review-movies.yml=./resources/review-movies.yml
      - review-tv.yml=./resources/review-tv.yml
generatorOptions:
  disableNameSuffixHash: true
