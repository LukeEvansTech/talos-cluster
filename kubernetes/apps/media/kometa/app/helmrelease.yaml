---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kometa
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kometa
  values:
    controllers:
      kometa:
        type: cronjob
        cronjob:
          ttlSecondsAfterFinished: 86400
          # Starts after MDBList's quota resets at midnight UTC; 02:00 also survives the
          # spring DST jump that a 01:00 schedule would skip (docs/docs/apps/kometa.md).
          schedule: "0 2 * * *"
          timeZone: &timeZone ${TIMEZONE}
          concurrencyPolicy: Forbid
          # A hung run under Forbid once blocked three nights of runs (docs/docs/apps/kometa.md).
          # This kills any run past 20h; a normal run takes about 4h.
          activeDeadlineSeconds: 72000
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app:
            image:
              repository: kometateam/kometa
              tag: v2.5.1@sha256:20388de48f0e088ad9feb9904f6a452fd9ef933a79c7b2bf186e388224e8f437
            command:
              - /bin/sh
              - -c
            args:
              - python3 kometa.py --run --read-only-config
            env:
              TZ: *timeZone
            envFrom:
              - secretRef:
                  name: kometa-secret
            resources:
              requests:
                cpu: 10m
                memory: 4Gi
              limits:
                memory: 8Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      # Each run is a fresh pod, so a ConfigMap edit needs no rollout to take effect.
      config:
        existingClaim: kometa-cache
        globalMounts:
          - path: /config
      config-file:
        type: configMap
        name: kometa-configmap
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml
            readOnly: true
      assets:
        type: emptyDir
        globalMounts:
          - path: /config/assets
      logs:
        type: emptyDir
        advancedMounts:
          kometa:
            app:
              - path: /config/logs
                subPath: logs
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
