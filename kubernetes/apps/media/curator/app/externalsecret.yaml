---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: curator
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: curator-secret
  data:
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: radarr
        property: RADARR_API_KEY
    # Play history is a hard dependency: without it a zero play count means
    # nothing, and the engine blocks rather than guessing.
    - secretKey: TAUTULLI_API_KEY
      remoteRef:
        key: tautulli
        property: TAUTULLI_API_KEY
    # The request system is the only positive evidence that a person asked for
    # a film. Optional, but without it every origin reads as unknown.
    - secretKey: SEERR_API_KEY
      remoteRef:
        key: seerr
        property: SEERR_API_KEY
