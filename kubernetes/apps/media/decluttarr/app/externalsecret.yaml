---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: decluttarr
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: decluttarr-secret
    template:
      data:
        config.yaml: |-
          general:
            test_run: false
            # private_tracker_handling defaults to remove; set it to skip or
            # obsolete_tag before the cluster qBittorrent carries private trackers.
          jobs:
            remove_bad_files: {}
            remove_failed_downloads: {}
            # Unambiguous junk only -- this job blocklists and re-searches on
            # first sight. "Confirm the match" cases moved to the daily
            # queue-triage agent, which manual imports them instead.
            remove_failed_imports:
              message_patterns:
                - Not a Custom Format upgrade for existing*
                - Not an upgrade for existing*
                - No files found are eligible for import*
                - "*Found potentially dangerous file with extension*"
                - Unable to parse file*
                - Invalid video file*
            remove_metadata_missing: {}
            remove_missing_files: {}
            # remove_orphans: off -- takes no max_strikes, and "unknown to the
            # arr" can be transiently true, so it culled live downloads.
            # remove_slow: off -- it strikes on progress between checks, and
            # with a deep SABnzbd queue, jobs that haven't started yet read as
            # 0 KB/s. It removed and blocklisted them, and the arrs re-grabbed
            # the same releases. remove_stalled still catches dead downloads.
            remove_stalled: {}
            remove_unmonitored: {}
          instances:
            radarr:
              - base_url: http://radarr.media.svc.cluster.local
                api_key: {{ .RADARR_API_KEY }}
            sonarr:
              - base_url: http://sonarr.media.svc.cluster.local
                api_key: {{ .SONARR_API_KEY }}
          # Without these, remove_bad_files is a no-op and the Keep tag does
          # nothing; both read the torrent client directly.
          download_clients:
            qbittorrent:
              - base_url: http://qbittorrent-app.downloads.svc.cluster.local
                username: "{{ .QBT_USERNAME }}"
                password: "{{ .QBT_PASSWORD }}"
            sabnzbd:
              - base_url: http://sabnzbd-app.downloads.svc.cluster.local
                api_key: "{{ .SABNZBD_API_KEY }}"
  data:
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: radarr
        property: RADARR_API_KEY
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: sonarr
        property: SONARR_API_KEY
    - secretKey: SABNZBD_API_KEY
      remoteRef:
        key: sabnzbd
        property: SABNZBD_API_KEY
    # Generically labelled fields, so pulled by property rather than extract.
    - secretKey: QBT_USERNAME
      remoteRef:
        key: qbittorrent
        property: username
    - secretKey: QBT_PASSWORD
      remoteRef:
        key: qbittorrent
        property: password
