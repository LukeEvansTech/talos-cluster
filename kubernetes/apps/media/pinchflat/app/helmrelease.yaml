---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pinchflat
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: pinchflat
  values:
    controllers:
      pinchflat:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: any-nvidia-gpu
        initContainers:
          # The fork's yt-dlp updater rewrites its binary in place; this gives it a writable copy.
          yt-dlp:
            image:
              repository: ghcr.io/thebadfella/pinchflat-ngx
              tag: 2026.11.2@sha256:21ddc10736bd96408f3b64d864faea29dbaf3e8a71e43478c8afdd57292e67df
            command:
              - "sh"
              - "-c"
              - "cp /usr/local/bin/yt-dlp /yt-dlp-bin/yt-dlp && chmod 0755 /yt-dlp-bin/yt-dlp"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/thebadfella/pinchflat-ngx
              tag: 2026.11.2@sha256:21ddc10736bd96408f3b64d864faea29dbaf3e8a71e43478c8afdd57292e67df
            env:
              PATH: /yt-dlp-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              TZ: ${TIMEZONE}
              TZ_DATA_PATH: /tmp/elixir_tz_data
              PORT: &port 80
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
              claims:
                - name: gpu
    defaultPodOptions:
      labels:
        gpu-workload: "true"
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: In
                    values:
                      - "true"
        podAntiAffinity:
          # Avoids the GPU running the inference model (~21/23 GiB used, no VRAM isolation
          # under time-slicing). Preferred, not required, or 3 nodes with no worker pool
          # would wedge pods Pending on a drain. `namespaces: [ai]` matters: pod affinity is
          # namespace-scoped and the model runs there.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                namespaces:
                  - "ai"
                labelSelector:
                  matchLabels:
                    llm-gpu-model: "true"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              gpu-workload: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 44
    service:
      app:
        controller: pinchflat
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      yt-dlp:
        type: emptyDir
        globalMounts:
          - path: /etc/yt-dlp
      yt-dlp-bin:
        type: emptyDir
        advancedMounts:
          pinchflat:
            yt-dlp:
              - path: /yt-dlp-bin
            app:
              - path: /yt-dlp-bin
      media:
        type: nfs
        server: ${SECRET_STORAGE_SERVER:-localhost}
        path: /mnt/pool/media
        globalMounts:
          - path: /downloads
            subPath: downloads/youtube
      tmp:
        type: emptyDir
