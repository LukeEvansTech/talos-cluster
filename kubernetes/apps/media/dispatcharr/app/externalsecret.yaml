---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dispatcharr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dispatcharr-secret
    template:
      engineVersion: v2
      data:
        # Dragonfly enforces auth. dispatcharr builds its Celery broker from
        # REDIS_* (REDIS_PASSWORD), and also honours CELERY_BROKER_URL if set —
        # provide both, authenticated, so neither code path connects password-less.
        REDIS_PASSWORD: "{{ .DRAGONFLY_PASSWORD }}"
        # Own Dragonfly db: prowler's worker consumes the default `celery` queue
        # on db 0 and was silently eating dispatcharr's EPG/M3U refresh tasks
        # (KeyError on the task name, refresh reported success but never ran).
        # CELERY_RESULT_BACKEND defaults to this URL, so both move together.
        CELERY_BROKER_URL: "redis://default:{{ .DRAGONFLY_PASSWORD }}@dragonfly.database.svc.cluster.local:6379/3"
        # WireGuard creds + exit location come from the per-app
        # `gluetun-dispatcharr` 1Password item (its own AirVPN device key /
        # internal IP, SERVER_COUNTRIES=United Kingdom). One device key per
        # gluetun pod: AirVPN keys are single-connection, so sharing one with
        # another app flaps both tunnels.
        VPN_SERVICE_PROVIDER: "{{ .VPN_SERVICE_PROVIDER }}"
        WIREGUARD_PRIVATE_KEY: "{{ .WIREGUARD_PRIVATE_KEY }}"
        WIREGUARD_PRESHARED_KEY: "{{ .WIREGUARD_PRESHARED_KEY }}"
        WIREGUARD_ADDRESSES: "{{ .WIREGUARD_ADDRESSES }}"
        SERVER_COUNTRIES: "{{ .SERVER_COUNTRIES }}"
  dataFrom:
    - extract:
        key: dragonfly
    - extract:
        key: gluetun-dispatcharr
