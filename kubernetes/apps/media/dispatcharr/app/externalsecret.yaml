---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dispatcharr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dispatcharr-secret
    template:
      engineVersion: v2
      data:
        # Dragonfly enforces auth; dispatcharr builds its broker from REDIS_* but also honours
        # CELERY_BROKER_URL, so both are provided authenticated.
        REDIS_PASSWORD: "{{ .DRAGONFLY_PASSWORD }}"
        # Same db as REDIS_DB in the HelmRelease; that variable is what isolates the queue from
        # prowler (this URL alone wouldn't, since uwsgi's attach-daemon workers never see it).
        CELERY_BROKER_URL: "redis://default:{{ .DRAGONFLY_PASSWORD }}@dragonfly.database.svc.cluster.local:6379/3"
        # One device key per gluetun pod: AirVPN keys are single-connection, so sharing one with
        # another app flaps both tunnels.
        VPN_SERVICE_PROVIDER: "{{ .VPN_SERVICE_PROVIDER }}"
        WIREGUARD_PRIVATE_KEY: "{{ .WIREGUARD_PRIVATE_KEY }}"
        WIREGUARD_PRESHARED_KEY: "{{ .WIREGUARD_PRESHARED_KEY }}"
        WIREGUARD_ADDRESSES: "{{ .WIREGUARD_ADDRESSES }}"
        SERVER_COUNTRIES: "{{ .SERVER_COUNTRIES }}"
  dataFrom:
    - extract:
        key: dragonfly
    - extract:
        key: gluetun-dispatcharr
