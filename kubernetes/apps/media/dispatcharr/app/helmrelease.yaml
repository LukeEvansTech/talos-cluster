---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dispatcharr
spec:
  interval: 1h
  # Gluetun's tunnel handshake lands inside the install/upgrade window, so the
  # helm 5m default can expire mid-connect and start a rollback/upgrade thrash.
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: dispatcharr
  values:
    controllers:
      dispatcharr:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          chown-dbdir:
            image:
              repository: docker.io/library/alpine
              tag: 3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
            command:
              - /bin/sh
              - -c
            args:
              - |
                mkdir -p /data/db && chmod 0750 /data/db
            securityContext:
              runAsUser: 0
          # Native sidecar (restartPolicy: Always): starts before the app
          # container, so every playlist fetch, EPG refresh and stream pull
          # leaves through the tunnel from the first byte. Cluster and LAN
          # traffic (Dragonfly, the gateway, Plex/Jellyfin pulling streams)
          # stays off the tunnel via FIREWALL_OUTBOUND_SUBNETS below. Shape
          # copied from downloads/prowlarr — see that file for the full
          # rationale behind the settings repeated here.
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            env:
              # DNS_KEEP_NAMESERVER below leaves resolution with CoreDNS, so
              # gluetun's own resolver is never in the path and its blocklist
              # would be ~300MB of RAM for nothing.
              # https://github.com/qdm12/gluetun/issues/2054
              BLOCK_MALICIOUS: off
              DOT: "on"
              DOT_CACHING: "on"
              DOT_IPV6: off
              # Required for cluster-service resolution — without it dispatcharr
              # cannot resolve dragonfly.database.svc.cluster.local. The
              # trade-off is that provider hostname lookups go to CoreDNS (and
              # upstream) rather than through the tunnel; the streams themselves
              # are still tunnelled.
              DNS_KEEP_NAMESERVER: "on"
              FIREWALL: true
              FIREWALL_DEBUG: on
              # dispatcharr (9191), gluetun-webui (3000), health server (9999)
              FIREWALL_INPUT_PORTS: 9191,3000,9999
              FIREWALL_OUTBOUND_SUBNETS: '"${CLUSTER_PODS_CIDR},${CLUSTER_SVCS_CIDR},${CR_LAN_CIDR},${GH_LAN_CIDR}"'
              HEALTH_SERVER_ADDRESS: ":9999"
              # `off` means "do not disable the loop". Both kubelet probes
              # below are disabled, so this in-process health check is the
              # only thing left that notices a degraded tunnel and
              # reconnects it. Flipping this to `on` leaves no recovery
              # path at all — the tunnel stays down, and with it every
              # stream, until the pod is recreated by hand.
              HEALTH_SERVER_DISABLE_LOOP: off
              HEALTH_VPN_DURATION_INITIAL: 60s
              LOG_LEVEL: info
              # Run as root (0) rather than gluetun's default 1000: gluetun
              # chowns its public-IP status file to PUID:PGID after every
              # write, which needs CAP_CHOWN, and this container drops ALL
              # capabilities. Chowning to the file's existing owner is a
              # permitted no-op instead.
              PGID: 0
              # gluetun only accepts "ipinfo" or "ip2location"; ipinfo
              # rate-limits (HTTP 429) on its free tier.
              PUBLICIP_API: ip2location
              PUID: 0 # see PGID above
              TZ: ${TIMEZONE}
              UPDATER_PERIOD: 12h
              VERSION_INFORMATION: off
              VPN_INTERFACE: wg0
              VPN_IPV6_SERVER: off
              VPN_TYPE: wireguard
            # WireGuard creds + exit location come from the per-app
            # `gluetun-dispatcharr` 1Password item (its own AirVPN device key /
            # internal IP, SERVER_COUNTRIES=United Kingdom).
            envFrom:
              - secretRef:
                  name: dispatcharr-secret
            # Both kubelet probes stay disabled, matching every other gluetun
            # sidecar here. A probe restarts the *container* but the pod netns
            # survives, so gluetun re-appends its firewall rules on each start
            # and one transient failure becomes a self-sustaining restart loop
            # (imgur-proxy sat in exactly that for 4+ days / 1352 restarts).
            # HEALTH_SERVER_DISABLE_LOOP keeps gluetun's in-process tunnel
            # restart, which recovers the same faults without touching the netns.
            probes:
              # Liveness stays OFF. It restarts the *container*, but the pod
              # netns survives and gluetun re-appends its firewall rules on
              # every start, so one transient failure compounds into a
              # self-sustaining loop. The health loop above recovers the same
              # faults in-process instead.
              liveness:
                enabled: false
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  timeoutSeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              # Startup, by contrast, is ON and load-bearing. Kubernetes gates
              # the app container on a sidecar's startup probe, and gluetun's
              # health server only answers 200 once the tunnel and firewall are
              # actually up. Without it "started" means merely "the process is
              # running", so dispatcharr could fetch a playlist over the pod's
              # default route before the kill switch existed — the exact leak
              # this app is meant to prevent. 5m of headroom before it gives up.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  failureThreshold: 30
            restartPolicy: Always
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
              capabilities:
                add:
                  - NET_ADMIN
                drop:
                  - ALL
              allowPrivilegeEscalation: false
            resources:
              limits:
                # No memory limit: gluetun's startup spike lands inside one
                # scrape interval and cannot be sized from metrics, and a limit
                # turns it into an OOMKill loop. Matches prowlarr/qbittorrent.
                kernel.org/tun: 1
        containers:
          app:
            image:
              repository: ghcr.io/dispatcharr/dispatcharr
              tag: 0.30.0@sha256:0ba8e97c2a711f3df757f65d21e9fc36f871ff3198f59b68e5987fa7e529d8a6
            env:
              TZ: ${TIMEZONE}
              DISPATCHARR_ENV: aio
              DISPATCHARR_LOG_LEVEL: info
              DISPATCHARR_PORT: &port 9191
              # 0.29.0's get_client_ip trusts the RFC1918 ranges by default, so
              # behind envoy every client resolved to the proxy pod IP (shared
              # login-throttle bucket). Trust only the pod CIDR so the XFF walk
              # stops at the real LAN client.
              DISPATCHARR_TRUSTED_PROXIES: ${CLUSTER_PODS_CIDR}
              REDIS_HOST: dragonfly.database.svc.cluster.local
            envFrom:
              - secretRef:
                  name: dispatcharr-secret
            resources:
              requests:
                cpu: 50m
                memory: 1Gi
                nvidia.com/gpu: 1
              limits:
                memory: 3Gi
                nvidia.com/gpu: 1
          gluetun-webui:
            dependsOn: app
            image:
              repository: docker.io/scuzza/gluetun-webui
              tag: latest@sha256:a7c2b4c77f26bb690debe6879cd7149d69710578b13e0dcdc08f6b9b6c7a7a14
            env:
              GLUETUN_CONTROL_URL: http://localhost:8000
              PORT: &gluetun-webui-port 3000
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *gluetun-webui-port
                  periodSeconds: 60
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *gluetun-webui-port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *gluetun-webui-port
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 50Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      labels:
        gpu-workload: "true"
        gluetun: "true"
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: In
                    values:
                      - "true"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              gpu-workload: "true"
    service:
      app:
        controller: dispatcharr
        ports:
          http:
            port: *port
      gluetun-webui:
        controller: dispatcharr
        ports:
          http:
            port: *gluetun-webui-port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            # 0.29.0 prefers a client-supplied X-Real-IP over the XFF walk for
            # throttling/ACLs/audit, and nothing on the uwsgi path strips it —
            # drop it at the gateway so clients cannot spoof their identity.
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - "X-Real-IP"
      gluetun-webui:
        hostnames:
          - "{{ .Release.Name }}-gluetun.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: gluetun-webui
                port: *gluetun-webui-port
    persistence:
      config:
        existingClaim: *app
        advancedMounts:
          dispatcharr:
            app:
              - path: /data
                subPath: data
            chown-dbdir:
              - path: /data
                subPath: data
      tmp:
        type: emptyDir
        advancedMounts:
          dispatcharr:
            app:
              - path: /tmp
                subPath: tmp
      # gluetun creates its status directory with os.MkdirAll("/tmp/gluetun",
      # 0644) — a directory with no execute bit, untraversable without
      # CAP_DAC_OVERRIDE. Pre-creating it as an emptyDir (mode 1777) makes that
      # MkdirAll a no-op, so the public-IP file stays writable with all
      # capabilities dropped. Paired with PUID/PGID 0 above.
      gluetun-tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Mi
        advancedMounts:
          dispatcharr:
            gluetun:
              - path: /tmp/gluetun
