---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dispatcharr
spec:
  interval: 1h
  # Gluetun's tunnel handshake lands inside the install/upgrade window, so the
  # helm 5m default can expire mid-connect and start a rollback/upgrade thrash.
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: dispatcharr
  values:
    controllers:
      dispatcharr:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          chown-dbdir:
            image:
              repository: docker.io/library/alpine
              tag: 3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
            command:
              - /bin/sh
              - -c
            args:
              - |
                mkdir -p /data/db && chmod 0750 /data/db
            securityContext:
              runAsUser: 0
          # Native sidecar (restartPolicy: Always), so every playlist fetch, EPG refresh and
          # stream pull leaves through the tunnel from the first byte. The kill-switch approach is
          # copied from downloads/prowlarr; the probe and recovery settings below differ on purpose
          # (docs/docs/apps/dispatcharr.md).
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            env:
              # Off to skip the ~300MB blocklist (qdm12/gluetun#2054).
              BLOCK_MALICIOUS: off
              DOT: "on"
              DOT_CACHING: "on"
              DOT_IPV6: off
              # Off, so gluetun owns resolv.conf and every lookup goes out its DoT resolver inside
              # the tunnel (docs/docs/apps/dispatcharr.md has why). Costs .cluster.local
              # resolution; dragonfly is pinned via hostAliases below.
              DNS_KEEP_NAMESERVER: off
              FIREWALL: true
              FIREWALL_DEBUG: on
              # dispatcharr (9191), gluetun-webui (3000), health server (9999)
              FIREWALL_INPUT_PORTS: 9191,3000,9999
              FIREWALL_OUTBOUND_SUBNETS: '"${CLUSTER_PODS_CIDR},${CLUSTER_SVCS_CIDR},${CR_LAN_CIDR},${GH_LAN_CIDR}"'
              HEALTH_SERVER_ADDRESS: ":9999"
              # `off` means don't disable the loop: with liveness disabled (KB-042), this is the
              # only thing left reconnecting a degraded tunnel; `on` leaves no recovery path.
              HEALTH_SERVER_DISABLE_LOOP: off
              HEALTH_VPN_DURATION_INITIAL: 60s
              LOG_LEVEL: info
              # Root (0), not gluetun's default 1000: it chowns its public-IP status file to
              # PUID:PGID after every write (needs CAP_CHOWN), and this container drops ALL.
              # Chowning to the existing owner is a permitted no-op instead.
              PGID: 0
              # gluetun only accepts "ipinfo" or "ip2location"; ipinfo
              # rate-limits (HTTP 429) on its free tier.
              PUBLICIP_API: ip2location
              PUID: 0 # see PGID above
              TZ: ${TIMEZONE}
              UPDATER_PERIOD: 12h
              VERSION_INFORMATION: off
              VPN_INTERFACE: wg0
              VPN_IPV6_SERVER: off
              VPN_TYPE: wireguard
            # WireGuard creds + exit location come from the per-app `gluetun-dispatcharr`
            # 1Password item (its own VPN-provider device key, SERVER_COUNTRIES=United Kingdom).
            envFrom:
              - secretRef:
                  name: dispatcharr-secret
            probes:
              # Liveness stays disabled, matching every other gluetun sidecar here: a probe
              # restarts the container while the pod netns survives, which self-sustains a restart
              # loop (KB-042). HEALTH_SERVER_DISABLE_LOOP off recovers the same faults in-process
              # instead. Startup stays enabled below, deliberately; it gates the app container.
              liveness:
                enabled: false
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  timeoutSeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              # Startup, by contrast, is ON and load-bearing: it gates the app container on this
              # sidecar until gluetun's health server answers 200, tunnel and firewall up, so
              # nothing can fetch before the kill switch exists (5m headroom before giving up).
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  failureThreshold: 30
            restartPolicy: Always
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
              capabilities:
                add:
                  - NET_ADMIN
                drop:
                  - ALL
              allowPrivilegeEscalation: false
            resources:
              limits:
                # No memory limit: the startup spike is faster than one scrape interval, so it can't
                # be sized from metrics, and a limit turns it into an OOMKill loop.
                kernel.org/tun: 1
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: any-nvidia-gpu
        containers:
          app:
            image:
              repository: ghcr.io/dispatcharr/dispatcharr
              tag: 0.31.0@sha256:09162065cac2b9ac2b16214d55fe792f6953eb5a5d009bbdfa48ce26128eb040
            env:
              TZ: ${TIMEZONE}
              DISPATCHARR_ENV: aio
              DISPATCHARR_LOG_LEVEL: info
              DISPATCHARR_PORT: &port 9191
              # 0.29.0's get_client_ip trusts RFC1918 by default, so behind envoy every client
              # resolved to the proxy pod IP (shared login-throttle bucket). Trust only the pod
              # CIDR so the XFF walk stops at the real client.
              DISPATCHARR_TRUSTED_PROXIES: ${CLUSTER_PODS_CIDR}
              REDIS_HOST: dragonfly.database.svc.cluster.local
              # Own Dragonfly db, isolating Celery from prowler's worker on db 0 (was consuming and
              # discarding dispatcharr's tasks). REDIS_DB is the lever: uwsgi's attach-daemon
              # workers don't inherit CELERY_BROKER_URL (docs/docs/apps/dispatcharr.md).
              REDIS_DB: "3"
            envFrom:
              - secretRef:
                  name: dispatcharr-secret
            resources:
              requests:
                cpu: 50m
                memory: 1Gi
              limits:
                memory: 3Gi
              claims:
                - name: gpu
          gluetun-webui:
            dependsOn: app
            image:
              repository: docker.io/scuzza/gluetun-webui
              tag: latest@sha256:a7c2b4c77f26bb690debe6879cd7149d69710578b13e0dcdc08f6b9b6c7a7a14
            env:
              GLUETUN_CONTROL_URL: http://localhost:8000
              PORT: &gluetun-webui-port 3000
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *gluetun-webui-port
                  periodSeconds: 60
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *gluetun-webui-port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *gluetun-webui-port
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 50Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      # gluetun owns resolv.conf, so cluster DNS isn't available here; dragonfly is the only
      # in-cluster dependency, pinned by ClusterIP so REDIS_HOST/CELERY_BROKER_URL keep resolving.
      # Update if the dragonfly Service is recreated: kubectl -n database get svc dragonfly
      hostAliases:
        - ip: 10.43.92.110
          hostnames:
            - dragonfly.database.svc.cluster.local
            - dragonfly.database.svc
      labels:
        gpu-workload: "true"
        gluetun: "true"
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: In
                    values:
                      - "true"
        podAntiAffinity:
          # Keeps transcoders off the card holding the inference model (~21 of 23 GiB, no VRAM
          # isolation from time-slicing). Preferred not required, or a hard rule wedges these
          # Pending whenever one of the three nodes drains. `namespaces` is required: affinity is
          # namespace-scoped by default and the model runs in `ai`, not this app's namespace.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                namespaces:
                  - "ai"
                labelSelector:
                  matchLabels:
                    llm-gpu-model: "true"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              gpu-workload: "true"
    service:
      app:
        controller: dispatcharr
        ports:
          http:
            port: *port
      gluetun-webui:
        controller: dispatcharr
        ports:
          http:
            port: *gluetun-webui-port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            # 0.29.0 prefers a client-supplied X-Real-IP over the XFF walk, and nothing on the
            # uwsgi path strips it; drop it at the gateway so clients can't spoof their identity.
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove:
                    - "X-Real-IP"
      gluetun-webui:
        hostnames:
          - "{{ .Release.Name }}-gluetun.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: gluetun-webui
                port: *gluetun-webui-port
    persistence:
      config:
        existingClaim: *app
        advancedMounts:
          dispatcharr:
            app:
              - path: /data
                subPath: data
            chown-dbdir:
              - path: /data
                subPath: data
      tmp:
        type: emptyDir
        advancedMounts:
          dispatcharr:
            app:
              - path: /tmp
                subPath: tmp
      # gluetun creates its status dir with MkdirAll(0644), no execute bit, untraversable without
      # CAP_DAC_OVERRIDE. Pre-creating it as an emptyDir (1777) makes that a no-op, so the
      # public-IP file stays writable with all capabilities dropped (paired with PUID/PGID 0 above).
      gluetun-tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Mi
        advancedMounts:
          dispatcharr:
            gluetun:
              - path: /tmp/gluetun
