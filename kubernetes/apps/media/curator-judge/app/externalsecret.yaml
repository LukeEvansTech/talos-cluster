---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: curator-judge
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: curator-judge-secret
  data:
    # Generated with `claude setup-token`. The estate already uses this shape
    # for the Renovate reviewer Action; see the "Claude Code OAuth Token"
    # items in the Talos vault. One-year lifetime and NOT refreshable, so the
    # item carries an expiry date for Watchtower to flag.
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: claude-code-curator
        property: credential
    # execute re-validates every protection against live Radarr immediately
    # before each deletion, so it needs the same credentials the plan did.
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: radarr
        property: RADARR_API_KEY
    - secretKey: TAUTULLI_API_KEY
      remoteRef:
        key: tautulli
        property: TAUTULLI_API_KEY
    - secretKey: SEERR_API_KEY
      remoteRef:
        key: seerr
        property: SEERR_API_KEY
    - secretKey: TRIAGE_WEBHOOK_TOKEN
      remoteRef:
        key: chaski
        property: TRIAGE_WEBHOOK_TOKEN
