---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: curator-judge
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: curator-judge
  values:
    controllers:
      # Reads the plan the curator job left on the volume, asks Claude which of
      # the candidates are worth keeping, and applies the answer.
      #
      # The judge is the least trusted part of this: it runs with every tool
      # denied, and execute independently re-checks every protection against
      # live Radarr and refuses any id the plan did not offer. A wrong -- or
      # hostile -- answer can only choose badly among films the engine had
      # already cleared. It cannot reach anything else.
      curator-judge:
        type: cronjob
        cronjob:
          # Half an hour after curator, which needs a couple of minutes cold.
          schedule: "30 8 * * 6"
          timeZone: "${TIMEZONE}"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          backoffLimit: 1
          activeDeadlineSeconds: 3600
        pod:
          automountServiceAccountToken: false
        initContainers:
          # Installs the CLI at start-up because Anthropic publishes no public
          # container image. Pinned, so the version is visible in git and
          # Renovate can see it move.
          judge:
            image:
              repository: docker.io/library/node
              tag: 24-alpine@sha256:50c8e8ca1d27439048670df5883f32d57cf81cff6233222c893fd0d9884cbd81
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                apk add --no-cache jq >/dev/null
                npm install -g --silent "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
                exec /bin/sh /prompt/judge.sh
            env:
              CLAUDE_CODE_VERSION: "2.1.269"
              JUDGE_MODEL: claude-opus-5
              # claude writes its own state; give it somewhere writable that is
              # thrown away with the pod.
              HOME: /tmp/claude-home
              npm_config_cache: /tmp/npm
            envFrom:
              - secretRef:
                  name: curator-judge-secret
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          # Validates the recommendations against the plan's candidate set,
          # re-checks every protection live, and applies the deletions the
          # engine still agrees with. In dry-run it stops short of the call and
          # records nothing as completed.
          app:
            image:
              repository: docker.io/library/python
              tag: 3.14-alpine@sha256:c6ead215bfd31f1e433d968853b7a769989117115b728874824e6c0a27cb96fc
            command:
              - python3
              - -m
              - curator
              - execute
              - --plan
              - /state/cleanup-plan/plan.json
              - --recommendations
              - /state/cleanup-plan/recommendations.json
              - --out
              - /state/cleanup-plan/result.json
            env:
              PYTHONPATH: /app
              PYTHONDONTWRITEBYTECODE: "1"
              PYTHONUNBUFFERED: "1"
              TZ: "${TIMEZONE}"
              RADARR_URL: http://radarr.media.svc.cluster.local
              TAUTULLI_URL: http://tautulli.media.svc.cluster.local
              SEERR_URL: http://seerr.media.svc.cluster.local
              LEDGER_DIR: /state/ledger
              CLEANUP_SCOPE_START: "2026-03-01"
              # Flip to "act" only after reading a dry run you believe. In
              # dry-run every protection is still re-checked and the intent is
              # still recorded -- it stops immediately before the DELETE.
              CLEANUP_MODE: dry-run
            envFrom:
              - secretRef:
                  name: curator-judge-secret
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      prompt:
        type: configMap
        name: curator-judge-prompt
        defaultMode: 0555
        globalMounts:
          - path: /prompt
            readOnly: true
      # Owned by the curator app; mounted here to run execute.
      code:
        type: configMap
        name: curator-code
        globalMounts:
          - path: /app/curator
            readOnly: true
      state:
        existingClaim: curator
        globalMounts:
          - path: /state
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
