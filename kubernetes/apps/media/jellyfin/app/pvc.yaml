---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: ceph-block
---
# Trickplay tiles are regenerable (about 10 days of GPU time for the library), so they sit outside VolSync.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-trickplay
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 250Gi
  storageClassName: ceph-block
