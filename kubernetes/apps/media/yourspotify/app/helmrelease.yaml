---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yourspotify
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: yourspotify
  # A throttled server can stay unready for hours; waiting on it would time out and roll back.
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    controllers:
      server:
        # The imports PVC is RWO.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/yooooomi/your_spotify_server
              tag: 1.20.0@sha256:624ea009f2ef9d877989bee9c7913ac66840449f566517871696c31a8ea13ddf
            env:
              TZ: ${TIMEZONE}
              API_ENDPOINT: https://yourspotify-api.${SECRET_DOMAIN}
              CLIENT_ENDPOINT: https://yourspotify.${SECRET_DOMAIN}
              MONGO_ENDPOINT: mongodb://yourspotify-mongodb:27017/your_spotify
              # A full-history import exhausted the default ~256MB V8 heap and crash-looped the server.
              NODE_OPTIONS: --max-old-space-size=768
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            # No liveness or startup probe: a throttled server waits silently, even at startup, and a
            # restart re-arms the throttle. See docs/docs/apps/yourspotify.md.
            probes:
              liveness:
                enabled: false
              startup:
                enabled: false
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &serverPort 8080
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
      web:
        pod:
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
        containers:
          app:
            image:
              repository: ghcr.io/yooooomi/your_spotify_client
              tag: 1.20.0@sha256:e4da90a0634c7862f9f4e893026ee8cd91380234fa2125b88b26c6fb9da3d47e
            env:
              API_ENDPOINT: https://yourspotify-api.${SECRET_DOMAIN}
            probes:
              liveness: &webProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &webPort 3000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *webProbes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
      mongodb:
        pod:
          securityContext:
            runAsNonRoot: false
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
        containers:
          app:
            image:
              repository: docker.io/library/mongo
              tag: 9.0.4@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058
            # 9.0's 1 GB minimum per-query cap exceeds the 512Mi limit, so a runaway query would OOM-kill the pod.
            # 9.0-only parameter that 8.0 refuses at startup: drop these args when reverting to 8.0.
            args:
              - --setParameter
              - internalQueryMaxMemoryUsageBytesPerOperation=134217728
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      server:
        controller: server
        ports:
          http:
            port: *serverPort
      web:
        controller: web
        ports:
          http:
            port: *webPort
      mongodb:
        controller: mongodb
        ports:
          mongodb:
            port: 27017
    route:
      api:
        hostnames:
          - "{{ .Release.Name }}-api.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}-server"
                port: *serverPort
      web:
        # gethomepage.dev/app is pinned to yourspotify; the route itself is named yourspotify-web.
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/app: yourspotify
          gethomepage.dev/name: YourSpotify
          gethomepage.dev/group: Media
          gethomepage.dev/icon: /icons/dracula/yourspotify.svg
          gethomepage.dev/description: Spotify stats
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}-web"
                port: *webPort
    persistence:
      mongo-data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          mongodb:
            app:
              - path: /data/db
      # Uploaded history files must survive a restart, or a stalled import cannot be retried.
      imports:
        # The default name is the release name, which is already the MongoDB data PVC.
        forceRename: "{{ .Release.Name }}-imports"
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        storageClass: ceph-block
        advancedMounts:
          server:
            app:
              - path: /tmp/imports
      tmpfs:
        type: emptyDir
        advancedMounts:
          server:
            app:
              - path: /tmp
                subPath: server-tmp
