---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: curatorjudge
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: curatorjudge
  values:
    controllers:
      # Reads the plan the curator job left on the volume, asks Claude which of
      # the candidates are worth keeping, and applies the answer.
      #
      # Three steps, because the judge is the least trusted part of this and is
      # kept as small as possible: build the prompt, ask, act. Only the middle
      # step talks to Claude, and it holds no credential except the OAuth token.
      # The executor independently re-checks every protection against live
      # Radarr and refuses any id the plan did not offer, so a wrong -- or
      # hostile -- answer can only choose badly among films already cleared.
      curatorjudge:
        type: cronjob
        cronjob:
          # Half an hour after curator, which needs a couple of minutes cold.
          schedule: "30 8 * * 6"
          timeZone: "${TIMEZONE}"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
          # Never retry. This pipeline ends in DELETEs, and a retry would
          # re-run judgement and execution against the same plan. Anything
          # ambiguous is left for the next scheduled run, which reconciles it
          # by looking at live state rather than by repeating the call.
          backoffLimit: 0
          activeDeadlineSeconds: 3600
        pod:
          automountServiceAccountToken: false
        initContainers:
          # 1. Plan -> prompt. Refuses a stale plan, one the engine blocked, or
          #    one with nothing to judge, and leaves a marker the next steps
          #    honour rather than paying for a judgement that would be rejected.
          prompt:
            image: &python
              repository: docker.io/library/python
              tag: 3.14-alpine@sha256:9e9fde4d32eedce0b661d9ab91e826b62dddf28e928c230ec55f1866cac66b01
            command:
              - python3
              - /prompt/build_prompt.py
            env: &pythonEnv
              PYTHONDONTWRITEBYTECODE: "1"
              PYTHONUNBUFFERED: "1"
              TZ: "${TIMEZONE}"
            resources: &small
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext: &hardened
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          # 2. Ask Claude. Anthropic publishes no public image, so the CLI is
          #    installed at start-up -- into a writable prefix under /tmp,
          #    because the root filesystem is read-only and this runs as a
          #    non-root user. The version is pinned so it is visible in git.
          judge:
            # The chart topologically sorts initContainers and falls back to key
            # order, which is alphabetical -- so without this, `judge` ran first
            # and read a prompt file that did not exist yet, every time.
            dependsOn: prompt
            image:
              repository: docker.io/library/node
              tag: 24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
            command:
              - /bin/sh
              - -c
              # $${VAR} survives Flux postBuild substitution; a bare ${VAR}
              # would be replaced with an empty string before the pod ever runs.
              - |
                set -u
                if [ -f /work/skip ]; then
                  echo "skipping: $$(cat /work/skip)"
                  exit 0
                fi
                # A judgement this step cannot obtain is recorded and reported,
                # not allowed to kill the pod before the digest is sent. The run
                # deletes nothing, so the week's report is worth more than the
                # judgement it is missing.
                fail() {
                  echo "$$1" >&2
                  printf '%s' "$$1" > /work/judge-failed
                  exit 0
                }
                npm install -g --silent --prefix /tmp/npm \
                  "@anthropic-ai/claude-code@$${CLAUDE_CODE_VERSION}" \
                  || fail "could not install the CLI"
                # One turn, every tool denied. This is a single structured
                # judgement, not an agent: it has no business reaching a
                # filesystem or a network.
                /tmp/npm/bin/claude -p \
                  --output-format json \
                  --max-turns 1 \
                  --model "$${JUDGE_MODEL}" \
                  --disallowed-tools "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Task,NotebookEdit" \
                  < /work/prompt.txt > /work/claude.json \
                  || fail "claude -p exited non-zero"
            env:
              CLAUDE_CODE_VERSION: "2.1.269"
              JUDGE_MODEL: claude-opus-5
              # The CLI writes its own state; both must be writable and both
              # live on the emptyDir that dies with the pod.
              HOME: /tmp/claude-home
              npm_config_cache: /tmp/npm-cache
              TZ: "${TIMEZONE}"
            envFrom:
              - secretRef:
                  name: curatorjudge-token
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext: *hardened
        containers:
          # 3. Validate the answer, apply what the engine still agrees with,
          #    then send the digest. Exits non-zero if any step failed, so the
          #    Job surfaces it rather than reporting success.
          app:
            image: *python
            command:
              - /bin/sh
              - -c
              - |
                set -u
                rc=0
                keep() { [ "$$rc" -eq 0 ] && rc="$$1"; return 0; }

                python3 /prompt/read_verdicts.py || keep $$?
                python3 -m curator execute \
                  --plan /state/cleanup-plan/plan.json \
                  --recommendations /state/cleanup-plan/recommendations.json \
                  --out /state/cleanup-plan/result.json \
                  --read-only || keep $$?
                # The digest is the entire output of a read-only run, so it goes
                # out whatever the steps above did. Its own failure earns a red
                # Job: an undelivered digest is indistinguishable, from the
                # phone, from a week in which nothing ran at all.
                python3 -m curator report \
                  --plan /state/cleanup-plan/plan.json \
                  --result /state/cleanup-plan/result.json \
                  --judgement /state/cleanup-plan/judgement.json \
                  --out /state/cleanup-plan/report.md || keep $$?
                exit "$$rc"
            env:
              <<: *pythonEnv
              PYTHONPATH: /app
              RADARR_URL: http://radarr.media.svc.cluster.local
              TAUTULLI_URL: http://tautulli.media.svc.cluster.local
              SEERR_URL: http://seerr.media.svc.cluster.local
              LEDGER_DIR: /state/ledger
              CLEANUP_SCOPE_START: "2026-03-01"
              # Must match the curator job's mode: the ledger namespaces
              # dry-run state separately, and execute refuses a plan made in
              # the other mode rather than mixing the two.
              #
              # Scheduled runs are read-only, and --read-only on the command
              # above enforces that independently: flipping this alone makes
              # execute refuse rather than delete. Acting on a schedule is
              # therefore two deliberate edits, not one word.
              CLEANUP_MODE: dry-run
              # Fans out to Pushover. The route verifies its own token, which
              # is why the digest carries one.
              CLEANUP_WEBHOOK_URL: http://chaski.default.svc.cluster.local:8080/hooks/library-cleanup
            envFrom:
              - secretRef:
                  name: curatorjudge-secret
            resources: *small
            securityContext: *hardened
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      prompt:
        type: configMap
        name: curatorjudge-prompt
        defaultMode: 0555
        globalMounts:
          - path: /prompt
            readOnly: true
      # Owned by the curator app; mounted here to run execute.
      code:
        type: configMap
        name: curator-code
        globalMounts:
          - path: /app/curator
            readOnly: true
      # Deliberately NOT a globalMount. The judge container never sees the
      # volume at all: with write access it could rewrite plan.json to insert a
      # protected film into `candidates`, and the executor trusts that set --
      # its live re-checks cover tags, collections, status, file presence and
      # playback, not membership of the candidate list. The prompt builder gets
      # it read-only; only the executor needs to write.
      state:
        existingClaim: curator
        advancedMounts:
          curatorjudge:
            prompt:
              - path: /state
                readOnly: true
            app:
              - path: /state
      # Hand-off between the three steps, and the only writable place the judge
      # has: npm prefix, npm cache and the CLI's own state all land here.
      work:
        type: emptyDir
        globalMounts:
          - path: /work
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
