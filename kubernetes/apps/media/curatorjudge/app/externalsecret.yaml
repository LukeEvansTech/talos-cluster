---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: curatorjudge-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: curatorjudge-token
  data:
    # Deliberately alone in its own Secret. The judge container installs an npm
    # package at start-up and then runs the least-trusted process in this
    # pipeline; handing it the Radarr and webhook credentials as well would let
    # a bad package or a tool escape reach the library directly.
    #
    # Generated with `claude setup-token`. One-year lifetime, not refreshable,
    # same shape as the Renovate reviewer token; give the 1Password item an
    # `expires` date so Watchtower flags it.
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: claude-code-curator
        property: credential
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: curatorjudge
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: curatorjudge-secret
  data:
    # The executor re-validates every protection against live Radarr
    # immediately before each deletion, so it needs what the plan needed.
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: radarr
        property: RADARR_API_KEY
    - secretKey: TAUTULLI_API_KEY
      remoteRef:
        key: tautulli
        property: TAUTULLI_API_KEY
    - secretKey: SEERR_API_KEY
      remoteRef:
        key: seerr
        property: SEERR_API_KEY
