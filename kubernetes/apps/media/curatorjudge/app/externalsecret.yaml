---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: curatorjudge-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: curatorjudge-token
  data:
    # Alone in its own Secret: the judge installs an npm package and is the least-trusted step,
    # so handing it the Radarr/webhook credentials too would let a bad package reach the library.
    #
    # Generated with `claude setup-token`; one-year, non-refreshable. Give the 1Password item an
    # `expires` date so Watchtower flags it.
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: claude-code-curator
        property: credential
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: curatorjudge
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: curatorjudge-secret
  data:
    # The executor re-validates every protection against live Radarr
    # immediately before each deletion, so it needs what the plan needed.
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: radarr
        property: RADARR_API_KEY
    - secretKey: TAUTULLI_API_KEY
      remoteRef:
        key: tautulli
        property: TAUTULLI_API_KEY
    - secretKey: SEERR_API_KEY
      remoteRef:
        key: seerr
        property: SEERR_API_KEY
    # Shares the queue-triage token on purpose: both land on the same phone, and a second
    # secret to rotate would buy nothing.
    - secretKey: CLEANUP_WEBHOOK_TOKEN
      remoteRef:
        key: chaski
        property: TRIAGE_WEBHOOK_TOKEN
