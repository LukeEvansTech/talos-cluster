---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reclaimerr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: reclaimerr
  values:
    controllers:
      reclaimerr:
        containers:
          app:
            image:
              repository: ghcr.io/jessielw/reclaimerr
              tag: 0.5.6@sha256:b1e226525ab4d3b3959575c73c03ee444835de23251570c1d68131a64931e85f
            # Skip the image entrypoint: with TZ set it writes /etc/localtime, which the read-only root refuses.
            command:
              - sh
              - -c
              - mkdir -p /app/data/database /app/data/logs /app/data/static/avatars && exec granian --interface asgi --workers 1 --host 0.0.0.0 --port 8000 backend.api.main:app
            env:
              TZ: ${TIMEZONE}
              API_HOST: 0.0.0.0
              API_PORT: &port 8000
              COOKIE_SECURE: "true"
              CORS_ORIGINS: https://reclaimerr.${SECRET_DOMAIN}
              LOG_LEVEL: INFO
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/info/health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/info/health
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                # The first full Plex sync was OOMKilled at 512Mi on 0.5.6.
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: reclaimerr
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: internal
            url: http://reclaimerr.media.svc.cluster.local:8000/api/info/health
            conditions: ["[STATUS] == 200"]
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      media:
        type: nfs
        server: ${SECRET_STORAGE_SERVER:-localhost}
        path: /mnt/pool/media
        globalMounts:
          - path: /media
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
