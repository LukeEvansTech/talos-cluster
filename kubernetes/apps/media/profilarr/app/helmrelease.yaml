---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app profilarr
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: profilarr
  values:
    controllers:
      profilarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/dictionarry-hub/profilarr
              tag: 2.2.0@sha256:ddcdd0f340043c2ec0a85ca74b9a6be9be42b1c0288c75fc36a26a43f695860b
            env:
              TZ: ${TIMEZONE}
              PUID: "1000"
              PGID: "1000"
              UMASK: "022"
              AUTH: "on"
              ORIGIN: https://{{ .Release.Name }}.${SECRET_DOMAIN}
              PARSER_HOST: localhost
              PARSER_PORT: "5000"
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
                # This container needs SETUID/SETGID to drop from root to PUID/PGID; do not
                # add the repo's standard hardening securityContext here (capabilities.drop:
                # [ALL], readOnlyRootFilesystem, allowPrivilegeEscalation: false).
          parser:
            image:
              repository: ghcr.io/dictionarry-hub/profilarr-parser
              tag: 2.2.0@sha256:3cd3f8c4979ee66304a518462cc6c5b59825bae6b25e7dfa51b30178b9265df7
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 5000
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 5000
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
    defaultPodOptions:
      securityContext:
        # fsGroup and fsGroupChangePolicy let kubelet chown /config, or the app fails with
        # "Operation not permitted".
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # Leave runAsUser and runAsNonRoot unset: the app entrypoint must start as root.
        supplementalGroups:
          - 10000
        seccompProfile:
          type: RuntimeDefault
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          profilarr:
            app:
              - path: /config
      home:
        type: emptyDir
        advancedMounts:
          profilarr:
            app:
              - path: /home
      tmp:
        type: emptyDir
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        controller: profilarr
        ports:
          http:
            port: 6868
