---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tdarr
spec:
  interval: 1h
  # 15m avoids upgrade thrash: tdarr's ~2.7GB of images can outrun helm-controller's 5m
  # default wait and trip a remediation rollback loop (#2737).
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: tdarr
  values:
    controllers:
      tdarr:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: any-nvidia-gpu
        containers:
          app:
            image:
              repository: ghcr.io/haveagitgat/tdarr
              tag: 2.95.01@sha256:6b4dcd9a20dc80a26d06b50378bdfa6955f2d37e413bf4c52d93a4bb37e74afc
            env:
              TZ: ${TIMEZONE}
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8265
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
          node:
            image:
              repository: ghcr.io/haveagitgat/tdarr_node
              tag: 2.95.01@sha256:7a56924b2f567b306abfd155a70874ee0b45ff69c9f63ed93e6177ae57622df7
            env:
              TZ: ${TIMEZONE}
              nodeID:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              serverIP: localhost
              serverPort: "8266"
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 4Gi
              claims:
                - name: gpu
    defaultPodOptions:
      labels:
        gpu-workload: "true"
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: In
                    values:
                      - "true"
        podAntiAffinity:
          # Avoids the GPU running the inference model (~21/23 GiB used, no VRAM isolation
          # under time-slicing). Preferred, not required, or 3 nodes with no worker pool
          # would wedge pods Pending on a drain. `namespaces: [ai]` matters: pod affinity is
          # namespace-scoped and the model runs there.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                namespaces:
                  - "ai"
                labelSelector:
                  matchLabels:
                    llm-gpu-model: "true"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              gpu-workload: "true"
      # s6 must start as root to drop privileges itself; NFS write ownership is unaffected either
      # way (docs/docs/troubleshooting/kb/022-s6-image-createcontainerconfigerror-non-root.md).
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 44 # video
          - 10000
    service:
      app:
        controller: tdarr
        ports:
          http:
            port: *port
          server:
            port: 8266
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          tdarr:
            app:
              - path: /app/server
                subPath: server
            node:
              - path: /app/configs
                subPath: configs
      cache:
        type: emptyDir
        globalMounts:
          - path: /cache
      media:
        type: nfs
        server: ${SECRET_STORAGE_SERVER}
        path: /mnt/pool/media
        globalMounts:
          - path: /media
