---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app wizarr
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/homepage
    - ../../../../components/volsync
    - ../../../../components/zeroscaler
  interval: 1h
  path: ./kubernetes/apps/media/wizarr/app
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 5Gi
      # The Kopia cache holds the index/metadata of the WHOLE shared repository, not just this
      # app's data, so it does not scale down with VOLSYNC_CAPACITY. 4Gi filled to 100% and the
      # mover died on `write /cache/CACHEDIR.TAG: no space left on device` (KB-030). 8Gi is the
      # cluster-wide floor for small apps.
      VOLSYNC_CACHE_CAPACITY: 8Gi
      HOMEPAGE_NAME: Wizarr
      HOMEPAGE_GROUP: Requests
      HOMEPAGE_ICON: wizarr.svg
      HOMEPAGE_DESCRIPTION: User invites
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
