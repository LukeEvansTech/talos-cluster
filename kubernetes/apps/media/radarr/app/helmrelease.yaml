---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: radarr
  values:
    controllers:
      radarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 6.4.4.10685@sha256:be53998a2d39cfa3c3315b70c7509a6a1f2a10c3aee9337653efc9f4c970430e
            env:
              RADARR__APP__INSTANCENAME: Radarr
              RADARR__APP__THEME: dark
              # Enabled, not DisabledForLocalAddresses: every gateway request looks local (RFC1918
              # pod address), so that exemption covered all traffic. See docs/docs/apps/radarr.md.
              RADARR__AUTH__REQUIRED: Enabled
              RADARR__LOG__DBENABLED: "False"
              RADARR__LOG__LEVEL: info
              # localhost, loopback and the pod hostname are always accepted, so exportarr
              # (localhost:80) needs no entry; other clients use the FQDN service name.
              RADARR__SERVER__ALLOWEDHOSTS: radarr.${SECRET_DOMAIN},radarr.media.svc.cluster.local
              RADARR__SERVER__PORT: &port 80
              # Trusts X-Forwarded-* from the Envoy Gateway pods (pod network), so Radarr logs
              # the real client address.
              RADARR__SERVER__TRUSTEDNETWORKS: ${CLUSTER_PODS_CIDR}
              RADARR__UPDATE__BRANCH: develop
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: radarr-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                    # kubelet sends the pod IP as Host, which the allowlist above rejects;
                    # localhost is always accepted.
                    httpHeaders:
                      - name: Host
                        value: localhost
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 250m
              limits:
                memory: 4Gi
          metrics:
            dependsOn: app
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
            args:
              - "radarr"
            env:
              PORT: &metricsPort 9707
              URL: "http://localhost:80"
              ENABLE_ADDITIONAL_METRICS: "true"
              API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: radarr-secret
                    key: RADARR__AUTH__APIKEY
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                # ENABLE_ADDITIONAL_METRICS pulls the whole library and queue per scrape;
                # 128Mi was OOMKilled 135 times on 2026-10-07/08 (~5.3k films). Matches Sonarr.
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: radarr
        ports:
          http:
            port: *port
          metrics:
            port: *metricsPort
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      # Radarr needs a writable /tmp for its ASP.NET data-protection key ring (kb/113).
      tmp:
        type: emptyDir
      config-cache:
        existingClaim: "{{ .Release.Name }}-cache"
        globalMounts:
          - path: /config/MediaCover
      media:
        type: nfs
        server: ${SECRET_STORAGE_SERVER:-localhost}
        path: /mnt/pool/media
        globalMounts:
          - path: /media
