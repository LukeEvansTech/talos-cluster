---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app gpu-claim-templates
  namespace: &namespace media
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # The DeviceClass this template names is created by the DRA driver's chart,
  # so the template is only satisfiable once that HelmRelease is up.
  dependsOn:
    - name: dra-driver-nvidia-gpu
      namespace: gpu-operator
  path: ./kubernetes/apps/media/gpu-claim-templates/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 1h
  timeout: 5m
