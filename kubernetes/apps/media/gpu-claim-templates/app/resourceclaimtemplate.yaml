---
# Unqualified on purpose: the available devices are interchangeable. A workload needing a specific
# device should get its own template with a CEL selector, not narrow this one. spec is immutable, so
# changing the request needs force: true on the Kustomization or a manual delete.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: any-nvidia-gpu
  namespace: media
spec:
  spec:
    devices:
      requests:
        - name: nvidia-gpu
          exactly:
            deviceClassName: gpu.nvidia.com
