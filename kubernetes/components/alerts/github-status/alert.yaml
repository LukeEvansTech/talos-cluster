---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/notification.toolkit.fluxcd.io/alert_v1beta3.json
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: github-status
spec:
  providerRef:
    name: github-status
  eventSources:
    # Scopes to Kustomizations under cluster-apps; a Kustomization synced from a separate
    # private GitRepository has no matching revision SHA here, so its commit-status POST
    # would 422 forever without this scope.
    - kind: Kustomization
      name: "*"
      matchLabels:
        kustomize.toolkit.fluxcd.io/name: cluster-apps
