---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${APP}-pocket-id
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${APP}
  oidc:
    provider:
      issuer: https://id.${SECRET_DOMAIN}
    # Each app's Pocket ID client is created with the app name as its ID, so it is not a secret.
    clientID: ${APP}
    clientSecret:
      name: ${APP}-pocket-id-secret
    redirectURL: https://${APP}.${SECRET_DOMAIN}/oauth2/callback
    # The default /logout would shadow an app's own path of that name.
    logoutPath: /oauth2/logout
    # A pinned suffix keeps sessions alive when the policy is recreated.
    cookieNames:
      suffix: ${APP}
