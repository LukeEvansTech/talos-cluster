---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Puts the app's HTTPRoute (named ${APP}) behind a Pocket ID sign-in at the gateway.
# Onboarding and exceptions: docs/docs/apps/pocket-id.md.
resources:
  - ./externalsecret.yaml
  - ./securitypolicy.yaml
# Behind the sign-in every browser path answers 302, so the route's Gatus check expects that
# redirect: it proves the gateway and Pocket ID path. App health is the pod's readiness, or a
# Service check the app adds itself.
patches:
  - target:
      kind: HelmRelease
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: placeholder
      spec:
        values:
          route:
            app:
              annotations:
                gatus.home-operations.com/endpoint: |-
                  client:
                    ignore-redirect: true
                  conditions: ["[STATUS] == 302"]
