---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-pocket-id
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ${APP}-pocket-id-secret
    template:
      data:
        # Envoy Gateway reads the client secret from this key name.
        client-secret: "{{ .POCKET_ID_CLIENT_SECRET }}"
  dataFrom:
    # An item of its own, so the gateway secret never shares a Login item or the app's own fields.
    - extract:
        key: ${APP}-pocket-id
