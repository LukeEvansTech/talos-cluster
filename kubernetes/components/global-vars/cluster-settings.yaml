---
# yaml-language-server: $schema=https://json.schemastore.org/configmap.json
# Non-secret settings, substituted into apps via the root Kustomization postBuild; unlike
# cluster-secrets, values live in Git and reach consumers on the next reconcile.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  annotations:
    checkov.io/skip1: CKV_K8S_21=Namespace provided by kustomization overlay
# Internal device hostnames live in the cluster-secrets 1Password item instead of here,
# since this is a public repository; see docs/docs/apps/components.md.
data: {}
