---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Homepage discovers services from annotated HTTPRoutes, not Service annotations; see
# docs/docs/apps/components.md for the route-path and pod-selector detail.
patches:
  - target:
      kind: HelmRelease
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: placeholder
      spec:
        values:
          route:
            app:
              annotations:
                gethomepage.dev/enabled: "true"
                gethomepage.dev/app: "${APP}"
                gethomepage.dev/name: "${HOMEPAGE_NAME:=${APP}}"
                gethomepage.dev/group: "${HOMEPAGE_GROUP:=Services}"
                gethomepage.dev/icon: "${HOMEPAGE_ICON:=mdi-application}"
                gethomepage.dev/description: "${HOMEPAGE_DESCRIPTION:=}"
