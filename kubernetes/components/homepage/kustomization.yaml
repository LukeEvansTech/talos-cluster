---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Homepage discovers services from annotated HTTPRoutes (kubernetes.yaml has
# `gateway: true`); it never reads Service annotations, which is where this
# component used to put them. app-template renders the route under
# spec.values.route.app, so every consumer must define its route there.
# `gethomepage.dev/app` pins the pod selector to the release name, some
# HTTPRoutes are named `<app>-app`, which would otherwise match no pods.
patches:
  - target:
      kind: HelmRelease
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: placeholder
      spec:
        values:
          route:
            app:
              annotations:
                gethomepage.dev/enabled: "true"
                gethomepage.dev/app: "${APP}"
                gethomepage.dev/name: "${HOMEPAGE_NAME:=${APP}}"
                gethomepage.dev/group: "${HOMEPAGE_GROUP:=Services}"
                gethomepage.dev/icon: "${HOMEPAGE_ICON:=mdi-application}"
                gethomepage.dev/description: "${HOMEPAGE_DESCRIPTION:=}"
